ngle","stem":"（真题）劳动者可以立即解除劳动合同且无需事先告知用人单位的是（ ）","options":{"A":"用人单位未按照劳动合同的约定提供劳动条件","B":"用人单位以暴力、威胁或者非法限制人身自由的手段强迫劳动者劳动","C":"用人单位未及时足额支付劳动报酬","D":"用人单位制定的规章制度违反法律、法规的规定，损害劳动者的权益"},"answer":"B","explanation":"【逐项解析】B正确:用人单位以暴力威胁或非法限制人身自由强迫劳动的,劳动者可立即解除无需事先告知。ACD均需提前30日书面通知(或试用期提前3日)。【法条依据】《劳动合同法》第38条第2款。"},{"id":342,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）陈某应聘到某施工企业，双方于2022年3月12日签订了劳动合同。合同中约定试用期 2个月，签约次日合同开始履行，2022年6月17日，陈某因找到新的工作拟解除原劳动合同。根据《劳动合同 法》，关于该劳动合同解除的说法，正确的是（ ）。","options":{"A":"陈某辞职必须取得用人单位同意","B":"陈某口头通知用人单位即可解除劳动合同","C":"陈某应提前30日以书面形式通知用人单位","D":"陈某应报请劳动行政主管部门同意后以书面形式通知用人单位"},"answer":"C","explanation":"【逐项解析】C正确:正式工(试用期满)解除劳动合同应提前30日书面通知。A辞职无需用人单位同意(通知即可)。B正式工不能口头通知(需书面)。D不需劳动行政主管部门同意。【法条依据】《劳动合同法》第37条。"},{"id":343,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"下列情形中，用人单位提前30日以书面形式通知劳动者，可以解除劳动合同的是（ ）。","options":{"A":"某用人单位生产经营发生严重困难的","B":"某公司项目部安全员孙某患肺病在规定的医疗期满后不能从事原工作，也不能从事由用人单位为行安排的 工作的","C":"某集团公司科技部的钱某不能胜任工作","D":"李某与公司订立劳动同时所依据的客况发生了重大变化，致使劳动合同无法履行的"},"answer":"B","explanation":"【逐项解析】B正确:医疗期满不能从事原工作也不能从事另行安排的工作→用人单位提前30日通知可解除(需支付经济补偿)。A经济性裁员需经特别程序。C钱某不能胜任→需培训或调岗后仍不能胜任才可解除。D客观情况重大变化→需先协商变更,协商不成才可解除。【法条依据】《劳动合同法》第40条。"},{"id":344,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）劳动者发生下列情形，用人单位可以随时解除劳动合同的有（ ）","options":{"A":"在试用期被证明不符合录用条件的","B":"不能胜任工作，经过培训或者调整工作岗位，仍不能胜任工作的","C":"严重违反用人单位规章制度的","D":"同时与其他用人单位建立劳动关系，对完成本单位的工作任务造成严重影响的","E":"患病，在规定的医疗期满后不能从事原工作，也不能从事由用人单位另行安排的工作的"},"answer":"ACD","explanation":"【逐项解析】ACD正确:试用期不符合条件、严重违章、同时与其他单位建立劳动关系严重影响本职工作→可随时解除。B需提前30日通知(非随时解除)。E需提前30日通知+支付经济补偿(非随时解除)。【法条依据】《劳动合同法》第39条、第40条。"},{"id":345,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"某公司进入破产重整程序，需要裁员30人。根据《劳动合同法》，属于应当优先留用的人员 有（ ）。","options":{"A":"与该公司订立无固定期限劳动合同的","B":"家庭有未成年人的","C":"与该公司订立较长期限的固定期限劳动合同的","D":"家庭无其他就业人员，有需要扶养的老人的","E":"在本企业因工负伤并被确认部分丧失劳动能力的"},"answer":"ACD","explanation":"【逐项解析】ACD正确:裁员时优先留用:与本单位订立无固定期限合同的、订立较长期限固定期限合同的、家庭无其他就业人员有需要扶养老人的。B无未成年人的特殊保护规定。E部分丧失劳动能力应优先留用但非法律规定(属于因工负伤的特殊保护)。【法条依据】《劳动合同法》第41条。"},{"id":346,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【模拟题】","type":"single","stem":"某施工单位试验员李某2019年3月上班，2020年5月，施工单位以李某怀孕不能胜任工作为由将其 解雇。经劳动争议仲裁，如李某不愿意回单位上班，可主张按（ ）的工资标准支付赔偿金。","options":{"A":"1个月","B":"1.5个月","C":"3个月","D":"4.5个月"},"answer":"C","explanation":"【逐项解析】C正确:违法解除劳动合同→支付赔偿金=经济补偿标准的2倍。李某工作1年2个月→经济补偿为1.5个月工资,赔偿金=1.5×2=3个月。注意:孕期属于不得解除的情形,单位违法解除应支付赔偿金(非经济补偿)。【法条依据】《劳动合同法》第42条、第47条、第87条。"},{"id":347,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【真题】","type":"single","stem":"甲安装工程公司拟与在公司工作了15年的王某解除合同，劳动合同解除前12个月王某的月平均工资 为2.3万元,该公司职工月平均工资0.8万元，甲所在设区的市级人民政府公布的本地区上年度职工月平均工 资为0.65万元。根据《劳动合同法》，甲应当向王某支付的经济补偿是（ ）。","options":{"A":"34.5万元","B":"12万元","C":"23.4万元","D":"9.75万元"},"answer":"C","explanation":"【逐项解析】C正确:工作15年→经济补偿=15个月工资。月工资上限:用人单位所在地区上年度职工月平均工资3倍=0.65×3=1.95万。王某工资2.3万>1.95万→按1.95万计算。1.95×12=23.4万(劳动者月工资高于3倍的按3倍计算,支付年限最高12年)。但王某工作15年,按15个月算...实际应为:2.3>0.65*3=1.95,按1.95*12=23.4万元(封顶12年)。【法条依据】《劳动合同法》第47条。"},{"id":348,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《劳动合同法》，在劳务派遣用工方式中，订立劳务派遣协议的主体是（ ）","options":{"A":"派遣单位与用工单位","B":"用工单位与劳动者","C":"用工单位与当地人民政府","D":"派遣单位与劳动者"},"answer":"A","explanation":"【逐项解析】A正确:劳务派遣协议由派遣单位与用工单位订立。B用工单位与劳动者是用工关系(非派遣协议当事人)。C与政府无关。D派遣单位与劳动者订立劳动合同(非派遣协议)。【法条依据】《劳动合同法》第59条。"},{"id":349,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）关于劳务派遣的说法，正确的有（ ）。","options":{"A":"经营劳务派遣业务，应当向劳动行政部门申请行政许可","B":"劳务派遣用工劳动只能在临时性、辅助性或者替代性的工作岗位上实施","C":"用工单位可以将被派遣劳动者再派遣到其他用人单位","D":"劳务派遣用工方式使劳动者的聘用与使用分离","E":"除岗前培训费以外，劳务派遣单位不得再向被派遣劳动者收取费用"},"answer":"ABD","explanation":"【逐项解析】ABD正确:A经营劳务派遣需行政许可。B只能在临时性辅助性替代性岗位实施。D聘用与使用分离是劳务派遣的本质特征。C用工单位不得将被派遣劳动者再派遣。E劳务派遣单位不得以任何名义向劳动者收取费用(包括培训费)。【法条依据】《劳动合同法》第57条、第62条、第66条。"},{"id":350,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于劳务派遣的说法，正确的是（ ）。","options":{"A":"劳务派遣中的劳动关系与用工关系相分离","B":"劳务派遣主要涉及劳务派遣单位和劳动者双方法律关系","C":"劳务派遣是目前建筑行业的主要用工形式","D":"劳务派遣单位不得与劳动者约定试用期"},"answer":"A","explanation":"【逐项解析】A正确:劳动关系(与派遣单位)与用工关系(与用工单位)相分离。B涉及三方(派遣单位+劳动者+用工单位)。C建筑行业主要用工形式是直接用工(非劳务派遣,劳务派遣≤10%)。D劳务派遣可约定试用期(非不得约定)。【法条依据】《劳动合同法》第66条、《劳务派遣暂行规定》第4条。"},{"id":351,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于最低工资保障制度的说法，正确的是（ ）。","options":{"A":"最低工资的具体标准由国务院规定","B":"最低工资的具体标准包括特殊情况下延长工作时间工资","C":"最低工资的具体标准包括特殊工作环境条件下的津贴","D":"用人单位支付劳动者的工资不得低于当地最低工资的具体标准"},"answer":"D","explanation":"【逐项解析】D正确:用人单位支付工资不得低于当地最低工资标准。A最低工资标准由省级政府规定(非国务院)。B最低工资不包括加班工资。C最低工资不包括特殊环境津贴。【法条依据】《劳动法》第48条、《最低工资规定》。"},{"id":352,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"王某的日工资为80元。政府规定2010年10月1日至7日放假7天，其中3天属于法定休假日，4天 属于前后两周的周末休息日。公司安排王某在这7天加班不能安排补 休。公司应当向王某支付加班费合计（ ）元。","options":{"A":"560","B":"1360","C":"800","D":"1120"},"answer":"B","explanation":"【逐项解析】B正确:法定休假日3天→300%:80×3×3=720。休息日4天→200%:80×4×2=640。合计1360元。注意:法定假日不能补休只能支付加班费,休息日可补休否则付2倍。【法条依据】《劳动法》第44条。"},{"id":353,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【真题-多选题】","type":"multi","stem":"关于工程建设领域农民工工资支付保障的说法，正确的有（ ）。","options":{"A":"施工合同额低于300万元的工程，免除该工程存储农民工工资保证金","B":"农民工工资保证金使用后，施工总承包单位应当自使用之日起10个工作日内将农民工工资保证金资金补足","C":"施工企业支付的农民工工资不得低于当地最低工资标准","D":"农民工工资保证金可以用来支付工程款、材料费","E":"当事人被列入失信联合惩戒名单的期限为2年，自人力资源社会保障行政部门作出列入决定之日起计算"},"answer":"BC","explanation":"【逐项解析】BC正确:B工资保证金使用后10个工作日内补足。C工资不低于当地最低标准。A施工合同额<300万+1年内未发生工资拖欠的免除(非当然免除)。D工资保证金专款专用(不可支付工程款)。E列入失信名单期限为3年(非2年)。【法条依据】《保障农民工工资支付条例》。"},{"id":354,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《职业病防治法》，劳动者享有的职业卫生保护权利是（ ）。","options":{"A":"获得职业安全教育培训","B":"要求用人单位提供安全防护设施","C":"建立职业卫生管理制度和操作规程","D":"对职业病防治工作提出意见和建议"},"answer":"D","explanation":"【逐项解析】D正确:对职业病防治工作提出意见和建议是劳动者的职业卫生保护权利。ABC多是义务或企业应提供的条件(非劳动者权利)。【法条依据】《职业病防治法》第39条。"},{"id":355,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"张某为某汽车制造厂机加工岗位工人，与该单位签订为期3年的劳动合同。工作一年后，该单 位将其从机加工岗位调到喷漆岗位工作。依据《职业病防治法》的规定，下列关于张某在劳动过程中职业病 防护与管理的做法，正确的是（ ）。","options":{"A":"张某因该单位未事先告知喷漆岗位职业危害而不服从调动，用人单位因此解除与其签订的劳动合同","B":"张某因该单位喷漆岗位未配备职业病防护装置而不服从调动，用人单位因此解除与其签订的劳动合同","C":"张某因该单位未事先告知喷漆岗位职业病危害，拒绝从事新岗位作业","D":"张某到新岗位后，该单位保持原劳动合同，未协商变更相关条款"},"answer":"C","explanation":"【逐项解析】C正确:未事先告知职业病危害→劳动者可拒绝从事新岗位作业。A单位不得因此解除合同。B不得因此解除合同(单位应提供防护装置)。D应协商变更合同相关条款。【法条依据】《职业病防治法》第33条。"},{"id":356,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【真题-多选题】","type":"multi","stem":"根据《职业病防治法》，关于建设项目职业危害预评价制度的说法，正确的有（ ）","options":{"A":"建设项目可能产生职业病危害的，建设单位应当遵行职业病危害预评价","B":"建设项目职业病危害预评价应当在项目的可行性论证阶段进行","C":"医疗机构建设项目可能产生放射性职业病危害的，建设单位应当向卫生行政部门提交放射性职业病危害预 评价报告","D":"建设项目职业病危害预评价制度的适用范围不包括改建建设项目","E":"未提交预评价报告或者预评价报告未经卫生行政部门审核同意的，不得开工建设"},"answer":"ABCE","explanation":"A正确：可能产生职业病危害的建设项目应进行职业病危害预评价。B正确：预评价应在项目可行性论证阶段进行。C正确：医疗机构放射性职业病危害项目应向卫生行政部门提交放射性职业病危害预评价报告。E正确：预评价报告未经卫生行政部门审核同意的，不得开工建设。D错误：预评价制度适用于新建、扩建、改建、技术改造和技术引进项目，并非不包括改建。故选ABCE。"},{"id":357,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某女职工与用人单位订立劳动合同从事后勤工作，约定劳动合同期限为2年。关于该 女职工权益保护的说法，正确的是（ ）。","options":{"A":"公司应当定期安排该女职工进行健康检查","B":"若该女职工哺乳的孩子已满18个月，公司可以安排夜班劳动","C":"公司可以安排该女职工在经期从事国家规定的第3级体力劳动强度的劳动","D":"若该女职工已怀孕5个月，公司不得安排夜班劳动"},"answer":"B","explanation":"【逐项解析】B正确:哺乳未满1周岁婴儿不得安排夜班和加班。满18个月(1.5岁)>1岁→可安排夜班。A定期健康检查非所有岗位的强制性要求。C经期不得安排第3级体力劳动。D怀孕7个月以上不得安排夜班(5个月可安排)。【法条依据】《女职工劳动保护特别规定》第6条、第9条。"},{"id":358,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于女职工特殊保护的说法，正确的是（ ）。","options":{"A":"女职工在孕期，用人单位不得延长劳动时间","B":"女职工不得从事矿山井下作业","C":"用人单位因女职工怀孕降低工资的，不得低于当地最低工资标准","D":"怀孕女职工在劳动时间内进行产前检查，所需时间不计入劳动时间"},"answer":"B","explanation":"【逐项解析】B正确:女职工不得从事矿山井下作业。A孕期不得安排加班和夜班(但7个月以上才绝对禁止,7个月以下可协商)。C孕期不得降低工资。D产前检查时间计入劳动时间。【法条依据】《女职工劳动保护特别规定》。"},{"id":359,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据我国有关规定，下列情形应当认定为或者视同工伤的有（ ）。","options":{"A":"下班途中驾车发生车祸受伤，负同等责任的","B":"因讨要被拖欠工资，在办公室自残的","C":"宴请客户时，因醉酒经抢救无效死亡的","D":"在隔壁工地发生大火时因自愿救人受伤的","E":"安全员在施工现场履行职责遭殴打受伤的"},"answer":"ADE","explanation":"【逐项解析】ADE正确:A上下班途中非本人主要责任事故→工伤。D在抢险救灾中受伤→视同工伤。E工作时间和场所内因履行职责受暴力伤害→工伤。B自残→不得认定工伤。C醉酒→不得认定工伤。【法条依据】《工伤保险条例》第14条、第15条、第16条。"},{"id":360,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【真题-单选题】","type":"single","stem":"下列情况中，可以认定为工伤的是（ ）。","options":{"A":"赵某在单位上班期间受伤","B":"孙某去项目部出差，当地突发泥石流后下落不明","C":"钱某下班后被本单位上上访人员打伤","D":"周某在项目部宿舍突发脑溢血，经抢救无效死亡"},"answer":"B","explanation":"【逐项解析】B正确:因工外出期间发生事故下落不明→认定为工伤。A上班期间受伤需与工作有关(非当然工伤)。C下班后被打与工作无关→非工伤。D宿舍突发脑溢血→非工作时间和工作岗位(在岗时48小时内抢救无效死亡才算)。【法条依据】《工伤保险条例》第14条。"},{"id":361,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【真题-单选题】","type":"single","stem":"关于工伤保险待遇的说法，正确的是（ ）。","options":{"A":"职工治疗工伤应当在就近的医疗机构就医","B":"职工因工伤被鉴定为四级伤残的，保留劳动关系退出工作岗位享受工伤待遇","C":"停工留薪期一般不超过6个月","D":"病情严重或者情况特殊,经所在单位同意可以适当延长停工留薪期"},"answer":"B","explanation":"【逐项解析】B正确:四级伤残保留劳动关系退出工作岗位享受工伤待遇。A应在签订服务协议的医疗机构就医(非就近)。C停工留薪期一般不超过12个月(非6个月)。D经劳动能力鉴定委员会确认可延长(非所在单位同意)。【法条依据】《工伤保险条例》第33条、第35条。"},{"id":362,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列纠纷中，属于劳动争议范围的有（ ）。","options":{"A":"劳动者与用人单位在履行劳动合同过程中发生的纠纷","B":"劳动者请求社会保险经办机构发放社会保险金的纠纷","C":"劳动者与用人单位因住房制度改革产生的公有住房转让纠纷","D":"因除名、辞退和辞职、离职发生的纠纷","E":"劳动者退休后，与尚未参加社会保险统筹的原用人单位因追索养老金、医疗费、工伤保险待遇和其他社会 保险待遇而发生的纠纷"},"answer":"ADE","explanation":"【逐项解析】ADE正确:劳动合同履行纠纷、因除名辞退辞职离职纠纷、退休后追索社保待遇纠纷→均属劳动争议。B请求社保经办机构发社保金→行政争议(非劳动争议)。C公有住房转让纠纷→普通民事纠纷(非劳动争议)。【法条依据】《劳动争议调解仲裁法》第2条。"},{"id":363,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"关于劳动争议调解的说法，正确的是（ ）。","options":{"A":"当事人申请是启动劳动争议调解程序的唯一方式","B":"只有当事人提出申请，劳动争议调解程序才能启动","C":"企业劳动争议调解委员会由职工代表、企业代表和行政主管部门代表组成","D":"劳动争议调解一般不公开进行"},"answer":"D","explanation":"【逐项解析】D正确:劳动争议调解一般不公开进行。A调解可依申请或依职权启动(非唯一方式)。B同上。C企业调解委员会由职工代表+企业代表组成(无行政主管部门代表)。【法条依据】《劳动争议调解仲裁法》第10条、第13条。"},{"id":364,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"关于劳动仲裁的说法，正确的是（ ）。","options":{"A":"仲裁庭逾期未做出裁决的，当事人可以就该争议事项向人民法院提起诉讼","B":"劳动关系存续期间因拖欠劳动报酬发生争议的，劳动者申请仲裁不受规定的仲裁时效期间的限制","C":"劳动争议申请仲裁的时效期间为6个月","D":"劳动争议申请仲裁的时效期间不适用中止和中断","E":"设区的市仅能设立1个劳动争议仲裁委员"},"answer":"AB","explanation":"【逐项解析】AB正确:A逾期未裁决可向法院起诉。B劳动关系存续期间拖欠报酬不受1年时效限制。C仲裁时效为1年(非6个月)。D仲裁时效适用中止中断。E可以设立多个仲裁委员会。【法条依据】《劳动争议调解仲裁法》第27条、第43条。"},{"id":365,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于人民调解的说法，正确的是（ ）。","options":{"A":"经人民调解委员会调解达成的调解协议，当事人有权申请强制执行","B":"经人民调解委员会调解达成的调解协议，具有法律约束力","C":"经人民调解委员会调解达成的调解协议，一方当事人有权向人民法院申请司法确认","D":"未经人民调解委员会调解的，不得提起民事诉讼"},"answer":"B","explanation":"【逐项解析】B正确:经人民调解达成的调解协议具有法律约束力。A需经司法确认才可申请强制执行。C双方当事人才可共同申请司法确认(非一方)。D人民调解非诉讼前置程序(可直接起诉)。【法条依据】《人民调解法》第31-33条。"},{"id":366,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"关于人民调解的说法，正确的是（ ）","options":{"A":"人民调解委员会调解民间纠纷，只收取成本费用","B":"人民调解达成调解协议的，可以采取口头协议的方式","C":"当事人认为有必要的，可以自调解协议生效之日起30日内向人民法院申请司法确认","D":"人民调解委员会是依法设立的调解民间纠纷的群众性组织","E":"人民调解制度是一种信访辅助制度"},"answer":"BCD","explanation":"【逐项解析】BCD正确:B可口头协议。C30日内申请司法确认。D群众性组织。A人民调解不收费(非只收成本)。E人民调解是独立的纠纷解决制度(非信访辅助)。【法条依据】《人民调解法》第4条、第7条、第27条。"},{"id":367,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"根据《民事诉讼法》，关于法院调解的说法,正确的是（ ）。","options":{"A":"最后收到调解书的当事人签收的日期为调解书生效日","B":"调解书的效力低于判决书","C":"调解达成的所有协议，人民法院均应当制作调解书","D":"人民法院审理民事案件，在判决作出之前应当进行调解"},"answer":"A","explanation":"【逐项解析】A正确:调解书需双方当事人签收生效,最后签收日期为生效日。B调解书与判决书同等效力。C调解维持婚姻关系等可不制作调解书。D应在判决作出前进行调解但非应当(自愿原则)。【法条依据】《民事诉讼法》第100条。"},{"id":368,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列纠纷中，可以申请仲裁的是（ ）。","options":{"A":"收养协议纠纷","B":"工程合同纠纷","C":"遗产继承纠纷","D":"监护资格纠纷"},"answer":"B","explanation":"【逐项解析】B正确:工程合同纠纷属于合同纠纷,可申请仲裁。A收养/C继承/D监护→涉及身份关系不可仲裁(仲裁法第3条)。【法条依据】《仲裁法》第2条、第3条。"},{"id":369,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《仲裁法》，关于仲裁的说法,正确的有（ ）。","options":{"A":"仲裁机构受理案件的依据是司法行政主管部门的授权","B":"劳动争议仲裁不属于《仲裁法》的调整范围","C":"当事人达成有效仲裁协议后，人民法院仍然对案件享有管辖权","D":"仲裁不公开进行","E":"仲裁裁决作出后，当事人不服的可以向人民法院起诉"},"answer":"BD","explanation":"【逐项解析】BD正确:B劳动争议仲裁不适用《仲裁法》(适用《劳动争议调解仲裁法》)。D仲裁不公开进行(保密原则)。A受理依据是当事人仲裁协议(非司法行政部门授权)。C有效仲裁协议排除法院管辖。E仲裁一裁终局(不得再起诉)。【法条依据】《仲裁法》第4条、第5条、第9条、第40条。"},{"id":370,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于仲裁协议的说法，正确的是（ ）。","options":{"A":"当事人没有仲裁协议，一方申请仲裁的，仲裁委员会受理后可以要求双方达成仲裁协议","B":"当事人达成仲裁协议，一方向人民法院起诉的，人民法院受理后先审查仲裁协议的效力","C":"申请仲裁必须以当事人依法订立的仲裁协议为前提","D":"合同无效的，合同中的仲裁条款也无效"},"answer":"C","explanation":"【逐项解析】C正确:申请仲裁必须以当事人订立仲裁协议为前提。A无仲裁协议受理后应驳回(非要求双方达成协议)。B法院受理后,另一方在首次开庭前提交仲裁协议的应驳回起诉(非先审查效力)。D合同无效不影响仲裁条款效力(仲裁条款独立性原则)。【法条依据】《仲裁法》第4条、第19条、第26条。"},{"id":371,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）当事人达成有效仲裁协议后,一方向人民法院起诉未声明有仲裁协议,人民法院受理 后,另一方在首次开庭前提交件裁协议的人民法院应当（ ）。","options":{"A":"驳回起诉","B":"裁定不予受理","C":"继续审理","D":"移交仲裁机构处理"},"answer":"A","explanation":"【逐项解析】A正确:有仲裁协议,另方在首次开庭前提交→法院应驳回起诉。B不予受理是针对起诉时(已受理后是驳回起诉)。C不能继续审理。D应驳回起诉非移交仲裁(当事人自行申请仲裁)。【法条依据】《仲裁法》第26条。"},{"id":372,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）关于仲裁协议的说法，正确的有（ ）。","options":{"A":"仲裁协议必须在纠纷发生前达成","B":"当事人对仲裁协议效力有异议的，应当在仲裁庭首次开庭前提出","C":"仲裁协议可以采用口头形式，但需双方认可","D":"合同解除后，合同中的仲裁条款仍然有效","E":"仲裁协议约定两个以上仲裁机构，当事人不能就选择达成一致的，可以由司法行政主管部门指定"},"answer":"BD","explanation":"【逐项解析】BD正确:B对仲裁协议效力有异议应在首次开庭前提出。D合同解除后仲裁条款独立有效。A可在纠纷发生前或发生后达成。C仲裁协议必须书面形式。E约定两个以上仲裁机构的,当事人可协议选择其一(不能一致的可由仲裁机构所在地法院裁定,非司法行政主管部门指定)。【法条依据】《仲裁法》第16-20条。"},{"id":373,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于仲裁协议效力确认的说法，正确的是（ ）。","options":{"A":"当事人对仲裁协议效力有异议的，应当在仲裁裁决作出前提出","B":"当事人既可以请求仲裁委员会作出决定，也可以请求人民法院裁定","C":"当事人对仲裁委员会就仲裁协议效力作出的决定不服的，可以向人民法院申请撤销该决定","D":"当事人向人民法院申请确认仲裁协议效力的案件，只能由仲裁协议约定的仲裁委员会所在地的中级人民法 院管辖"},"answer":"B","explanation":"【逐项解析】B正确:对仲裁协议效力异议可请求仲裁委员会决定或请求法院裁定。A应在首次开庭前提出(非裁决作出前)。C仲裁委员会的决定不能向法院申请撤销(法院对仲裁协议的司法审查是独立的)。D可由仲裁协议约定地、仲裁机构所在地、被申请人住所地等中级法院管辖。【法条依据】《仲裁法》第20条。"},{"id":374,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《仲裁法》，关于仲裁庭组成的说法，正确的是（ ）。","options":{"A":"仲裁庭必须由3名及3名以上的单数仲裁员组成","B":"仲裁庭可由当事人双方各选定两名仲裁员组成","C":"首席仲裁员可以由当事人双方共同选定","D":"首席仲裁员不可能由仲裁委员会主任指定"},"answer":"C","explanation":"【逐项解析】C正确:首席仲裁员可由当事人共同选定。A可独任仲裁(1名,非必须3名以上)。B只能选定1名或委托主任指定。D可由仲裁委员会主任指定(当事人未选定时)。【法条依据】《仲裁法》第30条、第31条。"},{"id":375,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-单选题】","type":"single","stem":"关于仲裁员回避的说法，正确的是（ ）。","options":{"A":"仲裁员是否回避，由仲裁庭决定","B":"当事人请求仲裁员回避，应当仲裁庭首次开庭辩论终结前提出","C":"当事人提出仲裁员回避，应当说明理由","D":"因回避而重新选定仲裁员后，已进行的仲裁程序有效"},"answer":"C","explanation":"【逐项解析】C正确:当事人提出回避应说明理由。A仲裁员回避由仲裁委员会主任决定(主任任仲裁员时由仲裁委员会决定)。B应在首次开庭前提出(首次开庭后知道的可在最后一次开庭终结前提出)。D已进行的程序可由仲裁庭决定是否重新进行。【法条依据】《仲裁法》第35条、第36条、第37条。"},{"id":376,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于仲裁和解的说法，正确的是（ ）。","options":{"A":"当事人仲裁和解的，应当开庭进行","B":"当事人自行达成和解协议的，仲裁庭应当制作撤案决定书","C":"当事人达成和解协议撤回仲裁申请反悔的，需要另行达成仲裁","D":"当事人自行达成和解协议的，可以撤回仲裁申请"},"answer":"D","explanation":"【逐项解析】D正确:达成和解协议的可以撤回仲裁申请(也可请求仲裁庭制作裁决书)。A和解不必须开庭。B可制作裁决书(非必须制作撤案决定书)。C反悔后可依原仲裁协议重新申请仲裁(非需另行达成)。【法条依据】《仲裁法》第49条、第50条。"},{"id":377,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于仲裁调解的说法，正确的是（ ）。","options":{"A":"仲裁裁决书的法律效力高于仲裁调解书","B":"仲裁调解达成协议的，即可申请强制执行","C":"仲裁调解书经双方当事人签收后，即可发生律效力","D":"在仲裁调解签收之前当事人反悔的，当事人应当重新申请仲裁"},"answer":"C","explanation":"【逐项解析】C正确:仲裁调解书经双方当事人签收后发生法律效力。A调解书与裁决书同等法律效力。B需法院强制执行(非自动)。D签收前反悔的仲裁庭应及时作出裁决(非重新申请仲裁)。【法条依据】《仲裁法》第51条、第52条。"},{"id":378,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲、乙、丙三人组成仲裁庭，甲为首席仲裁员，甲认为应该支持申请人的主张，乙 、丙认为不应支持申请人的主张，关于仲裁裁决的说法，正确的是（ ）","options":{"A":"应按乙、丙的意见做出仲裁裁决","B":"应该按甲的意见做出仲裁书","C":"甲、乙、丙各自的意见全部列出交由仲裁委员会做出决定","D":"按照甲的意见做出仲裁裁决，裁决书如实记载乙、丙意见"},"answer":"A","explanation":"【逐项解析】A正确:裁决按多数仲裁员意见作出(2:1→按乙丙意见)。B不能按少数意见。C不能提交仲裁委员会决定。D少数意见可记入笔录但裁决按多数意见。【法条依据】《仲裁法》第53条。"},{"id":379,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"发生法律效力的裁决，当事人可以向人民法院申请执行，该人民法院应当是（ ）。","options":{"A":"终审人民法院","B":"申请执行人所在地人民法院","C":"被执行的财产所在地基层人民法院","D":"被执行人住所地或被执行财产所在地中级法院"},"answer":"D","explanation":"【逐项解析】D正确:仲裁裁决由被执行人住所地或被执行的财产所在地中级法院执行。A终审法院概念不适用于仲裁。B非申请执行人所在地。C应是中级法院(非基层)。【法条依据】《仲裁法》第62条。"},{"id":380,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《仲裁法》，当事人有证据证明仲裁裁决存在（ ）情形下，可以向人民法院 申请撤销该仲裁裁决。","options":{"A":"双方当事人均不满意仲裁结果","B":"没有仲裁协议","C":"被申请人死亡","D":"仲裁机构已被撤销","E":"裁决事项超出仲裁委员会权限"},"answer":"BE","explanation":"【逐项解析】BE正确:没有仲裁协议和裁决事项超出仲裁委员会权限→可撤销。A不满意非撤销理由。C被申请人死亡非撤销理由(执行程序处理)。D仲裁机构被撤销非撤销理由。【法条依据】《仲裁法》第58条。"},{"id":381,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《仲裁法》，关于仲裁裁决撤销的说法，正确的是（ ）。","options":{"A":"违约金的计算不符合合同约定，当事人可以申请撤销仲裁裁决","B":"当事人需要申请撤销仲裁裁决时，可以向财产所在地的中级人民法院申请","C":"仲裁裁决被撤销后，当事人可以根据双方重新达成的仲裁协议申请仲裁，不可以向人民法院起诉","D":"仲裁的程序违反法定程序，当事人可以申请撤销仲裁裁决"},"answer":"D","explanation":"【逐项解析】D正确:仲裁程序违反法定程序的可申请撤销。A实体问题(违约金计算)不属撤销事由(一裁终局)。B向仲裁委员会所在地中级法院申请。C撤销后当事人可重新达成仲裁协议申请仲裁或向法院起诉(非仅限仲裁)。【法条依据】《仲裁法》第58条。"},{"id":382,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-多选题】","type":"single","stem":"关于民事合同仲裁裁决执行的说法，正确的有（ ）","options":{"A":"申请仲裁裁决强制执行的期间为3年","B":"当事人申请执行仲裁裁决案件，由被执行人住所地或者被执行的财产所在地的中级人民法院管辖","C":"申请执行时效，不适用中止和中断的裁定","D":"一方当事人不履行的，对方当事人可以向作出仲裁的仲裁委员会申请执行","E":"法律文书未规定履行期间的，申请执行的期间从法律文书生效之日起计算"},"answer":"B","explanation":"【逐项解析】B正确:仲裁裁决执行由被执行人住所地或被执行的财产所在地中级法院管辖。A申请执行时效为2年(非3年)。C申请执行时效适用中止中断。D向法院(非仲裁委员会)申请执行。E规定履行期间的从最后一日计算(非法律文书生效之日)。数据标为single+Ans:B。【法条依据】《仲裁法》第62条。"},{"id":383,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（模拟题）下列纠纷中适用专属管辖的有（ ）。","options":{"A":"建设工程施工合同纠纷","B":"施工机械租赁合同纠纷","C":"建筑材料买卖合同纠纷","D":"房屋买卖合同纠纷","E":"港口作业中发生纠纷"},"answer":"ADE","explanation":"【逐项解析】ADE正确:建设工程施工合同纠纷(不动产所在地)、房屋买卖合同纠纷(不动产)、港口作业纠纷→专属管辖。B施工机械租赁和C材料买卖→普通合同纠纷(非专属管辖)。【法条依据】《民事诉讼法》第34条。"},{"id":384,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）建设工程施工合同纠纷的管辖法院是（ ）。","options":{"A":"建设工程所在地人民法院","B":"发包人住所地人民法院","C":"承包人住所地人民法院","D":"发包人和承包人约定的人民法院"},"answer":"A","explanation":"【逐项解析】A正确:建设工程施工合同纠纷由工程所在地法院专属管辖(不动产纠纷)。BCD均错→不适用协议管辖。【法条依据】《民事诉讼法解释》第28条:建设工程施工合同纠纷按不动产纠纷确定管辖。"},{"id":385,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-单选题】","type":"single","stem":"关于民事诉讼地域管辖的说法，正确的是（ ）。","options":{"A":"建设工程施工合同纠纷由工程所在地人民法院管辖","B":"对于监禁的人提起的诉讼由监狱所在地人民法院管辖","C":"合同对履行地点约定不明确，应当由被告人所在地人民法院管辖","D":"以信息网络方式订立的买卖合同，应当由出卖人所在地人民法院管辖"},"answer":"A","explanation":"【逐项解析】A正确:建设工程施工合同纠纷由工程所在地法院管辖(专属管辖)。B对被监禁人诉讼由原告住所地法院管辖(非监狱所在地)。C约定不明时,给付货币的以接受货币方所在地为履行地。D以信息网络方式订立的以收货地或买家住所地为履行地。【法条依据】《民事诉讼法》第23条、第34条。"},{"id":386,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）关于移送管辖的说法，正确的是（ ）。","options":{"A":"移送管辖是没有管辖权的法院把案件移送给有管辖权的法院审理","B":"移送管辖仅限于上下级法院之间","C":"移送管辖与指定管辖的程序完全相同","D":"受移送的法院认为受移送的案件不属于本院管辖的，可以再自行移送"},"answer":"A","explanation":"【逐项解析】A正确:移送管辖是无管辖权的法院将案件移送有管辖权的法院。B移送管辖不限上下级(同级之间也可移送)。C移送管辖与指定管辖是不同程序。D受移送法院认为不属于本院管辖的应报请上级法院指定管辖(不得再自行移送)。【法条依据】《民事诉讼法》第36条。"},{"id":387,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）以下关于民事诉讼代理制度，说法正确的是（ ）。","options":{"A":"当事人最多可以委托3名诉讼代理人","B":"诉讼代理人不具备律师资格的，只能是当事人亲属","C":"授权委托书必须载明委托事项和权限，并由委托人签名或盖章","D":"诉讼代理人有权为当事人代为承认、放弃、变更诉讼请求，进行和解"},"answer":"C","explanation":"【逐项解析】C正确:授权委托书必须载明委托事项和权限并由委托人签名或盖章。A最多委托2名(非3名)。B代理人可为律师、基层法律服务工作者、当事人的近亲属或工作人员、有关社会团体推荐的公民。D代为承认放弃变更诉讼请求需特别授权(非一般授权)。【法条依据】《民事诉讼法》第61条、第62条。"},{"id":388,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列人员中，可以被委托为民事诉讼代理人的是（ ）。","options":{"A":"知名法学家","B":"基层法律服务工作者","C":"当事人的亲属","D":"建设行政主管部门推荐的公民"},"answer":"B","explanation":"【逐项解析】B正确:基层法律服务工作者可被委托为诉讼代理人。A知名法学家需是当事人近亲属或被推荐才可。C亲属范围限于近亲属(父母子女配偶兄弟姐妹等)。D行政主管部门推荐非委托代理人资格。【法条依据】《民事诉讼法》第61条。"},{"id":389,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"人民法院认为审理案件需要的下列民事证据中,应当主动调查收集的是（ ）","options":{"A":"涉及国家秘密的证据","B":"涉及国有资产的证据","C":"涉及身份关系的","D":"因客观原因不能自行收集的"},"answer":"C","explanation":"【逐项解析】C正确:涉及身份关系的证据法院应主动调查收集。A涉及国家秘密→法院依职权调查(但身份关系是最典型的)。B国有资产非法院必须主动调查的。D因客观原因不能自行收集→依申请调查(非主动)。【法条依据】《民事诉讼法》第67条。"},{"id":390,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题修改）在施工合同纠纷的诉讼中，能作为证据的有（ ）","options":{"A":"法律规定","B":"当事人的陈述","C":"谈判录音","D":"工程设计图纸","E":"工程质量司法鉴定机构出具的鉴定报告"},"answer":"BCDE","explanation":"【逐项解析】BCDE正确:当事人陈述、谈判录音(视听资料)、设计图纸(书证)、鉴定报告均属法定证据种类。A法律规定不是证据(是裁判依据)。证据八种:当事人陈述、书证、物证、视听资料、电子数据、证人证言、鉴定意见、勘验笔录。【法条依据】《民事诉讼法》第66条。"},{"id":391,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列人员中，不能作为民事诉讼的证人作证的是（ ）。","options":{"A":"因健康原因不能出庭的","B":"因路途遥远，交通不便不能出庭的","C":"不能正确表达意思的","D":"因自然灾害等不可抗力不能出庭的"},"answer":"C","explanation":"【逐项解析】C正确:不能正确表达意思的人不能作证。ABD属于证人确有困难不能出庭的情形(可提交书面证言或通过视听传输技术作证),但仍有证人资格。【法条依据】《民事诉讼法》第75条。"},{"id":392,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列当事人提出的证据中，能单独作为认定案件事实的有（ ）。","options":{"A":"与一方当事人或者其代理人有利害关系的证人出具的证言","B":"与书证原件核对无误的复印件","C":"当事人的陈述","D":"有其他证据佐证并以合法手段取得的、无疑点的视听资料","E":"无正当理由未出庭作证的证人证言"},"answer":"BD","explanation":"【逐项解析】BD正确:B核对无误的复印件可单独作为认定事实的依据。D有其他证据佐证且合法的视听资料可单独认定。A有利害关系的证人证言不能单独认定。C当事人的陈述不能单独认定(需其他证据补强)。E无正当理由未出庭的证人证言不能单独认定。【法条依据】《民事诉讼法解释》第90条。"},{"id":393,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列情形中，可以引起诉讼时效中断的有（ ）","options":{"A":"权利人申请仲裁","B":"不可抗力义务人","C":"同意履行义务","D":"权利人向义务人提出履行请求","E":"权利人被义务人或者其他人控制"},"answer":"ACD","explanation":"【逐项解析】ACD正确:申请仲裁、同意履行义务、提出履行请求→引起诉讼时效中断。B不可抗力→诉讼时效中止(非中断)。E权利人被控制→诉讼时效中止。【法条依据】《民法典》第195条。"},{"id":394,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某建设单位支付工程最终结算款的时间应为2013年4月1日。由于建设单位逾期未予 支付，故施工单位于2013年8月1日致函建设单位要求付款，但未得到任何答复。则施工单位请求人民法院保 护其权利的诉讼时效期间届满的时间为（ ）。","options":{"A":"2014年4月1日","B":"2014年8月1日","C":"2016年8月1日","D":"2015年8月1日"},"answer":"C","explanation":"【逐项解析】C正确:2013年4月1日应付款→诉讼时效3年→至2016年4月1日届满。但2013年8月1日致函要求付款→诉讼时效中断→重新计算3年→2016年8月1日届满。注意:2017年前适用2年时效,2017年10月1日起民法总则实施诉讼时效变3年。本题按3年计算。【法条依据】《民法典》第188条、第195条。"},{"id":395,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）按照合同约定，2019年1月1日发包方应该向承包方支付工程款，但没有支付。当 年7月1日至8月1日之间，当地发生了特大洪水，导致承包方不能行使请求权。则在此期间（ ）。","options":{"A":"诉讼时效中止","B":"诉讼时效中断","C":"诉讼时效不中止","D":"诉讼时效终止"},"answer":"C","explanation":"【逐项解析】C正确:诉讼时效中止发生在时效期间最后6个月内。2019年1月1日应付款,时效至2022年1月1日(3年)。7月1日至8月1日仍在时效期间内但不属于最后6个月(最后6个月从2021年7月1日起),因此不中止。若发生在最后6个月内→中止。注意:洪水持续1个月结束,即使发生在最后6个月内,中止事由消除后继续计算6个月。【法条依据】《民法典》第194条。"},{"id":396,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）承包人起诉发包人支付工程价款，经传票传唤，诉讼参加人无正当理由，拒不到庭 的，人民法院的下列做法中，正确的是（ ）。","options":{"A":"承包人拒不到庭的，缺席判决","B":"发包人拒不到庭的，缺席判决","C":"第三人拒不到庭的，裁定中止案件审理","D":"证人拒不到庭的，按撤诉处理"},"answer":"B","explanation":"【逐项解析】B正确:被告(发包人)无正当理由拒不到庭→缺席判决。A原告(承包人)拒不到庭→按撤诉处理(非缺席判决)。C第三人不到庭不影响审理。D证人不到庭可对其采取强制措施(非按撤诉处理)。【法条依据】《民事诉讼法》第146条、第147条。"},{"id":397,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列情形中，应当中止民事诉讼程序的有（ ）。","options":{"A":"原告死亡，继承人放弃诉讼权利的","B":"作为一方当事人的法人终止，尚未确定权利义务承受人的","C":"一方当事人死亡，需要等待继承人表明是否参加诉讼的","D":"离婚案件一方当事人死亡的","E":"被告死亡，没有遗产，也没有应当承担义务的人的"},"answer":"BC","explanation":"【逐项解析】BC正确:B法人终止未确定权利义务承受人→中止诉讼。C一方死亡需等待继承人→中止诉讼。A继承人放弃权利→终结诉讼(非中止)。D离婚案件一方死亡→终结诉讼。E被告死亡无遗产无义务人→终结诉讼。中止vs终结:中止是暂停待条件成就后恢复,终结是彻底结束。【法条依据】《民事诉讼法》第153条、第154条。"},{"id":398,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于小额诉讼程序的说法，正确的是（ ）。","options":{"A":"小额诉讼程序适用于审理事实清楚、权利义务关系明确、争议不大的简单金钱给付民事案件","B":"小额诉讼程序是普通程序的一种","C":"小额诉讼程序适用于标的额为全国上年度就业人员年平均工资50％以下的案件","D":"小额诉讼程序实行两审终审"},"answer":"A","explanation":"【逐项解析】A正确:小额诉讼适用于事实清楚、权利义务明确、争议不大的简单金钱给付案件。B是简易程序的一种(非普通程序)。C标的额为各省上年度就业人员年平均工资50%以下(非全国)。D一审终审(非两审终审)。【法条依据】《民事诉讼法》第165条。"},{"id":399,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"关于小额民事诉讼的说法，正确的是（ ）。","options":{"A":"人身关系条件不适用小额诉讼","B":"小额诉讼案件应当采用合议庭审理","C":"小额诉讼案件实行两审终审","D":"小额诉讼案件应当自立案之日起1年内审结"},"answer":"A","explanation":"【逐项解析】A正确:人身关系案件不适用小额诉讼程序。B小额诉讼实行独任审判(非合议庭)。C一审终审(非两审)。D应自立案之日起3个月内审结(非1年)。【法条依据】《民事诉讼法》第165-167条。"},{"id":400,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）关于民事诉讼审判程序的说法，正确的是（ ）。","options":{"A":"一审程序包括普通程序和特殊程序","B":"符合起诉条件的，应当在5日内立案","C":"原告与案件有直接利害关系","D":"提交起诉状的同时提交全部证据"},"answer":"C","explanation":"【逐项解析】C正确:原告需与案件有直接利害关系(起诉条件之一)。A一审包括普通程序和简易程序(非特殊程序)。B符合条件应在7日内立案(非5日)。D证据可在举证期限内提交(非必须提交起诉状时提交全部)。【法条依据】《民事诉讼法》第122条、第126条。"},{"id":401,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）人民法院于2018年4月1日作出第一审民事判决，判决书于4月5日送达原告，4月10日 送达被告，当事人双方均未提出上诉，该判决书生效之日是2018年4月（ ）","options":{"A":"1","B":"26","C":"5","D":"10"},"answer":"B","explanation":"【逐项解析】B正确:上诉期15日从判决书送达之日起算。被告4月10日送达→上诉期至4月25日(4月10日+15天)。期满双方未上诉→4月26日判决生效。注意:上诉期以各自送达日起算,须双方上诉期均届满才生效。【法条依据】《民事诉讼法》第171条。"},{"id":402,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列案件中，实行二审终审的案件是（ ）。","options":{"A":"小额诉讼案件","B":"确认调解协议案件","C":"建设工程施工合同案件","D":"实现担保物权案件"},"answer":"C","explanation":"【逐项解析】C正确:建设工程施工合同案件适用两审终审。A小额诉讼→一审终审。B确认调解协议→特别程序一审终审。D实现担保物权→特别程序一审终审。【法条依据】《民事诉讼法》第10条、第165条、特别程序。"},{"id":403,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题】","type":"single","stem":"发生法律效力的民事判決、裁定，当事人可以向人民法院申请执行，该人民法院应当是（ ）。","options":{"A":"终审人民法院","B":"申请执行人所在地人民法院","C":"被执行的财产所在地基层人民法院","D":"与第一审人民法院同级的被执行的财产所在地人民法院"},"answer":"D","explanation":"【逐项解析】D正确:民事判决裁定由第一审法院或与第一审法院同级的被执行的财产所在地法院执行。A非终审法院(仲裁裁决才是中级法院,民事判决由一审法院执行)。B非申请执行人所在地。C基层法院不准确(取决于一审法院级别)。【法条依据】《民事诉讼法》第235条。"},{"id":404,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题】","type":"single","stem":"在民事诉讼执行阶段，人民法院应当裁定中止执行的是（ ）。","options":{"A":"申请人撤销强制执行申请的","B":"案外人对执行标的提出确有理由的异议的","C":"据以执行的法律文书被撤销的","D":"作为被执行人的公民因生活困难无力偿还借款，无收入来源，又丧失劳动力的"},"answer":"B","explanation":"【逐项解析】B正确:案外人对执行标的提出确有理由的异议→裁定中止执行。A撤销申请→终结执行。C文书被撤销→终结执行。D无力偿还→终结执行(或终结本次执行)。中止vs终结:中止可恢复执行,终结是彻底结束。【法条依据】《民事诉讼法》第263条、第264条。"},{"id":405,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）某施工单位在参加投标中有违法行为，建设行政主管部门的处罚决定于5月20日作 出，施工单位5月25日收到。11月1日施工单位欲通过有关途径申请撤销该处罚决定，则说法正确的是（ ）","options":{"A":"施工单位可以申请复议，也可以不经过复议直接起诉","B":"施工单位应先申请复议，不服复议可以向法院起诉","C":"施工单位只能向法院起诉","D":"施工单位既不可以申请复议，也不可以向法院起诉"},"answer":"C","explanation":"【逐项解析】C正确:5月25日收到处罚决定→复议期60日(至7月24日)→已过期。起诉期6个月(至11月25日)→11月1日仍在期限内,可直接起诉(无需先复议)。行政处罚复议与诉讼的关系:当事人可选择复议或起诉(非必须复议前置),但复议期已过后只能起诉。【法条依据】《行政复议法》第9条、《行政诉讼法》第46条。"},{"id":406,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）对下列行政行为不服，申请人应当先向行政复议机关申请行政复议，对行政复议决 定不服，方可以向民法院提起行政诉讼的是（ ）。","options":{"A":"行政机关作出的确认自然资源所有权的决定","B":"行政机关作出的行政强制执行决定","C":"申请政府信息公开、行政机关不予公开","D":"行政机关作出的吊销资质证书处罚决定"},"answer":"C","explanation":"《行政复议法》第23条：复议前置情形包括“申请政府信息公开，行政机关不予公开”（C正确）。A错误：复议前置的是“侵犯已依法取得的自然资源所有权/使用权”的决定，单纯的“确认自然资源所有权”不属复议前置。B行政强制执行、D吊销资质可直接诉讼或选择复议，非必须前置。故选C。"},{"id":407,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于行政复议申请的说法，正确的是（ ）。","options":{"A":"有权对某一行政行为申请行政复议的公民死亡的，该行政行为不得再被申请行政复议","B":"因不动产提出的行政复议申请自行政行为作出之日起超过20年的，行政复议机关不予受理","C":"作出行政行为的行政机关被撤销的，不得再对其作出的行政行为申请复议","D":"申请人申请行政复议，应当书面提出"},"answer":"B","explanation":"【逐项解析】B正确:因不动产提起的复议自行政行为作出超过20年→不予受理。A公民死亡的其近亲属可申请复议。C行政机关被撤销的由继续行使其职权的机关为被申请人。D可书面或口头提出。【法条依据】《行政复议法》第10条、第11条、第21条。"},{"id":408,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-单选题】","type":"single","stem":"下列行政诉讼案件中，由中级人民法受理一审的案件是（ ）。","options":{"A":"知识产权案件","B":"省公安厅作为被告的案件","C":"乡镇人民政府作为被告的案件","D":"县级人民政府作为被告的案件"},"answer":"D","explanation":"【逐项解析】D正确:县级政府为被告→中级法院管辖第一审行政案件。A知识产权案件一审可由基层或中级(视情况)。B省公安厅为被告→基层法院(对国务院部门或县级以上政府提起才由中级管辖)。C乡镇政府→基层法院。中级法院管辖:对国务院部门或县级以上地方政府所作的行政行为提起的诉讼。【法条依据】《行政诉讼法》第15条。"},{"id":409,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-单选题】","type":"single","stem":"关于行政诉讼法院管辖的说法，正确的是（ ）。","options":{"A":"原告向两个以上有管辖权的人民法院提出起诉的，由最先立案的人民法院管辖","B":"对国务院部门所作的行政行为提起诉讼的第一审行政案件，由高级人民法院管辖","C":"人民法院对管辖权发生争议的，由其共同的上级人民法院直接指定管辖","D":"人民法院发回重审的案件，当事人提出管辖权异议的，人民法院应当审查"},"answer":"A","explanation":"【逐项解析】A正确:原告向两个以上有管辖权的法院起诉的由最先立案的法院管辖。B国务院部门作被告→中级法院(非高级)。C争议的由共同上级法院指定管辖(可由上级直接指定或协商→指定)。D发回重审案件当事人提出管辖权异议的不予审查。【法条依据】《行政诉讼法》第21条、第15条。"},{"id":410,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-单选题】","type":"single","stem":"关于行政诉讼中举证责任的说法，正确的是（ ）","options":{"A":"原告应当提供被告作出行政行为的证据和所依据的规范性文件","B":"在诉讼过程中，被告诉讼代理人可以自行向原告、第三人和证人收集证据","C":"在行政补偿案件中，因被告的原因导致原告无法就损害情况举证的，应当由被告就该损害情况承担举证责 任","D":"原告应当提供证明行政行为违法的证据"},"answer":"C","explanation":"【逐项解析】C正确:行政补偿案件中因被告原因导致原告无法举证的由被告承担举证责任(举证责任倒置)。A被告(非原告)应提供作出行政行为的证据。B诉讼过程中被告不得自行向原告和证人收集证据。D原告提供符合起诉条件的证据即可(非提供证明违法的证据→被告证明合法)。【法条依据】《行政诉讼法》第34条、第35条、第38条。"},{"id":411,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）施工单位对建设行政管理部门下列行为提起行政诉讼，人民法院应当受理的是（ ）。","options":{"A":"对施工现场侵权赔偿纠纷进行的调解","B":"撤销施工单位资质证书的决定","C":"因工作人员违法颁发资质证书而给予的行政处分","D":"关于资质证书颁发的条件不符合法律规定"},"answer":"B","explanation":"【逐项解析】B正确:撤销资质证书属于具体行政行为→可提起行政诉讼。A调解行为→不可诉(《行政诉讼法》第13条排除行政调解)。C行政处分(内部行政行为)→不可诉。D不符合条件(抽象的)→不属受案范围。【法条依据】《行政诉讼法》第12条、第13条。"},{"id":412,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列情形中，属于行政复议受案范围的是（ ）。","options":{"A":"认为行政机关制定、发布的具有普遍约束力的规范性文件侵犯其合法权益的","B":"对行政机关作出的人事任免决定不服的","C":"对行政机关作出的民事纠纷调解不服的","D":"对行政机关作出的不予受理工伤认定申请的决定不服的"},"answer":"D","explanation":"【逐项解析】D正确:对不予受理工伤认定申请不服→可申请行政复议(具体行政行为)。A抽象行政行为→不可复议(可附带审查)。B人事任免→内部行为不可复议。C民事纠纷调解→不可复议。【法条依据】《行政复议法》第6条。"},{"id":413,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列属于人民法院行政诉讼受案范围的是（ ）。","options":{"A":"行政机关为作出行政行为而实施的准备、论证、研究、层报、咨询等过程性行为","B":"驳回当事人对行政行为提起申诉的重复处理行为","C":"认为行政机关滥用行政权力排除或者限制竞争的","D":"调解行为以及法律规定的仲裁行为"},"answer":"C","explanation":"【逐项解析】C正确:认为行政机关滥用行政权力排除或限制竞争→行政诉讼受案范围。A过程性行为→不可诉。B重复处理行为→不可诉。D调解行为和仲裁行为→不可诉。【法条依据】《行政诉讼法》第12条、第13条。"},{"id":414,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）行政诉讼期间发生的下列情况，人民法院应当裁定停止执行行政行为的有（ ）。","options":{"A":"原告认为需要停止执行的","B":"被告认为需要停止执行的","C":"该行政行为的执行会给当事人造成重大损害的","D":"人民法院认为该行政行为的执行会给国家和利益造成重大损害的","E":"该行政行为具有人身强制属性的"},"answer":"BD","explanation":"【逐项解析】BD正确:B被告认为需要停止执行→应停止。D法院认为执行会给国家利益造成重大损害→应停止。A原告认为非应当。C会造成重大损害(非国家和利益)。E人身强制属性非应当停止的理由。【法条依据】《行政诉讼法》第56条。"},{"id":415,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列主体中，不能作为行政诉讼被告的是（ ）。","options":{"A":"某区区长","B":"某大学","C":"某居委会","D":"某造价师协会"},"answer":"A","explanation":"【逐项解析】A正确:区长是个人(非行政机关或授权组织),不能作为行政诉讼被告。B大学(授权组织)、C居委会(授权组织)、D造价师协会(授权组织)在行使行政管理职能时可作被告。行政诉讼被告必须是行政机关或被授权组织。【法条依据】《行政诉讼法》第2条。"},{"id":416,"chapter":"第10章 建设工程争议解决法律制度","marker":"【真题-单选题】","type":"single","stem":"人民法院认为事实清楚，权利义务关系明确、争议不大的第一审行政案件，可以适用简易程序的是（ ）。（）","options":{"A":"属于政府信息公开的案件","B":"发回重审的案件","C":"按照审判监督程序再审的案件","D":"被诉行政行为经过听证程序的案件"},"answer":"A","explanation":"【逐项解析】A正确:政府信息公开案件可适用简易程序。BCD均不适用简易程序:发回重审、再审案件、经听证程序的案件程序较复杂,不适用简易程序。简易程序条件:事实清楚、权利义务明确、争议不大。政府信息公开案件通常符合这些条件。【法条依据】《行政诉讼法》第82条。"},{"id":417,"chapter":"第10章 建设工程争议解决法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列行政诉讼案件中，可以适用调解的是（ ）。","options":{"A":"对行政机关作出的关于确认山岭使用权的决定不服的","B":"认为行政机关侵犯其经营自主权的","C":"认为行政机关限制竞争的","D":"请求行政赔偿的"},"answer":"D","explanation":"【逐项解析】D正确:行政赔偿案件可适用调解。行政诉讼原则上不适用调解,但行政赔偿、补偿及行政机关行使自由裁量权的案件可以调解。A确认使用权/B侵犯经营自主权/C限制竞争→不适用调解。【法条依据】《行政诉讼法》第60条。"}];
const res = { json: async () => QDATA };  // embedded data
  allQuestions = await res.json();
  document.getElementById('totalBadge').textContent = `题库 ${allQuestions.length} 题`;
  loadState();
  loadFromHash();
  renderChapters();
  applyFilter();
}

// ── URL Hash 自动同步 ──
// 格式: #v=1&m=seq&c=all&a=___1_0__...  (417位, _=未做 1=正确 0=错误)
function encodeHash() {
  if (Object.keys(answeredQ).length === 0) {
    history.replaceState(null, '', location.pathname);
    return;
  }
  const maxId = allQuestions.length;
  let ans = '';
  for (let i = 1; i <= maxId; i++) {
    const v = answeredQ[i];
    if (v === undefined) ans += '_';
    else if (v === 'correct') ans += '1';  // 正确
    else ans += '0';  // 错误（选项字母）
  }
  ans = ans.replace(/_+$/, '');
  const params = new URLSearchParams();
  params.set('v', '1');
  if (mode !== 'seq') params.set('m', mode);
  if (selChapter !== 'all') params.set('c', encodeURIComponent(selChapter));
  params.set('a', ans);
  const hash = '#' + params.toString();
  history.replaceState(null, '', hash);
}

function loadFromHash() {
  const hash = location.hash.slice(1);
  if (!hash) return;
  const params = new URLSearchParams(hash);
  const ans = params.get('a');
  if (!ans) return;
  // 从hash恢复做题记录
  let hashAnswers = 0;
  for (let i = 0; i < ans.length; i++) {
    const ch = ans[i];
    const qid = i + 1;
    if (ch === '1') { answeredQ[qid] = 'correct'; hashAnswers++; }
    else if (ch === '0') { answeredQ[qid] = 'X'; hashAnswers++; }  // X表示做过但错了(同步时选项字母不重要)
  }
  // 恢复模式和章节
  const m = params.get('m');
  if (m) mode = m;
  const c = params.get('c');
  if (c) selChapter = decodeURIComponent(c);
  updateModeBtn();
  updateAutoNextBtn();
  if (hashAnswers > 0) {
    saveState(); // 同步到localStorage
    setTimeout(() => showToast(`已从同步链接恢复 ${hashAnswers} 题进度`), 500);
  }
  updateSyncBtn();
}
// loadFromHash is called inside load() after allQuestions is ready

// ── localStorage ──
const LS_KEY = 'fagui_quiz_state_v2';
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    answeredQ, mode, selChapter, autoNext
  }));
  encodeHash();  // 自动更新URL hash
}
function loadState() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      answeredQ = s.answeredQ || {};
      mode = s.mode || 'seq';
      selChapter = s.selChapter || 'all';
      autoNext = s.autoNext || false;
      updateModeBtn();
      updateAutoNextBtn();
    } catch(e) {}
  }
}
function resetProgress() {
  if (confirm('确定要重置所有刷题进度？此操作不可恢复！')) {
    answeredQ = {};
    notesQ = {};
    selChapter = 'all';
    saveState();
    saveNotes();
    renderChapters();
    applyFilter();
    renderQuestionList();
  }
}

// ── Data Export / Import ──
function copySyncLink() {
  const cnt = Object.keys(answeredQ).length;
  if (cnt === 0) {
    showToast('还没有做题记录，请先刷几道题再同步');
    return;
  }
  const url = location.href;
  navigator.clipboard.writeText(url).then(() => {
    showToast(`已复制同步链接（${cnt}题），其他设备打开即可恢复`);
  }).catch(() => {
    const input = document.createElement('input');
    input.value = url;
    document.body.appendChild(input);
    input.select();
    document.execCommand('copy');
    document.body.removeChild(input);
    showToast(`已复制同步链接（${cnt}题），其他设备打开即可恢复`);
  });
}

function updateSyncBtn() {
  const btn = document.getElementById('btnCopyLink');
  if (!btn) return;
  const cnt = Object.keys(answeredQ).length;
  btn.textContent = cnt > 0 ? `🔗 同步(${cnt})` : '🔗 同步';
}

function exportData() {
  const data = {
    version: 1,
    exportedAt: new Date().toISOString(),
    subject: 'fagui',
    totalQuestions: allQuestions.length,
    answeredQ: answeredQ,
    notesQ: notesQ,
    mode: mode,
    selChapter: selChapter,
    autoNext: autoNext,
    stats: {
      answered: Object.keys(answeredQ).length,
      correct: Object.values(answeredQ).filter(v => v === true).length
    }
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  const ts = new Date().toISOString().slice(0,10).replace(/-/g,'');
  a.download = `一建法规_刷题记录_${ts}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('导出成功！文件已下载，可在其他设备导入恢复进度');
}

function importData(event) {
  const file = event.target.files[0];
  if (!file) return;
  if (!confirm('导入将覆盖当前做题记录，确定继续？')) {
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.answeredQ) throw new Error('无效的数据格式');
      answeredQ = data.answeredQ || {};
      notesQ = data.notesQ || {};
      mode = data.mode || 'seq';
      selChapter = data.selChapter || 'all';
      autoNext = data.autoNext || false;
      saveState();
      saveNotes();
      updateModeBtn();
      updateAutoNextBtn();
      renderChapters();
      applyFilter();
      renderQuestionList();
      showToast(`导入成功！恢复 ${Object.keys(answeredQ).length} 条做题记录，${Object.keys(notesQ).length} 条笔记`);
    } catch(err) {
      alert('导入失败：文件格式不正确');
      console.error(err);
    }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showToast(msg) {
  const existing = document.getElementById('toast');
  if (existing) existing.remove();
  const toast = document.createElement('div');
  toast.id = 'toast';
  toast.textContent = msg;
  toast.style.cssText = `
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:#1a1a2e; color:#fff; padding:12px 24px; border-radius:8px;
    font-size:14px; z-index:999; box-shadow:0 4px 12px rgba(0,0,0,.25);
    animation: fadeInUp .3s ease;
  `;
  document.body.appendChild(toast);
  setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity .3s';
    setTimeout(() => toast.remove(), 300);
  }, 2500);
}

// ── Notes ──
let notesQ = {};
const NOTES_KEY = 'fagui_quiz_notes_v2';

function loadNotes() {
  const raw = localStorage.getItem(NOTES_KEY);
  if (raw) try { notesQ = JSON.parse(raw); } catch(e) {}
}
loadNotes();

function saveNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notesQ));
}

function getNote(qid) {
  return notesQ[qid] || '';
}

function saveNote(qid) {
  const el = document.getElementById('noteInput');
  if (!el) return;
  const text = el.value.trim();
  if (text) {
    notesQ[qid] = text;
  } else {
    delete notesQ[qid];
  }
  saveNotes();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Chapters ──
function getChapters() {
  const set = new Set();
  allQuestions.forEach(q => set.add(q.chapter));
  return ['all', ...Array.from(set).sort((a,b) => {
    const na = parseInt(a.match(/\d+/)?.[0] || '0');
    const nb = parseInt(b.match(/\d+/)?.[0] || '0');
    return na - nb;
  })];
}

function renderChapters() {
  const chapters = getChapters();
  const bar = document.getElementById('chapterBar');
  bar.innerHTML = chapters.map(ch => {
    const cls = ch === selChapter ? 'ch-btn sel' : 'ch-btn';
    const label = ch === 'all' ? '全部' : ch.replace(/^第\d+章\s*/, '');
    return `<button class="${cls}" onclick="selectChapter('${ch}')">${label}</button>`;
  }).join('');
}

function selectChapter(ch) {
  selChapter = ch;
  saveState();
  renderChapters();
  applyFilter();
}

// ── Filter ──
function applyFilter() {
  if (selChapter === 'all') {
    filteredQuestions = [...allQuestions];
  } else {
    filteredQuestions = allQuestions.filter(q => q.chapter === selChapter);
  }
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Mode ──
function toggleMode() {
  mode = mode === 'seq' ? 'rand' : 'seq';
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateModeBtn();
  saveState();
  renderQuestion();
  renderQuestionList();
}

function updateModeBtn() {
  document.getElementById('btnMode').textContent = mode === 'seq' ? '顺序' : '随机';
  document.getElementById('btnMode').classList.toggle('active', mode === 'rand');
}

function toggleAutoNext() {
  autoNext = !autoNext;
  updateAutoNextBtn();
  saveState();
}
function toggleInfoPanel() {
  document.getElementById('infoPanel').classList.toggle('open');
}
function updateAutoNextBtn() {
  const btn = document.getElementById('btnAutoNext');
  if (autoNext) {
    btn.textContent = '🔁 自动下一题 ✓';
    btn.style.background = '#ecfdf5';
    btn.style.borderColor = '#10b981';
    btn.style.color = '#10b981';
  } else {
    btn.textContent = '🔁 自动下一题';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  }
}

function shuffleFiltered() {
  for (let i = filteredQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredQuestions[i], filteredQuestions[j]] = [filteredQuestions[j], filteredQuestions[i]];
  }
}

// ── Stats ──
function updateStats() {
  const total = filteredQuestions.length;
  const doneCount = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
  const wrongCount = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
  const remain = total - doneCount;

  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statAcc').textContent = doneCount > 0
    ? Math.round((doneCount - wrongCount) / doneCount * 100) + '%' : '-';
  document.getElementById('statRemain').textContent = remain;
  document.getElementById('progressPct').textContent = Math.round(doneCount / total * 100) + '%';
  document.getElementById('progressFill').style.width = (doneCount / total * 100) + '%';

  // Wrong book
  renderWrongBook();
}

// ── Render question ──
let multiSelected = new Set();  // For multi-select questions

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (filteredQuestions.length === 0) {
    area.innerHTML = '<div class="empty"><div class="icon">✨</div><p>该章节暂无题目</p></div>';
    return;
  }
  if (currentIdx >= filteredQuestions.length) {
    const total = filteredQuestions.length;
    const done = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
    const wrong = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
    area.innerHTML = `
      <div class="empty">
        <div class="icon">🎉</div>
        <p>全部刷完！</p>
        <p style="font-size:14px;color:var(--text2);margin-top:8px;">
          共 ${total} 题 | 错 ${wrong} 题 | 正确率 ${done>0 ? Math.round((done-wrong)/done*100) : 0}%
        </p>
        <button class="btn-next" style="margin-top:16px;" onclick="retryWrong()">复习错题</button>
      </div>`;
    return;
  }
  
  const q = filteredQuestions[currentIdx];
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  const isMulti = q.type === 'multi';
  multiSelected = new Set();

  const optKeys = ['A','B','C','D','E'];
  const options = q.options;
  
  let optHtml = '';
  for (const key of optKeys) {
    if (!options[key]) continue;
    let cls = 'opt-btn';
    let icon = '';
    if (answered) {
      cls += ' done';
      if (q.answer.includes(key)) cls += ' correct';
      else if (prevAns !== 'correct' && prevAns.includes(key)) cls += ' wrong';
      else cls += ' dim';
    } else if (isMulti) {
      icon = `<input type="checkbox" class="multi-cb" data-key="${key}" onchange="toggleMulti(this)" style="margin-right:6px;">`;
    }
    optHtml += `
      <div class="${cls}" onclick="${answered ? '' : (isMulti ? `toggleMultiClick('${key}')` : `answer('${key}')`)}">
        ${icon}<span class="opt-letter">${key}</span>
        <span>${options[key]}</span>
      </div>`;
  }

  area.innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span>第 ${currentIdx+1}/${filteredQuestions.length} 题</span>
        <span>${q.chapter}</span>
        ${q.kaodian ? `<span>${q.kaodian}</span>` : ''}
        <span style="background:${isMulti?'#fef3c7':'#eef0ff'};color:${isMulti?'#d97706':'#4361ee'};">${isMulti ? '多选' : '单选'}</span>
        ${prevAns === 'correct' ? '<span style="background:#ecfdf5;color:#10b981;">✓ 已答对</span>' : ''}
        ${prevAns && prevAns !== 'correct' ? `<span style="background:#fef2f2;color:#ef4444;">✗ 已答错 (${formatAnswer(prevAns)})</span>` : ''}
      </div>
      <div class="q-stem">${q.stem}</div>
      ${isMulti && !answered ? '<div style="font-size:12px;color:#d97706;margin-bottom:10px;">⚠ 多选题，请选择所有正确答案后点击"提交答案"</div>' : ''}
      <div class="q-options">${optHtml}</div>
      <div class="feedback ${answered ? 'show ' : ''}${prevAns === 'correct' ? 'correct' : prevAns ? 'wrong' : ''}" id="feedback">
        ${answered ? (prevAns === 'correct' ? '✓ 回答正确！' : `✗ 回答错误，正确答案是 ${formatAnswer(q.answer)}`) : ''}
        ${answered && q.explanation ? `<div style="margin-top:8px;padding:8px 10px;background:#fff;border-radius:6px;font-size:13px;color:#555;line-height:1.7;"><strong>📖 解析：</strong>${q.explanation}</div>` : ''}
      </div>
      ${answered ? `
      <div class="note-box show">
        ${getNote(q.id) ? `
        <div class="existing-note"><span class="note-icon">📝</span><span class="note-text">${escapeHtml(getNote(q.id))}</span></div>
        ` : ''}
        <textarea id="noteInput" placeholder="记一笔：为什么错 / 关键考点 / 记忆口诀..." onblur="saveNote(${q.id})">${escapeHtml(getNote(q.id) || '')}</textarea>
        <div class="note-hint">输入后自动保存</div>
      </div>
      ` : ''}
      <div class="actions">
        <button class="btn" onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>上一题</button>
        ${isMulti && !answered ? '<button class="btn-next" onclick="submitMulti()" id="btnSubmitMulti">提交答案</button>' : ''}
        <button class="btn-next" onclick="nextQuestion()">${answered ? '下一题' : '跳过'}</button>
      </div>
    </div>`;
}

function formatAnswer(ans) {
  return ans.length === 1 ? ans : ans.split('').join('、');
}

function toggleMulti(cb) {
  const key = cb.dataset.key;
  if (cb.checked) multiSelected.add(key);
  else multiSelected.delete(key);
}

function toggleMultiClick(key) {
  const cb = document.querySelector(`.multi-cb[data-key="${key}"]`);
  if (cb) { cb.checked = !cb.checked; toggleMulti(cb); }
}

function answer(letter) {
  const q = filteredQuestions[currentIdx];
  const correct = q.type === 'multi'
    ? letter.split('').sort().join('') === q.answer.split('').sort().join('')
    : letter === q.answer;
  answeredQ[q.id] = correct ? 'correct' : letter;
  saveState();
  updateStats();
  renderQuestion();
  renderQuestionList();
  updateSyncBtn();
  if (autoNext && correct && currentIdx < filteredQuestions.length - 1) {
    setTimeout(() => { currentIdx++; renderQuestion(); renderQuestionList(); document.getElementById('questionArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 700);
  }
}

function submitMulti() {
  if (multiSelected.size === 0) return;
  const selected = Array.from(multiSelected).sort().join('');
  answer(selected);
}

function prevQuestion() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); renderQuestionList(); }
}

function nextQuestion() {
  if (currentIdx < filteredQuestions.length - 1) {
    currentIdx++;
    renderQuestion(); renderQuestionList();
  } else {
    currentIdx = filteredQuestions.length;
    renderQuestion(); renderQuestionList();
  }
}

function retryWrong() {
  const wrongIds = new Set();
  for (const [id, ans] of Object.entries(answeredQ)) {
    if (ans !== 'correct') wrongIds.add(parseInt(id));
  }
  if (wrongIds.size === 0) {
    alert('没有错题，全部正确！');
    return;
  }
  filteredQuestions = allQuestions.filter(q => wrongIds.has(q.id));
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Wrong book ──
function renderWrongBook() {
  const wrongQs = [];
  for (const q of allQuestions) {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  }
  
  const book = document.getElementById('wrongBook');
  const list = document.getElementById('wrongList');
  
  if (wrongQs.length === 0) {
    book.style.display = 'none';
    return;
  }
  
  book.style.display = 'block';
  document.getElementById('wrongCount').textContent = `(${wrongQs.length} 题)`;
  
  list.innerHTML = wrongQs.map(wq => `
    <div class="wrong-item" onclick="jumpToQuestion(${wq.id})">
      <div class="q-text">${wq.stem.substring(0, 80)}...</div>
      <div class="q-meta-small">
        <span>${wq.chapter}</span> |
        你的答案: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
        正确答案: <span class="ans">${formatAnswer(wq.answer)}</span>
      </div>
    </div>
  `).join('');
}

function jumpToQuestion(qid) {
  selChapter = 'all';
  filteredQuestions = [...allQuestions];
  if (mode === 'rand') shuffleFiltered();
  const idx = filteredQuestions.findIndex(q => q.id === qid);
  if (idx >= 0) {
    currentIdx = idx;
    renderChapters();
    updateStats();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── Analysis ──
function showAnalysis() {
  // Build chapter stats
  const chStats = {};
  allQuestions.forEach(q => {
    if (!chStats[q.chapter]) chStats[q.chapter] = { total: 0, done: 0, wrong: 0 };
    chStats[q.chapter].total++;
    const ans = answeredQ[q.id];
    if (ans !== undefined) {
      chStats[q.chapter].done++;
      if (ans !== 'correct') chStats[q.chapter].wrong++;
    }
  });

  // Sort by accuracy (worst first)
  const chapters = Object.entries(chStats)
    .filter(([_, s]) => s.done > 0)
    .map(([name, s]) => ({
      name: name.replace(/^第\d+章\s*/, ''),
      fullName: name,
      ...s,
      acc: s.done > 0 ? Math.round((s.done - s.wrong) / s.done * 100) : 0
    }))
    .sort((a, b) => a.acc - b.acc);

  const overallDone = Object.values(chStats).reduce((s, c) => s + c.done, 0);
  const overallWrong = Object.values(chStats).reduce((s, c) => s + c.wrong, 0);
  const overallAcc = overallDone > 0 ? Math.round((overallDone - overallWrong) / overallDone * 100) : 0;

  if (overallDone === 0) {
    document.getElementById('analysisContent').innerHTML = '<p style="color:#888;padding:20px 0;">还没有刷题记录，先刷几题再来分析吧 ✨</p>';
    document.getElementById('analysisModal').classList.add('show');
    return;
  }

  // Build most-wrong questions
  const wrongQs = [];
  allQuestions.forEach(q => {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  });
  wrongQs.sort((a, b) => {
    const ca = (answeredQ[a.id] && answeredQ[a.id] !== 'correct' ? 1 : 0);
    const cb = (answeredQ[b.id] && answeredQ[b.id] !== 'correct' ? 1 : 0);
    return cb - ca;
  });

  // Recommendations
  const recs = [];
  chapters.forEach(ch => {
    if (ch.done < 3) return;
    if (ch.acc < 50) recs.push({ level: 'high', text: `「${ch.name}」正确率仅 ${ch.acc}%，需重点攻克，建议回看讲义原文`, ch });
    else if (ch.acc < 70) recs.push({ level: 'medium', text: `「${ch.name}」正确率 ${ch.acc}%，加强专项练习`, ch });
  });
  const untouched = Object.entries(chStats).filter(([_, s]) => s.done === 0);
  untouched.forEach(([name, s]) => {
    recs.push({ level: 'medium', text: `「${name.replace(/^第\d+章\s*/, '')}」尚未刷过，安排时间过一遍`, ch: null });
  });

  let html = `
    <div class="analysis-section">
      <h3>📈 总体正确率: <b style="color:${overallAcc>=70?'var(--correct)':overallAcc>=50?'#f59e0b':'var(--wrong)'}">${overallAcc}%</b> (${overallDone - overallWrong}/${overallDone})</h3>
    </div>
    <div class="analysis-section">
      <h3>📊 章节正确率排序（低到高）</h3>
      <div class="chapter-bar-chart">
  `;

  chapters.forEach(ch => {
    const level = ch.acc < 50 ? 'weak' : ch.acc < 70 ? 'medium' : 'strong';
    html += `
      <div class="cb-row">
        <div class="cb-label">${ch.name}</div>
        <div class="cb-track"><div class="cb-fill ${level}" style="width:${ch.acc}%"></div></div>
        <div class="cb-val">${ch.acc}% <span style="font-weight:normal;color:#999;">(${ch.done - ch.wrong}/${ch.done})</span></div>
      </div>`;
  });

  html += `</div></div>`;

  // Recommendations
  if (recs.length > 0) {
    html += `<div class="analysis-section"><h3>💡 备考建议</h3>`;
    recs.forEach(r => {
      html += `<div class="rec-card ${r.level}"><div class="rec-title">${r.level === 'high' ? '🔴 优先' : r.level === 'medium' ? '🟡 关注' : '🟢 保持'}</div>${r.text}</div>`;
    });
    html += `</div>`;
  }

  // Top wrong questions
  if (wrongQs.length > 0) {
    html += `<div class="analysis-section"><h3>⚠️ 高频错题 (Top 5)</h3>`;
    wrongQs.slice(0, 5).forEach(wq => {
      html += `<div class="wrong-item" onclick="jumpToQuestion(${wq.id});hideAnalysis()">
        <div class="q-text">${wq.stem.substring(0, 60)}...</div>
        <div class="q-meta-small">
          你的: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
          正确: <span class="ans">${formatAnswer(wq.answer)}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('analysisContent').innerHTML = html;
  document.getElementById('analysisModal').classList.add('show');
}

function hideAnalysis() {
  document.getElementById('analysisModal').classList.remove('show');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  const q = filteredQuestions.length > 0 && currentIdx < filteredQuestions.length
    ? filteredQuestions[currentIdx] : null;
  if (!q) return;
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  
  if (!answered && q.type === 'single' && ['a','b','c','d'].includes(e.key.toLowerCase())) {
    const letter = e.key.toUpperCase();
    if (q.options[letter]) answer(letter);
  }
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight' || e.key === ' ') nextQuestion();
});

// ── Start ──
load();

// ── Question list sidebar ──
function renderQuestionList() {
  const container = document.getElementById('qNums');
  if (!container) return;
  let html = '';
  for (let i = 0; i < filteredQuestions.length; i++) {
    const q = filteredQuestions[i];
    const status = answeredQ[q.id];
    let cls = 'q-num';
    if (i === currentIdx) cls += ' current';
    if (status === 'correct') cls += ' correct';
    else if (status) cls += ' wrong';
    html += `<div class="${cls}" onclick="jumpToQuestion(${i})" title="第${i+1}题">${i+1}</div>`;
  }
  container.innerHTML = html;
  // Update total count
  const totalEl = document.querySelector('.sidebar-title .total');
  if (totalEl) totalEl.textContent = `${filteredQuestions.length}题`;
  // Scroll current into view
  const currentEl = container.querySelector('.current');
  if (currentEl) {
    currentEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function jumpToQuestion(idx) {
  if (idx >= 0 && idx < filteredQuestions.length) {
    currentIdx = idx;
    renderQuestion();
    renderQuestionList();
  }
}

</script>
