ons":{"A":"不同投标人的投标报价呈规律性差异","B":"不同投标人的投标文件在同一文印店装订","C":"不同投标人的投标保函由同一银行开具","D":"投标人之间协商投标报价等投标文件的实质性内容"},"answer":"A","explanation":"【逐项解析】A正确：不同投标人投标报价呈规律性差异，视为投标人相互串通投标。B不同文印店装订→需结合其他情况判断。C保函同一银行开具→正常商业行为。D协商投标报价→属于串通（第39条），非视为（第40条）。【法条依据】《招标投标法实施条例》第40条。"},{"id":147,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列情形中，属于招标人与投标人串通投标的有( )。","options":{"A":"投标人未经招标人授意，自行撤换、修改投标文件","B":"招标人在开标前开启投标文件并将有关信息泄露给投标人","C":"设定的资格条件与招标项目的实际需要不相适应","D":"招标人直接向投标人泄露标底、评标委员会成员等信息","E":"招标人暗示投标人压低或者抬高投标报价"},"answer":"BDE","explanation":"【逐项解析】BDE正确：开标前开启投标文件泄露信息、直接泄露标底、暗示压低抬高报价，均属招标人与投标人串通投标。A投标人自行撤换→非招标人串通。C设定不合理资格条件→属于不合理条件限制排斥（非串通）。【法条依据】《招标投标法实施条例》第41条。"},{"id":148,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-多选题】","type":"multi","stem":"下列行为中，属于对不同企业设置的各类不合理限制和壁垒的有( )。","options":{"A":"要求投标人在本地注册设立子公司、分公司、分支机构，在本地拥有一定办公面积，在本地缴纳社会保险","B":"以投标人的业绩和奖项作为加分条件","C":"采用抽签、摇号等方式直接确定中标候选人","D":"要求经营主体取得培训合格证、上岗证等特定地区或者特定行业组织颁发的相关证书","E":"为招标人指定评标委员会成员"},"answer":"ACDE","explanation":"【逐项解析】ACDE正确：要求在本地注册子公司、抽签摇号确定中标人、要求取得特定地区证书、为招标人指定评标委员会成员均属不合理限制。B以业绩奖项作为加分条件→在一定范围内允许（非当然不合理）。【法条依据】《工程项目招投标领域营商环境专项整治工作方案》。"},{"id":149,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于开标的说法，正确的是( )。","options":{"A":"投标文件经确定无误后，由招标监管部门人员当众拆封","B":"开标时只能由投标人或其推选的代表检查投标文件的密封情况","C":"开标过程应当及时向社会公布","D":"开标地点应当为招标文件中预先确定的地点"},"answer":"D","explanation":"【逐项解析】D正确：开标地点应为招标文件中预先确定的地点。A由投标人或其代表检查密封后当众拆封（非监管部门人员）。B也可以由招标人委托的公证机构检查密封（非只能由投标人）。C开标过程应记录存档（非及时向社会公布）。【法条依据】《招标投标法》第34条、第36条。"},{"id":150,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"关于建设工程开标的说法正确的是( )","options":{"A":"开标应当在投标人递交投标文件的同时进行，","B":"开标过程应当记录并存档备查。","C":"开标地点应当在递交投标文件时告知投标人。","D":"开标时不再检查投标文件的密封情况。"},"answer":"B","explanation":"【逐项解析】B正确：开标过程应记录并存档备查。A应同时（投标截止时间即为开标时间）但非递交同时。C开标地点应在招标文件中预先确定。D开标时应检查密封情况。【法条依据】《招标投标法》第34条、第36条。"},{"id":151,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于投标文件修改的说法，正确的是( )。","options":{"A":"投标人在招标文件要求提交投标文件的截止时间前，可以修改已提交的投标文件","B":"投标人不得修改已提交投标文件的实质性内容","C":"投标人对已提交的投标文件，仅能修改一次","D":"投标人修改已提交的投标文件，修改的内容应当作为一个独立文件"},"answer":"A","explanation":"【逐项解析】A正确：投标截止时间前可修改已提交的投标文件，并书面通知招标人。B错误：可修改实质性内容（只要在截止前）。C错误：无修改次数限制。D错误：修改内容作为投标文件的组成部分（非独立文件）。【法条依据】《招标投标法》第29条。"},{"id":152,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列投标人投标的情形中，评标委员会应当否决的有( )。","options":{"A":"联合体未提交共同投标协议","B":"投标报价高于招标文件设定的最高投标限价","C":"投标文件未经投标人盖章和单位负责人签字","D":"投标人主动提出了对投标文件的澄清、修改","E":"投标文件未对招标文件的实质性要求和条件作出响应"},"answer":"ABCE","explanation":"【逐项解析】ABCE正确：联合体未提交共同投标协议、投标报价高于最高限价、未经盖章签字、未对实质性要求作出响应→均应否决投标。D投标人主动提出澄清修改→评标委员会可要求澄清，不一定直接否决。【法条依据】《招标投标法实施条例》第51条。"},{"id":153,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-多选题】","type":"multi","stem":"下列投标文件中，应当拒收的是( )。","options":{"A":"提前送达的投标文件","B":"投标联合体提交的未附共同投标协议的投标文件","C":"未通过资格预审的申请人提交的投标文件","D":"未提交投标保证金的投标文件","E":"不按招标文件要求密封的"},"answer":"CE","explanation":"【逐项解析】CE正确：未通过资格预审的申请人提交的投标文件、不按招标文件要求密封的投标文件→应当拒收（逾期送达的也应拒收）。A提前送达→应接收。B未附共同投标协议→应否决（非拒收）。D未提交投标保证金→应否决（非拒收）。拒收vs否决的区别：拒收是不接收（在接收环节），否决是接收后评定不合格。【法条依据】《招标投标法实施条例》第36条（拒收）、第51条（否决投标）。"},{"id":154,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于评标的说法，正确的是( )。","options":{"A":"评标委员会完成评标后应当向投标人提出书面评标报告","B":"评标应当公开进行","C":"评标委员会可以对招标文件确定的评标标准和方法进行补充和完善","D":"评标由招标人依法组建的评标委员会负责"},"answer":"D","explanation":"【逐项解析】D正确：评标由招标人依法组建的评标委员会负责。A评标报告向招标人提出（非投标人）。B评标应在严格保密下进行（非公开）。C评标委员会不得对招标文件确定的标准和方法进行修改补充。【法条依据】《招标投标法》第37条、第38条、第40条。"},{"id":155,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"关于确定中标人的说法，正确的是( )。","options":{"A":"排名第一的中标候选人放弃中标，招标人可以按照评标委员会提出的中标候选人名单自主确定其他中标候 选人为中标人","B":"排名第一的中标候选人放弃中标的，招标人应当重新招标","C":"中标人应当是投标报价最低的投标人","D":"中标人的投标应当能够最大限度地满足招标文件中规定的各项条件"},"answer":"D","explanation":"【逐项解析】D正确：中标人应能最大限度满足招标文件中规定的各项综合评价标准或实质性要求。A排名第一放弃→招标人可确定排名第二的（非自主确定）。B可以确定其他候选人（非必须重新招标）。C最低价不一定中标（经评审的最低投标价法或综合评价法）。【法条依据】《招标投标法》第41条。"},{"id":156,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于依法必须进行招标的项目评标的说法，正确的是( )。","options":{"A":"评标由招标人依法组建的评标委员会负责","B":"评标委员会不得有招标人代表","C":"评标委员会成员的名单在评标前应当公示","D":"评标委员会成员拒绝在评标报告上签字的，视为不同意评标报告"},"answer":"A","explanation":"【逐项解析】A正确：评标由招标人依法组建的评标委员会负责。B应有招标人代表（至少1人）。C评标委员会成员名单在中标结果确定前应保密（非公示）。D拒绝签字的视为同意评标报告（非不同意）应书面说明不同意见和理由。【法条依据】《招标投标法》第37条。"},{"id":157,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"某建设工程施工招标项目，开标会议上公布的标底为6200万元，最高投标限价6600万元。中 标人甲的投标报价为6000万元。则招标人可以要求甲提交的履约保证金额度最高为( )。","options":{"A":"620万元","B":"660万元","C":"600万元","D":"80万元"},"answer":"C","explanation":"【逐项解析】C正确：履约保证金不得超过中标合同金额的10%。中标价6000万×10%=600万。注意：履约保证金以中标价为基准（非标底6200或限价6600）。【法条依据】《招标投标法实施条例》第58条。"},{"id":158,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）关于投标人异议与投诉程序，说法正确的( )。","options":{"A":"投标人对招标文件有异议的，应当在投标截止时间前15日向招标人书面提出异议","B":"投标人对开标有异议的，应当在开标现场当场提出异议","C":"投标人对评标结果有异议的，可以自中标候选人公示期间直接向招标行政监督部门投诉","D":"招标人在对投标人异议做出书面答复前，可以暂停招投标活动"},"answer":"B","explanation":"【逐项解析】B正确：对开标有异议的应在开标现场当场提出，招标人当场答复并记录。A对招标文件异议应在投标截止10日前提出（非15日）。C对评标结果异议应先向招标人提出（非直接向行政监督部门投诉）。D招标人答复前应暂停招投标活动（非可以）。【法条依据】《招标投标法实施条例》第44条（开标异议）、第54条（评标结果异议）、第60条（投诉）。"},{"id":159,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于招标投标投诉与处理的说法正确的是( )。","options":{"A":"投诉人就同一事项向两个以上有权受理的行政监督部门投诉的，由最后收到投诉的行政监督部门负责处理","B":"行政监督部门应当自收到投诉之日起三个工作日内作出是否受理投诉，并自收到投诉之日起20个工作日作 出书面处理决定","C":"行政监督部门的工作人员对投诉处理过程中知悉的国家秘密，商业秘密，应当保密","D":"需要专家评审的所需时间计算在内"},"answer":"C","explanation":"【逐项解析】C正确：行政监督部门工作人员对知悉的国家秘密、商业秘密应当保密。A由最先收到投诉的部门负责（非最后收到）。B自收到投诉之日起3个工作日内决定是否受理，受理之日起30个工作日内作出处理决定（非20日）。D专家评审所需时间不计算在投诉处理期限内。【法条依据】《招标投标法实施条例》第61条。"},{"id":160,"chapter":"第4章 建设工程发承包法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）招标人对某招标估算价为6000万元的施工项目进行公开招标，2007年3月3日开始发 售招标文件，3月6日停售；招标文件规定投标保证金为200万元；3月20日招标人对已发出的招标文件作了必 要的澄清和修改，投标截止日期为同年3月25日。上述案例中有( )处错误。","options":{"A":"1","B":"2","C":"3","D":"4"},"answer":"C","explanation":"【逐项解析】C正确：3处错误。①发售期：3月3日至3月6日仅4天，应不少于5日；②投标保证金200万/6000万=3.33%>2%，超限；③3月20日澄清修改距投标截止3月25日仅5天，应不少于15日→需顺延。3处错误。【法条依据】《招标投标法实施条例》第16条（发售≥5日）、第26条（保证金≤2%）、第21条（修改≥15日前）。"},{"id":161,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"single","stem":"根据《政府采购法》对于不能事先计算出总额的货物采购项目，适宜采用的发包方式是( )。","options":{"A":"公开招标","B":"单一来源采购","C":"竞争性谈判","D":"询价"},"answer":"C","explanation":"【逐项解析】C正确：不能事先计算出总额的货物采购，适宜采用竞争性谈判方式（《政府采购法》第30条）。A公开招标需能事先确定总额。B单一来源采购适用于唯一供应商。D询价适用于规格统一、价格变化小的货物。【法条依据】《政府采购法》第30条。"},{"id":162,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"single","stem":"根据《政府采购非招标采购方式管理办法》，竞争性谈判采购中，采购人在质量和服务均能满足采 购文件实质性响应要求的前提下，确定成交供应商的原则是( )。","options":{"B":"综合实力最强","A":"综合评分最高","C":"标的物质量最好","D":"最后报价最低"},"answer":"D","explanation":"【逐项解析】D正确：竞争性谈判中，在质量和服务均满足要求的前提下，最后报价最低的原则确定成交供应商。注意：选项顺序在数据中为B→A→C→D（D为最后报价最低）。【法条依据】《政府采购非招标采购方式管理办法》第35条。"},{"id":163,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"multi","stem":"根据《政府采购法》，采用询价方式采购货物应当符合的条件有( )。","options":{"A":"有效竞争不足","B":"需要多次重复采购","C":"货物规格、标准统一","D":"现货货源充足","E":"价格变化幅度小"},"answer":"CDE","explanation":"【逐项解析】CDE正确：询价采购适用于货物规格标准统一、现货货源充足、价格变化幅度小的情形。A有效竞争不足→竞争性谈判。B需多次重复采购→非询价的法定条件。【法条依据】《政府采购法》第32条。"},{"id":164,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"multi","stem":"根据《政府采购法》,下列情形中.可以采用单一来源采购方式的有( )。","options":{"A":"只能从唯一供应商处采购的","B":"采购资金总额巨大","C":"发生了不可预见的紧急情况不能从其他供商处采购的","D":"必须保证原有采购项目服务配套的要求，需要继续从原供应商处添购且添购资金总额不超过原合同采购金 额10%的","E":"市场价格变化幅度较小的"},"answer":"ACD","explanation":"【逐项解析】ACD正确：只能从唯一供应商处采购的、不可预见紧急情况不能从其他供应商处采购的、保证原有项目配套需从原供应商添购且金额≤原合同10%的→可采用单一来源采购。B采购资金巨大→不是单一来源的法定条件。E价格变化小→询价适用范围。【法条依据】《政府采购法》第31条。"},{"id":165,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"multi","stem":"关于单一来源采购的说法，正确的有( )。","options":{"A":"采用单一来源采购方式公示期不得少于3个工作日","B":"单一来源采购方式适用于工程采购","C":"拟采用单一来源采购方式的，在报批之前，应当在省级以上财政部门指定媒体上公示，并将公示情况一并 报财政部门","D":"对采用单一来源采购方式公示有异议的，可以在公示期间内将书面意见反馈给采购人、采购代理机构，并 同时抄送相关财政部门","E":"采购人收到公示异议后应当组织补充论证，论证后认为异议成立的，应当采用其他采购方式"},"answer":"BCD","explanation":"【逐项解析】BCD正确：B单一来源适用于工程采购。C报批前在省级以上财政部门指定媒体公示并报财政部门。D有异议的可在公示期内向采购人反馈并抄送财政部门。A公示期不得少于5个工作日（非3个）。E收到异议后应组织补充论证，认为异议成立应依法采取其他采购方式（但需在公示期满后才能确定）。【法条依据】《政府采购非招标采购方式管理办法》第38-40条。"},{"id":166,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"single","stem":"根据《政府采购框架协议采购方式管理暂行办法》集中采购机构应当在征集公告和征集文件中确定 框架协议采购的( )。","options":{"A":"最高限制单价","B":"最低限制单价","C":"最高限制总价","D":"最低限制总价"},"answer":"A","explanation":"【逐项解析】A正确：框架协议采购应在征集公告和征集文件中确定最高限制单价（非总价、最低价）。【法条依据】《政府采购框架协议采购方式管理暂行办法》第8条。"},{"id":167,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"single","stem":"根据《政府采购框架协议采购方式管理暂行办法》，封闭式框架协议采购程序确定第一阶段入围供 应商的主要评审方式是( )","options":{"A":"质量优先法","B":"随机抽查法","C":"速度优先法","D":"价格优先法"},"answer":"D","explanation":"【逐项解析】D正确：封闭式框架协议第一阶段确定入围供应商的主要评审方式是价格优先法。A质量优先法非主要方式。【法条依据】《政府采购框架协议采购方式管理暂行办法》第11条。"},{"id":168,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"single","stem":"关于框架协议采购的说法，正确的是( )。","options":{"A":"开放式框架协议是框架协议的主要形式","B":"框架协议要求在框架协议有效期内可以变动","C":"框架协议可以确定1名或多名入围供应商","D":"封闭式框架协议供应商可以随时退出框架协议"},"answer":"C","explanation":"【逐项解析】C正确：框架协议可确定1名或多名入围供应商。A封闭式框架协议是主要形式（非开放式）。B框架协议有效期内不可随意变动。D封闭式框架协议供应商不可随意退出。【法条依据】《政府采购框架协议采购方式管理暂行办法》。"},{"id":169,"chapter":"第4章 建设工程发承包法律制度","marker":"【真题】","type":"single","stem":"关于政府采购框架协议采购的说法，正确的是( )。","options":{"A":"封闭式框架协议入围供应商可以随时退出框架协议","B":"集中采购目录以内品目，属于小额零星采购的,可以采用框架协议采购方式采购","C":"开放式框架协议采购，不得增加供应商","D":"开放式框架协议采购是框架协议采购的主要形式"},"answer":"B","explanation":"【逐项解析】B正确：集中采购目录以内且属于小额零星采购的可采用框架协议采购方式。A封闭式不得随意退出。C开放式框架协议可增加供应商。D封闭式是主要形式（非开放式）。【法条依据】《政府采购框架协议采购方式管理暂行办法》第3条。"},{"id":170,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"法律、行政法规规定或当事人约定合同应当采用书面形式订立，当事人未采用书面形式， 但是一方已经履行主要义务，对方接受时该合同( )。","options":{"A":"无效","B":"成立","C":"可撤销","D":"效力待定"},"answer":"B","explanation":"【逐项解析】B正确:《民法典》第490条:法律、行政法规规定或当事人约定采用书面形式订立合同,当事人未采用书面形式但一方已履行主要义务、对方接受时,该合同成立。A无效/A可撤销/D效力待定均不适用。【法条依据】《民法典》第490条。"},{"id":171,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于合同形式的说法，正确的是( )。","options":{"A":"未依法采用书面形式订立合同的，合同有可能成立","B":"书面形式合同是指合同书","C":"根据当事人的行为推定合同成立的，称为口头合同","D":"以电子数据交换方式能够有形地表现所载内容的数据电文，视为口头形式"},"answer":"A","explanation":"【逐项解析】A正确:未依法采用书面形式,但一方已履行主要义务对方接受的,合同可能成立。B错误:书面形式包括合同书、信件、电报、电传、传真等。C错误:根据行为推定成立的是默示合同(非口头)。D错误:数据电文属书面形式(非口头)。【法条依据】《民法典》第469条。"},{"id":172,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲公司根据乙公司的材料价格清单通过邮政快递寄出采购单，后通过电子邮件通知 乙公司取消订单，如果邮政快递后于电子邮件到达，那么该情形为( )。","options":{"A":"要约撤销","B":"要约撤回","C":"承诺撤回","D":"承诺撤销"},"answer":"B","explanation":"【逐项解析】B正确:采购单(要约)先以邮政快递方式发出,后以电子邮件方式通知取消,且取消通知先于或与要约同时到达→要约撤回。要约撤回的条件:撤回通知应在要约到达之前或同时到达受要约人。【法条依据】《民法典》第475条。"},{"id":173,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）3月1日甲施工企业向乙钢材供应商发出钢材采购单，承诺期限为3月5日前承诺，3月 1日，乙收到甲的采购单。3月2日，乙收到甲取消本次采购的函。3月4日，乙发函至甲，表示同意履行3月1 日的采购单，关于甲、乙双方合同订立的说法，正确的是( )。","options":{"A":"甲3月2日的行为属于要约邀请","B":"甲乙之间买卖合同成立","C":"乙3月4日的行为属于新要约","D":"甲的要约已经撤销"},"answer":"B","explanation":"【逐项解析】B正确:甲3月1日发出采购单(要约),乙3月1日收到;3月2日甲发函取消(要约撤销)。但乙在承诺期限(3月5日前)内于3月4日发出承诺。问题:撤销通知到达后,如受要约人已为履行合同做了准备工作则要约不可撤销。题意中甲发出的是简单的取消函,需判断撤销是否有效。实际上:要约人确定了承诺期限的,要约不得撤销(《民法典》第476条)。甲确定了承诺期限(3月5日前),故要约不可撤销,乙3月4日承诺有效,合同成立。A要约邀请错。C新要约错。D要约未有效撤销。【法条依据】《民法典》第476条。"},{"id":174,"chapter":"第5章 建设工程合同法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）建设工程施工合同的下列情形中，应当认定无效的有( )。","options":{"A":"施工企业超越资质等级订立的","B":"建设单位胁迫施工企业订立的","C":"没有资质的实际施工人借用有资质的建筑施工企业名义订立的","D":"施工企业与建设单位对工程款支付有重大误解订立的","E":"建设工程必须进行招标的未招标订立的"},"answer":"ACE","explanation":"【逐项解析】ACE正确:A超越资质等级(违反强制性规定)→无效。C借用资质(以合法形式掩盖非法目的)→无效。E应招标未招标→无效。B胁迫→可撤销(非无效)。D重大误解→可撤销(非无效)。无效vs可撤销的关键:无效是当然、自始无效;可撤销需权利人行使撤销权。【法条依据】《民法典》第153条、第154条;《建工司法解释(一)》第1条。"},{"id":175,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）行为人与相对人以虚假意思表示实施的民事法律行为( )。","options":{"A":"有效","B":"可撤销","C":"无效","D":"效力待定"},"answer":"C","explanation":"【逐项解析】C正确:行为人与相对人以虚假意思表示实施的民事法律行为无效(《民法典》第146条)。虚假意思表示(通谋虚伪表示)是无效的法定情形。A有效错。B可撤销错。D效力待定错。【法条依据】《民法典》第146条。"},{"id":176,"chapter":"第5章 建设工程合同法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《民法典》，民事法律行为的有效要件有( )。","options":{"A":"行为人具有相应的民事行为能力","B":"不超越经营范围","C":"意思表示不真实","D":"不违反法律、行政法规的强制性规定","E":"不违背公序良俗"},"answer":"ADE","explanation":"【逐项解析】ADE正确:民事法律行为有效要件:行为人具有相应民事行为能力、意思表示真实、不违反法律行政法规强制性规定、不违背公序良俗。B不超越经营范围不是民事法律行为的有效要件(超越经营范围的合同不当然无效)。C意思表示应真实(非不真实)。【法条依据】《民法典》第143条。"},{"id":177,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"甲、乙双方于2018年3月10日签订一份固定总价施工合同。2018年3月20日，乙方发现甲方隐 瞒了施工现场周边真实地质条件，如果按合同施工，将增加近30%的施工费用，遂与甲方协商但遭到拒绝。 乙方欲行使撤销权，则应当在( )前行使。","options":{"A":"2019年3月10日","B":"2019年3月20日","C":"2020年3月10日","D":"2020年3月20日"},"answer":"B","explanation":"【逐项解析】B正确:甲方隐瞒地质条件构成欺诈,乙方享有撤销权。撤销权自知道或应当知道撤销事由之日起1年内行使。乙方3月20日发现→应在2019年3月20日前行使。重大误解的撤销权是自知道之日起90日内,欺诈是1年内。本题甲方隐瞒属欺诈(非重大误解),撤销权1年。【法条依据】《民法典》第152条。"},{"id":178,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《民法典》，关于可撤销合同的说法,正确的是( )","options":{"A":"已经在有关行政管理部门办理备案的合同不可撤销","B":"显失公平的合同属于无效合同而非可撤销合同","C":"基于重大误解订立的合同是可撤销合同","D":"可撤销合同可以由行政监督部门撤销"},"answer":"C","explanation":"【逐项解析】C正确:基于重大误解订立的合同属于可撤销合同。A备案不影响撤销权。B显失公平属可撤销(非无效)。D可撤销合同由法院或仲裁机构撤销(非行政监督部门)。【法条依据】《民法典》第147条、第151条。"},{"id":179,"chapter":"第5章 建设工程合同法律制度","marker":"【例-多选题】","type":"multi","stem":"甲公司以国产设备为样品，谎称进口设备，与乙施工企业订立设备买卖合同后乙施工企业知 悉实情。关于该合同争议处理的说法，正确的有( )。","options":{"A":"该买卖合同属于重大误解合同","B":"乙施工企业有权自主决定是否行使撤销权","C":"乙施工企业有权自合同订立之日起1年内主张撤销该合同","D":"该买卖合同被法院撤销后，则该合同自始没有法律约束力","E":"乙施工企业有权自知道设备为国产之日起1年内主张撤销该合同"},"answer":"BDE","explanation":"【逐项解析】BDE正确:B撤销权是形成权,乙可自主决定是否行使。D被撤销的合同自始无效。E欺诈撤销权自知道之日起1年内行使。A错误:甲公司谎称进口设备属欺诈(非重大误解)。C错误:从知道之日起1年(非合同订立之日起)。【法条依据】《民法典》第148条、第152条、第155条。"},{"id":180,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于限制民事行为能力人实施的民事法律行为的说法，正确的是( )。","options":{"A":"限制民事行为能力人实施的纯获利益的民事法律行为效力待定","B":"限制民事行为能力人实施的与其年龄、智力、精神健康状况不相适应的民事法律行为无效","C":"相对人可以催告法定代理人在收到通知之日起30日内予以追认","D":"相对人催告法定代理人追认，法定代理人未作表示的，视为予以追认"},"answer":"C","explanation":"【逐项解析】C正确:相对人可催告法定代理人在收到通知之日起30日内追认。A错误:纯获利益的民事法律行为有效(非效力待定)。B错误:不适应的是效力待定(非无效)。D错误:法定代理人未作表示的视为拒绝追认(非追认)。【法条依据】《民法典》第145条。"},{"id":181,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）合同生效后，当事人就质量没有约定或者约定不明确的，可以采用的确定相关内容 方式有：①按照交易习惯确定；②签订补充协议；③按《民法典》其他相关规定执行。三种方式的先后顺序 是( )。","options":{"A":"①②③","B":"③②①","C":"②①③","D":"②③①"},"answer":"C","explanation":"【逐项解析】C正确:合同生效后,对质量没有约定或约定不明→①签订补充协议②按交易习惯确定③按《民法典》相关规定执行。顺序:协议补充→交易习惯→法定补充(合同法第510-511条)。【法条依据】《民法典》第510条、第511条。"},{"id":182,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲公司与乙公司订立水泥买卖合同,合同约定，甲公司向乙公司购买水泥100吨，甲 公司于8月1日前向乙公司支付30%的预付款，余款于10月15日水泥交付后3日内付清。8月1日，甲公司未按合 同约定支付预付款。10月15日，甲公司要求乙公司交付水泥。根据《民法典》，乙公司可以行使的权利是( )","options":{"A":"先履行抗辩权","B":"同时履行抗辩权","C":"不安抗辩权","D":"先诉抗辩权"},"answer":"A","explanation":"【逐项解析】A正确:约定甲先支付预付款,乙后交付水泥。甲未支付预付款(先履行义务未履行),乙可行使先履行抗辩权拒绝交付水泥。B同时履行抗辩权适用于无先后履行顺序。C不安抗辩权适用于先履行方有证据证明对方丧失履行能力。D先诉抗辩权适用于一般保证。【法条依据】《民法典》第526条。"},{"id":183,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）依据施工企业甲与材料供应商乙订立的买卖合同，甲应当先行支付乙货款的20%作为 预付款，此时甲有确切证据证明乙经营状况严重恶化，关于甲的做法，正确的是( )。","options":{"A":"中止履行，并及时通知对方","B":"通知乙即刻解除合同","C":"继续支付预付款","D":"要求乙承担违约责任"},"answer":"A","explanation":"【逐项解析】A正确:甲应先支付预付款(先履行方),有确切证据证明乙经营状况严重恶化→可行使不安抗辩权,中止履行并及时通知对方。B不能直接解除合同。C继续支付将承担风险。D此时合同未到乙履行期,乙尚未违约,不能要求乙承担违约责任。【法条依据】《民法典》第527条、第528条。"},{"id":184,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）预制件定作合同总价款100万元，施工企业向预制件厂支付定金50万元。预制件厂不 履行合同，则应当共计返还( )。","options":{"A":"50","B":"100","C":"70","D":"150"},"answer":"C","explanation":"【逐项解析】C正确:定金不得超过合同金额的20%。100万×20%=20万,超出的30万无效。收受定金方违约应双倍返还:20万×2=40万,加上超出的30万(原数返还)=70万。【法条依据】《民法典》第586条、第587条。"},{"id":185,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲施工企业与乙钢材供应商订立钢材采购合同，合同价款为1000万元，约定定金为 300万元，甲实际支付定金100万元，乙按照合同约定开始供货。后在合同履行过程中， 双方发生争议，关于本案中定金的说法，正确的是( )。","options":{"A":"若乙违约，致使合同目的不能实现，则应当向甲返还200万元","B":"双方约定300万元的定金因为超过合同价款的20%而无效","C":"视为变更约定的定金数额为200万元","D":"若甲违约，致使合同目的不能实现，甲应当向乙支付100万元"},"answer":"A","explanation":"【逐项解析】A正确:约定定金300万但实际支付100万→视为变更定金为100万。定金不超过20%:1000万×20%=200万,100万<200万合法。乙(收受方)违约→双倍返还200万。B约定超过20%部分无效(非全部无效)。C实际支付100万视为变更(非200万)。D甲违约→定金不退(100万归乙)。【法条依据】《民法典》第586条第2款(实际交付变更)、第587条。"},{"id":186,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《民法典》，关于定金的说法，正确的是( )","options":{"A":"定金合同可以独立于主合同存在","B":"债务人履行债务的，定金应当抵作合同价款或者收回","C":"定金合同约定后即成交","D":"实际支付的定金数额多于约定数额的部分，不产生定金的效力"},"answer":"B","explanation":"【逐项解析】B正确:债务人履行债务的,定金应抵作价款或收回。A定金合同是从合同(不能独立存在)。C定金合同自实际交付定金时成立(非要约承诺即成立)。D实际支付多于约定的部分,如对方接受可产生定金效力。【法条依据】《民法典》第586条。"},{"id":187,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某项目设计费用为100万元，合同约定定金为设计费用的15%，发包方依约支付定金 后，设计方不履行合同，给发包方造成12万元损失，发包方对此最多可获得( )万元。","options":{"A":"24","B":"27","C":"30","D":"42"},"answer":"C","explanation":"【逐项解析】C正确:定金100万×15%=15万,合法(不超过20%)。收受方违约→双倍返还定金30万。损害赔偿:实际损失12万。定金与损害赔偿可并用但总额不超过违约造成的损失。本题30万>12万,最多获30万。定金罚则的目的在于惩罚违约方,不是补偿守约方。【法条依据】《民法典》第588条:定金不足以弥补损失的,可请求赔偿超过定金数额的损失。但定金已超过损失12万,以30万为准。"},{"id":188,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"根据《民法典》，关于违约的责任中损失赔偿款的说法，正确的有( )","options":{"A":"不包括合同履行后可以获得的利益","B":"应当相当于因违约所造成的损失","C":"以守约一方的计算为准","D":"以违约一方的计算为准"},"answer":"B","explanation":"【逐项解析】B正确:损失赔偿额应相当于因违约所造成的损失,包括合同履行后可获得的利益(《民法典》第584条)。A错误:包括可获利益。C/D错误:以实际损失为准,非以守约方或违约方单方计算。【法条依据】《民法典》第584条。"},{"id":189,"chapter":"第5章 建设工程合同法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《民法典》，免除施工单位违约责任的情形有( )。","options":{"A":"施工单位因安全事故隐患，被监理工程师责令暂停施工，致使工期延误","B":"因拖欠农民工工资，部分农民工停工抗议，致使工期延误","C":"地震导致已完工程被爆破拆除重建，造成建设单位费用增加","D":"由于战争，施工单位暂停施工，致使工期延误","E":"因迟延履行而遭遇洪水，导致工期延误"},"answer":"CD","explanation":"【逐项解析】CD正确:地震导致拆除重建、战争导致停工,均属不可抗力,可免除违约责任。A因安全事故被责令停工→自身原因不免责。B拖欠工资导致抗议→自身原因。E迟延履行后遭遇不可抗力→不免责(迟延期间的风险由违约方承担)。【法条依据】《民法典》第590条。"},{"id":190,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某工程施工中某水泥厂为施工企业供应水泥，延迟交货一周，延迟交货导致施工企 业每天损失0.4万元，第一天晚上施工企业为减少损失，采取紧急措施共花费1万元，使剩余6天共损失0.7万 元。则水泥厂因违约应向施工企业赔偿的损失为( )。","options":{"A":"1.1万元","B":"1.7万元","C":"2.1万元","D":"2.8万元"},"answer":"C","explanation":"【逐项解析】C正确:违约赔偿=实际损失+减损措施费用。第1天损失0.4万+减损费用1万+剩余6天损失0.7万=2.1万。注意:减损措施费用属于合理费用,应由违约方承担。《民法典》第591条:当事人一方违约后,对方应采取适当措施防止损失扩大;未采取措施致损失扩大的,不得就扩大损失请求赔偿。采取减损措施支出的合理费用由违约方承担。【法条依据】《民法典》第591条。"},{"id":191,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"建设工程施工合同无效，工程竣工验收质量合格，承包人要求参照合同关于工程价款的约 定折价补偿被发包人拒绝，遂诉至人民法院，关于该案处理说法，正确的是 ( ).","options":{"A":"不应当支付工程款","B":"可以参照合同关于工程价款的约定折价补偿承包人","C":"应当按照合同约定支付工程款","D":"应当参照合同关于工程价款的约定折价补偿承包人"},"answer":"B","explanation":"【逐项解析】B正确:建设工程施工合同无效,但工程竣工验收合格,可以参照合同关于工程价款的约定折价补偿承包人(建工司法解释(一)第24条)。注意区分:折价补偿(合同无效的救济)vs支付工程款(合同有效)。【法条依据】《建工司法解释(一)》第24条。"},{"id":192,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某建设工程施工合同约定的开工日期为3月1日，发包人于3月10日向承包人发出开工 通知。开工通知载明的开工日期为3月20日。接到形式通知后，承包人由于人员、设备未能及时到位。3月30 日才正式进场施工。根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（二）》 ，该项目开工日期应当为( )。","options":{"A":"3月1日","B":"3月20日","C":"3月10日","D":"3月30日"},"answer":"B","explanation":"【逐项解析】B正确:开工日期认定顺序:开工通知载明的日期→具备开工条件的日期→实际进场施工日期。发包人3月10日发出开工通知载明3月20日→开工日期为3月20日。承包人自身原因延迟不影响开工日期的认定。【法条依据】《建工司法解释(二)》第5条(或《建工司法解释(一)》第8条)。"},{"id":193,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释（一）》， 某建设工程尚不具备开工条件即发出开工通知，当事人对开工日期有争议，开工日期应当为( )。","options":{"A":"合同中约定的原开工日期","B":"开工条件具备的时间","C":"开工通知载明的开工日期","D":"实际开工日期"},"answer":"B","explanation":"【逐项解析】B正确:不具备开工条件即发出开工通知的,开工日期为开工条件具备的时间。ACD均不符合司法解释规定。【法条依据】《建工司法解释(一)》第8条。"},{"id":194,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）当事人对建设工程实际竣工日期有争议，关于人民法院认定的竣工日期的说法，正 确的是( )。","options":{"A":"承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日期","B":"建设工程经竣工验收合格的，以承包人提交验收报告之日为竣工日期","C":"建设工程未经竣工验收，承包人向发包人交付工程，发包人拒绝接收的，以承包人申请交付之日为竣工日 期","D":"建设工程未经竣工验收，发包人通知承包人并实际占有使用工程，以发包人通知到达之日为竣工日期"},"answer":"A","explanation":"【逐项解析】A正确:承包人已提交竣工验收报告,发包人拖延验收的,以提交验收报告之日为竣工日期。B应经验收合格之日(非提交报告之日)。C发包人擅自使用的,以转移占有之日。D以实际占有使用之日(非通知到达之日)。【法条依据】《建工司法解释(一)》第9条。"},{"id":195,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）建设工程施工合同约定承包人垫资至基础工程完工，约定垫资利率为全国银行间同 业拆借中心公布的贷款市场报价利率的2倍，基础工程完工后，发包人未能按约定支付垫资款项及其利息， 双方发生争议，关于该项目垫资及其利息的说法， 正确的是( )。","options":{"A":"承包人主张该项目垫资应当按照工程欠款进行处理的，人民法院不予支持","B":"关于垫资的约定无效","C":"约定的垫资金额过高，导致建设工程施工合同无效","D":"承包人向人民法院请求发包人按照约定支付利息的，人民法院应当全部支持"},"answer":"A","explanation":"【逐项解析】A正确:承包人主张垫资按工程欠款处理的,人民法院不予支持(垫资和工程欠款是不同的法律关系)。B垫资约定原则有效(当事人对垫资及利息有约定的,按约定处理)。C垫资金额高低不影响合同效力。D约定利率超过LPR的4倍部分不予支持(非全部支持)。【法条依据】《建工司法解释(一)》第25条。"},{"id":196,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）建设工程施工合同对付款时间没有约定或者约定不明，则应付款时间为( )。","options":{"A":"建设价款确定之日","B":"建设工程已竣工验收的，为竣工验收合格之日","C":"建设工程未交付的，工程款价也未结算的，为当事人起诉之日","D":"建设工程未交付的，为竣工结算完成之日"},"answer":"C","explanation":"【逐项解析】C正确:付款时间无约定或约定不明→建设工程已交付的,为交付之日;未交付的,为提交竣工结算文件之日;未交付也未结算的,为当事人起诉之日。A/C/D对比,未交付且未结算时,为起诉之日。【法条依据】《建工司法解释(一)》第27条。"},{"id":197,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据最高人民法院《关于审理建设工程施工合同纠纷案件适用法律问题的解释（一 ）》，属于承包人建设工程价款优先受偿权范围的是( )。","options":{"A":"工程款利息","B":"违约金","C":"工程价款","D":"损害赔偿金"},"answer":"C","explanation":"【逐项解析】C正确:建设工程价款优先受偿权的范围限于工程价款本身(包括工作人员报酬、材料款等实际支出费用)。A利息/B违约金/D损害赔偿金不属于优先受偿权范围。【法条依据】《民法典》第807条;《建工司法解释(一)》第35条。"},{"id":198,"chapter":"第5章 建设工程合同法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）关于建设工程价款优先受偿权的说法，正确的是( )。","options":{"A":"建设工程价款优先受偿权与抵押权效力相当，优于其他债权","B":"装饰装修工程的承包人，无权主张建设工程价款优先受偿权","C":"承包人行使建设工程价款优先受偿权的时限最长不得超过18个月","D":"建设工程价款优先受偿权的起算日为发包人应当给付建设工程价款之日","E":"未竣工的建设工程质量合格，承包人无权享有建设工程价款优先受偿权"},"answer":"CD","explanation":"【逐项解析】CD正确:C优先受偿权行使期限最长不超过18个月(自发包人应付款之日起)。D起算日为应付款之日。A错误:优先受偿权优于抵押权和其他债权(非效力相当)。B错误:装饰装修工程的承包人有条件地享有优先受偿权。E错误:未竣工工程质量合格可享有优先受偿权。【法条依据】《建工司法解释(一)》第41条(18个月)、第35-42条。"},{"id":199,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"关于建设工程施工合同变更的说法，正确的是( )。","options":{"A":"发包人可以依据单方意思表示变更合同","B":"对于合同变更的内容约定不明确的推定为未变更","C":"合同变更与工程变更范围一致","D":"合同变更协议自实际履行之日起生效"},"answer":"B","explanation":"【逐项解析】B正确:合同变更内容约定不明确的,推定为未变更(《民法典》第544条)。A发包人不能单方变更(需双方协商)。C合同变更与工程变更是不同概念(范围不完全一致)。D变更协议自双方签字盖章生效(非实际履行之日)。【法条依据】《民法典》第543条、第544条。"},{"id":200,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）2015年9月15日，甲公司与丙公司订立书面协议转让其对乙公司的30万元债权，同年 9月25日甲公司将该债权转让通知了乙公司。关于该案的说法，正确的是( )。","options":{"A":"甲公司与丙公司之间的债权转让协议于2015年9月25日生效","B":"丙公司自2015年9月15日起可以向乙公司主张30万元的债权","C":"甲公司和乙公司就30万债务的清偿对丙公司承担连带责任","D":"甲公司和丙公司之间的债权转让行为于2015年9月25日对乙公司发生效力"},"answer":"D","explanation":"【逐项解析】D正确:债权转让对债务人发生效力的时间是通知到达债务人之日(9月25日通知乙)。A债权转让协议自成立时生效(9月15日)。B债权转让自通知债务人时才对债务人生效(9月25日起可向乙主张)。C出让人不承担连带责任。【法条依据】《民法典》第546条。"},{"id":201,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-多选题】","type":"multi","stem":"根据《民法典》，关于合同权利义务终止的说法，正确的有( )","options":{"A":"债务人依法将标的物提存","B":"债权人免除债务","C":"债权人已经履行债权","D":"债务相互抵销","E":"债权债务同归于一人"},"answer":"ABDE","explanation":"【逐项解析】ABDE正确:A提存/B免除债务/D抵销/E混同(债权债务同归一人),均导致合同权利义务终止。C应为债权人已经接受履行(非履行债权)。合同终止原因包括:履行、抵销、提存、免除、混同、解除。【法条依据】《民法典》第557条。"},{"id":202,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列情形中，对方当事人可以行使施工合同法定解除权的是( )。","options":{"A":"发包人延迟支付工程款的","B":"承包人将建设工程转包的","C":"承包人采用不合格材料，监理人拒绝该材料进场的","D":"在保修期内，承包人未能在合理期限对工程缺陷进行修复的"},"answer":"B","explanation":"【逐项解析】B正确:承包人转包→发包人可行使法定解除权(建工司法解释第8条)。A迟延支付工程款需经催告合理期限仍未支付,才能解除(非当然可以)。C拒绝不合格材料不构成解除事由。D保修期内的修复问题,应先要求修复。【法条依据】《民法典》第563条;《建工司法解释(一)》相关条文。"},{"id":203,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"根据《民法典》，关于合同解除的说法，正确的是( )","options":{"A":"当事人不可以约定合同解除条件","B":"发生不可抗力的，当事人有权解除合同","C":"在履行期限届满前，当事人一方明确表示或者以自己的行为表明不履行主要债务，另一方有权解除合同","D":"以持续履行的债务为内容的不定期合同，当事人无权随时解除合同"},"answer":"C","explanation":"【逐项解析】C正确:履行期限届满前,一方明确表示或以行为表明不履行主要债务(预期违约),另一方有权解除合同。A错误:当事人可约定解除条件(约定解除权)。B错误:不可抗力需导致合同目的不能实现时才能解除(非当然有权)。D错误:不定期持续履行合同,当事人可随时解除(但应提前通知)。【法条依据】《民法典》第563条。"},{"id":204,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）5月12日发生强烈地震，在建工程全部被毁。5月15日发包人向承包人发出书面通知 ，解除承包合同。5月17日承包人收到该通知，5月18日承包人作出了同意解除合同的回复。依据《合同法》 ，该施工合同解除的时间应为( )。","options":{"A":"5月12日","B":"5月15日","C":"5月17日","D":"5月18日"},"answer":"C","explanation":"【逐项解析】C正确:解除通知到达对方时合同解除(5月17日承包人收到通知)。一方通知解除,对方有异议的可请求法院或仲裁确认。本题承包人同意解除,不影响5月17日为解除时间。【法条依据】《民法典》第565条。"},{"id":205,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《民法典》，下列情形中，属于买卖合同中出卖人义务的是( )","options":{"A":"担保标的物的权利制度","B":"支付价款","C":"为标的物投保财产保险","D":"检验标的物"},"answer":"A","explanation":"【逐项解析】A正确:出卖人的义务包括交付标的物、转移所有权、担保标的物权利无瑕疵(权利瑕疵担保义务)。B支付价款是买受人义务。C投保非出卖人法定义务。D检验是买受人的义务/权利。【法条依据】《民法典》第612条。"},{"id":206,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）除法律另有规定或者当事人另有约定外，买卖合同中标的物毁损灭失的风险转移时 间是( )。","options":{"A":"标的物交付时","B":"合同成立时","C":"合同生效时","D":"价款付清时"},"answer":"A","explanation":"【逐项解析】A正确:买卖合同中标的物毁损灭失的风险,除法律另有规定或当事人另有约定外,自标的物交付时起转移。B合同成立/C合同生效/D价款付清均非风险转移时间点。【法条依据】《民法典》第604条。"},{"id":207,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）在买卖合同中，出卖人出卖交由承运人运输的在途标的物，除当事人另有约定的以 外，毁损、灭失的风险自( )时起由买受人承担。","options":{"A":"标的物交付","B":"合同成立","C":"合同生效","D":"支付贷款"},"answer":"B","explanation":"【逐项解析】B正确:出卖人出卖交由承运人运输的在途标的物(路货买卖),毁损灭失的风险自合同成立时起由买受人承担。这是路货买卖的特殊风险转移规则。【法条依据】《民法典》第606条。"},{"id":208,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某建筑设备有限公司向某施工企业出售了一批交由承运人运输的在途二手外墙喷涂 机器人，关于该买卖合同的履行的说法，正确的是( )。","options":{"A":"设备公司对机器人不承担权利瑕症担保义务","B":"设备公司对机器人承担质量瑕症担保义务","C":"在途机器人毁损、灭失的风险自机器人交付时起由施工企业承担","D":"因机器人不符合质量要求，施工企业拒绝接受机器人，机器人毁损、灭失的风险由设备公司与企业共同承 担"},"answer":"B","explanation":"【逐项解析】B正确:出卖人对标的物承担质量瑕疵担保义务(无论什么情况下,出卖人应对标的物质量负责)。A权利瑕疵担保义务不可免除(除非买受人明知)。C在途标的物风险自合同成立时转移(非交付时)。D因质量不合格买受人拒绝接受→风险由出卖人承担(出卖人违约)。【法条依据】《民法典》第606条、第610条、第612条。"},{"id":209,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲公司向乙公司订购2台同型号施工设备，同时订购了配套维修工具。合同约定设备 与维修工具分两批交货。根据《民法典》，关于该合同解除的说法，正确的是( )。","options":{"A":"如果因设备不符合约定而解除合同，解除的效力及于维修工具","B":"如果因维修工具不符合约定而解除合同，解除的效力及于设备","C":"如果其中1台设备质量不符合约定，甲公司可以就全部2台设备解除合同","D":"如果第二批交付的设备不符合约定，甲公司可以就第一批交付的设备解除合同"},"answer":"A","explanation":"【逐项解析】A正确:因主物(设备)不符合约定解除合同,解除效力及于从物(维修工具)。但反之则否:因从物不符合约定解除合同,效力不及于主物。C标的物为数物,其中一物不符合约定可就该物解除。D分批交付的,一批不符合约定不影响其他批次的合同效力。【法条依据】《民法典》第631条、第632条、第633条。"},{"id":210,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于借款合同的说法，正确的是( )。","options":{"A":"自然人之间的借款合同，自贷款人提供借款时生效","B":"借款合同为有偿合同","C":"借款合同必须采用书面形式","D":"借款合同自双方当事人签字盖章之日起生效"},"answer":"A","explanation":"【逐项解析】A正确:自然人之间的借款合同为实践合同,自贷款人提供借款时成立(非诺成合同)。B借款合同可有偿也可无偿(自然人之间无约定利息视为无利息)。C不必须书面形式。D自然人借款为实践合同(非签字盖章时生效)。【法条依据】《民法典》第679条。"},{"id":211,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于借款合同利息的说法，正确的是( )。","options":{"A":"借款的利息可以预先在本金中扣除","B":"对支付利息的期限没有约定的，应当在返还借款时一并支付","C":"借款合同对支付利息没有约定的，视为没有利息","D":"借款人提前返还借款的，应当按照借款合同约定的期间支付利息"},"answer":"C","explanation":"【逐项解析】C正确:借款合同对支付利息没有约定的,视为没有利息。A不得预先扣除(按实际借款数额返还)。B无约定时,借款期不满1年→返还时一并支付;1年以上→每届满1年支付。D提前返还→按实际借款期间计算利息。【法条依据】《民法典》第670条、第674条、第677条、第680条。"},{"id":212,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）借款100万元，约定利率5%，贷款支付借款时，扣除利息实际支付95万元，借款人需 要偿还( )万元。","options":{"A":"100","B":"95","C":"99.75","D":"105"},"answer":"C","explanation":"《民法典》第670条：借款的利息不得预先在本金中扣除；利息预先扣除的，应按实际借款数额返还借款并计算利息。实际借款95万元，应还本金95万+利息95万×5%=4.75万=99.75万。故选C。"},{"id":213,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"下列主体中，不得担任保证人的是( )。","options":{"A":"自然人","B":"营利法人","C":"以公益为目的的非营利法人","D":"公司的分支机构"},"answer":"C","explanation":"【逐项解析】C正确:以公益为目的的非营利法人不得担任保证人(《民法典》第683条)。A自然人可作保证人。B营利法人可作保证人(如担保公司)。D公司的分支机构经法人书面授权可在授权范围内提供保证。【法条依据】《民法典》第683条。"},{"id":214,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲建设单位与乙施工单位签订了施工合同，由丙公司为甲出具工程款的支付担保， 担保方式为一般保证。甲到期未能支付工程款，乙应当要求( )。","options":{"A":"丙先行代为支付","B":"甲和丙按比例支付","C":"甲先行支付","D":"甲和丙协商支付"},"answer":"C","explanation":"【逐项解析】C正确:一般保证中,保证人享有先诉抗辩权。债权人应先向债务人主张权利,经强制执行仍不能清偿时,保证人才承担保证责任。A丙不能先行代为支付(有先诉抗辩权)。B按份支付错。D不是协商问题。【法条依据】《民法典》第687条。"},{"id":215,"chapter":"第5章 建设工程合同法律制度","marker":"【例-多选题】","type":"multi","stem":"关于担保合同的说法，正确的是( )。","options":{"A":"保证合同的双方当事人是债务人与债权人","B":"保证合同期限没有约定的，按主合同履行期限届满之日起6个月内","C":"主合同的效力不影响担保合同的效力","D":"第三人加入债务的，保证人的保证责任不受影响","E":"保证合同中，保证方式没有约定的，视为一般保证"},"answer":"BDE","explanation":"【逐项解析】BDE正确:B无约定的保证期间为6个月(自主债务履行期届满之日起)。D第三人加入债务,保证责任不受影响。E无约定或约定不明时,按一般保证(民法典第686条改了一般保证为默认)。A保证合同双方是保证人与债权人(非债务人)。C主合同无效,担保合同无效(从属性)。【法条依据】《民法典》第682条、第686条、第692条、第697条。"},{"id":216,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"关于主合同变更对保证合同影响的说法，正确的是( )。","options":{"A":"债权人和债务人未经保证人书面同意，协商变重主债权债务合同内容，保证不再承担保证责任","B":"债权人转让全部或部分债权，未通知保证人的，该转让对保证人不发生效力","C":"债权人和债务人的主合同履行期限，不得变更","D":"第三人加入债务的，保证人不再承担保证表任"},"answer":"B","explanation":"【逐项解析】B正确:债权人转让债权未通知保证人的,该转让对保证人不发生效力。A减轻债务的,保证人继续承担;加重债务的,对加重部分不承担(非全部不承担)。C主合同履行期限可经协商变更。D第三人加入债务的,保证人的保证责任不受影响(民法典第697条)。【法条依据】《民法典》第695-697条。"},{"id":217,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于租赁合同中承租人转租的说法，正确的是( )。","options":{"A":"承租人可以决定是否转租","B":"承租人转租的，承租人与出租人之间的租赁合同继续有效","C":"承租人转租的，转租合同的内容可以突破租赁合同的内容","D":"转租合同订立后，租赁合同自动解除"},"answer":"B","explanation":"【逐项解析】B正确:承租人转租的,承租人与出租人之间的租赁合同继续有效。第三人造成租赁物损失的,承租人应赔偿损失。A转租需经出租人同意(非承租人可随意决定)。C转租合同内容不得超出原租赁合同。D租赁合同不因转租自动解除。【法条依据】《民法典》第716条。"},{"id":218,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于租赁合同的说法，正确的是( )。","options":{"A":"租赁期限超过20年的，超过部分无效","B":"租赁期限超过6个月的，可以采用书面形式","C":"租赁合同应当采用书面形式，当事人未采用的，视为租赁合同未生效","D":"租赁物在租赁期间发生所有权变动的，租赁合同解除"},"answer":"A","explanation":"【逐项解析】A正确:租赁期限超过20年的,超过部分无效。B期限超过6个月的应采用书面形式。C未采用书面形式且无法确定期限的,视为不定期租赁(非未生效)。D买卖不破租赁:所有权变动不影响租赁合同效力。【法条依据】《民法典》第705条(20年)、第707条(书面)、第725条(买卖不破租赁)。"},{"id":219,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）甲公司与乙公司订立书面租赁合同，合同约定甲公司租用乙公司的施工设备，租期 12个月，租金月付。租赁期满后，因工程延期，甲公司继续支付租金，乙公司亦未拒绝。根据《民法典》， 关于租期届满后甲乙租赁合同效力的说法，正确的是( )。","options":{"A":"甲乙租赁合同继续有效，但乙有权随时解除租赁合同","B":"甲乙租赁合同效力待定，乙公司事后明确同意续租才有效","C":"因双方并未明确续订租赁合同，甲乙租赁合同终止","D":"乙仍接受甲支付的租金，可视为双方租赁合同续订了12个月"},"answer":"A","explanation":"【逐项解析】A正确:租赁期满后,承租人继续使用、出租人未提出异议的,原租赁合同继续有效,但为不定期租赁。不定期租赁中,双方可随时解除合同(但应在合理期限前通知)。A描述正确:继续有效+可随时解除。B效力待定错。C合同终止错。D续订12个月错(不定期租赁无固定期限)。【法条依据】《民法典》第734条。"},{"id":220,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于承揽合同，说法正确的是( )。","options":{"A":"承揽合同应当采用书面形式","B":"承揽人发现定作人提供的图纸不合理的，可以直接修改","C":"承揽人在工作期间，应当接受定作人必要的监督检验","D":"承揽人可以根据工作需要自行决定是否留存复制品或者技术资料"},"answer":"C","explanation":"【逐项解析】C正确:承揽人在工作期间,应接受定作人必要的监督检验。A承揽合同不要求书面形式。B发现图纸不合理应及时通知定作人(不能直接修改)。D未经定作人同意不得留存复制品。【法条依据】《民法典》第779条、第782条。"},{"id":221,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于承揽合同中解除权的说法，正确的是( )。","options":{"A":"定作人不履行协助义务的，承揽人可以解除合同","B":"承揽人将承揽的工作交由第三人完成的，定作人有权解除合同","C":"承揽人可以随时解除合同，造成定作人损失的，应当赔偿损失","D":"定作人在承揽人完成工作前可以随时解除合同，造成承揽人损失的，应该赔偿损失"},"answer":"D","explanation":"【逐项解析】D正确:定作人在承揽人完成工作前可随时解除合同,造成承揽人损失的应当赔偿(定作人的任意解除权)。A定作人不履行协助义务,承揽人可催告→逾期可解除(不是当然可以)。B承揽人将主要工作交第三人需定作人同意;辅助工作可自行决定。C承揽人没有任意解除权(只有定作人有)。【法条依据】《民法典》第787条。"},{"id":222,"chapter":"第5章 建设工程合同法律制度","marker":"【真题-单选题】","type":"single","stem":"关于承揽合同解除权的说法，正确的是( )。","options":{"A":"定作人可以解除合同，承揽人不得解除","B":"承揽人未经定作人同意，将主要承揽工作交由第三人完成，定作人可以解除合同","C":"定作人在承揽人完成承揽工作50%以上时，不得解除合同","D":"承揽合同不得由双方当事人协商解除"},"answer":"B","explanation":"【逐项解析】B正确:承揽人未经定作人同意将主要工作交第三人完成的,定作人可解除合同。A定作人和承揽人都有法定解除权(定作人任意解除权;承揽人特定情形解除权,如定作人不履行协助义务)。C定作人可随时解除(无50%限制)。D可协商解除所有合同。【法条依据】《民法典》第772条、第778条、第787条。"},{"id":223,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于货运合同法律特征的说法，正确的是( )","options":{"A":"货运合同是单务、有偿合同","B":"货运合同是实践合同","C":"货运合同的收货人和托运人可以是同一人，也可以不是同一人","D":"货运合同的标的是货物"},"answer":"C","explanation":"【逐项解析】C正确:收货人和托运人可以是同一人也可以不是同一人(货运合同可为第三人利益订立)。A货运合同为双务、有偿合同(非单务)。B货运合同为诺成合同(非实践合同)。D货运合同的标的是运输行为(非货物)。【法条依据】《民法典》第809条。"},{"id":224,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《民法典》，托运人或者收货人不支付运费、保管费或者其他费用的，除当事 人另有约定外,承运人对相应的运输货物享有( )。","options":{"A":"提存权","B":"拍卖权","C":"拒绝运输权","D":"留置权"},"answer":"D","explanation":"【逐项解析】D正确:托运人或收货人不支付运费、保管费等,承运人对相应的运输货物享有留置权。A提存权/B拍卖权/C拒绝运输权均非此时的权利。【法条依据】《民法典》第836条。"},{"id":225,"chapter":"第5章 建设工程合同法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于货物在运输过程中因不可抗力灭失时运费承担的说法，正确的是( )。","options":{"A":"未收取运费的，承运人有权请求支付运费","B":"无论是否收取运费，均应当由双方协商确定","C":"已经收取运费的，托运人有权请求返还","D":"承运人和托运人根据公平原则平均承担"},"answer":"C","explanation":"【逐项解析】C正确:货物在运输过程中因不可抗力灭失,未收取运费的承运人不得请求支付;已收取运费的,托运人可请求返还。A错误(不得请求)。B协商错。D平均承担错(承运人承担运费损失,托运人承担货物损失)。【法条依据】《民法典》第835条。"},{"id":226,"chapter":"第5章 建设工程合同法律制度","marker":"【真题】","type":"single","stem":"在仓储合同中，储存期限内仓储物毁损的，应由保管人承担赔偿责任的情形是( )","options":{"A":"因仓储物本身的自然性质造成的。","B":"因包装不符合约定造成的；","C":"因保管不善造成的；","D":"因超过有效储存期造成的"},"answer":"C","explanation":"【逐项解析】C正确:因保管不善造成仓储物毁损的,保管人应承担赔偿责任。A自然性质/B包装不符合约定/D超过有效储存期→保管人不承担责任。【法条依据】《民法典》第917条。"},{"id":227,"chapter":"第5章 建设工程合同法律制度","marker":"【真题】","type":"single","stem":"关于仓储合同保管人的权利义务的说法，正确的是( )。","options":{"A":"保管人仅负责保管，不负责对入库仓储物进行验收","B":"因仓储物超过有效储存期造成仓储物变质、损坏的，保管人不承担赔偿责任","C":"保管期间，保管人有权拒绝仓单持有人检查仓储物的要求","D":"仓单持有人不得转让提取仓储物的权利"},"answer":"B","explanation":"【逐项解析】B正确:因仓储物超过有效储存期造成变质损坏的,保管人不承担赔偿责任。A保管人应进行验收并出具仓单。C保管期间应允许仓单持有人检查仓储物或提取样品。D仓单可以转让(记名仓单可背书转让)。【法条依据】《民法典》第908条、第910条、第911条、第917条。"},{"id":228,"chapter":"第5章 建设工程合同法律制度","marker":"【真题】","type":"single","stem":"某施工企业与某仓储中心签订了建材仓储合同，并按照合同约定支付了建材后施工企业提取建材时 发现部分建材因保管不善潮湿损坏，双方发生争议，关于该仓储合同的说法，正确的是( )。","options":{"A":"仓储中心应当对潮湿损坏的建材承担赔偿责任","B":"施工企业向仓储中心交付建材时合同成立","C":"施工企业逾期提取建材，仓储中心可以直接提取建材","D":"施工企业提前提取建材，仓储中心应当减收仓储费"},"answer":"A","explanation":"【逐项解析】A正确:保管不善造成损坏,仓储中心应承担赔偿责任。B仓储合同为诺成合同(非实践合同)。C逾期提取,保管人可提存(非直接提取)。D提前提取不减收仓储费。【法条依据】《民法典》第914条、第915条、第917条。"},{"id":229,"chapter":"第5章 建设工程合同法律制度","marker":"【真题】","type":"multi","stem":"根据《民法典》，关于委托合同中委托人义务的说法，正确的是( )。","options":{"A":"受托人为处理委托事务垫付的必要费用，委托人应当偿还该费用，但不用支付利息","B":"委托人应当预付处理委托事务的费用","C":"受托人完成委托事务的，委托人应当按照约定向其支付报酬","D":"委托人经受托人同意，可以在受托人之外委托第三人处理委托事务","E":"因不可归责于受托人的事由，委托事务不能完成的，委托人应当向受托人支付相应的报酬，但当事人另有 约定的除外"},"answer":"BCDE","explanation":"【逐项解析】BCDE正确:B委托人应预付费用。C应按约定支付报酬。D经受托人同意可委托第三人。E因不可归责于受托人的事由未完成,应支付相应报酬。A错误:垫付必要费用应偿还并支付利息(自垫付之日起)。【法条依据】《民法典》第921条、第928条。"},{"id":230,"chapter":"第5章 建设工程合同法律制度","marker":"【模拟题】","type":"single","stem":"关于人身保险合同的说法，正确的是( )。","options":{"A":"保险合同只能由被保险人和保险人签订","B":"受益人由被保险人或投保人指定","C":"被保险人或受益人必须是投保人","D":"受益人应当按照保险合同支付保险费"},"answer":"B","explanation":"【逐项解析】B正确:受益人由被保险人或投保人指定。A保险合同可由投保人和保险人签订(被保险人不一定是投保人)。C受益人不一定是投保人。D投保人支付保险费(非受益人)。【法条依据】《保险法》第10条、第18条、第39条。"},{"id":231,"chapter":"第5章 建设工程合同法律制度","marker":"【真题】","type":"single","stem":"根据《保险法》，保险人，被保险人为查明和确定保险事故的性质所支付的必要的，合理的费用， 该费用的承担主体是( )。","options":{"A":"保险人","B":"被保险人","C":"照成损失的人","D":"保险受益人"},"answer":"A","explanation":"【逐项解析】A正确:保险人、被保险人为查明和确定保险事故性质、原因和损失程度所支付的必要的合理的费用,由保险人承担。BCD均不正确。【法条依据】《保险法》第64条。"},{"id":232,"chapter":"第5章 建设工程合同法律制度","marker":"【真题】","type":"single","stem":"根据《保险法》，下列行为中，属于保险人义务的是( )。","options":{"A":"对投保人责任免除条款的明确说明义务","B":"保险事故发生后的及时通知义务","C":"保险事故发生时，采取必要措施防止或者减少保险标的损失的义务","D":"保险标的危险程度增加时的及时通知义务"},"answer":"A","explanation":"【逐项解析】A正确:对投保人责任免除条款的明确说明义务,是保险人的法定义务。BCD均为投保人或被保险人的义务:及时通知义务、减损义务、危险程度增加通知义务。【法条依据】《保险法》第17条(说明义务)、第21条(通知义务)。"},{"id":233,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《建设工程安全生产管理条例》，属于建设单位安全责任的有( )。","options":{"A":"编制施工安全生产规章制度","B":"向施工企业提供准确的地下管线资料","C":"将拆除工程的有关资料报送有关部门备案","D":"保证设计文件符合工程建设强制性标准","E":"为从事特种作业的施工人员办理意外伤害保险"},"answer":"BC","explanation":"【逐项解析】BC正确:B向施工企业提供准确的地下管线资料是建设单位安全责任。C将拆除工程资料报送备案是建设单位安全责任。A编制安全生产规章制度→施工单位。D设计文件符合强制标准→设计单位。E办理意外伤害保险→施工单位。【法条依据】《建设工程安全生产管理条例》第6-11条。"},{"id":234,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建设工程安全生产管理条例》，建设单位应当在拆除工程施工15日前，报送 建设行政主管部门或者其他部门备案的资料是( )。","options":{"A":"拟拆除建筑物、构筑物及可能危及毗邻建筑的说明","B":"设计单位资质等级证明","C":"拆除设计方案","D":"拆除工程施工合同"},"answer":"A","explanation":"【逐项解析】A正确:建设单位应在拆除工程施工15日前报送:拟拆除建筑物及可能危及毗邻建筑的说明、拆除施工组织方案、堆放清除废弃物的措施等。B/C/D非备案的法定资料。【法条依据】《建设工程安全生产管理条例》第11条。"},{"id":235,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"关于建设单位安全责任的说法，正确的是( )。","options":{"A":"建设单位在编制工程概算时，应当确定建设工程安全作业环境及安全施工措施所需费用","B":"建设单位应当在拆除工程施工30日前，到县级以上建设主管部门备案","C":"“三新”等工程的施工安全提出措施建议","D":"建设单位应当将房屋拆除交由具备保证安全条件的设计企业承担"},"answer":"A","explanation":"【逐项解析】A正确:建设单位在编制工程概算时应确定安全作业环境及安全施工措施所需费用。B应在15日前报送(非30日)。C这是设计单位的责任(非建设单位)。D应交给具有相应资质的施工单位(非设计企业)。【法条依据】《建设工程安全生产管理条例》第8条、第11条。"},{"id":236,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）工程监理单位在实施监理过程中，发现存在安全事故隐患，情况严重的，应当要求 施工单位( )。","options":{"A":"暂时停止施工，并及时报告建设单位","B":"整改，并及时报告建设单位","C":"暂时停止施工，并及时报告有关主管部门","D":"整改，并及时报告有关主管部门"},"answer":"A","explanation":"【逐项解析】A正确:监理发现安全事故隐患,情况严重的应要求施工单位暂时停止施工,并及时报告建设单位。一般的→要求整改。B整改适用于一般隐患。C报告有关主管部门→由建设单位报告(非监理直接报告)。【法条依据】《建设工程安全生产管理条例》第14条。"},{"id":237,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《建筑起重机械安全监督管理规定》，出租单位或者自购建筑起重机械的使用 单位应当报废的建筑起重机械有( )。","options":{"A":"属国家明令淘汰或者禁止使用的","B":"没有完整安全技术档案的","C":"经检验达不到安全技术标准规定的","D":"超过安全技术标准或者制造厂家规定使用年限的","E":"没有齐全有效的安全保护装置的"},"answer":"ACD","explanation":"【逐项解析】ACD正确:属国家明令淘汰或禁止使用的、经检验达不到安全技术标准的、超过规定使用年限的→应报废。B没有完整安全技术档案→不得出租使用但可补全档案(非一定要报废)。E没有安全保护装置→不得使用但可补装(非一定要报废)。【法条依据】《建筑起重机械安全监督管理规定》第8条。"},{"id":238,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"根据《建筑起重机械安全监督管理规定》，下列建筑起重机械不得出租、使用的有( )。","options":{"A":"经检验达不到安全技术标准规定的建筑起重机械","B":"属国家明令限制使用的建筑起重机械","C":"没有完整安全技术档案的建筑起重机械","D":"属于有可能淘汰","E":"没有齐全有效的安全保护装置的建筑起重机械"},"answer":"ACE","explanation":"【逐项解析】ACE正确:经检验达不到安全技术标准的、没有完整安全技术档案的、没有齐全有效安全保护装置的→不得出租使用。B属国家明令限制使用的(而非淘汰)→未必。D属于有可能淘汰→不构成法定禁止。【法条依据】《建筑起重机械安全监督管理规定》第7条。"},{"id":239,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《建设工程安全生产管理条例》，关于施工起重机械安装、拆卸安全责任的说法，正 确的是( )","options":{"A":"施工现场需要紧急使用施工起重机械的，可以由施工企业自行安装","B":"实行施工总承包的，由各分包单位与安装单位分别签订施工起重机械安装、拆卸工程安全协议书","C":"施工起重机械安装完毕后即可使用","D":"安装、拆卸施工起重机械，应当编制拆装方案、制定安全施工方案，并由专业技术人员现场监督"},"answer":"D","explanation":"【逐项解析】D正确:安装拆卸应编制拆装方案、制定安全施工方案,并由专业技术人员现场监督(《安全生产管理条例》第17条)。A必须由具有相应资质的单位承担。B实行总承包的,由总承包单位与安装单位签订安全协议书。C安装完毕后需验收合格方可使用。【法条依据】《建设工程安全生产管理条例》第17条。"},{"id":240,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"关于施工起重机械和自升式架设设施安装、拆卸单位的安全责任的说法，正确的有( )。","options":{"A":"从事建筑起重机械安装、拆卸活动的单位，应当依法取得建筑施工企业安全生产许可证","B":"编制建筑起重机械安装拆卸工程专项施工方案，并由本单位法定代表人签字","C":"在施工现场安装、拆卸整体提升脚手架、应当编制拆装方案，制定安全施工措施，并由专业技术人员现场 监督","D":"施工起重机械安装完毕后，施工总承包单位应当自检，出具自检合格证明","E":"在施工现场安装、拆卸整体提升脚手架，必须由具有相应资质的单位承担"},"answer":"ACE","explanation":"【逐项解析】ACE正确:A安装拆卸单位应取得安全生产许可证。C安装拆卸整体提升脚手架应编制拆装方案并由专业技术人员现场监督。E必须由具有相应资质的单位承担。B施工方案由本单位技术负责人签字(非法定代表人)。D安装完毕后应由安装单位自检(非总承包单位)。【法条依据】《建设工程安全生产管理条例》第17条。"},{"id":241,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）关于施工许可证与已确定的施工企业安全生产许可证之间关系的说法，正确的( )。","options":{"A":"施工许可证以安全生产许可证的取得为条件","B":"施工许可证与安全生产许可证无关","C":"安全生产许可证以施工许可证取得为前提","D":"因吊销安全生产许可证，更换施工企业的，施工许可证应当重新申请领取","E":"施工许可证与安全生产许可证的持证主体相同"},"answer":"AD","explanation":"【逐项解析】AD正确:A安全生产许可证是取得施工许可证的前提条件(先有安全许可再办施工许可)。D因吊销安全生产许可证更换施工企业→施工许可证应重新申请。B两者有关联。C顺序反了。E主体不同(施工许可证主体是建设单位,安全生产许可证主体是施工单位)。【法条依据】《建筑施工企业安全生产许可证管理规定》。"},{"id":242,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列建筑施工条件中，属于建筑施工企业取得安全生产许可证应该具备的条件是( )","options":{"A":"为施工现场作业人员办理意外伤害保险","B":"依法参加工伤保险，为从业人员缴纳保险费","C":"保证本单位生产经营条件所需资金的投入","D":"管理人员和作业人员每年至少进行2次安全生产教育培训并考核合格"},"answer":"B","explanation":"【逐项解析】B正确:依法参加工伤保险,为从业人员缴纳保险费是取得安全生产许可证的条件之一。A应办理意外伤害保险(鼓励性,非强制条件)。C保证安全生产条件所需资金的投入(非生产经营条件)。D每年至少1次(非2次)安全生产教育培训并考核合格。【法条依据】《安全生产许可证条例》第6条。"},{"id":243,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）建筑施工企业的安全生产许可证由( )省级人民政府住房城乡建设行政主管部门颁发","options":{"A":"施工行为地","B":"企业注册地","C":"建设工程合同履行地","D":"建设工程合同签订地"},"answer":"B","explanation":"【逐项解析】B正确:安全生产许可证由企业注册所在地省级住建主管部门颁发。A施工行为地错。C合同履行地错。D合同签订地错。【法条依据】《建筑施工企业安全生产许可证管理规定》第5条。"},{"id":244,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建筑施工企业安全生产许可证的说法，正确的是( )。","options":{"A":"安全生产许可证遗失补办，由申请人告知资质许可机关，由资质许可机关在官网发布信息","B":"企业在安全生产许可证有效期内未发生死亡事故的，安全生产许可证自动续期","C":"安全生产许可证的有效期为5年","D":"安全生产许可证有效期满前30天可以向原颁发管理机关办理延期手续"},"answer":"A","explanation":"【逐项解析】A正确:安全生产许可证遗失补办,由申请人告知资质许可机关并在官网发布信息。B有效期内未发生死亡事故→期满时经同意不再审查(非自动续期)。C有效期为3年(非5年)。D期满前3个月(非30天)办理延期。【法条依据】《建筑施工企业安全生产许可证管理规定》第8条。"},{"id":245,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建筑施工企业安全生产许可证管理规定》，属于应当注销安全生产许可证情 形的是( )。","options":{"A":"安全生产许可证颁发管理机关超越法定职权颁发安全生产许可证的","B":"施工企业破产、倒闭、撤销的","C":"安全生产许可证颁发管理机关对不具备安全生产条件的施工企业颁发安全生产许可证的","D":"安全生产许可证颁发管理机关工作人员滥用职权、玩忽职守颁发安全生产许可证的"},"answer":"B","explanation":"【逐项解析】B正确:施工企业破产、倒闭、撤销的,应注销安全生产许可证。A/C/D均为撤销的情形(许可本身存在瑕疵),非注销。注销vs撤销:注销是许可证的消灭(企业终止等),撤销是因许可有瑕疵而取消。【法条依据】《建筑施工企业安全生产许可证管理规定》第15条(注销)。"},{"id":246,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《建筑施工企业安全生产许可证管理规定》，下列情形中，可撤销建筑施工企 业安全生产许可证的有( )","options":{"A":"滥用职权颁发的","B":"企业被撒销的","C":"超越法定职权颁发的","D":"违反法定程序颁发的","E":"对不具备安全生产条件的企业颁发的"},"answer":"ACDE","explanation":"【逐项解析】本题数据中marker和type不一致。可撤销的情形包括:滥用职权颁发、超越法定职权颁发、违反法定程序颁发、对不具备安全生产条件的企业颁发。ACD均属于撤销情形。B企业撤销→注销(非撤销)。注意数据中标为single+Ans:A,需核实是否单选。【法条依据】《建筑施工企业安全生产许可证管理规定》第14条。"},{"id":247,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）以下属于施工单位项目负责人的安全生产责任( )。","options":{"A":"制定安全生产规章制度和操作规程","B":"确保安全生产费用的有效使用","C":"在施工前向作业班组做技术交底","D":"现场监督施工方案的实施情况"},"answer":"B","explanation":"【逐项解析】B正确:确保安全生产费用的有效使用是项目负责人的安全生产责任。A制定规章制度和操作规程是企业主要负责人的职责。C施工前向班组做技术交底是技术负责人的职责。D现场监督施工方案实施是专职安全管理人员的职责。【法条依据】《建设工程安全生产管理条例》第21条。"},{"id":248,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建设工程安全生产管理条例》及相关规定，下列责任中，属于建设工程项目 施工单位专职安全生产管理人员职责的是( )。","options":{"A":"保证本单位安全生产投入的有效实施","B":"建立健全并落实本单位全员安全生产责任制","C":"组织制定并实施本单位安全生产规章制度和操作规程","D":"现场监督危险性较大工程安全专项施工方案实施情况"},"answer":"D","explanation":"【逐项解析】D正确:现场监督危险性较大工程安全专项施工方案实施情况是专职安全生产管理人员的职责。ABC均属于企业主要负责人的安全生产职责。【法条依据】《建设工程安全生产管理条例》第23条。"},{"id":249,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"建筑施工企业负责人和项目负责人应定期带班检查、带班生产，符合规定的是( )。","options":{"A":"企业负责人每月带班检查时间不少于其工作日的15%","B":"项目负责人带班生产时，应当认真做好带班记录并签字存档","C":"项目负责人带班生产时间不少于本月工作日的80%","D":"项目负责人因其他事务离开施工现场时，应向企业负责人请假并经批准"},"answer":"B","explanation":"【逐项解析】B正确:项目负责人带班生产时应认真做好带班记录并签字存档。A企业负责人每月带班检查时间不少于其工作日的25%(非15%)。C项目负责人带班生产时间不少于本月施工时间的80%(非工作日的80%)。D离开时应向建设单位请假(非企业负责人)。【法条依据】《建筑施工企业负责人及项目负责人施工现场带班暂行办法》。"},{"id":250,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"关于施工企业负责人施工现场带班制度的说法，正确的是( )","options":{"A":"施工现场带班的施工企业负责人不包括企业的副总工程师","B":"项目负责人在同一时期只能承担不超过2个工程项目的管理工作","C":"工程项目发现重大隐患时，施工企业负责人应当到施工现场带班检查","D":"施工企业集团的负责人因故不能到现场，可以书面委托项目负责人对施工现场进行带班检查"},"answer":"C","explanation":"【逐项解析】C正确:工程项目发现重大隐患时,施工企业负责人应到施工现场带班检查。A副总工程师属于企业负责人(包括企业领导班子成员和副总工以上)。B项目负责人在同一时期只能承担1个工程项目的管理工作(非2个)。D企业集团负责人可书面委托分公司负责人(非项目负责人)带班检查。【法条依据】《建筑施工企业负责人及项目负责人施工现场带班暂行办法》。"},{"id":251,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《房屋市政工程生产安全重大事故隐患判定标准(2022版）》，下列重大事故隐患中， 应当判定为施工安全管理重大事故隐患的是( )。","options":{"A":"对因基坑工程施工可能造成损害的毗邻重要建筑物、构筑物和地下管线等，未采取专项防护措施","B":"模板支架拆除及滑模、爬模爬升时，混凝土强度未达到设计或规范要求","C":"建筑施工特种作业人员未取得特种作业人员操作资格证书上岗作业","D":"有限空间作业时现场未有专人负责监护工作"},"answer":"C","explanation":"【逐项解析】C正确:特种作业人员未取得操作资格证书上岗作业→施工安全管理重大事故隐患。A属于基坑工程重大隐患。B属于模板工程重大隐患。D属于有限空间作业重大隐患(但非施工安全管理类的直接判定标准)。【法条依据】《房屋市政工程生产安全重大事故隐患判定标准(2022版)》第4条。"},{"id":252,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列情形中，应当判定为施工安全管理重大事故隐患的是( )。","options":{"A":"施工企业未取得安全生产许可证","B":"施工从业人员未取得安全生产考核合格证书从事相关工作","C":"部分分项工程未编制、未审核专项施工方案","D":"建筑施工特种工作人员未取得特种作业资格证书上岗作业"},"answer":"D","explanation":"【逐项解析】D正确:特种作业人员未取得特种作业资格证书上岗作业→施工安全管理重大事故隐患。ABC均不是施工安全管理重大事故隐患的标准表述。施工企业未取得安全生产许可证→不可从事建筑施工活动。【法条依据】《房屋市政工程生产安全重大事故隐患判定标准(2022版)》第4条。"},{"id":253,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建设工程安全生产管理条例》，施工总承包单位应当承担的安全生产责任是( )。","options":{"A":"总承包合同应当明确总分包单位双方的安全生产责任","B":"负责调查施工生产安全事故","C":"与分包单位对分包工程的安全生产责任承担按份责任","D":"统一组织编制建设工程生产安全应急救援预案"},"answer":"D","explanation":"【逐项解析】D正确:总承包单位统一组织编制建设工程生产安全应急救援预案。A总承包合同中应明确双方安全生产责任→是对的,但D是更典型的正确。B调查事故由安监部门负责。C总分包对分包工程承担连带责任(非按份)。【法条依据】《建设工程安全生产管理条例》第24条。"},{"id":254,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某工程施工作业人员张某在作业过程中，发现正在吊装的预制构件在高空失衡晃动 将要脱落，直接危及施工现场安全，立即停止作业并迅速躲避。张某的行为于行使( )。","options":{"A":"获得救治权","B":"拒绝违章指挥权","C":"正当防卫权","D":"紧急避险权"},"answer":"D","explanation":"【逐项解析】D正确:发现直接危及人身安全的紧急情况时,停止作业并紧急撤离→紧急避险权(《安全生产法》第55条)。A获得救治权(工伤后的权利)。B拒绝违章指挥权(对违章指挥说「不」)。C正当防卫权(刑法概念)。【法条依据】《安全生产法》第55条。"},{"id":255,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"施工作业人员应当享有的安全生产权利包括( )。","options":{"A":"了解其工作岗位存在的危险因素、应急措施及安全防护措施","B":"接受安全生产教育和培训，正确使用安全防护用具和机械设备","C":"发现安全隐患时立即停止作业或撤离作业场所","D":"拒绝违章指挥和强令冒险作业","E":"发生工伤后，除要求工伤保险赔偿后，就不足部分向本单位提出赔偿请求"},"answer":"ADE","explanation":"【逐项解析】ADE正确:A了解危险因素和防范措施(知情权)。D拒绝违章指挥和强令冒险作业(拒绝权)。E工伤后除工伤保险外就不足部分向单位索赔(工伤保险+民事赔偿)。B接受教育培训是义务(非权利)。C发现安全隐患应立即报告(非直接停止或撤离,只有紧急情况时方可)。【法条依据】《安全生产法》第53-56条。"},{"id":256,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（模拟题）施工单位应经过建设行政主管或其他部门考核合格人员包括( )","options":{"A":"应急救援人员","B":"单位主要负责人","C":"钢筋工、混凝土工","D":"专职安全生产管理人员","E":"垂直运输机械作业人员"},"answer":"BDE","explanation":"【逐项解析】BDE正确:B单位主要负责人、D专职安全生产管理人员需经主管部门考核合格。E垂直运输机械作业人员需取得特种作业操作资格。A应急救援人员不需要主管部门考核。C钢筋工不需要主管部门考核(需企业培训合格即可)。【法条依据】《建设工程安全生产管理条例》第25条、第36条。"},{"id":257,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《建筑施工企业主要负责人、项目负责人和专职安全生产管理人员安全管理规定》， 关于“安管人员”安全生产考核的说法，正确的有( )。","options":{"A":"“安管人员”应当自行申请安全生产考核","B":"安全生产考核证书的有效期无限制","C":"安全生产考核应当向县级人民政府住房城乡建设主管部门申请","D":"安全生产考核证书在全国范围内有效"},"answer":"D","explanation":"【逐项解析】D正确:安全生产考核证书在全国范围内有效。A由受聘企业统一申请(非个人自行申请)。B有效期为3年(非无限制)。C向省级住建主管部门申请(非县级)或设区的市级。【法条依据】《建筑施工企业主要负责人、项目负责人和专职安全生产管理人员安全生产管理规定》第5条、第9条、第10条。"},{"id":258,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-多选题】","type":"multi","stem":"关于施工企业安全生产教育培训的说法，正确的有( )","options":{"A":"施工项目采用新技术、新设备时，施工企业应当对作业人员进行安全生产教育培训","B":"特种作业人员必须按照国家有关规定经专门的安全作业培训，经培训后，即可上岗作业","C":"专职安全生产管理人员经施工企业考核合格后即可任职","D":"作业人员进入新的岗位或者新的施工现场前，应当接受安全生产教育培训","E":"应当对被派遣劳动者进行岗位安全操作规程和安全操作技能的教育和培训"},"answer":"ADE","explanation":"A正确：施工项目采用新技术、新设备时应对作业人员培训。D正确：作业人员进入新岗位或新施工现场前应接受安全教育培训。E正确：应对被派遣劳动者进行岗位安全操作规程和技能培训。B错误：特种作业人员须经专门培训并取得操作资格证书方可上岗，非仅培训。C错误：专职安全生产管理人员须经主管部门考核合格方可任职。故选ADE。"},{"id":259,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）对于危险性较大的深8.5m基坑支护与降水分部工程施工，须严格按施工程序进行， 那么下列做法中正确的是( )。","options":{"A":"施工单位在施工组织设计编制安全技术措施即可","B":"施工方案中应附具安全验算结果","C":"施工方案应经施工单位项目经理、总监理工程师签字后实施","D":"应由专职安全生产管理人员进行现场监督","E":"施工方案应经建设单位组织专家论证方可实施"},"answer":"BD","explanation":"【逐项解析】BD正确:B施工方案应附具安全验算结果。D应由专职安全生产管理人员现场监督。危大工程(深8.5m基坑)需编制专项施工方案(非仅在施工组织设计中编制)。C方案应经施工单位技术负责人+总监理工程师签字(非项目经理)。E需经施工单位组织专家论证(非建设单位)。【法条依据】《危险性较大的分部分项工程安全管理规定》。"},{"id":260,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）关于危险性较大的分部分项工程专项施工方案的说法，正确的有( )。","options":{"A":"施工企业应当在危险性较大的分部分项工程施工前组织工程技术人员编制专项施工方案","B":"专项施工方案应当由施工企业负责人审核签字，加盖单位公章","C":"专项施工方案经论证不通过的，施工企业修改后应当重新组织专家论证","D":"危险性较大的分部分项工程实行分包的，由施工总承包单位编制专项施工方案","E":"专项施工方案经论证需修改后通过的，施工企业根据论证报告修改完善后，可以直接实施"},"answer":"AC","explanation":"【逐项解析】AC正确:A施工前组织工程技术人员编制专项施工方案。C论证不通过→修改后重新组织专家论证。B专项方案由施工单位技术负责人审核签字(非企业负责人)。D实行分包的由分包单位编制(非总承包)。E修改后通过→施工单位审核+总监理工程师审查后方可实施(非直接实施)。【法条依据】《危险性较大的分部分项工程安全管理规定》第10-13条。"},{"id":261,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于施工企业安全费用的说法，正确的有( )。","options":{"A":"采取经评审的最低投标价法评标的招标项目，安全费用在竞标时可以降低","B":"施工总承包单位与分包单位分别计提安全费用","C":"安全费用不计入工程造价","D":"房屋建筑工程的安全费用计提比例高于市政公用工程"},"answer":"D","explanation":"【逐项解析】D正确:房屋建筑工程安全费用计提比例高于市政公用工程(房屋建筑3%、市政2.5%等不同)。A安全费用不可竞争(不得降低)。B由总承包单位统一计提(非分包分别计提)。C安全费用计入工程造价。【法条依据】《企业安全生产费用提取和使用管理办法》。"},{"id":262,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设工程施工企业安全生产费用提取和使用说法正确的是( )","options":{"A":"施工企业可以根据安全生产实际需要，适当提高或降低安全费用提取标准","B":"施工企业以建筑安装工程造价为依据提取企业安全生产费用","C":"建设单位应当于签订施工合同前支付施工企业安全生产费用","D":"竣工结决算后结余的安全生产费用归属于施工企业"},"answer":"B","explanation":"【逐项解析】B正确:施工企业以建筑安装工程造价为依据计提安全生产费用。A不得随意提高或降低(按规定标准)。C建设单位应在开工后1个月内支付50%(非签合同前)。D结余的安全生产费用归属建设单位(非施工企业)。【法条依据】《建设工程施工企业安全生产费用提取和使用管理办法》。"},{"id":263,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-多选题】","type":"multi","stem":"下列支出中，属于施工企业安全生产费用支出的有( )。","options":{"A":"完善、改造和维护施工现场临时用电系统支出","B":"开展施工现场重大危险源检测、评估、监控支出","C":"施工现场文物保护支出","D":"配备和更新现场作业人员安全防护用品支出","E":"从业人员发现并报告事故隐患的奖励支出"},"answer":"ABDE","explanation":"【逐项解析】ABDE正确:完善改造维护临时用电系统、重大危险源检测评估监控、配备更新安全防护用品、事故隐患报告奖励均属安全费用支出。C施工现场文物保护支出不属于安全费用(属于文明施工或文物保护费用)。【法条依据】《企业安全生产费用提取和使用管理办法》。"},{"id":264,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"根据《建设工程安全生产管理条例》，下列职责中，属于施工企业在施工现场的消防安全责 任的有( )。","options":{"A":"在施工现场建立消防安全责任制度","B":"确定消防安全责任人","C":"消防设施每半年至少进行一次全面检测","D":"制定用火、用电等消防安全管理制度和操作规程","E":"设置消防通道、消防水源，配备消防设施和灭火器材"},"answer":"ABDE","explanation":"【逐项解析】ABDE正确:建立消防责任制、确定消防责任人、制定消防管理制度和操作规程、设置消防通道消防水源配备消防器材→均为消防安全责任。C消防设施每年至少一次全面检测(对,但这是机关团体企业事业单位的通用消防义务,且表述为每年一次)。【法条依据】《建设工程安全生产管理条例》第31条。"},{"id":265,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-多选题】","type":"multi","stem":"下列事故中，属于较大生产安全事故的有( )。","options":{"A":"造成6人死亡","B":"造成15人重伤的事故","C":"造成1230万元直接经济损失的事故","D":"造成800万元直接经济损失和1050万元间接经济损失的事故","E":"造成9人重伤的事故"},"answer":"ABC","explanation":"【逐项解析】ABC正确:较大事故:3人≤死亡<10人,或10人≤重伤<50人,或1000万≤直接经济损失<5000万。A6人死亡→较大。B15人重伤→较大。C1230万直接损失→较大。D800万直接损失<1000万→一般事故。E9人重伤<10人→一般事故。【法条依据】《生产安全事故报告和调查处理条例》第3条。"},{"id":266,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真题-多选题】","type":"multi","stem":"关于生产安全事故隐患的说法，正确的有( )。","options":{"A":"重大事故隐患是指危害和整改难度较大，必须全部停产停业，经过一定时间整改治理可以排除的隐患","B":"重大危险源是指长期或者临时地生产、搬运、使用或者储存危险物品，且危险物品的数量等于或者超过临 界量的单元","C":"一般事故隐患是指危害和整改难度较小，发现后能够立即整改排除的隐患","D":"各行业对重大事故隐患的界定标准相同","E":"生产安全事故隐患是指生产经营活动中造成的人员伤亡或者经济损失"},"answer":"BC","explanation":"【逐项解析】BC正确:B重大危险源的定义正确。C一般事故隐患定义正确。A重大事故隐患是危害和整改难度较大,应全部或局部停产停业(非必须全部)。D各行业对重大事故隐患的界定标准因行业而异。E描述的是生产安全事故(非事故隐患)。【法条依据】《安全生产事故隐患排查治理暂行规定》第3条。"},{"id":267,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例题-多选题】","type":"multi","stem":"根据《生产安全事故应急条例》有关地方人民政府机其部门启动生产安全事故应急救援预 案，按照应急救援预案规定采取的应急救援措施的有( )","options":{"A":"组织抢救遇险人员，救助受伤人员，研判事故发展趋势以及可造成的危害","B":"向应急救援队伍发出救援申请，等待救援","C":"通知可能受到事故影响的单位和人员隔离事故现场，划定区域、疏散受到威胁的人员实施交通管制","D":"采取必要措施，防止事故危害扩大和次生，衍生灾害发生，避免或者减少事故对环境造成的危害","E":"维护事故现场秩序，安抚遇险人员和遇险人员亲属"},"answer":"ACDE","explanation":"【逐项解析】ACDE正确:组织抢救遇险人员、隔离事故现场疏散人员、防止事故危害扩大、维护现场秩序安抚→均属应急救援措施。B等待救援非政府及部门的主动应急救援措施(应主动救援)。数据标为single+Ans:A,但实际选项多选。【法条依据】《生产安全事故应急条例》第18条。"},{"id":268,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）下列职责中，属于施工生产安全事故调查组职责的是( )。","options":{"A":"查用事故发生的间接经济损失","B":"追究责任人的连带责任","C":"提出对受伤人员的赔偿方案","D":"提出对事故责任者的处理建议"},"answer":"D","explanation":"【逐项解析】D正确:提出对事故责任者的处理建议是事故调查组的职责。A查明直接经济损失(非间接)。B调查组提建议(非追究责任)。C提出赔偿方案不是调查组的职责。【法条依据】《生产安全事故报告和调查处理条例》第25条。"},{"id":269,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）事故调查报告的内容包括( )。","options":{"A":"事故发生经过和事故救援情况","B":"事故已经造成或者可能造成的伤亡人数和初步估计的直接经济损失","C":"事故发生的原因和事故性质","D":"事故责任的认定以及对事故责任者的处理决定","E":"事故防范和整改措施"},"answer":"ACE","explanation":"【逐项解析】ACE正确:事故调查报告包括:发生经过和救援情况、原因和性质、防范和整改措施。B是事故报告的内容(非调查报告)。D调查组提处理建议(非作出处理决定,处理决定由人民政府作出)。【法条依据】《生产安全事故报告和调查处理条例》第30条。"},{"id":270,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《生产安全事故报告和调查处理条例》，负责事故调查的人民政府应当自收到 事故调查报告之日起30日内做出批复的事故是( )。","options":{"A":"特别重大事故","B":"一般事故","C":"较大事故","D":"重大事故"},"answer":"A","explanation":"【逐项解析】A正确:特别重大事故→30日内批复。重大/较大/一般事故→15日内批复(特殊情况下可延长)。【法条依据】《生产安全事故报告和调查处理条例》第32条。"},{"id":271,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《房屋建筑和市政基础设施工程施工安 全监督规定》，关于建设工程施工安全监督管理的说法，正确的是( )。","options":{"A":"施工安全监督人员应当具有工程类中级及以上专业技术职称","B":"施工安全监督机构监督人员应当占监督机构总人数的60%以上","C":"工程项目因故中止施工的，监督机构不得对工程项目中止施工安全监督","D":"施工安全监督包括处理与工程项目施工安全相关的投诉、举报"},"answer":"D","explanation":"【逐项解析】D正确:施工安全监督包括处理与工程项目施工安全相关的投诉举报。A应具有工程类相关专业大专及以上学历(非中级职称)。B监督人员应占机构总人数的75%以上(非60%)。C中止施工的,监督机构可中止安全监督。【法条依据】《房屋建筑和市政基础设施工程施工安全监督规定》。"},{"id":272,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设工程安全生产监督管理体制的说法，错误的是( )。","options":{"A":"国务院负责安全生产监督管理的部门对全国建设工程安全生产工作实施综合监督管理","B":"国务院住房城乡建设主管部门对全国的建设工程安全生产实施监督管理","C":"施工安全监督人员应当具有5年及以上施工安全管理经验","D":"县级以上地方人民政府住房城乡建设主管部门可以将施工安全监督工作委托所属的施工安全监督机构具体 实施"},"answer":"C","explanation":"【逐项解析】C错误:C表述有误(具体标准需以规定为准)。A正确:国务院应急管理部门综合监管。B正确:住建部对建设工程安全生产实施监管。D正确:县级可委托施工安全监督机构实施。【法条依据】《建设工程安全生产管理条例》第39条、第40条。"},{"id":273,"chapter":"第6章 建设工程安全生产法律制度","marker":"【单选题】","type":"single","stem":"某县应急管理部门开展专项执法检查，发现某公司有一库房住有人员，同时存 放有大量危险化学品，决定对该公司采取强制措施，根据《行政强制法》《安全生产法》，关于县应急管理 部门执法人员采取行政强制措施的说法，正确的是( )","options":{"A":"有权查封该库房","B":"可以根据部门规章作出查封决定","C":"可以对有关人员采取限制人身自由的措施","D":"无权扣押该批危险化学品"},"answer":"A","explanation":"【逐项解析】A正确:应急管理部门有权查封不符合安全生产标准的场所。B部门规章不能设定查封(需法律法规)。C限制人身自由仅公安机关可实施。D可以扣押危险化学品。【法条依据】《安全生产法》第65条。"},{"id":274,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建筑工程施工许可管理办法》，关于未取得施工许可证擅 自施工的法律责任的说法，正确的是( )。","options":{"A":"应当吊销施工单位资质证书","B":"可以对在建工程采取查封措施","C":"可以对建设单位处以罚款","D":"应当依法追究刑事责任"},"answer":"C","explanation":"【逐项解析】C正确:未取得施工许可证擅自施工,可对建设单位处以罚款。A吊销资质证书需另行依程序。B查封在建工程非直接适用。D情节严重的才追究刑事责任(非应当)。【法条依据】《建筑工程施工许可管理办法》第12条。"},{"id":275,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建筑工程五方责任主体项目负责人质量终身责任追究暂行 办法》，由于施工原因造成尚在设计使用年限内的建筑工程不能正常使用，造成重大质量事故,情况特别恶 劣的。关于追究施工企业项目经理质量责任的说法，正确的是( )。","options":{"A":"项目经理为相关注册执业人员的，吊销执业资格证书，终身不予注册","B":"项目经理为相关注册执业人员的，吊销执业资格证书，5年内不予注册","C":"施工企业宣告破产的，不再追究项目经理的责任","D":"项目经理已经退休的，不再追究其质量责任"},"answer":"A","explanation":"【逐项解析】A正确:因施工原因造成重大质量事故、情况特别恶劣的,项目经理为注册执业人员的吊销执业资格证书、终身不予注册。B是5年(错,应为终身)。C企业破产不免除个人责任。D已退休仍追究责任(终身追责制)。【法条依据】《建筑工程五方责任主体项目负责人质量终身责任追究暂行办法》。"},{"id":276,"chapter":"第6章 建设工程安全生产法律制度","marker":"【真-单选题】","type":"single","stem":"关于应急管理部门开展安全生产行政执法工作的行使职权的说法，正确的 是( )。","options":{"A":"经被检查的生产经营单位同意，可以调阅有关资料向有关单位人员了解情况","B":"对检查中发现的事故隐患应当责令限期排除","C":"重大事故隐患排除后，即可恢复生产经营和使用","D":"对检查中发现的安全生产违法行为应当场予以纠正或者要求限期改正"},"answer":"D","explanation":"【逐项解析】D正确:对检查中发现的安全生产违法行为应当场纠正或要求限期改正。A可调阅资料(无需经被检查单位同意)。B对事故隐患应责令立即排除(非限期排除)。C重大事故隐患排除后经审查同意方可恢复。【法条依据】《安全生产法》第65条。"},{"id":277,"chapter":"第6章 建设工程安全生产法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）施工企业拒不执行负有安全生产监督管理职责的部门作出的停止施工的决定，有发 生生产安全事故的现实危险的，在保证安全的前提下，负有安全生产监督管理职责的部门可以通知有关单位 来取的措施有( )。","options":{"A":"停止供电","B":"禁止通行","C":"停止拨付资金","D":"限制供应食品、药品","E":"停止供应民用爆炸物品"},"answer":"AE","explanation":"【逐项解析】AE正确:施工企业拒不执行停止施工决定且有发生事故现实危险的,可通知有关单位停止供电、停止供应民用爆炸物品。B禁止通行/C停止拨付资金/D限制供应食品药品→不得采取。【法条依据】《安全生产法》第70条。"},{"id":278,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于工程建设强制性国家标准的说法，正确的是（ ）。","options":{"A":"强制性标准文本可以收费","B":"国务院标准化行政主管部门根据国务院授权作出的强制性国家标准的解释与标准具有同等效力","C":"应当由国务院标准化行政主管部门批准发布","D":"对各有关行业起引领作用的技术要求应当制定强制性国家标准"},"answer":"B","explanation":"【逐项解析】B正确:国务院标准化行政主管部门根据授权作出的强制性国家标准解释与标准具有同等效力。A强制性标准文本应免费公开(非收费)。C强制性国家标准由国务院批准发布或授权批准发布(非标准化行政主管部门直接发布)。D对各行业起引领作用的技术要求应制定推荐性标准(非强制性)。【法条依据】《标准化法》第10条、第17条。"},{"id":279,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于工程建设行业标准的说法，正确的是（ ）。","options":{"A":"对没有推荐性国家标准，需要在全国工程建设行业范围内统一的技术要求，可以制定行业标准","B":"行业标准可以由行业协会制定","C":"工程建设行业标准中包括强制性标准","D":"行业标准的制定，应当报国务院标准化行政主管部门批准"},"answer":"A","explanation":"【逐项解析】A正确:没有推荐性国家标准、需在全国行业范围内统一的技术要求可制定行业标准。B行业标准由国务院有关行政主管部门制定(非行业协会)。C行业标准均为推荐性标准(强制性标准只有国家标准)。D报国务院标准化行政主管部门备案(非批准)。【法条依据】《标准化法》第12条。"},{"id":280,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于团体标准的说法，正确的是（ ）。","options":{"A":"团体标准的技术要求不得高于强制性标准的相关技术要求","B":"在重要行业、战略性新兴产业、关键共性技术等领域制定团体标准必须利用自主创新技术","C":"国家鼓励社会团体制定高于推荐性标准相关技术要求的团体标准","D":"团体标准对本团体成员单位强制适用"},"answer":"C","explanation":"【逐项解析】C正确:国家鼓励社会团体制定高于推荐性标准相关技术要求的团体标准。A团体标准技术要求不得低于强制性标准(非不得高于)。B「必须利用自主创新技术」错(鼓励而非强制)。D团体标准由本团体成员约定采用(非强制适用)。【法条依据】《标准化法》第18条。"},{"id":281,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列标准属于强制性标准的有（ ）。","options":{"A":"工程建设通用的信息技术要求","B":"工程建设通用的有关安全、卫生和环保的标准","C":"工程建设通用的术语，符号，代号，制图方法标准","D":"工程建设通用的试验检验和评定方法","E":"工程建设勘察，规划，设计及验收等通用的综合标准和重要的通用的质量标准"},"answer":"BE","explanation":"【逐项解析】BE正确:工程建设通用的安全卫生环保标准、勘察规划设计验收等通用的综合标准和质量标准属于强制性标准。A信息技术要求→推荐性。C术语符号制图→推荐性。D试验检验评定方法→推荐性。强制性标准限于保障人身健康和生命财产安全、国家安全、生态环境安全的范围。【法条依据】《标准化法》第10条。"},{"id":282,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《实施工程建设强制性标准监督规定》，对工程建设规划阶段执行强制性标准 的情况，实施监督的机构是（ ）。","options":{"A":"建设项目规划审查机构","B":"施工图设计文件审查单位","C":"建筑安全监督管理机构","D":"工程质量监督机构"},"answer":"A","explanation":"【逐项解析】A正确:规划阶段执行强制性标准由建设项目规划审查机构监督。B施工图审查机构→设计阶段。C建筑安全监督机构→施工阶段。D工程质量监督机构→施工和验收阶段。【法条依据】《实施工程建设强制性标准监督规定》第3条。"},{"id":283,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建设工程抗震管理条例》，关于建设工程抗震相关主体责任和义务的说法正 确的是（ ）。","options":{"A":"设计单位应当将建筑抗震设防烈度等情况记入建筑使用说明书","B":"建设单位应当组织工程各参建单位建立隔震减震工程质量可追溯制度","C":"实行施工总承包的项目，隔震减震装置可以由专业承包单位完成施工","D":"施工单位应当对已经建成的建设工程的工程抗震构件进行检查和修缮"},"answer":"B","explanation":"【逐项解析】B正确:建设单位应组织各参建单位建立隔震减震工程质量可追溯制度。A设计单位应将抗震设防烈度等记入设计文件(非使用说明书)。C隔震减震装置属于主体结构分部,应由总承包单位自行完成(非专业分包)。D建设单位应对已建成工程的抗震构件进行检查修缮(非施工单位)。【法条依据】《建设工程抗震管理条例》。"},{"id":284,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于政府主管部门实施建设工程抗震监督管理措施的说法，正确的是（ ）。","options":{"A":"对建设单位或者施工现场随时进行监督检查","B":"不得复制被检查单位有关建设工程的文件和资料","C":"对隔震减震装置实施抽样检测","D":"查封涉嫌违反抗震设防强制性标准的施工企业"},"answer":"C","explanation":"【逐项解析】C正确:对隔震减震装置实施抽样检测是政府主管部门的监督管理措施。A应依法定程序监督检查(非随时)。B可以复制有关文件和资料。D可查封不符合标准的施工现场(非施工企业)。【法条依据】《建设工程抗震管理条例》。"},{"id":285,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"关于各参建单位无障碍环境建设义务的说法正确的有（ ）。","options":{"A":"个人不得参与无障碍环境建设","B":"无障碍设施经验收交付后，所有权人或管理人应当对无障碍设施维护和管理责任","C":"工程建设单位应当将无障碍设施建设经费纳入工程建设项目概预算","D":"施工图审查机构不对无障碍设施设计内容进行审查","E":"对损坏的无障碍设施和标识进行维修或者替换"},"answer":"BCE","explanation":"【逐项解析】BCE正确:B验收后所有权人或管理人负责无障碍设施维护管理。C建设单位将无障碍设施建设经费纳入概预算。E对损坏的无障碍设施和标识进行维修替换。A个人可参与无障碍环境建设。D施工图审查机构应审查无障碍设施设计。【法条依据】《无障碍环境建设法》。"},{"id":286,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《无障碍环境建设法》，关于无障碍环境建议保障措施的说法，正确的是（ ）。","options":{"A":"残疾人联合会有权修改涉及无障碍环境建设的标准","B":"地方结合本地实际制定的地方无障碍环境建设标准应当高于国家标准的相关技术要求","C":"文明城市创建活动应当将无障碍环境建设作为重要内容","D":"中等职业学校应当开设无障碍环境建设相关业和课程"},"answer":"C","explanation":"【逐项解析】C正确:文明城市创建活动应将无障碍环境建设作为重要内容。A残疾人联合会可提出建议(非有权修改标准)。B地方标准应当不低于国家标准(非高于)。D高等学校应开设相关课程(非中等职业学校)。【法条依据】《无障碍环境建设法》。"},{"id":287,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《无障碍环境建设法》，关于无障碍环境建设监督管理的说法，正确的有（ ）。","options":{"A":"县级以上人民政府建立无障碍环境建设信息公示制度，定期发布无障碍环境建设情况","B":"无障碍环境建设评估结果应当向社会公布","C":"残疾人联合会应当聘请残疾人代表对无障碍环境建设情况进行监督","D":"对违反《无障碍环境建设法》规定损害社会公共利益的行为,老年人代表可以提起公益诉讼","E":"乡镇人民政府应当在职责范围内，开展无障碍环境建设工作"},"answer":"AB","explanation":"【逐项解析】AB正确:A县级以上政府建立信息公示制度定期发布无障碍环境建设情况。B评估结果向社会公布。C残疾人联合会可以(非应当)聘请残疾人代表监督。D可由检察院提起公益诉讼(非老年人代表个人)。E县级以上政府有关部门应在职责范围内(非乡镇政府)。【法条依据】《无障碍环境建设法》。"},{"id":288,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）下列项目，依法要求必须有监理的是（ ）。","options":{"A":"国有资金占主导地位的投资项目","B":"以工代赈的项目","C":"大型公共事业项目","D":"居民住宅楼"},"answer":"C","explanation":"【逐项解析】C正确:大型公共事业项目依法必须实行监理。《建设工程质量管理条例》第12条规定了强制监理范围:国家重点建设工程、大中型公用事业工程、成片开发住宅小区、利用外国政府或国际组织贷款援助的工程等。A国有资金主导→并非所有必须监理。B以工代赈→可不监理。D居民住宅楼→非当然必须(需成片开发)。【法条依据】《建设工程质量管理条例》第12条。"},{"id":289,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设单位质量责任和义务的说法，正确的是（ ）。","options":{"A":"不得直接发包预拌混凝土专业分包工程","B":"不得购入用于工程的装配式建筑构配件、建筑材料和设备","C":"在开工前办理的工程质量监督手续应当与施工许可证政者开工报告合并办理","D":"在办理工程质量监督手续前签署工程质量终身责任承诺书的项目负责人不得更换"},"answer":"A","explanation":"【逐项解析】A正确:建设单位不得直接发包预拌混凝土专业分包工程(应由总承包单位发包)。B可自行采购装配式构配件。C工程质量监督手续可与施工许可证合并办理(开工前)。D项目负责人可更换但需重新签署承诺书。【法条依据】《建设工程质量管理条例》。"},{"id":290,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于设计单位质量责任和义务的说法，正确的是（ ）。","options":{"A":"设计文件中选用的建筑材料、建筑构配件和设备，应当注明规格、型号、性能等技术指标","B":"不得任意压缩合理工期","C":"设计单位应当就审查合格的施工图设计文件向建设单位作出详细说明","D":"设计单位应当将施工图设计文件报有关部门审查"},"answer":"A","explanation":"【逐项解析】A正确:设计文件应注明材料设备规格型号性能等技术指标,但不得指定生产商供应商。B不得压缩合理工期是建设单位的义务(非设计单位)。C向施工单位(非建设单位)作设计交底。D建设单位报审施工图(非设计单位)。【法条依据】《建设工程质量管理条例》第22条。"},{"id":291,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"根据《建设工程勘探设计管理条例》，关于设计单位质量责任和正确的有（ ）","options":{"A":"设计单位必须按照工程建设强制性标准进行设计，并对其设计的质量负责","B":"设计单位应当在建设工程施工前向施工企业和监理单位说明设计意图","C":"受注册执业人员的委托，未经注册的设计人员可以以其名义从事设计活动","D":"设计单位可以委托具备相应资质的其他单位，以本单位的名义承揽工程；","E":"不得对有特殊要求的专用设备指定供应商"},"answer":"AB","explanation":"A正确：设计单位须按工程建设强制性标准设计并对其设计质量负责。B正确：设计单位应在施工前就设计意图向施工企业和监理单位作出说明。C错误：注册执业人员须签字盖章，未经注册人员不得以本人名义执业。D错误：设计单位不得允许他人以本单位名义承揽工程（禁止挂靠）。E错误：对特殊要求的专用设备，设计单位可以指定供应商（但不得指定生产厂），故“不得指定供应商”表述错误。故选AB。"},{"id":292,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于工程监理单位质量责任和义务,正确的是（ ）。","options":{"A":"建设工程勘察设计文件是实施建设工程监理的依据","B":"工程监理单位与被监理的工程设备的供应单位有隶属关系的，可以承担该项建设工程的监理义务","C":"未经总监理工程师签字，建筑材料不得在工程上使用或者安装","D":"未经监理工程师签字，建设单位不得进行竣工验收"},"answer":"A","explanation":"【逐项解析】A正确:勘察设计文件是监理的依据之一。B与被监理工程的设备供应单位有隶属关系不得承担监理。C未经监理工程师签字建筑材料不得使用(非总监理工程师)。D未经总监理工程师签字建设单位不得进行竣工验收。【法条依据】《建设工程质量管理条例》第37条、第38条。"},{"id":293,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《建设工程质量管理条例》，关于建设单位质量责任和义务的说法，正确的是 （ ）。","options":{"A":"建设单位应当就施工图设计文件向施工企业进行技术交底","B":"建设单位不得明示或暗示设计单位违反抗震设防强制性标准，降低工程抗震性能","C":"建设单位在开工后，应当尽快办理工程质量监督手续","D":"建设单位应当对其采购的材料设备进行使用前的检验和试验"},"answer":"B","explanation":"【逐项解析】B正确:建设单位不得明示或暗示违反抗震设防强制标准。A向施工企业技术交底→设计单位职责。C开工前(非开工后)办理工程质量监督手续。D检验试验→施工单位职责(建设单位采购的材料设备由施工单位检验)。【法条依据】《建设工程质量管理条例》第10条。"},{"id":294,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于总分包单位的质量责任的说法,正确的是（ ）。","options":{"A":"分包工程质量由分包单位自行向建设单位负责","B":"分包单位应当接受总承包单位的质量管理","C":"总承包单位与分包单位对分包工程的质量各自向建设单位承担相应的责任","D":"分包工程发生质量问题，建设单位只能向总承包单位请求赔偿"},"answer":"B","explanation":"【逐项解析】B正确:分包单位应接受总承包单位的质量管理。A总分包就分包工程对建设单位承担连带责任(非自行负责)。C连带责任(非各自承担相应责任)。D可向总承包或分包单位请求赔偿(连带责任)。【法条依据】《建筑法》第55条。"},{"id":295,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）某单位工程设计图纸注明的混凝土标号为C30，但监理工程师认为该设计不符合承 包合同约定的C35等级，书面通知承包人按照合同约定的C35施工。该事件说法正确的是（ ）。","options":{"A":"施工单位应当继续按照原施工图纸施工","B":"施工单位应当按照监理通知要求施工","C":"施工单位发现设计不符合承包合同约定时，应按照承包合同约定施工","D":"监理单位认为设计不符合技术标准和合同约定的，应当报告建设单位"},"answer":"D","explanation":"【逐项解析】D正确:监理认为设计不符合技术标准或合同约定应报告建设单位,由建设单位要求设计单位修改。A按图纸施工。B应按图纸施工,监理通知不得替代设计文件。C发现设计问题应通过建设单位处理(非自行按合同施工)。【法条依据】《建设工程质量管理条例》第28条。"},{"id":296,"chapter":"第7章 建设工程质量法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《建设工程勘察设计管理条例》，关于设计文件修改的说法，正确的是（ ）","options":{"A":"监理单位发现设计文件不符合工程建设强制性标准，应当报告建设单位","B":"原设计单位已经注销，可以由具有执业资格的原注册人员修改","C":"经原设计单位授权，具有相应资质的设计单位可以按照相关设计规范修改","D":"委托其他设计单位修改设计文件的，无需原设计单位同意"},"answer":"A","explanation":"【逐项解析】A正确:监理发现设计不符合强制标准应报告建设单位。B原设计单位注销后,修改需由具有相应资质的设计单位修改(非原注册人员)。C经建设单位同意可委托其他设计单位(非原设计单位授权)。D委托其他设计单位修改需原设计单位书面同意(对原设计负责)。【法条依据】《建设工程勘察设计管理条例》第28条。"},{"id":297,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设工程见证取样的说法，正确的是（ ）。","options":{"A":"见证人员应当在试样或其包装上作出标识、标志","B":"涉及结构安全的试块、试件和材料见证取样比例不得低于有关技术标准中规定应取样数量的50%","C":"见证人员应当由施工企业中具备施工试验知识的专业技术人员担任","D":"用于承重墙体的砌筑砂浆试块必须实施见证取样"},"answer":"D","explanation":"【逐项解析】D正确:用于承重墙体的砌筑砂浆试块必须实施见证取样。A标识由取样人员+见证人员共同进行。B见证取样比例不得低于应取样数量的30%(非50%)。C见证人员应由建设单位或监理单位具备试验知识的专业人员担任(非施工单位)。【法条依据】《房屋建筑工程和市政基础设施工程实行见证取样和送检的规定》。"},{"id":298,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）关于工程质量检测的说法，正确的是（ ）。","options":{"A":"检测机构应当建立档案管理制度，并应当单独建立检测结果不合格项目台账","B":"应当由施工企业委托具有相应资质的检测机构进行检测","C":"检测机构可以监制建筑材料、构配件和设备","D":"检测报告应当由工程质量机构法定代表人签署"},"answer":"A","explanation":"【逐项解析】A正确:检测机构应建立档案管理制度并单独建立不合格项目台账。B应由建设单位委托检测机构(非施工单位)。C检测机构不得监制建筑材料。D检测报告由检测人员签字+检测机构法定代表人签署+加盖检测机构公章。【法条依据】《建设工程质量检测管理办法》。"},{"id":299,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）因施工企业的原因，致使建设工程质量不符合约定的，发包人请求并经施工企业修 理后造成逾期交付的，施工企业（ ）。","options":{"A":"不承担违约责任，修理费用由施工企业承担","B":"应当承担缔约过失责任","C":"应当承担违约责任","D":"应当承担侵权责任"},"answer":"C","explanation":"【逐项解析】C正确:因施工企业原因质量不符合约定,修理后逾期交付→应承担违约责任(包括逾期违约金)。A需承担违约责任。B不是缔约过失(合同已成立)。D应是合同责任(违约责任)非侵权责任。【法条依据】《民法典》第582条。"},{"id":300,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设工程返修的说法，正确的是（ ）。","options":{"A":"施工企业仅对已完成的工程负责返修","B":"对施工中出现质量问题的建设工程，无论是否属于施工企业原因造成的，施工企业都应当负责返修","C":"对于竣工验收不合格的建设工程，若是施工企业原因造成的质量问题，由施工企业有偿返修","D":"由设计缺陷造成质量不合格的，承包人不负责返修"},"answer":"B","explanation":"【逐项解析】B正确:对施工中出现质量问题的建设工程,不论何种原因施工单位都应负责返修(然后按责任归属追偿费用)。A不仅对已完工程负责(施工过程中的质量问题也应返修)。C施工单位原因造成的应无偿返修。D设计缺陷造成的由设计单位承担返修费用但施工单位仍应负责返修。【法条依据】《建设工程质量管理条例》第40条。"},{"id":301,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于施工单位施工质量检验和返修的说法，正确的是（ ）。","options":{"A":"隐蔽工程在隐蔽前，应当通知建设单位和勘察、设计单位","B":"建设工程竣工验收不合格的，施工单位应当负责返修","C":"因建设单位原因导致工程质量缺陷的，施工单位应当无偿修复","D":"因修复工程质量缺陷造成逾期交付的，施工单位均应承担违约责任"},"answer":"B","explanation":"【逐项解析】B正确:竣工验收不合格的施工单位应负责返修。A隐蔽前应通知建设单位和监理单位(非勘察设计单位)。C因建设单位原因造成缺陷,施工单位负责返修但费用由建设单位承担(非无偿)。D因建设单位原因造成逾期交付的,施工单位不承担违约责任。【法条依据】《建设工程质量管理条例》第32条。"},{"id":302,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《建设工程质量管理条例》，属于建设工程竣工验收应当具备的条件有（ ）","options":{"A":"完成建设工程设计和合同约定的各项内容","B":"有健全的财务管理档案","C":"有完整的技术档案和施工管理资料","D":"有监理单位出具的竣工验收报告","E":"有施工企业签署的工程保修书"},"answer":"ACE","explanation":"【逐项解析】ACE正确:竣工验收条件:完成设计和合同约定内容、有完整技术档案和施工管理资料、有材料设备试验报告、有质量合格文件、有工程保修书。B财务管理档案不是竣工验收条件。D由监理单位出具质量评估报告(非竣工验收报告),竣工报告由施工单位出具。【法条依据】《建设工程质量管理条例》第16条。"},{"id":303,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"建设工程竣工验收条件有（ ）。","options":{"A":"已经办理工程竣工资料归档手续","B":"有完整的技术档案和施工管理资料","C":"有施工企业签署的工程保修书","D":"有工程使用的全部建筑材料的进场试验报告","E":"有建设、设计、施工、工程监理等单位分别签署的质量合格文件"},"answer":"BC","explanation":"【逐项解析】BC正确:B完整技术档案和施工管理资料。C工程保修书。AE表述不准确:归档手续在验收后进行;质量合格文件由各单位分别签署是对的。D全部材料的试验报告(错,是主要材料的)。【法条依据】《建设工程质量管理条例》第16条。"},{"id":304,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设工程竣工规划验收的说法,正确的是（ ）。","options":{"A":"建设工程竣工后，施工企业应当向城乡规划主管部门提出竣工规划验收申请","B":"竣工规划验收合格的，由城乡规划主管部门出具规划认可文件或核发建设工程规划验收合格证","C":"报送有关竣工验收材料必须在竣工后1年完成","D":"未在规定时间内向城乡规划主管部门报告竣工验收材料的，责令限期补报，并罚款"},"answer":"B","explanation":"【逐项解析】B正确:竣工规划验收合格由城乡规划主管部门出具规划认可文件或核发验收合格证。A建设单位(非施工企业)申请规划验收。C验收后6个月内报送资料(非竣工后1年完成)。D责令限期补报,逾期不报的罚款(非直接罚款)。【法条依据】《城乡规划法》第45条。"},{"id":305,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"关于建筑工程节能的说法，正确的有（ ）。","options":{"A":"建设单位组织竣工验收应当对民用建筑是否符合民用建筑节能强制性标准进行查验","B":"单位工程竣工验收应当在建筑节能分部工程验收合格后进行","C":"政府投资项目不符合强制性节能标准的不得批准建设","D":"不符合强制性节能标准的项目可以开工建设","E":"建筑节能分部工程的质量验收，建设单位应当先行自检合格"},"answer":"ABC","explanation":"【逐项解析】ABC正确:A竣工验收应查验建筑节能标准。B单位工程验收应在节能分部验收合格后进行。C政府投资项目不符合节能标准不得批准建设。D不符合节能标准的项目不得开工建设。E建筑节能分部验收由建设单位组织(非自检)。【法条依据】《民用建筑节能条例》。"},{"id":306,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"根据《建设项目环境保护管理条件》，依法应当编制环境影响报告书，环境影响报告表建设 项目，关于其竣工环保验收的说法，正确的是（ ）","options":{"A":"分期建设，分期投入生产或使用的建设项目，其相应的环境保护设施应当合并验收","B":"对配套建设的环境设施进行验收，编制的验收报告一律向社会公开","C":"配套建设的环境保护设施未经验收合格，可以先行使用","D":"建设单位应当对配套建设的环境保护设施进行验收，编制验收报告"},"answer":"D","explanation":"【逐项解析】D正确:建设单位应对配套建设的环境保护设施进行验收并编制验收报告。A分期建设的应分期验收(非合并)。B除涉及国家秘密的外公开(非一律公开)。C未经验收合格不得投入使用。【法条依据】《建设项目环境保护管理条例》第19条。"},{"id":307,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于工程竣工验收后提交档案资料的说法，正确的是（ ）。","options":{"A":"施工分包单位应将本单位形成的工程文件立卷后向施工总承包单位移交","B":"勘察、设计等单位应当将本单位形成的工程文件立卷后向施工单位移交","C":"建设单位应当在工程竣工验收后6个月内向城建档案馆报送建设工程档案","D":"建设单位编制的建设工程电子档案可不移交城建档案馆"},"answer":"A","explanation":"【逐项解析】A正确:分包单位将本单位形成的工程文件立卷后向总承包单位移交。B勘察设计单位将文件向建设单位移交(非施工单位)。C建设单位应在验收后3个月内报送(非6个月)。D电子档案也需移交。【法条依据】《建设工程文件归档规范》。"},{"id":308,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"关于工程竣工验收应当提交档案资料的说法，正确的是（ ）。","options":{"A":"向档案馆移交一套符合规定的工程档案","B":"工程竣工验收备案表一式叁份，1份由建设单位保存，1份由施工企业保存，1份留备案机关存档","C":"结构和平面布置发生改变的，不必重新编制建设工程档案","D":"建设工程项目实行总承包管理的，建设单位应当负责收集、汇总各分包单位形成的工程档案，并应当及时 向城建档案馆移交"},"answer":"A","explanation":"【逐项解析】A正确:应向城建档案馆移交一套符合规定的工程档案。B备案表一式两份(非三份)由建设单位和备案机关保存。C结构和平面布置改变的应重新编制档案。D实行总承包的由总承包单位负责收集汇总各分包单位档案并移交(非建设单位)。【法条依据】《建设工程质量管理条例》第49条。"},{"id":309,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）建设单位和施工企业经过平等协商确定某屋面防水工程的保修期限为3年，工程竣工 验收合格移交使用后的第4年屋面出现渗漏，则承担该工程维修责任的是（ ）。","options":{"A":"施工单位","B":"建设单位","C":"使用单位","D":"建设单位和施工企业协商确定"},"answer":"A","explanation":"【逐项解析】A正确:屋面防水工程法定最低保修期为5年,约定3年低于法定最低标准→约定无效→按法定5年执行。第4年仍在5年保修期内,施工单位应承担维修责任。法定最低保修期不得通过约定缩短。【法条依据】《建设工程质量管理条例》第40条。"},{"id":310,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"（模拟题）在正常使用条件下，关于建设工程质量法定最低保修期限的说法，正确的有（ ）。","options":{"A":"屋面防水工程为5年","B":"供热与供冷系统为两年","C":"房屋建筑的主体结构为70年","D":"装修工程为5年","E":"给排水管道为2年"},"answer":"AE","explanation":"【逐项解析】AE正确:A屋面防水最低5年。E给排水管道最低2年。B供热供冷系统为2个采暖期供冷期(非2年)。C主体结构为设计文件规定的合理使用年限(非70年)。D装修工程为2年(非5年)。【法条依据】《建设工程质量管理条例》第40条。"},{"id":311,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）2019年3月2日，某工程施工单位向建设单位提交竣工验收报告，3月7日经验收不合 格，施工单位返修后于3月20日再次验收合格，3月31日，建设单位将有关材料报送建设行政主管部门备案， 则施工单位出保修书时间为（ ）。","options":{"A":"3月2日","B":"3月7日","C":"3月20日","D":"3月31日"},"answer":"A","explanation":"按教材观点，施工单位出具工程质量保修书的时间与提交竣工验收报告时间一致，即2019年3月2日；而保修期限自工程竣工验收合格之日（3月20日）起计算。故选A。"},{"id":312,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《关于清理规范工程建设领域保证金的通知》，关于工程建设领域保证金的说 法，正确的是 （ ）。","options":{"A":"建设单位可以要求施工企业缴纳工期保证金","B":"农民工工资保证金已经被取消","C":"未按规定返还保证金，无需承担违约责任","D":"在工程项目竣工前，已经缴纳履约保证金的，建设单位不得同时预留工程质量保证金"},"answer":"D","explanation":"【逐项解析】D正确:竣工前已缴纳履约保证金的不得同时预留工程质量保证金。A不得要求缴纳工期保证金(除依法依规的4类保证金外一律取消)。B农民工工资保证金未被取消。C未按规定返还需承担违约责任。【法条依据】《关于清理规范工程建设领域保证金的通知》。"},{"id":313,"chapter":"第7章 建设工程质量法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《建设工程质量保证金管理办法》，关于缺陷责任期确定的说法，错误的有（ ）。","options":{"A":"缺陷责任期一般为1年，最长不超过2年","B":"缺陷责任期的期限由法律直接规定","C":"缺陷责任期从工程通过竣工验收之日起计","D":"由于承包人原因导致工程无法按规定期限进行竣工验收的，缺陷责任期从实际通过竣工验收之日起计","E":"由于发包人原因导致工程无法按规定期限进行竣工验收的，在承包人提交工验收报告60天后，工程自动进 入缺陷责任期"},"answer":"BE","explanation":"【逐项解析】BE错误:B缺陷责任期由合同约定(非法律直接规定)。E因发包人原因导致无法按期竣工验收的,承包人提交竣工验收报告90天后(非60天)自动进入缺陷责任期。ACD均为正确说法。【法条依据】《建设工程质量保证金管理办法》。"},{"id":314,"chapter":"第7章 建设工程质量法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于建设工程质量保证金的说法,正确的是（ ）。","options":{"A":"采用工程质量保证担保的,建设单位不得再预留工程质量保证金","B":"质量保修期从承包人提交竣工验收报告之日起计","C":"工程质量保证金总预留比例不得高于工程价款结算总额的5%","D":"建设单位返还工程质量保证金后,施工企业不再履行工程保修义务"},"answer":"A","explanation":"【逐项解析】A正确:采用工程质量保证担保的可不再预留保证金。B保修期从竣工验收合格之日起算(非提交报告之日)。C保证金总预留比例不得高于工程价款结算总额的3%(非5%)。D返还保证金后施工企业仍依法履行保修义务。【法条依据】《建设工程质量保证金管理办法》。"},{"id":315,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）关于向城镇排水设施排放污水的说法，正确的是（ ）。","options":{"A":"限制新建并限期淘汰不符合国家产业政策的高耗水产业项目","B":"施工作业需要排放污水的，应当向建设行政主管申请领取污水排入排水管网许可证","C":"在饮用水水源保护区内，禁止设置排污口","D":"排水户应当按照实际需要的排水类别、总量排放污水"},"answer":"C","explanation":"【逐项解析】C正确:在饮用水水源保护区内禁止设置排污口。A限制淘汰高耗水项目是产业政策(非排水规定)。B应向城镇排水主管部门(非住建部门)申请领取排水许可证。D应按许可的排水类别总量排放(非实际需要)。【法条依据】《水污染防治法》第64条。"},{"id":316,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《城镇排水与污水处理条例》， 关于在城镇排水与污水处理设施保护范围内施工的说法，正确的是（ ）","options":{"A":"城镇排水主管部门及其他相关部门和单位应当及时提供相关资料","B":"建设工程开工前，施工企业应当查明工程建设范围内地下城镇排水与污水处理设施的相关情况","C":"因工程建设需要拆除、改动城镇排水与污水处理设施的，施工单位应当承担改建和采取临时措施的费用","D":"建设工程施工范围内有排水管网等城镇排水与污水处理设施的，建设单位当与设计单位、施工企业共同制 定设施保护方案"},"answer":"A","explanation":"【逐项解析】A正确:城镇排水主管部门应及时提供相关资料。B建设单位(非施工单位)应查明地下排水设施情况。C建设单位(非施工单位)承担改建和临时措施费用。D建设单位与施工单位、监理单位(非设计单位)共同制定保护方案。【法条依据】《城镇排水与污水处理条例》第41条。"},{"id":317,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于施工水污染防治禁止事项的说法，正确的是（ ）。","options":{"A":"禁止向水体排放含放射性物质的废水","B":"禁止向水体排放含热废水","C":"禁止向城镇排水设施排放污水","D":"禁止向水体排放工业废渣"},"answer":"D","explanation":"【逐项解析】D正确:禁止向水体排放工业废渣。A含放射性的废水符合国家规定可排放(非一律禁止)。B含热废水符合国家规定可排放。C可向城镇排水设施排放污水(需许可)。【法条依据】《水污染防治法》第34条。"},{"id":318,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《水污染防治法》，禁止设置排污口的是（ ）。","options":{"A":"风景名胜区水体","B":"货运码头","C":"饮用水水源保护区内","D":"具有特殊经济文化价值的水体"},"answer":"C","explanation":"【逐项解析】C正确:饮用水水源保护区内禁止设置排污口(《水污染防治法》第64条)。A风景名胜区水体→禁止新建排污口(已有需限期治理)。B货运码头非特别保护区。D有特殊经济文化价值水体→禁止新建排污口。【法条依据】《水污染防治法》第64条。"},{"id":319,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于危险废物污染环境防治，说法正确的是（ ）。","options":{"A":"危险废物的容器和包装物应当根据实际需要设置危险废物识别标志","B":"产生工业固体废物的单位，应当按照国家有关规定申请取得排污许可证","C":"将危险废物与旅客在同一运输工具上运载的，应当按照国家有关规定申请取得许可证","D":"危险废物的容器和包装物转作他用时，应当经行政主管部门批准"},"answer":"B","explanation":"【逐项解析】B正确:产生工业固体废物的单位应申请取得排污许可证。A危险废物容器和包装物必须(非根据实际需要)设置危险废物识别标志。C禁止将危险废物与旅客在同一运输工具上运载。D危险废物容器和包装物不得转作他用。【法条依据】《固体废物污染环境防治法》。"},{"id":320,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"根据《关于推进建筑垃圾减量化的指导意见》，关于建筑垃圾处理的说法，正确的是（ ）","options":{"A":"建设单位应当建立建筑垃圾分类收集与存放管理制度","B":"建筑垃圾实行分类收集、分类存放、统一处置制度","C":"鼓励以前端收集为导向对建筑垃圾进行细化分类","D":"鼓励采用现场泥沙分离、泥浆脱水预处理等工艺，减少工程渣土和工程泥浆排放"},"answer":"D","explanation":"【逐项解析】D正确:鼓励采用现场泥沙分离泥浆脱水等工艺减少工程渣土和泥浆排放。A施工单位(非建设单位)应建立分类收集存放制度。B分类收集分类存放分类处置(非统一处置)。C鼓励以后端处置为导向(非前端收集)。【法条依据】《关于推进建筑垃圾减量化的指导意见》。"},{"id":321,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《环境噪声污染防治法》，在城市市区噪声敏感建筑物集中区域内，禁止夜间 进行产生环境噪声污染的建筑施工作业，但可以除外的情形有（ ）。","options":{"A":"抢修抢险作业","B":"涉及施工企业商业秘密的","C":"使用专有技术的","D":"利用扶贫资金实行以工代赈的","E":"因生产工艺上要求必须连续作业的"},"answer":"AE","explanation":"【逐项解析】AE正确:抢修抢险作业和工艺要求必须连续作业的可例外(夜间禁止施工的例外)。BCD均不是法定例外情形。【法条依据】《噪声污染防治法》第31条。"},{"id":322,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）在噪声敏感建筑物集中区域因特殊需要必须连续施工作业的，应当取得地方人民政 府住房城乡建设、生态环境主管部门或者地方人民政府指定的部门的证明，并（ ）。","options":{"A":"向附近居民支付赔偿费用","B":"报经应急管理部门审批","C":"经居民小区业主委员会同意","D":"在施工现场显著位置公示"},"answer":"D","explanation":"【逐项解析】D正确:需连续施工作业的,取得证明后应在施工现场显著位置公示。A不需支付赔偿。B不需报应急管理部门。C不需业主委员会同意。【法条依据】《噪声污染防治法》第43条。"},{"id":323,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《噪声污染防治法》，关于建筑施工污染防治的说法，正确的是（ ）。","options":{"A":"建设单位应当制定噪声污染防治实施方案","B":"施工企业应当将噪声污染防治费用列入工程造价","C":"监理单位应当落实噪声污染防治实施方案","D":"在施工合同中，应当明确施工企业的噪声污染防治责任"},"answer":"D","explanation":"【逐项解析】D正确:施工合同中应明确施工企业的噪声污染防治责任。A施工单位(非建设单位)制定噪声污染防治实施方案。B建设单位将噪声污染防治费用列入工程造价(非施工单位)。C施工单位(非监理单位)落实实施方案。【法条依据】《噪声污染防治法》。"},{"id":324,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"根据《噪声污染防治法》，关于建筑施工噪声污染防治的说法，正确的是（ ）。","options":{"A":"对已交付使用的建筑物进行室内装修时应当采取有效噪声防治措施","B":"在噪声敏感建筑物集中区域施工作业，应当使用低噪声施工设备","C":"建设单位应当在交通路段设置声屏障或者采取其他减少振动、降低噪声的措施","D":"严禁施工单位夜间进行产生噪声的建筑施工作业"},"answer":"A","explanation":"【逐项解析】A正确:对已交付使用的建筑物进行室内装修时应采取有效噪声防治措施。B在噪声敏感区应优先使用低噪声设备(非应当)。C交通部门设置声屏障(非建设单位)。D因特殊需要+取得证明可在夜间施工(非严禁)。【法条依据】《噪声污染防治法》。"},{"id":325,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据文物保护法、受国家保护的文物是（ ）。","options":{"A":"与历史事件中有关的代表性建筑","B":"具有历史、艺术、科学价值的石刻、壁画","C":"历史上各时代艺术品、工艺美术品","D":"反映历史上各时代的实物"},"answer":"B","explanation":"【逐项解析】B正确:具有历史、艺术、科学价值的石刻壁画受国家保护。A与历史事件中有关的代表性建筑→应为具有历史意义的事件。C历史上各时代艺术品→应为珍贵的。D反映历史上各时代的实物→应为具有历史、艺术、科学价值的。【法条依据】《文物保护法》第2条。"},{"id":326,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《历史文化名城名镇名村保护条例》，可以申报历史文化名城、名镇、名村的 是（ ）。","options":{"A":"保护文物比较丰富的城市","B":"能够反应本地区建筑的文化特色的镇","C":"保留着传统格局和历史风貌的村庄","D":"历史上建设的工程对本地区的发展产生较大影响的城市"},"answer":"C","explanation":"【逐项解析】C正确:保留着传统格局和历史风貌的村庄可申报历史文化名村。A保护文物丰富→还需历史建筑集中成片等条件。B反映本地区建筑文化特色→需保留传统格局和历史风貌。D对历史发展产生较大影响→需保留历史风貌。【法条依据】《历史文化名城名镇名村保护条例》。"},{"id":327,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《历史文化名城名镇名村保护条例》规定，可以在历史文化名城、名镇、名村 保护范围内进行下列活动有（ ）。","options":{"A":"修建储存腐蚀性物品的仓库","B":"占用保护规划确定保留的道路","C":"在历史建筑上刻划、涂污","D":"改变园林绿地、河湖水系等自然状态的活动"},"answer":"D","explanation":"【逐项解析】D正确:改变园林绿地河湖水系等自然状态的活动可在保护范围内进行(但需审批)。A不得修建储存腐蚀性物品仓库。B不得占用保护规划确定保留的道路。C不得在历史建筑上刻划涂污。【法条依据】《历史文化名城名镇名村保护条例》第24条。"},{"id":328,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《历史文化名城名镇名村保护条例》，在历史文化街区、名镇、名村核心保护 范围内，允许建设的工程是（ ）。","options":{"A":"新建影视摄制基地","B":"新建商业综合体","C":"扩建办公楼","D":"扩建必要的基础设施"},"answer":"D","explanation":"【逐项解析】D正确:核心保护范围内可扩建必要的基础设施。ABC新建影视基地、商业综合体、扩建办公楼均不得在核心保护范围内进行(核心保护范围以保护为主)。【法条依据】《历史文化名城名镇名村保护条例》第28条。"},{"id":329,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）已经建成的下列工程中，抗震设防措施未达到抗震设防要求的，应按国家 有关规定进行抗震性能鉴定，并采取必要的抗震加固措施的是（ ）。","options":{"A":"可能发生灾害的建设工程","B":"学校、医院等人员密集场所的建设工程","C":"具有艺术价值的建设工程","D":"地震监视防御区内的建设工程"},"answer":"B","explanation":"【逐项解析】B正确:学校医院等人员密集场所的已建成工程,抗震措施未达标的应进行鉴定并加固。A可能发生灾害→表述不准确。C具有艺术价值→需看是否为重大工程。D地震监视防御区→范围太广。【法条依据】《建设工程抗震管理条例》。"},{"id":330,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【真题-单选题】","type":"single","stem":"根据《建设项目环境保护管理条件》，依法应当编制环境影响报告书，环境影响 报告表建设项目，关于其竣工环保验收的说法，正确的是（ ）","options":{"A":"分期建设，分期投入生产或使用的建设项目，其相应的环境保护设施应当合并验收","B":"对配套建设的环境设施进行验收，编制的验收报告一律向社会公开","C":"配套建设的环境保护设施未经验收合格，可以先行使用","D":"建设单位应当对配套建设的环境保护设施进行验收，编制验收报告"},"answer":"D","explanation":"【逐项解析】D正确:建设单位应对配套环保设施进行验收编制验收报告。A分期建设的应分期验收。B除涉及国家秘密外公开(非一律公开)。C未经验收合格不得使用。【法条依据】《建设项目环境保护管理条例》第19条。"},{"id":331,"chapter":"第8章 建设工程环境保护和历史文化遗产保护法律制度","marker":"【真题】","type":"single","stem":"关于施工发现文物保护的说法，正确的是（ ）","options":{"A":"在施工中发现文物，应当保护现场，并在24小时内报告当地文物行政部门","B":"文物行政部门接到报告后，一般应在在24小时内赶赴现场，并立即提出处理意见","C":"文物行政部门接到报告后，应当报请当地人民政府通知公安机关协助保护现场","D":"施工中发现的文物属于国家所有，任何单位和个人不得哄抢、私分、藏匿"},"answer":"D","explanation":"【逐项解析】D正确:施工中发现的文物属国家所有,任何单位和个人不得哄抢私分藏匿。A应在24小时内报告(对,但D更全面正确)。B文物部门应在24小时内(非一般)赶赴现场。C应在24小时内通知公安机关(非报请政府通知)。【法条依据】《文物保护法》第32条。"},{"id":332,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）根据《劳动合同法》，用人单位与劳动者明确合同终止时间的合同是（ ）","options":{"A":"固定期限劳动合同","B":"无固定期限劳动合同","C":"集体合同","D":"以完成一定工作任务为期的劳动"},"answer":"A","explanation":"【逐项解析】A正确:固定期限劳动合同约定明确的合同终止时间。B无固定期限无确定终止时间。C集体合同不是以合同终止时间分类的。D以完成一定工作任务为期限的合同以任务完成而非时间终止。【法条依据】《劳动合同法》第13条。"},{"id":333,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）根据《劳动合同法》，按期限划分，劳动合同可以分为（ ）。","options":{"A":"固定期限劳动合同","B":"无固定期限劳动合同","C":"非全日制用工劳动合同","D":"以完成一定工作任务为期限的劳动合同","E":"零散用工劳动合同"},"answer":"ABD","explanation":"【逐项解析】ABD正确:劳动合同按期限分为固定期限、无固定期限、以完成一定工作任务为期限三种。C非全日制用工是按用工方式分类(非期限分类)。E零散用工不是法定分类。【法条依据】《劳动合同法》第12条。"},{"id":334,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）某施工企业的下列劳动者中，有权要求与企业订立无固定期限劳动合同的是（ ）","options":{"A":"在该施工企业连续工作刚满8年的张某","B":"在该施工企业工作满2年，并被任命为总经理的王某","C":"在该施工企业已经连续订立2次固定期限劳动合同，因工负伤调整到其他工作岗位的李某","D":"在该施工企业累计工作刚满10年，期间曾离开过企业1年的刘某"},"answer":"C","explanation":"【逐项解析】C正确:连续订立2次固定期限劳动合同且劳动者无过失→续订时应订立无固定期限合同。A连续工作满10年(刚满8年不够)。B满2年不够10年。D累计满10年但期间离开→非连续工作满10年(需连续)。【法条依据】《劳动合同法》第14条。"},{"id":335,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（模拟题）2022年5月10日张某进入某公司工作。同年6月1日,张某与该公司签订了一年的劳 动合同,试用期1个月。根据《劳动合同法》说法正确的是（ ）。","options":{"A":"张某与该公司2022年6月1日建立劳动关系","B":"合同自2022年7月1日起生效","C":"合同自2022年6月1日起生效","D":"张某与该公司2022年7月1日建立起劳动关系"},"answer":"C","explanation":"【逐项解析】C正确:合同自6月1日签订生效,劳动关系自5月10日用工之日起建立。A劳动关系自5月10日建立(非6月1日)。B合同自签订之日生效(非7月1日)。D劳动关系自用工之日(5月10日)建立。【法条依据】《劳动合同法》第7条、第10条。"},{"id":336,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【真题-单选题】","type":"single","stem":"关于劳动关系的说法，正确的是（ ）。","options":{"A":"用人单位自订立劳动合同之日起与劳动者建立劳动关系","B":"劳动关系的存在，以书面劳动合同的订立为条件","C":"订立了书面劳动合同，即使没有用工事实，劳动关系也已经建立","D":"建立劳动关系，应当订立书面劳动合同"},"answer":"D","explanation":"【逐项解析】D正确:建立劳动关系应订立书面劳动合同。A自用工之日起建立劳动关系(非订立合同之日)。B劳动关系以用工事实为条件(非以书面合同为条件)。C无用工事实仅有合同不建立劳动关系。【法条依据】《劳动合同法》第7条、第10条。"},{"id":337,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-多选题】","type":"multi","stem":"（真题）下列条款中，劳动合同应当具备的条款有（ ）。","options":{"A":"试用期","B":"社会保险","C":"工作方法与要求","D":"劳动合同期限","E":"工作内容和工作地点"},"answer":"BDE","explanation":"【逐项解析】BDE正确:劳动合同必备条款包括:用人单位信息+劳动者信息+合同期限+工作内容地点+工作时间和休息休假+劳动报酬+社会保险+劳动保护等。A试用期是约定条款(非必备)。C工作方法与要求不是法定必备条款。【法条依据】《劳动合同法》第17条。"},{"id":338,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于劳动合同试用期的说法，正确的是（ ）。","options":{"A":"初次订立劳动合同的，可以仅约定试用期，而不约定劳动合同期限","B":"同一用人单位与同一劳动者只能约定1次试用期","C":"试用期不包含在劳动合同期限之内","D":"劳动合同期限不满1年的，不得约定试用期"},"answer":"B","explanation":"【逐项解析】B正确:同一用人单位与同一劳动者只能约定1次试用期。A试用期包含在合同期限内,不得仅约定试用期。C试用期包含在合同期限内。D不满1年的→可约定试用期(不超过1个月)。【法条依据】《劳动合同法》第19条。"},{"id":339,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"马某与某施工企业订立了一份2年期限的劳动合同，合同约定了试用期，同时约定合同生效时 间为5月1日，则试用期最晚应当截止于（ ）。","options":{"A":"11月1日","B":"8月1日","C":"7月1日","D":"6月1日"},"answer":"C","explanation":"【逐项解析】C正确:2年期限劳动合同试用期最长不超过2个月,5月1日起算→最晚7月1日。试用期包含在合同期限内。【法条依据】《劳动合同法》第19条:1年≤合同<3年→试用期≤2个月。"},{"id":340,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"single","stem":"（真题）关于劳动合同履行的说法，正确的 是（ ）。","options":{"A":"用人单位变更投资人不影响劳动合同的履行","B":"用人单位变更名称，原劳动合同可终止","C":"用人单位发生合并或者分立，原劳动合同解除","D":"用人单位变更法定代表人，应当重新订立劳动合同"},"answer":"A","explanation":"【逐项解析】A正确:用人单位变更投资人不影响劳动合同履行。B变更名称不影响履行。C合并分立后原劳动合同继续有效(由承继单位继续履行)。D变更法定代表人不影响履行(无需重新订立)。【法条依据】《劳动合同法》第33条、第34条。"},{"id":341,"chapter":"第9章 建设工程劳动保障法律制度","marker":"【例-单选题】","type":"si
