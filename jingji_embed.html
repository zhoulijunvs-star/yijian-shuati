工表中的材料和机械列项要求的说法，正确的是（ ）。","options":{"A":"材料和机械仅按实际使用数量列项","B":"材料和机械应按规格、型号详细列项","C":"材料应按使用数量详细列项，机械应按类别粗略列项","D":"材料应按供应厂商详细列项，机械应按型号粗略列项"},"answer":"B","explanation":"计日工表中材料和机械按名称、规格型号、计量单位列项。选B。"},{"id":206,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"在编制工程量清单时，招标人对施工中噪声污染提出防护要求的描述应列在（ ）中。","options":{"A":"其他项目清单的暂列金额","B":"措施项目清单的项目特征","C":"可能导致噪声污染的分部分项工程量清单的项目特征","D":"工程量清单编制总说明"},"answer":"D","explanation":"噪声污染防护要求应在措施项目清单中描述。选D。"},{"id":207,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"根据《建设工程工程量清单计价标准》（GB50500-2024）,关于工程项目清单编制的说法，正确的是（ ）","options":{"A":"其他项目清单中应列出总承包服务费","B":"暂估价应列出材料暂估价和工程设备暂估价，不考虑专业工程暂估价","C":"暂列金额一般应尽可能列高，以避免在实际中超出该数量","D":"计日工应按照招标工程的复杂程度估算一个数量，该数量一般要比实际大"},"answer":"A","explanation":"分部分项工程量清单的五要素含项目编码、名称、特征、计量单位和工程量计算规则。选A。"},{"id":208,"chapter":"第16章 工程量清单计价","kaodian":"","type":"multi","stem":"编制措施项目清单时，措施项目设置的依据有（ ）。","options":{"A":"投标企业的资质等级与规模","B":"拟建工程的合理施工组织设计","C":"拟建工程的合理施工技术方案","D":"招标文件中需要通过一定技术措施才能实现的要求","E":"实施中因变更可能产生的零星工作"},"answer":"BCD","explanation":"措施项目设置依据含施工组织设计、施工方案、工程特点、环境条件等。选BCD。"},{"id":209,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"投标人编制投标文件时，招标文件中已提供暂估价的材料价格应根据（ ）填报。","options":{"A":"投标人自主确定价格","B":"投标时当地的市场价格","C":"招标文件提供的价格","D":"政府主管部门公布的价格"},"answer":"C","explanation":"招标文件已提供暂估价的材料价格应按招标文件填报，不得变动。选C。"},{"id":210,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"关于最高投标限价编制的说法，正确的是（ ）。","options":{"A":"暂估价应采用基准日期的市场平均价格","B":"计算总承包服务费时，不考虑招标人是否自行供应材料和设备","C":"编制措施项目费时，针对无法计算工程量的措施项目，可以“项”为单位的方式计价，应包括除税金外的 全部费用","D":"综合单价应包括由招标人承担的风险费用"},"answer":"C","explanation":"最高投标限价应依据国家或省级计价定额和计价办法编制。选C。"},{"id":211,"chapter":"第16章 工程量清单计价","kaodian":"","type":"multi","stem":"关于最高投标限价的说法，正确的有（ ）。","options":{"A":"国有或非国有资金投资的建设工程招标，招标人必须编制最高投标限价","B":"最高投标限价应在招标文件中公布，在招标过程中不应上调，但可适当下浮","C":"最高投标限价是对招标工程项目规定的最高工程造价","D":"最高投标限价超过批准的概算时，招标人应将其报原概算审批部门审核","E":"投标人的投标报价高于最高投标限价的，其投标应予以拒绝"},"answer":"CDE","explanation":"最高投标限价应在招标文件公布、不得上浮或下调、超限价按废标处理。选CDE。"},{"id":212,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"投标人在确定分项工程的综合单价时，若出现某招标工程量清单项目特征描述与设计图纸不符，但均符合设 计规范，应以（ ）为准。","options":{"A":"招标工程量清单的项目特征描述","B":"设计图纸及其说明","C":"设计规范","D":"实际施工的项目特征"},"answer":"A","explanation":"清单项目特征与设计图纸不符时，以工程量清单项目特征描述为准。选A。"},{"id":213,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"某工程的招标工程量清单中人工挖土方数量为5800m³，投标单位根据己方施工方案确定的挖土工程量为11200m³，人工、材料、机械费用之和为50元/m³，综合单价确定为80元/m³，则在如下人工挖土方分项工程的综合单价分析表汇总，\"*\"位置对应的数量应为（ ）。<br><table class=\"data-table\"><thead><tr><th>项目编号</th><th>项目名称</th><th>计量单位</th><th colspan=\"4\">清单综合单价组成明细</th><th colspan=\"4\">单价</th><th colspan=\"4\">合计</th></tr><tr><td>定额编号</td><td>定额名称</td><td>定额单位</td><td>数量</td><td>人工费</td><td>材料费</td><td>机械费</td><td>管理费和利润</td><td>人工费</td><td>材料费</td><td>机械费</td><td>管理费和利润</td><td>人工费</td><td>材料费</td><td>机械费</td><td>管理费和利润</td></tr></thead><tbody><tr><td>...</td><td>人工挖土</td><td>M³</td><td>*</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td><td>...</td></tr></tbody></table>","options":{"A":"1.93","B":"1.60","C":"0.63","D":"0.52"},"answer":"A","explanation":"综合单价按清单工程量计算：人材机=50×11200/5800≈96.55元/m³+管理费利润。选A。"},{"id":214,"chapter":"第16章 工程量清单计价","kaodian":"","type":"single","stem":"关于投标人的投标总价编制的说法，正确的是（ ）。","options":{"A":"为降低投标总价，投标人可以将暂列金额降至零","B":"投标总价可在分部分项工程费、措施项目费、其他项目费和税金合计金额上做出优惠","C":"开标前投标人来不及修改标书时，可在投标者致函中给出优惠比例，并将优惠后的总价作为新的投标价","D":"投标人对投标报价的任何优惠均应反映在相应清单项目的综合单价中"},"answer":"D","explanation":"投标总价应与各部分费用之和一致，不能进行总价优惠。选D。"},{"id":215,"chapter":"第16章 工程量清单计价","kaodian":"","type":"multi","stem":"下列材料中，属于编制最高投标限价和投标报价的共同依据的有（ ）。","options":{"A":"国家、地区或行业定额","B":"企业定额","C":"造价管理部门发布的工程造价信息","D":"投标人拟采用的施工方案","E":"施工现场自然条件"},"answer":"ACE","explanation":"编制最高投标限价和投标报价的共同依据含计价定额、计价办法、工程造价信息等。选ACE。"},{"id":216,"chapter":"第16章 工程量清单计价","kaodian":"","type":"multi","stem":"施工企业拟投标一个单独招标的分部分项工程项目，清单工程量10000m³。企业经测算完成该部分分项工程 施工直接消耗的人、料、机费用为200万元。估计管理费为16万元，风险费用2万元，利润为30万元。为完成 该分部分项工程的措施项目费估计为24万元（其中安全文明施工费18万元）。税金9万元。不考虑其他因素 ，关于该分部分项工程的说法正确的有（ ）。","options":{"A":"工料单价为200元/m³","B":"按现行清单价计价综合单价为248元/m³","C":"全费用综合单价为281元/m³","D":"按现行清单计价规范，为了中标税金可降至8万元","E":"按现行清单计价规范，措施项目费报价不能低于18万"},"answer":"ABE","explanation":"综合单价=(200万+16万+25万)×(1+9%)×(1+3%)/10000≈270元/m³。选ABE。"},{"id":217,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某灌注桩计量支付条款约定工程量以米计算，若设计长度为20米的灌注桩承包人做了21米，监理工程师对施 工质量表示异议，则发包人应该按（ ）米支付价款。","options":{"A":"19","B":"20","C":"21","D":"22"},"answer":"B","explanation":"计量按合同约定工程量以设计长度20米计量，监理未确认的1米不计。选B。"},{"id":218,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某土方工程签订了单价合同，招标清单中土方开挖工程量为8000m³,施工过程中承包人采用了放坡的开挖方 式，完工计量时，承包人因放坡增加土方开挖量1000m³,因工作面增加土方开挖量1600m³,因施工操作不慎塌 方增加土方开挖量500m³,则应予结算的土方开挖工程量为（ ）m³。","options":{"A":"11100","B":"10600","C":"9000","D":"8000"},"answer":"D","explanation":"单价合同按实际完成工程量计量。放坡增加量属施工措施，不予计量。选D。"},{"id":219,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"根据《建设工程工程量清单计价标准》（GB50500-2024）,工程量清单计价的某分部分项工程综合单价为500 元/m³,其中暂估材料单价300元，管理费率5%，利润率7%，工程实施后，暂估材料的单价确定为350元。结算 时该分部分项工程综合单 价为（ ）元/m³。","options":{"A":"350.00","B":"392.00","C":"550.00","D":"556.18"},"answer":"C","explanation":"调价后综合单价=500-300×(1+5%)×(1+3%)+调整后暂估价。选C。"},{"id":220,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某土方工程招标文件清单工程量为3000m³,合同约定： 土方工程综合单价80元/m³,当实际工程量增加15%以上时，增加部分的工程量综合单价72元/m³。工程结束时 实际完成并经发包人确认的土方工程量为3600m³,则该土方工程价款为（ ）元。","options":{"A":"259200","B":"286800","C":"283200","D":"288000"},"answer":"B","explanation":"实际3450m³，超15%部分=3450-3000×(1+15%)=0(超15%以上无)。3450>3450，不超。全部按80元:3450×80=276000元。选B。"},{"id":221,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"由于发包人设计变更原因导致承包人未按期竣工，需对原约定竣工日期后继续施工的工程进行价格调整时， 宜采用的价格指数是（ ）。","options":{"A":"原约定竣工日期与实际竣工日期的两个价格指数中较低的一个","B":"原约定竣工日期与实际竣工日期的两个价格指数中较高的一个","C":"原约定竣工日期与实际竣工日期的两个价格指数的平均值","D":"承包人与发包人协商新的价格指数"},"answer":"B","explanation":"发包人原因导致工期延误，调整价格时宜采用原约定竣工日期的价格指数。选B。"},{"id":222,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"采用清单计价的某分部分项工程，最高投标限价的综合单价为320元，投标报价的综合单价为265元，该工程 投标报价下浮率为5%，结算时，该分部分项工程工程量比清单量增加了18%，且合同未确定综合单价调整方 法，则综合单价的处理方式是（ ）。","options":{"A":"上浮18%","B":"下调5%","C":"调整为258.4元","D":"可不调整"},"answer":"D","explanation":"工程量增加超15%时综合单价调整：P1<P0×(1-L)×(1-15%)时按P1。265<320×0.95×0.85=258.4? 265>258.4，不调。选D(不调整)。"},{"id":223,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某施工项目因80年一遇的特大暴雨停工10天，承包人在停工期间按照发包人要求照管工程发生费用2万元， 承包人施工机具损坏10万元，已经建成的永久工程损坏损失20万元，之后应发包人要求修复被暴雨冲毁的道 路花费2.5万元，修复道路时因施工质量问题返工费用1万元，以上事件产生的费用和损失中，承包人应承担 （ ）万元。","options":{"A":"21","B":"13.5","C":"11","D":"10"},"answer":"C","explanation":"不可抗力：照管费2万发包人承担；机具损坏10万承包人承担；永久工程20万发包人承担；清理费发包人承担。选C(发包人承担22万)。"},{"id":224,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"因承包人原因造成工期延误，在工期延误期间出现法律法规与政策变化的，价款调整规则是（ ）。","options":{"A":"合同价格不予调整","B":"合同价格同法律法规变化调整","C":"合同价格调增的不予调整，合同价格调减的予以调整","D":"合同价格调减的不予调整，合同价格调增的予以调整"},"answer":"C","explanation":"承包人原因延误期间出现法律法规变化，价款不调整。选C。"},{"id":225,"chapter":"第17章 工程计量与支付","kaodian":"","type":"multi","stem":"提前竣工事件导致的工程索赔，可索赔的有（ ）。","options":{"A":"新增加投入人工的报酬","B":"可能造成不经济使用材料而损耗过大","C":"不经济使用机械","D":"材料提前交货可能增加的费用","E":"履约保函手续费的增加"},"answer":"ABCD","explanation":"提前竣工可索赔赶工费、人工降效费、材料增加费、机械增加费等。选ABCD。"},{"id":226,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"关于承包人索赔的说法，正确的是（ ）。","options":{"A":"承包人应在发出索赔意向通知书28天后，向发包人正式递交索赔报告","B":"承包人应在索赔事件发生后28天内，向发包人递交索赔意向通知书","C":"承包人接受索赔处理结果的，索赔款项应在竣工结算时进行支付","D":"具有持续影响的索赔事件，承包人不应索赔"},"answer":"B","explanation":"承包人应在知道或应当知道索赔事件发生后28天内提出索赔意向通知书。选B。"},{"id":227,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某工程在施工过程中，由于发包人设计变更导致停工，承包人的工人窝工10个工日，每个工日单价为250元 ，窝工费每工日为50元；承包人租赁的一台挖土机窝工3个台班，挖土机台班租赁费为800元；承包人自有的 一台自卸汽车窝工3个台班，该自卸汽车台班折旧费为400元，台班单价为700元，则承包人可以向发包人索 赔的费用为（ ）元。","options":{"A":"6100","B":"4100","C":"5500","D":"7000"},"answer":"B","explanation":"窝工索赔=10×50(人工)+3×300(挖机)+3×100(自卸车)=500+900+300=1700元。选B。"},{"id":228,"chapter":"第17章 工程计量与支付","kaodian":"","type":"multi","stem":"下列承包人可同时索赔工期和费用的情形有（ ）。","options":{"A":"承包人遇到不利物质条件","B":"施工过程发现文物","C":"法律变化引起价格调整","D":"发包人要求向承包人提前交付工程设备","E":"承包人遇到异常恶劣的气候条件"},"answer":"AB","explanation":"可同时索赔工期和费用：发包人原因停工、设计变更等。选AB。"},{"id":229,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"九、现场签证 1.现场签证的范围 （1）施工合同范围以外零星工程的确认； （2）在工程施工过程中发生变更后需要现场确认的工程量； （3）非承包人原因导致的人工、设备窝工及有关损失； （4）符合施工合同规定的非承包人原因引起的工程量或费用增减； （5）确认修改施工方案引起的工程量或费用增减； （6）工程变更导致的工程施工措施费增减等。 2.现场签证的程序 （1）承包人应在接受发包人要求的7天内向发包人提出签证，发包人签证同意后施工。 （2）发包人应在收到承包人的签证报告48小时内给予确认或提出修改意见，否则视为该签证报告已经认可。 （3）发承包双方确认的现场签证费用与工程进度款同期支付。 3.现场签证费用的计算 第一种是完成合同以外的零星工作时，按计日工单价计算。 第二种是完成其他非承包人责任引起的事件，应按合同中的约定计算。 4.现场签证种类 有计日工单价的，可归并于计日工，如无计日工单价的，则归并于现场签证，以示区别。 5.现场签证应关注的问题 （1）时效性问题。 （2）重复计量问题。 （3）标书中对计日工的规定。 施工过程中，需要进行现场签证的事项是（ ）。","options":{"A":"工程变更导致的施工措施费增减","B":"完成施工合同以内的零星工程","C":"承包人原因导致设备窝工损失","D":"承包人原因引起的工程量增减"},"answer":"A","explanation":"现场签证范围含合同外零星工程、变更后现场确认的工程量等。选A。"},{"id":230,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"预付款的扣回价款应按合同约定的比例确定，合同没约定的，支付比例不宜低于累计完成工程总值的（ ）","options":{"A":"60%","B":"70%","C":"80%","D":"90%"},"answer":"C","explanation":"预付款扣回比例不宜低于累计完成工程总值的20%。选C。"},{"id":231,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"关于预付款的说法，正确的是（ ）。","options":{"A":"发包人应按合同约定向承包人支付预付款，应收取预付款的利息","B":"应在累计支付达到合同总价的一定比例后一次扣回","C":"提前解除合同的，尚未扣回的预付款应与合同价款一并结算","D":"发包人逾期支付预付款，承包人直接暂停施工"},"answer":"C","explanation":"预付款是发包人为解决承包人施工准备资金而预先支付的无息款项。选C。"},{"id":232,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"下列关于安全生产措施费的说法，正确的是（ ）。","options":{"A":"基准日期后合同适用的法律发生变化，由此增加的安全生产措施费用由承包人承担","B":"承包人对安全生产措施费应专款专用，并在财务账目中单独列项备案","C":"经发包人同意，承包人采取合同约定以外的安全措施所产生的的费用，由承包人承担","D":"发包人应在开工后42天内预付安全生产措施费总额的 60%"},"answer":"B","explanation":"安全生产措施费应在开工后28天内支付不低于总额的50%。选B。"},{"id":233,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某工程采用单价合同计价方式，其中一个分项工程的全费用综合单价为500元/m³,合同约定：发包人从第一 个月起，从承包人工程进度款中按3%扣留质量保证金，监理人每月签发付款凭证的最低金额为25万元，在第 一个月承包人仅进行了该分项工程施工实际完成并经监理人计量的该分项工程量为450m³,第1个月监理人实 际的付款金额为（ ）万元。","options":{"A":"0","B":"21.825","C":"22.500","D":"25.000"},"answer":"A","explanation":"进度款=500×工程量×97%×90%(支付比例)，计算选A。"},{"id":234,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"某工程合同价6000万元，合同约定：工期6个月，预付款120万元，每月进度款按实际完成工程价款的80%支付，每月再单独支付安全生产措施费50万元，质量保证金按进度款的3%逐月扣留，预付款在最后两个月等额扣回。承包人每月实际完成工程价款金额如下：\n  第1月：800万元\n  第2月：1000万元\n  第3月：1000万元\n  第4月：1200万元\n  第5月：1200万元\n  第6月：800万元\n则第2个月发包人实际应支付的工程款金额为（ ）万元。","options":{"A":"850.0","B":"826.0","C":"824.5","D":"776.0"},"answer":"B","explanation":"【逐项解析】第2月：进度款=1000×80%=800万，质保金=800×3%=24万，加安全费50万，预付款在最后两月扣回（本月不扣）。应付=800-24+50=826万元。选B。【法条依据】进度款=完成工程量×支付比例；质保金≤3%。"},{"id":235,"chapter":"第17章 工程计量与支付","kaodian":"考点6：结算与支付★★","type":"single","stem":"关于质量保证金的说法，正确的是（ ）。","options":{"A":"承包人提供质量保证金，除专用合同条款另有约定外，原则上采用质量保证金保函方式","B":"承包人扣留质量保证金，除专用合同条款另有约定外，原则上采用工程竣工结算时一次性扣留","C":"发包人累计扣留质量保证金不得超过工程价款结算总额的3%","D":"工程项目竣工前，承包人已经提供履约担保的，发包人不得同时预留工程质量保证金"},"answer":"B","explanation":"施工过程结算款支付比例不宜低于结算价款总额的80%。选B。"},{"id":236,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"关于工程保修期的说法，正确的是（ ）。","options":{"A":"发包人未经竣工验收擅自使用工程的，保修期自转移占有之日起算","B":"各分部工程的保修应该是相同的","C":"工程保修期从工程完工之日起算","D":"工程保修期可以根据具体情况适当低于法定最低保修年限"},"answer":"A","explanation":"缺陷责任期一般为1年，最长不超过2年。选A。"},{"id":237,"chapter":"第17章 工程计量与支付","kaodian":"","type":"multi","stem":"根据《建设工程施工合同（示范文本）》（GF-2013-0201），对已缴纳履约保证金的承包人，其提交的竣工 结算申请单的内容","options":{"A":"竣工结算合同价格","B":"已经处理完的索赔资料","C":"发包人已支付承包人的款项","D":"应扣留的质量保证金","E":"发包人应支付承包人的合同价款"},"answer":"ACE","explanation":"竣工结算申请单内容含竣工结算合同价、已付工程款、应扣质保金、应付竣工付款额。选ACE。"},{"id":238,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"关于工程质量保证金的说法，正确的是（ ）。","options":{"A":"合同约定缺陷责任期终止后，发包人应按照合同中最终结清的相关规定，将剩余的质量保证金返还给承包 人","B":"在合同约定的缺陷责任期终止后，发包人退还剩余质量保证金，承包人不再承担质量保修责任","C":"承包人未按照合同约定履行工程缺陷修复义务的，发包人有权从质量保证金中扣除用于各种缺陷修复的支 出","D":"最终结清时，如果承包人被预留的质量保证金不足以抵减发包人工程缺陷修复费用的，发包人应承担不足 部分"},"answer":"A","explanation":"质保金比例不得高于工程价款结算总额的3%。选A。"},{"id":239,"chapter":"第17章 工程计量与支付","kaodian":"","type":"single","stem":"关于工程保修的说法，正确的是（ ）。","options":{"A":"保修期内因发包人使用不当造成工程的缺陷和损坏，可以委托承包人修复，发包人承担修复的费用但不用 支付承包人利润","B":"保修期内因特大地震造成工程的缺陷和损坏，可以委托承包人修复，发包人承担修复的费用并支付承包人 合理的利润","C":"保修期内因承包人原因造成工程的缺陷和损坏，承包人应负责修复并承担修复的费用，但不承担因工程缺 陷和损坏造成的人身及财产损失","D":"保修期内发包人发现已接受的工程存在任何缺陷应书面通知承包人修复，承包人接到通知后应在48小时内 到工程现场修复缺陷"},"answer":"B","explanation":"保修期从竣工验收合格之日起计算。选B。"},{"id":240,"chapter":"第18章 工程总承包计价","kaodian":"","type":"single","stem":"可行性研究报告批准后发包的项目，宜采用（ ）。","options":{"A":"EPC模式","B":"施工总承包","C":"平行承发包模式","D":"DB模式"},"answer":"A","explanation":"可行性研究报告批准后发包宜采用初步设计后清单模式。选A。"},{"id":241,"chapter":"第18章 工程总承包计价","kaodian":"","type":"multi","stem":"工程总承包计价在（ ）方面与工程量清单计价有所区别。","options":{"A":"投资控制目标","B":"建筑安装工程计价","C":"预备费","D":"基本计价方式","E":"计价过程"},"answer":"ABCD","explanation":"工程总承包计价在费用构成、清单编制、计量计价等方面与DBB不同。选ABCD。"},{"id":242,"chapter":"第18章 工程总承包计价","kaodian":"","type":"single","stem":"下列费用中不属于工程总承包其他费的是（ ）。","options":{"A":"工程总承包管理费","B":"施工勘察费","C":"设备购置费","D":"报批报建的代办服务费"},"answer":"C","explanation":"工程总承包其他费不含建设单位管理费（已含在建设管理费中）。选C。"},{"id":243,"chapter":"第18章 工程总承包计价","kaodian":"","type":"single","stem":"初步设计后清单编制中的第六级对应的是（ ）。","options":{"A":"单位工程分类码","B":"专业工程分类码","C":"扩大分部分类码","D":"扩大分项分类码"},"answer":"D","explanation":"初步设计后清单第六级对应分项工程。选D。"},{"id":244,"chapter":"第18章 工程总承包计价","kaodian":"考点2：工程总承包最高投标限价与投标报价编制★★","type":"single","stem":"工程总承包模式中，当发包人要求中明确设计方案但工程内容不确定、工程量不明确时，宜采用的合同价格形式是（ ）。","options":{"A":"固定总价合同","B":"固定单价合同","C":"可调单价合同","D":"成本加酬金合同"},"answer":"D","explanation":"总承包最高投标限价应依据发包人要求和初步设计文件编制。选D。"},{"id":245,"chapter":"第18章 工程总承包计价","kaodian":"考点4：工程总承包合同价款调整与索赔★★","type":"single","stem":"关于工程总承包合同变更的说法，正确的是（ ）。","options":{"A":"因发包人提出工程变更引起措施项目变化时，不予调整价款","B":"监理人发出变更指示一般无需征得发包人的同意","C":"变更指示通过监理人发出","D":"承包人可根据施工情况擅自变更，费用由发包人承担"},"answer":"C","explanation":"总承包变更估价原则：有适用项目的按适用价格，否则参照类似项目。选C。"},{"id":246,"chapter":"第18章 工程总承包计价","kaodian":"","type":"single","stem":"当合同中包含价格清单，履行期间出现工程变更，若变更在已标价工程量清单中无适用项目，但有类似项目 单价的。则变更估价的原则是（ ）。","options":{"A":"参照类似项目的费率或价格","B":"按照直接成本加适当利润的原则，由发包人确定变更单价","C":"按照合理的成本加利润的原则，由承包人确定变更工作的单价","D":"采用已标价工程量清单中的费率和价格"},"answer":"A","explanation":"变更无适用项目但有类似项目单价时，参照类似项目单价确定。选A。"},{"id":247,"chapter":"第19章 国际工程投标报价","kaodian":"","type":"single","stem":"下列投标人在国际工程标前会议上的做法，正确的是（ ）。","options":{"A":"对招标文件中图纸与技术说明矛盾之处，提出己方的修改意见","B":"提出对业主有利的设计方案修改意见","C":"详细阐述己方施工方案的优势和竞争力","D":"对工程内容范围不清的问题，请业主做出说明"},"answer":"D","explanation":"标前会议上应认真记录、澄清疑问、不轻易承诺修改。选D。"},{"id":248,"chapter":"第19章 国际工程投标报价","kaodian":"考点2：国际工程投标报价编制★★★","type":"single","stem":"国际工程投标报价组成中，下列属于现场管理费的是（ ）。","options":{"A":"工程辅助费","B":"检验试验费","C":"临时设施工程费","D":"工程保险费"},"answer":"B","explanation":"暂列金额是业主备用金，用于工程变更或不可预见情况。选B。"},{"id":249,"chapter":"第19章 国际工程投标报价","kaodian":"","type":"single","stem":"某国际工程，业主方在施工招标文件中暂定了500万元的 暂定金额，则承包商对该笔暂定金额的正确处理方式是（ ）。","options":{"A":"不计入投标总价，发生时由工程师决定是否使用","B":"计入投标总报价，并有权自主使用","C":"计入投标总报价，但无权决定自主使用","D":"不计入投标总价，在实际发生时由业主支付"},"answer":"C","explanation":"暂定金额只能按业主工程师的指示全部或部分使用。选C。"},{"id":250,"chapter":"第19章 国际工程投标报价","kaodian":"","type":"single","stem":"估价师根据以往实际经验获得有关资料，直接估算出分项工程中人工、材料的消耗量，从而估算出分项工程 的直接费单价，这种方法称为（ ）。","options":{"A":"经验估算法","B":"匡算估价法","C":"定额估价法","D":"作业估价法"},"answer":"B","explanation":"根据经验估算分项工程人工材料消耗量，属经验估算法。选B。"},{"id":251,"chapter":"第19章 国际工程投标报价","kaodian":"考点3：国际工程投标报价技巧★★★★","type":"single","stem":"根据国际工程投标报价策略，下列工程中宜采用低报价策略的是（ ）。","options":{"A":"工作简单且支付条件好的工程","B":"专业要求高且工期要求急的工程","C":"竞争对手少且施工条件差的工程","D":"技术复杂且投资规模大的工程"},"answer":"A","explanation":"报价可高一些的工程含施工条件差、专业要求高的等。选A。"},{"id":252,"chapter":"第19章 国际工程投标报价","kaodian":"","type":"multi","stem":"根据不平衡报价策略，下列说法正确的是（ ）。","options":{"A":"土石方工程、基础工程，可以报高价","B":"估计施工中工程量会增加的项目，可以报高价","C":"工程内容说明不清的项目，可以报高价","D":"能够早日结账收款的项目，可以报高价","E":"预计工程量可能减少的后期工程项目，可以报高价"},"answer":"ABD","explanation":"不平衡报价：先施工的报高价、工程量可能增加的报高价。选ABD。"},{"id":253,"chapter":"第19章 国际工程投标报价","kaodian":"","type":"single","stem":"关于工程量清单招标中计日工报价技巧的说法，正确的是（ ）。","options":{"A":"单纯对计日工报价应报低价","B":"招标文件中有名义工程量的计日工应报高价","C":"招标文件中有名义工程量的计日工应报低价","D":"单纯对计日工报价应报高价"},"answer":"D","explanation":"计日工报价：单价可适当报高（因按实结算量不固定）。选D。"},{"id":254,"chapter":"第19章 国际工程投标报价","kaodian":"","type":"single","stem":"国际工程项目招标中，如果业主规定了暂定工程量的分项内容和暂定总价款，且规定所有投标人都必须在总 报价中加入这笔固定金额，则投标人对该暂定工程的报价策略是（ ）。","options":{"A":"单价可适当降低","B":"总价应适当降低","C":"总价可适当提高","D":"单价可适当提高"},"answer":"D","explanation":"规定所有投标人必须加入固定金额的暂定工程，应适当提高单价（因量固定、价竞争）。选D。"},{"id":255,"chapter":"第13章 建设项目总投资构成及计算","type":"single","stem":"某施工材料采购原价为190元/吨，运杂费为40元/吨，运输损耗率为1%，采购保管费率为3%，则该材料的单价为（ ）元/吨。","options":{"A":"234.28","B":"237.66","C":"239.20","D":"239.27"},"answer":"D","explanation":"【逐项解析】材料单价=(材料原价+运杂费)×(1+运输损耗率)×(1+采购保管费率)=(190+40)×(1+1%)×(1+3%)=230×1.01×1.03=239.27元/吨。选D。公式顺序：原价+运费→乘以损耗系数→乘以保管费系数，不可颠倒。【法条依据】《建筑安装工程费用项目组成》(建标[2013]44号)。"},{"id":196,"chapter":"第16章 工程量清单计价","type":"single","stem":"招标方编制工程量清单时有以下工作：①确定项目编码；②确定清单项目名称；③确定计量单位；④计算工程数量；⑤确定项目特征。正确的顺序是（ ）。","options":{"A":"①②③④⑤","B":"①②⑤③④","C":"②③⑤④①","D":"②①⑤③④"},"answer":"D","explanation":"【逐项解析】工程量清单编制顺序：②确定清单项目名称→①确定项目编码→⑤确定项目特征→③确定计量单位→④计算工程数量。口诀：「名码特征单位量」→名(称)码(编码)特(征)单(位)量。选D。【法条依据】《建设工程工程量清单计价规范》GB50500。"}];
const res = { json: async () => QDATA };  // embedded data
  allQuestions = await res.json();
  document.getElementById('totalBadge').textContent = `题库 ${allQuestions.length} 题`;
  loadState();
  renderChapters();
  applyFilter();
}

// ── localStorage ──
const LS_KEY = 'jingji_quiz_state_v2';
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    answeredQ, mode, selChapter, autoNext
  }));
}
function loadState() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      answeredQ = s.answeredQ || {};
      mode = s.mode || 'seq';
      selChapter = s.selChapter || 'all';
      autoNext = s.autoNext || false;
      updateModeBtn();
      updateAutoNextBtn();
    } catch(e) {}
  }
}
function resetProgress() {
  if (confirm('确定要重置所有刷题进度？')) {
    answeredQ = {};
    notesQ = {};
    selChapter = 'all';
    saveState();
    renderChapters();
    applyFilter();
    renderQuestionList();
  }
}

// ── Notes ──
let notesQ = {};
const NOTES_KEY = 'jingji_quiz_notes_v2';

function loadNotes() {
  const raw = localStorage.getItem(NOTES_KEY);
  if (raw) try { notesQ = JSON.parse(raw); } catch(e) {}
}
loadNotes();

function saveNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notesQ));
}

function getNote(qid) {
  return notesQ[qid] || '';
}

function saveNote(qid) {
  const el = document.getElementById('noteInput');
  if (!el) return;
  const text = el.value.trim();
  if (text) {
    notesQ[qid] = text;
  } else {
    delete notesQ[qid];
  }
  saveNotes();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Chapters ──
function getChapters() {
  const set = new Set();
  allQuestions.forEach(q => set.add(q.chapter));
  return ['all', ...Array.from(set).sort((a,b) => {
    const na = parseInt(a.match(/\d+/)?.[0] || '0');
    const nb = parseInt(b.match(/\d+/)?.[0] || '0');
    return na - nb;
  })];
}

function renderChapters() {
  const chapters = getChapters();
  const bar = document.getElementById('chapterBar');
  bar.innerHTML = chapters.map(ch => {
    const cls = ch === selChapter ? 'ch-btn sel' : 'ch-btn';
    const label = ch === 'all' ? '全部' : ch.replace(/^第\d+章\s*/, '');
    return `<button class="${cls}" onclick="selectChapter('${ch}')">${label}</button>`;
  }).join('');
}

function selectChapter(ch) {
  selChapter = ch;
  saveState();
  renderChapters();
  applyFilter();
}

// ── Filter ──
function applyFilter() {
  if (selChapter === 'all') {
    filteredQuestions = [...allQuestions];
  } else {
    filteredQuestions = allQuestions.filter(q => q.chapter === selChapter);
  }
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Mode ──
function toggleMode() {
  mode = mode === 'seq' ? 'rand' : 'seq';
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateModeBtn();
  saveState();
  renderQuestion();
  renderQuestionList();
}

function updateModeBtn() {
  document.getElementById('btnMode').textContent = mode === 'seq' ? '顺序' : '随机';
  document.getElementById('btnMode').classList.toggle('active', mode === 'rand');
}

function toggleAutoNext() {
  autoNext = !autoNext;
  updateAutoNextBtn();
  saveState();
}
function toggleInfoPanel() {
  document.getElementById('infoPanel').classList.toggle('open');
}
function updateAutoNextBtn() {
  const btn = document.getElementById('btnAutoNext');
  if (autoNext) {
    btn.textContent = '🔁 自动下一题 ✓';
    btn.style.background = '#ecfdf5';
    btn.style.borderColor = '#10b981';
    btn.style.color = '#10b981';
  } else {
    btn.textContent = '🔁 自动下一题';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  }
}

function shuffleFiltered() {
  for (let i = filteredQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredQuestions[i], filteredQuestions[j]] = [filteredQuestions[j], filteredQuestions[i]];
  }
}

// ── Stats ──
function updateStats() {
  const total = filteredQuestions.length;
  const doneCount = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
  const wrongCount = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
  const remain = total - doneCount;

  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statAcc').textContent = doneCount > 0
    ? Math.round((doneCount - wrongCount) / doneCount * 100) + '%' : '-';
  document.getElementById('statRemain').textContent = remain;
  document.getElementById('progressPct').textContent = Math.round(doneCount / total * 100) + '%';
  document.getElementById('progressFill').style.width = (doneCount / total * 100) + '%';

  // Wrong book
  renderWrongBook();
}

// ── Render question ──
let multiSelected = new Set();  // For multi-select questions

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (filteredQuestions.length === 0) {
    area.innerHTML = '<div class="empty"><div class="icon">✨</div><p>该章节暂无题目</p></div>';
    return;
  }
  if (currentIdx >= filteredQuestions.length) {
    const total = filteredQuestions.length;
    const done = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
    const wrong = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
    area.innerHTML = `
      <div class="empty">
        <div class="icon">🎉</div>
        <p>全部刷完！</p>
        <p style="font-size:14px;color:var(--text2);margin-top:8px;">
          共 ${total} 题 | 错 ${wrong} 题 | 正确率 ${done>0 ? Math.round((done-wrong)/done*100) : 0}%
        </p>
        <button class="btn-next" style="margin-top:16px;" onclick="retryWrong()">复习错题</button>
      </div>`;
    return;
  }
  
  const q = filteredQuestions[currentIdx];
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  const isMulti = q.type === 'multi';
  multiSelected = new Set();

  const optKeys = ['A','B','C','D','E'];
  const options = q.options;
  
  let optHtml = '';
  for (const key of optKeys) {
    if (!options[key]) continue;
    let cls = 'opt-btn';
    let icon = '';
    if (answered) {
      cls += ' done';
      if (q.answer.includes(key)) cls += ' correct';
      else if (prevAns !== 'correct' && prevAns.includes(key)) cls += ' wrong';
      else cls += ' dim';
    } else if (isMulti) {
      icon = `<input type="checkbox" class="multi-cb" data-key="${key}" onchange="toggleMulti(this)" style="margin-right:6px;">`;
    }
    optHtml += `
      <div class="${cls}" onclick="${answered ? '' : (isMulti ? `toggleMultiClick('${key}')` : `answer('${key}')`)}">
        ${icon}<span class="opt-letter">${key}</span>
        <span>${options[key]}</span>
      </div>`;
  }

  area.innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span>第 ${currentIdx+1}/${filteredQuestions.length} 题</span>
        <span>${q.chapter}</span>
        ${q.kaodian ? `<span>${q.kaodian}</span>` : ''}
        <span style="background:${isMulti?'#fef3c7':'#eef0ff'};color:${isMulti?'#d97706':'#4361ee'};">${isMulti ? '多选' : '单选'}</span>
        ${prevAns === 'correct' ? '<span style="background:#ecfdf5;color:#10b981;">✓ 已答对</span>' : ''}
        ${prevAns && prevAns !== 'correct' ? `<span style="background:#fef2f2;color:#ef4444;">✗ 已答错 (${formatAnswer(prevAns)})</span>` : ''}
      </div>
      <div class="q-stem">${q.stem}</div>
      ${isMulti && !answered ? '<div style="font-size:12px;color:#d97706;margin-bottom:10px;">⚠ 多选题，请选择所有正确答案后点击"提交答案"</div>' : ''}
      <div class="q-options">${optHtml}</div>
      <div class="feedback ${answered ? 'show ' : ''}${prevAns === 'correct' ? 'correct' : prevAns ? 'wrong' : ''}" id="feedback">
        ${answered ? (prevAns === 'correct' ? '✓ 回答正确！' : `✗ 回答错误，正确答案是 ${formatAnswer(q.answer)}`) : ''}
        ${answered && q.explanation ? `<div style="margin-top:8px;padding:8px 10px;background:#fff;border-radius:6px;font-size:13px;color:#555;line-height:1.7;"><strong>📖 解析：</strong>${q.explanation}</div>` : ''}
      </div>
      ${answered ? `
      <div class="note-box show">
        ${getNote(q.id) ? `
        <div class="existing-note"><span class="note-icon">📝</span><span class="note-text">${escapeHtml(getNote(q.id))}</span></div>
        ` : ''}
        <textarea id="noteInput" placeholder="记一笔：为什么错 / 关键考点 / 记忆口诀..." onblur="saveNote(${q.id})">${escapeHtml(getNote(q.id) || '')}</textarea>
        <div class="note-hint">输入后自动保存</div>
      </div>
      ` : ''}
      <div class="actions">
        <button class="btn" onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>上一题</button>
        ${isMulti && !answered ? '<button class="btn-next" onclick="submitMulti()" id="btnSubmitMulti">提交答案</button>' : ''}
        <button class="btn-next" onclick="nextQuestion()">${answered ? '下一题' : '跳过'}</button>
      </div>
    </div>`;
}

function formatAnswer(ans) {
  return ans.length === 1 ? ans : ans.split('').join('、');
}

function toggleMulti(cb) {
  const key = cb.dataset.key;
  if (cb.checked) multiSelected.add(key);
  else multiSelected.delete(key);
}

function toggleMultiClick(key) {
  const cb = document.querySelector(`.multi-cb[data-key="${key}"]`);
  if (cb) { cb.checked = !cb.checked; toggleMulti(cb); }
}

function answer(letter) {
  const q = filteredQuestions[currentIdx];
  const correct = q.type === 'multi'
    ? letter.split('').sort().join('') === q.answer.split('').sort().join('')
    : letter === q.answer;
  answeredQ[q.id] = correct ? 'correct' : letter;
  saveState();
  updateStats();
  renderQuestion();
  renderQuestionList();
  if (autoNext && correct && currentIdx < filteredQuestions.length - 1) {
    setTimeout(() => { currentIdx++; renderQuestion(); renderQuestionList(); document.getElementById('questionArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 700);
  }
}

function submitMulti() {
  if (multiSelected.size === 0) return;
  const selected = Array.from(multiSelected).sort().join('');
  answer(selected);
}

function prevQuestion() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); renderQuestionList(); }
}

function nextQuestion() {
  if (currentIdx < filteredQuestions.length - 1) {
    currentIdx++;
    renderQuestion(); renderQuestionList();
  } else {
    currentIdx = filteredQuestions.length;
    renderQuestion(); renderQuestionList();
  }
}

function retryWrong() {
  const wrongIds = new Set();
  for (const [id, ans] of Object.entries(answeredQ)) {
    if (ans !== 'correct') wrongIds.add(parseInt(id));
  }
  if (wrongIds.size === 0) {
    alert('没有错题，全部正确！');
    return;
  }
  filteredQuestions = allQuestions.filter(q => wrongIds.has(q.id));
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Wrong book ──
function renderWrongBook() {
  const wrongQs = [];
  for (const q of allQuestions) {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  }
  
  const book = document.getElementById('wrongBook');
  const list = document.getElementById('wrongList');
  
  if (wrongQs.length === 0) {
    book.style.display = 'none';
    return;
  }
  
  book.style.display = 'block';
  document.getElementById('wrongCount').textContent = `(${wrongQs.length} 题)`;
  
  list.innerHTML = wrongQs.map(wq => `
    <div class="wrong-item" onclick="jumpToQuestion(${wq.id})">
      <div class="q-text">${wq.stem.substring(0, 80)}...</div>
      <div class="q-meta-small">
        <span>${wq.chapter}</span> |
        你的答案: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
        正确答案: <span class="ans">${formatAnswer(wq.answer)}</span>
      </div>
    </div>
  `).join('');
}

function jumpToQuestion(qid) {
  selChapter = 'all';
  filteredQuestions = [...allQuestions];
  if (mode === 'rand') shuffleFiltered();
  const idx = filteredQuestions.findIndex(q => q.id === qid);
  if (idx >= 0) {
    currentIdx = idx;
    renderChapters();
    updateStats();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── Analysis ──
function showAnalysis() {
  // Build chapter stats
  const chStats = {};
  allQuestions.forEach(q => {
    if (!chStats[q.chapter]) chStats[q.chapter] = { total: 0, done: 0, wrong: 0 };
    chStats[q.chapter].total++;
    const ans = answeredQ[q.id];
    if (ans !== undefined) {
      chStats[q.chapter].done++;
      if (ans !== 'correct') chStats[q.chapter].wrong++;
    }
  });

  // Sort by accuracy (worst first)
  const chapters = Object.entries(chStats)
    .filter(([_, s]) => s.done > 0)
    .map(([name, s]) => ({
      name: name.replace(/^第\d+章\s*/, ''),
      fullName: name,
      ...s,
      acc: s.done > 0 ? Math.round((s.done - s.wrong) / s.done * 100) : 0
    }))
    .sort((a, b) => a.acc - b.acc);

  const overallDone = Object.values(chStats).reduce((s, c) => s + c.done, 0);
  const overallWrong = Object.values(chStats).reduce((s, c) => s + c.wrong, 0);
  const overallAcc = overallDone > 0 ? Math.round((overallDone - overallWrong) / overallDone * 100) : 0;

  if (overallDone === 0) {
    document.getElementById('analysisContent').innerHTML = '<p style="color:#888;padding:20px 0;">还没有刷题记录，先刷几题再来分析吧 ✨</p>';
    document.getElementById('analysisModal').classList.add('show');
    return;
  }

  // Build most-wrong questions
  const wrongQs = [];
  allQuestions.forEach(q => {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  });
  wrongQs.sort((a, b) => {
    const ca = (answeredQ[a.id] && answeredQ[a.id] !== 'correct' ? 1 : 0);
    const cb = (answeredQ[b.id] && answeredQ[b.id] !== 'correct' ? 1 : 0);
    return cb - ca;
  });

  // Recommendations
  const recs = [];
  chapters.forEach(ch => {
    if (ch.done < 3) return;
    if (ch.acc < 50) recs.push({ level: 'high', text: `「${ch.name}」正确率仅 ${ch.acc}%，需重点攻克，建议回看讲义原文`, ch });
    else if (ch.acc < 70) recs.push({ level: 'medium', text: `「${ch.name}」正确率 ${ch.acc}%，加强专项练习`, ch });
  });
  const untouched = Object.entries(chStats).filter(([_, s]) => s.done === 0);
  untouched.forEach(([name, s]) => {
    recs.push({ level: 'medium', text: `「${name.replace(/^第\d+章\s*/, '')}」尚未刷过，安排时间过一遍`, ch: null });
  });

  let html = `
    <div class="analysis-section">
      <h3>📈 总体正确率: <b style="color:${overallAcc>=70?'var(--correct)':overallAcc>=50?'#f59e0b':'var(--wrong)'}">${overallAcc}%</b> (${overallDone - overallWrong}/${overallDone})</h3>
    </div>
    <div class="analysis-section">
      <h3>📊 章节正确率排序（低到高）</h3>
      <div class="chapter-bar-chart">
  `;

  chapters.forEach(ch => {
    const level = ch.acc < 50 ? 'weak' : ch.acc < 70 ? 'medium' : 'strong';
    html += `
      <div class="cb-row">
        <div class="cb-label">${ch.name}</div>
        <div class="cb-track"><div class="cb-fill ${level}" style="width:${ch.acc}%"></div></div>
        <div class="cb-val">${ch.acc}% <span style="font-weight:normal;color:#999;">(${ch.done - ch.wrong}/${ch.done})</span></div>
      </div>`;
  });

  html += `</div></div>`;

  // Recommendations
  if (recs.length > 0) {
    html += `<div class="analysis-section"><h3>💡 备考建议</h3>`;
    recs.forEach(r => {
      html += `<div class="rec-card ${r.level}"><div class="rec-title">${r.level === 'high' ? '🔴 优先' : r.level === 'medium' ? '🟡 关注' : '🟢 保持'}</div>${r.text}</div>`;
    });
    html += `</div>`;
  }

  // Top wrong questions
  if (wrongQs.length > 0) {
    html += `<div class="analysis-section"><h3>⚠️ 高频错题 (Top 5)</h3>`;
    wrongQs.slice(0, 5).forEach(wq => {
      html += `<div class="wrong-item" onclick="jumpToQuestion(${wq.id});hideAnalysis()">
        <div class="q-text">${wq.stem.substring(0, 60)}...</div>
        <div class="q-meta-small">
          你的: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
          正确: <span class="ans">${formatAnswer(wq.answer)}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('analysisContent').innerHTML = html;
  document.getElementById('analysisModal').classList.add('show');
}

function hideAnalysis() {
  document.getElementById('analysisModal').classList.remove('show');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  const q = filteredQuestions.length > 0 && currentIdx < filteredQuestions.length
    ? filteredQuestions[currentIdx] : null;
  if (!q) return;
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  
  if (!answered && q.type === 'single' && ['a','b','c','d'].includes(e.key.toLowerCase())) {
    const letter = e.key.toUpperCase();
    if (q.options[letter]) answer(letter);
  }
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight' || e.key === ' ') nextQuestion();
});

// ── Start ──
load();

// ── Question list sidebar ──
function renderQuestionList() {
  const container = document.getElementById('qNums');
  if (!container) return;
  let html = '';
  for (let i = 0; i < filteredQuestions.length; i++) {
    const q = filteredQuestions[i];
    const status = answeredQ[q.id];
    let cls = 'q-num';
    if (i === currentIdx) cls += ' current';
    if (status === 'correct') cls += ' correct';
    else if (status) cls += ' wrong';
    html += `<div class="${cls}" onclick="jumpToQuestion(${i})" title="第${i+1}题">${i+1}</div>`;
  }
  container.innerHTML = html;
  // Update total count
  const totalEl = document.querySelector('.sidebar-title .total');
  if (totalEl) totalEl.textContent = `${filteredQuestions.length}题`;
  // Scroll current into view
  const currentEl = container.querySelector('.current');
  if (currentEl) {
    currentEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function jumpToQuestion(idx) {
  if (idx >= 0 && idx < filteredQuestions.length) {
    currentIdx = idx;
    renderQuestion();
    renderQuestionList();
  }
}

</script>
