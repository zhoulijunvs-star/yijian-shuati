m": "根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释(一)》， 当事人对建设工程开工日期有争议的，人民法院通常认定的开工日期为( )", "options": {"A": "发包人或者监理人发出的开工通知载明的开工日期", "B": "开工通知发出后，尚不具备开工条件的，以开工条件具备的时间为开工日期", "C": "承包人经发包人同意已经实际进场施工的，以实际进场施工时间为开工日期", "D": "因承包人原因导致开工时间推迟的，以开工通知载明的时间为开工日期", "E": "监理人未发出开工通知，应当以开工报告日期认定为开工日期"}, "answer": "ABCD", "explanation": ""}, {"id": 914, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "multi", "stem": "根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释(一)》 ，发包人或监理人未发出开工通知且无相关证据证明工程实际开日期的，认定开工日期时， 应结合是否具备开工条件事实综合考虑( )所载明的时间。", "options": {"A": "索赔报告", "B": "施工合同", "C": "施工许可证", "D": "开工报告", "E": "竣工验收报告"}, "answer": "BCDE", "explanation": ""}, {"id": 915, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "multi", "stem": "根据《最高人民法院关于审理建设工程施工合同纠纷案件适用法律问题的解释(一)》， 当事人对实际竣工日期有争议的，人民法院通常认定( )。 建造师金月 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸", "options": {"A": "建设工程经竣工验收合格的，以竣工验收合格之日为竣工日期", "B": "承包人已经提交竣工验收报告，发包人拖延验收的，以承包人提交验收报告之日为竣工日 期", "C": "建设工程未经竣工验收，发包人擅自使用的，以转移占有建设工程之日为竣工日期", "D": "建设工程未经竣工验收的部分，发包人擅自使用的，以开始使用之日为竣工日期", "E": "承包人已提交竣工验收报告，发包人验收认为不通过的，以承包人再次提交验收报告之日 为竣工日期"}, "answer": "ABC", "explanation": ""}, {"id": 916, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "single", "stem": "关于工程量及价款争议的解决说法中正确的是( )", "options": {"A": "当事人对垫资利息没有约定按照同期同类贷款利率或者同期贷款市场报价利率计息", "B": "垫资利息有约定，承包人请求按照约定返还垫资及其利息的，人民法院应予支持", "C": "当事人对该部分工程价款不能协商一致的，可以参照施工时当地建设行政主管部门发布的 计价标准或者计价方法结算工程价款", "D": "建设工程已实际交付的，计息日为提交竣工结算文件之日"}, "answer": "B", "explanation": ""}, {"id": 917, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "single", "stem": "工程总承包招标文件中没有而施工招标文件中有的文件是( )", "options": {"A": "合同协议书", "B": "图纸", "C": "发包人要求", "D": "中标通知书"}, "answer": "B", "explanation": ""}, {"id": 918, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》,“承包人建议书”应包括的内容有( )。", "options": {"A": "工程设备方案说明", "B": "功能要求", "C": "工程量清单", "D": "分包方案", "E": "对发包人要求中错误的说明"}, "answer": "ADE", "explanation": ""}, {"id": 919, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "single", "stem": "工程总承包合同订立时，需要明确承包人文件，下列说法正确的是( )", "options": {"A": "承包人文件中，最主要的是施工文件", "B": "专用合同条款需约定监理人对承包人提交文件应批准的合理期限", "C": "通用合同条款需约定承包人向监理人陆续提供文件的内容", "D": "监理人未在约定的期限内提出否定意见，承包人应书面通知监理人尽快提 出意见，以便进行后续工作"}, "answer": "B", "explanation": ""}, {"id": 920, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "single", "stem": "根据《标准设计施工总承包招标文件》，“发包人要求”中出现错误或违法情况时，下 列说法正确的是( )。", "options": {"A": "承包人复核时发现对工程的工艺安排的错误，应及时致电通知发包人，要求发包人修改", "B": "发包人对“发包人要求”中错误的修改，按变更对待", "C": "选择无条件补偿条款时，承包人复核时未发现发包人要求中存在错误的，承包人自行承担 由此导致增加的费用", "D": "选择有条件补偿条款时，承包人复核时未发现发包人要求中存在错误的，发包人承担由此 导致增加的费用"}, "answer": "B", "explanation": ""}, {"id": 921, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "single", "stem": "根据《标准设计施工总承包招标文件》，下列关于竣工后试验的说法，正确的是( )", "options": {"A": "竣工后试验是指工程竣工移交后任意时间，对工程的各项功能技术指标是否达到合同规定 要求而进行的试验", "B": "试验所必需的电力、设备、燃料、仪器、劳动力、材料等由发包人提供 建造师金月 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸 上岸", "C": "发包人负责竣工后试验，可派遣具有适当资质和经验的工作人员自行按照操作和维修手册 进行竣工后试验", "D": "承包人负责竣工后试验，应提供竣工后试验所需要的所有其他设备、仪器派遣有资格和经 验的工作人员自行进行竣工后试验"}, "answer": "B", "explanation": ""}, {"id": 922, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》，下列说法正确的有( )。", "options": {"A": "因发包人原因造成监理人未能在合同签订之日起60 天内发出开工通知，承包人有权提出 价格调整要求，或者解除合同", "B": "价格清单列出的任何数量为实际的工程量", "C": "承包人应在收到经监理人批复的合同进度计划后14 天内， 将支付分解报告以及形成支付分解报告的支持性资料报监理人审批", "D": "已签发区段工程验收证书的区段工程由发包人负责照管", "E": "监理人获得发包人同意后，应提前7 天向承包人发出开始工作通知"}, "answer": "DE", "explanation": ""}, {"id": 923, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》，关于竣工试验的说法，正确的有( )。", "options": {"A": "承包人应在竣工试验中进行适当的检查和功能性试验", "B": "承包人应提前14 天将申请竣工试验通知送达监理人", "C": "监理人应在接到竣工试验通知后21 天内确定竣工试验时间", "D": "除专用合同条款另有约定外，竣工试验应按三阶段进行", "E": "承包人应在竣工试验前提交竣工记录、正式操作和维修手册"}, "answer": "AD", "explanation": ""}, {"id": 924, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "金点题·金月", "type": "single", "stem": "根据《建设工程施工专业分包合同(示范文本)》，除分包人投标函及报价书外，解释 顺序排在“专用合同条款”之前的合同 // ── localStorage ──
const LS_KEY = 'guanli_quiz_state_v2';
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    answeredQ, mode, selChapter, autoNext
  }));
}
function loadState() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      answeredQ = s.answeredQ || {};
      mode = s.mode || 'seq';
      selChapter = s.selChapter || 'all';
      autoNext = s.autoNext || false;
      updateModeBtn();
      updateAutoNextBtn();
    } catch(e) {}
  }
}
function resetProgress() {
  if (confirm('确定要重置所有刷题进度？')) {
    answeredQ = {};
    notesQ = {};
    selChapter = 'all';
    saveState();
    renderChapters();
    applyFilter();
    renderQuestionList();
  }
}

// ── Notes ──
let notesQ = {};
const NOTES_KEY = 'guanli_quiz_notes_v2';

function loadNotes() {
  const raw = localStorage.getItem(NOTES_KEY);
  if (raw) try { notesQ = JSON.parse(raw); } catch(e) {}
}
loadNotes();

function saveNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notesQ));
}

function getNote(qid) {
  return notesQ[qid] || '';
}

function saveNote(qid) {
  const el = document.getElementById('noteInput');
  if (!el) return;
  const text = el.value.trim();
  if (text) {
    notesQ[qid] = text;
  } else {
    delete notesQ[qid];
  }
  saveNotes();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Chapters ──
function getChapters() {
  const set = new Set();
  allQuestions.forEach(q => set.add(q.chapter));
  return ['all', ...Array.from(set).sort((a,b) => {
    const na = parseInt(a.match(/\d+/)?.[0] || '0');
    const nb = parseInt(b.match(/\d+/)?.[0] || '0');
    return na - nb;
  })];
}

function renderChapters() {
  const chapters = getChapters();
  const bar = document.getElementById('chapterBar');
  bar.innerHTML = chapters.map(ch => {
    const cls = ch === selChapter ? 'ch-btn sel' : 'ch-btn';
    const label = ch === 'all' ? '全部' : ch.replace(/^第\d+章\s*/, '');
    return `<button class="${cls}" onclick="selectChapter('${ch}')">${label}</button>`;
  }).join('');
}

function selectChapter(ch) {
  selChapter = ch;
  saveState();
  renderChapters();
  applyFilter();
}

// ── Filter ──
function applyFilter() {
  if (selChapter === 'all') {
    filteredQuestions = [...allQuestions];
  } else {
    filteredQuestions = allQuestions.filter(q => q.chapter === selChapter);
  }
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Mode ──
function toggleMode() {
  mode = mode === 'seq' ? 'rand' : 'seq';
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateModeBtn();
  saveState();
  renderQuestion();
  renderQuestionList();
}

function updateModeBtn() {
  document.getElementById('btnMode').textContent = mode === 'seq' ? '顺序' : '随机';
  document.getElementById('btnMode').classList.toggle('active', mode === 'rand');
}

function toggleAutoNext() {
  autoNext = !autoNext;
  updateAutoNextBtn();
  saveState();
}
function toggleInfoPanel() {
  document.getElementById('infoPanel').classList.toggle('open');
}
function updateAutoNextBtn() {
  const btn = document.getElementById('btnAutoNext');
  if (autoNext) {
    btn.textContent = '🔁 自动下一题 ✓';
    btn.style.background = '#ecfdf5';
    btn.style.borderColor = '#10b981';
    btn.style.color = '#10b981';
  } else {
    btn.textContent = '🔁 自动下一题';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  }
}

function shuffleFiltered() {
  for (let i = filteredQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredQuestions[i], filteredQuestions[j]] = [filteredQuestions[j], filteredQuestions[i]];
  }
}

// ── Stats ──
function updateStats() {
  const total = filteredQuestions.length;
  const doneCount = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
  const wrongCount = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
  const remain = total - doneCount;

  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statAcc').textContent = doneCount > 0
    ? Math.round((doneCount - wrongCount) / doneCount * 100) + '%' : '-';
  document.getElementById('statRemain').textContent = remain;
  document.getElementById('progressPct').textContent = Math.round(doneCount / total * 100) + '%';
  document.getElementById('progressFill').style.width = (doneCount / total * 100) + '%';

  // Wrong book
  renderWrongBook();
}

// ── Render question ──
let multiSelected = new Set();  // For multi-select questions

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (filteredQuestions.length === 0) {
    area.innerHTML = '<div class="empty"><div class="icon">✨</div><p>该章节暂无题目</p></div>';
    return;
  }
  if (currentIdx >= filteredQuestions.length) {
    const total = filteredQuestions.length;
    const done = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
    const wrong = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
    area.innerHTML = `
      <div class="empty">
        <div class="icon">🎉</div>
        <p>全部刷完！</p>
        <p style="font-size:14px;color:var(--text2);margin-top:8px;">
          共 ${total} 题 | 错 ${wrong} 题 | 正确率 ${done>0 ? Math.round((done-wrong)/done*100) : 0}%
        </p>
        <button class="btn-next" style="margin-top:16px;" onclick="retryWrong()">复习错题</button>
      </div>`;
    return;
  }
  
  const q = filteredQuestions[currentIdx];
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  const isMulti = q.type === 'multi';
  multiSelected = new Set();

  const optKeys = ['A','B','C','D','E'];
  const options = q.options;
  
  let optHtml = '';
  for (const key of optKeys) {
    if (!options[key]) continue;
    let cls = 'opt-btn';
    let icon = '';
    if (answered) {
      cls += ' done';
      if (q.answer.includes(key)) cls += ' correct';
      else if (prevAns !== 'correct' && prevAns.includes(key)) cls += ' wrong';
      else cls += ' dim';
    } else if (isMulti) {
      icon = `<input type="checkbox" class="multi-cb" data-key="${key}" onchange="toggleMulti(this)" style="margin-right:6px;">`;
    }
    optHtml += `
      <div class="${cls}" onclick="${answered ? '' : (isMulti ? `toggleMultiClick('${key}')` : `answer('${key}')`)}">
        ${icon}<span class="opt-letter">${key}</span>
        <span>${options[key]}</span>
      </div>`;
  }

  area.innerHTML = `
    <div class="q-card">
      <div class="q-meta">
        <span>第 ${currentIdx+1}/${filteredQuestions.length} 题</span>
        <span>${q.chapter}</span>
        ${q.kaodian ? `<span>${q.kaodian}</span>` : ''}
        <span style="background:${isMulti?'#fef3c7':'#eef0ff'};color:${isMulti?'#d97706':'#4361ee'};">${isMulti ? '多选' : '单选'}</span>
        ${prevAns === 'correct' ? '<span style="background:#ecfdf5;color:#10b981;">✓ 已答对</span>' : ''}
        ${prevAns && prevAns !== 'correct' ? `<span style="background:#fef2f2;color:#ef4444;">✗ 已答错 (${formatAnswer(prevAns)})</span>` : ''}
      </div>
      <div class="q-stem">${q.stem}</div>
      ${isMulti && !answered ? '<div style="font-size:12px;color:#d97706;margin-bottom:10px;">⚠ 多选题，请选择所有正确答案后点击"提交答案"</div>' : ''}
      <div class="q-options">${optHtml}</div>
      <div class="feedback ${answered ? 'show ' : ''}${prevAns === 'correct' ? 'correct' : prevAns ? 'wrong' : ''}" id="feedback">
        ${answered ? (prevAns === 'correct' ? '✓ 回答正确！' : `✗ 回答错误，正确答案是 ${formatAnswer(q.answer)}`) : ''}
        ${answered && q.explanation ? `<div style="margin-top:8px;padding:8px 10px;background:#fff;border-radius:6px;font-size:13px;color:#555;line-height:1.7;"><strong>📖 解析：</strong>${q.explanation}</div>` : ''}
      </div>
      ${answered ? `
      <div class="note-box show">
        ${getNote(q.id) ? `
        <div class="existing-note"><span class="note-icon">📝</span><span class="note-text">${escapeHtml(getNote(q.id))}</span></div>
        ` : ''}
        <textarea id="noteInput" placeholder="记一笔：为什么错 / 关键考点 / 记忆口诀..." onblur="saveNote(${q.id})">${escapeHtml(getNote(q.id) || '')}</textarea>
        <div class="note-hint">输入后自动保存</div>
      </div>
      ` : ''}
      <div class="actions">
        <button class="btn" onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>上一题</button>
        ${isMulti && !answered ? '<button class="btn-next" onclick="submitMulti()" id="btnSubmitMulti">提交答案</button>' : ''}
        <button class="btn-next" onclick="nextQuestion()">${answered ? '下一题' : '跳过'}</button>
      </div>
    </div>`;
}

function formatAnswer(ans) {
  return ans.length === 1 ? ans : ans.split('').join('、');
}

function toggleMulti(cb) {
  const key = cb.dataset.key;
  if (cb.checked) multiSelected.add(key);
  else multiSelected.delete(key);
}

function toggleMultiClick(key) {
  const cb = document.querySelector(`.multi-cb[data-key="${key}"]`);
  if (cb) { cb.checked = !cb.checked; toggleMulti(cb); }
}

function answer(letter) {
  const q = filteredQuestions[currentIdx];
  const correct = q.type === 'multi'
    ? letter.split('').sort().join('') === q.answer.split('').sort().join('')
    : letter === q.answer;
  answeredQ[q.id] = correct ? 'correct' : letter;
  saveState();
  updateStats();
  renderQuestion();
  renderQuestionList();
  if (autoNext && correct && currentIdx < filteredQuestions.length - 1) {
    setTimeout(() => { currentIdx++; renderQuestion(); renderQuestionList(); document.getElementById('questionArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 700);
  }
}

function submitMulti() {
  if (multiSelected.size === 0) return;
  const selected = Array.from(multiSelected).sort().join('');
  answer(selected);
}

function prevQuestion() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); renderQuestionList(); }
}

function nextQuestion() {
  if (currentIdx < filteredQuestions.length - 1) {
    currentIdx++;
    renderQuestion(); renderQuestionList();
  } else {
    currentIdx = filteredQuestions.length;
    renderQuestion(); renderQuestionList();
  }
}

function retryWrong() {
  const wrongIds = new Set();
  for (const [id, ans] of Object.entries(answeredQ)) {
    if (ans !== 'correct') wrongIds.add(parseInt(id));
  }
  if (wrongIds.size === 0) {
    alert('没有错题，全部正确！');
    return;
  }
  filteredQuestions = allQuestions.filter(q => wrongIds.has(q.id));
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Wrong book ──
function renderWrongBook() {
  const wrongQs = [];
  for (const q of allQuestions) {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  }
  
  const book = document.getElementById('wrongBook');
  const list = document.getElementById('wrongList');
  
  if (wrongQs.length === 0) {
    book.style.display = 'none';
    return;
  }
  
  book.style.display = 'block';
  document.getElementById('wrongCount').textContent = `(${wrongQs.length} 题)`;
  
  list.innerHTML = wrongQs.map(wq => `
    <div class="wrong-item" onclick="jumpToQuestion(${wq.id})">
      <div class="q-text">${wq.stem.substring(0, 80)}...</div>
      <div class="q-meta-small">
        <span>${wq.chapter}</span> |
        你的答案: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
        正确答案: <span class="ans">${formatAnswer(wq.answer)}</span>
      </div>
    </div>
  `).join('');
}

function jumpToQuestion(qid) {
  selChapter = 'all';
  filteredQuestions = [...allQuestions];
  if (mode === 'rand') shuffleFiltered();
  const idx = filteredQuestions.findIndex(q => q.id === qid);
  if (idx >= 0) {
    currentIdx = idx;
    renderChapters();
    updateStats();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── Analysis ──
function showAnalysis() {
  // Build chapter stats
  const chStats = {};
  allQuestions.forEach(q => {
    if (!chStats[q.chapter]) chStats[q.chapter] = { total: 0, done: 0, wrong: 0 };
    chStats[q.chapter].total++;
    const ans = answeredQ[q.id];
    if (ans !== undefined) {
      chStats[q.chapter].done++;
      if (ans !== 'correct') chStats[q.chapter].wrong++;
    }
  });

  // Sort by accuracy (worst first)
  const chapters = Object.entries(chStats)
    .filter(([_, s]) => s.done > 0)
    .map(([name, s]) => ({
      name: name.replace(/^第\d+章\s*/, ''),
      fullName: name,
      ...s,
      acc: s.done > 0 ? Math.round((s.done - s.wrong) / s.done * 100) : 0
    }))
    .sort((a, b) => a.acc - b.acc);

  const overallDone = Object.values(chStats).reduce((s, c) => s + c.done, 0);
  const overallWrong = Object.values(chStats).reduce((s, c) => s + c.wrong, 0);
  const overallAcc = overallDone > 0 ? Math.round((overallDone - overallWrong) / overallDone * 100) : 0;

  if (overallDone === 0) {
    document.getElementById('analysisContent').innerHTML = '<p style="color:#888;padding:20px 0;">还没有刷题记录，先刷几题再来分析吧 ✨</p>';
    document.getElementById('analysisModal').classList.add('show');
    return;
  }

  // Build most-wrong questions
  const wrongQs = [];
  allQuestions.forEach(q => {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  });
  wrongQs.sort((a, b) => {
    const ca = (answeredQ[a.id] && answeredQ[a.id] !== 'correct' ? 1 : 0);
    const cb = (answeredQ[b.id] && answeredQ[b.id] !== 'correct' ? 1 : 0);
    return cb - ca;
  });

  // Recommendations
  const recs = [];
  chapters.forEach(ch => {
    if (ch.done < 3) return;
    if (ch.acc < 50) recs.push({ level: 'high', text: `「${ch.name}」正确率仅 ${ch.acc}%，需重点攻克，建议回看讲义原文`, ch });
    else if (ch.acc < 70) recs.push({ level: 'medium', text: `「${ch.name}」正确率 ${ch.acc}%，加强专项练习`, ch });
  });
  const untouched = Object.entries(chStats).filter(([_, s]) => s.done === 0);
  untouched.forEach(([name, s]) => {
    recs.push({ level: 'medium', text: `「${name.replace(/^第\d+章\s*/, '')}」尚未刷过，安排时间过一遍`, ch: null });
  });

  let html = `
    <div class="analysis-section">
      <h3>📈 总体正确率: <b style="color:${overallAcc>=70?'var(--correct)':overallAcc>=50?'#f59e0b':'var(--wrong)'}">${overallAcc}%</b> (${overallDone - overallWrong}/${overallDone})</h3>
    </div>
    <div class="analysis-section">
      <h3>📊 章节正确率排序（低到高）</h3>
      <div class="chapter-bar-chart">
  `;

  chapters.forEach(ch => {
    const level = ch.acc < 50 ? 'weak' : ch.acc < 70 ? 'medium' : 'strong';
    html += `
      <div class="cb-row">
        <div class="cb-label">${ch.name}</div>
        <div class="cb-track"><div class="cb-fill ${level}" style="width:${ch.acc}%"></div></div>
        <div class="cb-val">${ch.acc}% <span style="font-weight:normal;color:#999;">(${ch.done - ch.wrong}/${ch.done})</span></div>
      </div>`;
  });

  html += `</div></div>`;

  // Recommendations
  if (recs.length > 0) {
    html += `<div class="analysis-section"><h3>💡 备考建议</h3>`;
    recs.forEach(r => {
      html += `<div class="rec-card ${r.level}"><div class="rec-title">${r.level === 'high' ? '🔴 优先' : r.level === 'medium' ? '🟡 关注' : '🟢 保持'}</div>${r.text}</div>`;
    });
    html += `</div>`;
  }

  // Top wrong questions
  if (wrongQs.length > 0) {
    html += `<div class="analysis-section"><h3>⚠️ 高频错题 (Top 5)</h3>`;
    wrongQs.slice(0, 5).forEach(wq => {
      html += `<div class="wrong-item" onclick="jumpToQuestion(${wq.id});hideAnalysis()">
        <div class="q-text">${wq.stem.substring(0, 60)}...</div>
        <div class="q-meta-small">
          你的: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
          正确: <span class="ans">${formatAnswer(wq.answer)}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('analysisContent').innerHTML = html;
  document.getElementById('analysisModal').classList.add('show');
}

function hideAnalysis() {
  document.getElementById('analysisModal').classList.remove('show');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  const q = filteredQuestions.length > 0 && currentIdx < filteredQuestions.length
    ? filteredQuestions[currentIdx] : null;
  if (!q) return;
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  
  if (!answered && q.type === 'single' && ['a','b','c','d'].includes(e.key.toLowerCase())) {
    const letter = e.key.toUpperCase();
    if (q.options[letter]) answer(letter);
  }
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight' || e.key === ' ') nextQuestion();
});

// ── Start ──
load();

// ── Question list sidebar ──
function renderQuestionList() {
  const container = document.getElementById('qNums');
  if (!container) return;
  let html = '';
  for (let i = 0; i < filteredQuestions.length; i++) {
    const q = filteredQuestions[i];
    const status = answeredQ[q.id];
    let cls = 'q-num';
    if (i === currentIdx) cls += ' current';
    if (status === 'correct') cls += ' correct';
    else if (status) cls += ' wrong';
    html += `<div class="${cls}" onclick="jumpToQuestion(${i})" title="第${i+1}题">${i+1}</div>`;
  }
  container.innerHTML = html;
  // Update total count
  const totalEl = document.querySelector('.sidebar-title .total');
  if (totalEl) totalEl.textContent = `${filteredQuestions.length}题`;
  // Scroll current into view
  const currentEl = container.querySelector('.current');
  if (currentEl) {
    currentEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function jumpToQuestion(idx) {
  if (idx >= 0 && idx < filteredQuestions.length) {
    currentIdx = idx;
    renderQuestion();
    renderQuestionList();
  }
}

</script>
