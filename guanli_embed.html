<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一建管理 · 刷题(1475题)</title>
<style>
:root {
  --bg: #f5f6fa;
  --card: #fff;
  --text: #1a1a2e;
  --text2: #555;
  --border: #e0e3eb;
  --primary: #4361ee;
  --primary-light: #eef0ff;
  --correct: #10b981;
  --correct-bg: #ecfdf5;
  --wrong: #ef4444;
  --wrong-bg: #fef2f2;
  --tag-bg: #f0f1f7;
  --progress-bg: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
/* ── Top bar ── */
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.topbar h1 { font-size: 18px; font-weight: 700; }
.topbar-right { display: flex; gap: 12px; align-items: center; }
.topbar-right .badge {
  font-size: 13px; color: var(--text2);
  background: var(--tag-bg); padding: 4px 10px; border-radius: 6px;
}
.btn {
  padding: 6px 16px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); font-size: 13px; cursor: pointer; color: var(--text);
  transition: all .15s;
}
.btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
/* ── Layout ── */
.app { max-width: 800px; margin: 0 auto; padding: 20px; }
/* ── Chapter selector ── */
.chapter-bar {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
}
.chapter-bar .ch-btn {
  font-size: 12px; padding: 5px 10px; border: 1px solid var(--border);
  border-radius: 16px; cursor: pointer; background: var(--card); color: var(--text2);
  transition: all .15s; white-space: nowrap;
}
.chapter-bar .ch-btn:hover { border-color: var(--primary); color: var(--primary); }
.chapter-bar .ch-btn.sel { background: var(--primary); color: #fff; border-color: var(--primary); }
/* ── Stats row ── */
.stats-row {
  display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.stat-card {
  flex: 1; min-width: 100px; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; text-align: center;
}
.stat-card .val { font-size: 28px; font-weight: 700; }
.stat-card .lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }
.stat-card.wrong .val { color: var(--wrong); }
.stat-card.acc .val { color: var(--correct); }
/* ── Progress ── */
.progress-wrap { margin-bottom: 20px; }
.progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.progress-bar { height: 6px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
/* ── Question card ── */
.q-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
}
.q-meta {
  font-size: 12px; color: var(--text2); margin-bottom: 12px;
  display: flex; gap: 10px; flex-wrap: wrap;
}
.q-meta span {
  background: var(--tag-bg); padding: 2px 8px; border-radius: 4px;
}
.q-stem {
  font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.7;
}
.q-options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border: 2px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all .2s;
  background: var(--card); text-align: left; font-size: 14px;
  line-height: 1.5;
}
.opt-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.opt-btn .multi-cb { width: 16px; height: 16px; accent-color: var(--primary); flex-shrink: 0; }
.opt-btn .opt-letter {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--tag-bg); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.opt-btn.correct { border-color: var(--correct); background: var(--correct-bg); }
.opt-btn.correct .opt-letter { background: var(--correct); color: #fff; }
.opt-btn.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.opt-btn.wrong .opt-letter { background: var(--wrong); color: #fff; }
.opt-btn.dim { opacity: .5; }
.opt-btn.done { pointer-events: none; }
/* ── Feedback ── */
.feedback {
  margin-top: 16px; padding: 14px 16px; border-radius: 8px; font-size: 14px;
  display: none;
}
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct); }
.feedback.wrong { background: var(--wrong-bg); color: var(--wrong); border: 1px solid var(--wrong); }
/* ── Note ── */
.note-box { margin-top: 12px; display: none; }
.note-box.show { display: block; }
.note-box textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit; resize: vertical; min-height: 48px;
  background: #fafbfc;
}
.note-box textarea:focus { outline: none; border-color: var(--primary); }
.note-box .note-hint { font-size: 11px; color: #999; margin-top: 2px; }
.existing-note {
  margin-top: 12px; padding: 10px 14px; background: #fffbeb; border-radius: 8px;
  font-size: 13px; border: 1px solid #fde68a; display: flex; gap: 8px; align-items: flex-start;
}
.existing-note .note-icon { font-size: 16px; flex-shrink: 0; }
.existing-note .note-text { flex: 1; color: #92400e; }
/* ── Action row ── */
.actions { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
.btn-next {
  padding: 10px 32px; border-radius: 8px; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; background: var(--primary); color: #fff;
  transition: all .15s;
}
.btn-next:hover { opacity: .9; }
.btn-next:disabled { background: var(--progress-bg); cursor: not-allowed; color: #999; }
/* ── Empty ── */
.empty {
  text-align: center; padding: 60px 20px; color: var(--text2);
}
.empty .icon { font-size: 48px; margin-bottom: 12px; }
/* ── Wrong book ── */
.wrong-book {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin-top: 32px;
}
.wrong-book h3 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.wrong-book .count { font-size: 12px; color: var(--wrong); font-weight: normal; }
.wrong-item {
  padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px;
  cursor: pointer; transition: background .15s;
}
.wrong-item:last-child { border-bottom: none; }
.wrong-item:hover { background: var(--primary-light); }
/* ── Analysis Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px; padding: 28px; max-width: 640px;
  width: 90%; max-height: 80vh; overflow-y: auto;
}
.modal h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.modal .close-btn {
  margin-left: auto; background: none; border: none; font-size: 20px; cursor: pointer; color: #999;
}
.analysis-section { margin-bottom: 24px; }
.analysis-section h3 { font-size: 14px; color: var(--text2); margin-bottom: 10px; }
.chapter-bar-chart { display: flex; flex-direction: column; gap: 8px; }
.cb-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.cb-label { min-width: 100px; text-align: right; color: var(--text2); }
.cb-track { flex: 1; height: 20px; background: var(--progress-bg); border-radius: 4px; overflow: hidden; position: relative; }
.cb-fill { height: 100%; border-radius: 4px; transition: width .5s; }
.cb-fill.weak { background: #ef4444; }
.cb-fill.medium { background: #f59e0b; }
.cb-fill.strong { background: #10b981; }
.cb-val { min-width: 50px; font-weight: 600; font-size: 12px; }
.rec-card {
  padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 13px;
  border-left: 4px solid;
}
.rec-card.high { background: #fef2f2; border-color: #ef4444; }
.rec-card.medium { background: #fffbeb; border-color: #f59e0b; }
.rec-card.low { background: #ecfdf5; border-color: #10b981; }
.rec-card .rec-title { font-weight: 600; margin-bottom: 2px; }
.wrong-item .q-text { margin-bottom: 4px; }
.wrong-item .q-meta-small { font-size: 12px; color: var(--text2); }
.wrong-item .q-meta-small .your { color: var(--wrong); }
.wrong-item .q-meta-small .ans { color: var(--correct); }
/* ── Responsive ── */
/* ── Info panel ── */
.info-panel { transition: max-height 0.3s ease, opacity 0.3s ease; overflow: hidden; }
.btn-toggle { font-size: 18px; padding: 4px 10px; min-width: 36px; text-align: center; }
@media (max-width: 600px) {
  .info-panel { max-height: 0; opacity: 0; }
  .info-panel.open { max-height: 800px; opacity: 1; }
  .btn-toggle { display: inline-block; }
}
@media (min-width: 601px) {
  .btn-toggle { display: none; }
  .info-panel { max-height: none; opacity: 1; }
}
@media (max-width: 600px) {
  .topbar { padding: 10px 16px; }
  .topbar h1 { font-size: 16px; }
  .app { padding: 12px; }
  .stats-row { gap: 8px; }
  .stat-card { padding: 10px 12px; }
  .stat-card .val { font-size: 22px; }
  .q-card { padding: 16px; }
  .q-stem { font-size: 15px; }
  .opt-btn { padding: 12px; font-size: 13px; }
  .data-table { font-size: 13px; }
}
/* ── Data table ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 14px;
}
.data-table th, .data-table td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: center;
  font-size: 13px;
}
.data-table th {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
  white-space: nowrap;
}
.data-table tbody td {
  background: var(--card);
}
.data-table tr:nth-child(even) td {
  background: #f9fafb;
}

/* ── Sidebar layout ── */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; min-width: 260px; background: var(--card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow: hidden;
}
.sidebar-title {
  padding: 14px 14px 10px; font-size: 13px; font-weight: 600;
  color: var(--text2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
}
.sidebar-title .total { font-weight: normal; font-size: 12px; }
.q-nums {
  flex: 1; overflow-y: auto; padding: 8px 6px;
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px;
}
.q-num {
  width: 30px; height: 30px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card); color: var(--text2);
  transition: all .15s; flex-shrink: 0; user-select: none;
}
.q-num:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.q-num.current { border-color: var(--primary); background: var(--primary); color: #fff; font-weight: 700; transform: scale(1.1); z-index: 1; }
.q-num.correct { background: var(--correct-bg); border-color: #a7f3d0; color: var(--correct); }
.q-num.wrong { background: var(--wrong-bg); border-color: #fecaca; color: var(--wrong); }
.q-num.correct.current { background: var(--correct); color: #fff; border-color: var(--correct); }
.q-num.wrong.current { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main .app { max-width: 100%; }
/* Mobile */
@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; height: auto; max-height: 140px; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
  .q-num { width: 26px; height: 26px; font-size: 10px; }
  .q-nums { gap: 2px; padding: 6px; }
}

</style>
</head>
<body>

<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-title"><span>题目列表</span><span class="total"></span></div>
    <div class="q-nums" id="qNums"></div>
  </div>
  <div class="main">
<div class="topbar">
  <h1>📘 一建管理 · 刷题</h1>
  <div class="topbar-right">
    <button class="btn btn-toggle" onclick="toggleInfoPanel()" id="btnToggle" title="菜单">☰</button>
    <span class="badge" id="totalBadge">题库 0 题</span>
    <button class="btn" id="btnMode" onclick="toggleMode()">顺序</button>
    <button class="btn" id="btnAutoNext" onclick="toggleAutoNext()" style="background:#ecfdf5;border-color:#10b981;color:#10b981;">🔁 自动下一题</button>
    <button class="btn" id="btnAnalyze" onclick="showAnalysis()">📊 分析</button>
    <button class="btn" id="btnReset" onclick="resetProgress()">重置进度</button>
  </div>
</div>

<div class="app">
  <div class="info-panel" id="infoPanel">
  <!-- Chapter selector -->
  <div class="chapter-bar" id="chapterBar"></div>

  <!-- Stats -->
  <div class="stats-row">
    <div class="stat-card"><div class="val" id="statDone">0</div><div class="lbl">已做</div></div>
    <div class="stat-card wrong"><div class="val" id="statWrong">0</div><div class="lbl">错题</div></div>
    <div class="stat-card acc"><div class="val" id="statAcc">-</div><div class="lbl">正确率</div></div>
    <div class="stat-card"><div class="val" id="statRemain">0</div><div class="lbl">剩余</div></div>
  </div>

  <!-- Progress -->
  <div class="progress-wrap">
    <div class="progress-info"><span>进度</span><span id="progressPct">0%</span></div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  </div>
  </div>

  <!-- Question card -->
  <div id="questionArea"></div>

  <!-- Wrong book -->
  <div class="wrong-book" id="wrongBook" style="display:none;">
    <h3>📋 错题本 <span class="count" id="wrongCount"></span></h3>
    <div id="wrongList"></div>
  </div>
</div>
</div>

<!-- Analysis Modal -->
<div class="modal-overlay" id="analysisModal" onclick="if(event.target===this)hideAnalysis()">
  <div class="modal">
    <h2>📊 薄弱点分析 <button class="close-btn" onclick="hideAnalysis()">&times;</button></h2>
    <div id="analysisContent"></div>
  </div>
</div>
</div>

<script>
// ── State ──
let allQuestions = [];
let filteredQuestions = [];
let currentIdx = 0;
let mode = 'seq'; // seq | rand
let autoNext = false;
let answeredQ = {};  // id -> 'correct' | letter
let selChapter = 'all';

// ── Load data ──

理单位", "C": "设计单位", "D": "承包单位"}, "answer": "D", "explanation": "CM单位以承包单位身份从事施工管理。CM模式全称Construction Management。选D。"}, {"id": 28, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "建设工程采用CM承包模式时，CM单位有代理型和非代理型两种。工程分包单位的签约对象是（）", "options": {"A": "代理型为建设单位，非代理型为CM单位", "B": "代理型为CM单位，非代理型为建设单位", "C": "无论代理型或非代理型，均为建设单位", "D": "无论代理型或非代理型，均为CM单位"}, "answer": "A", "explanation": "代理型CM：分包与建设单位签约；非代理型CM：分包与CM单位签约。选A。"}, {"id": 29, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "multi", "stem": "关于CM承包模式的说法，正确的是（）。", "options": {"A": "使工程项目实现有条件的“边设计，边施工”", "B": "CM单位不赚取总包与分包之间的差价", "C": "CM模式适用于实施周期短的大型复杂工程", "D": "所有分包不须通过招标的方式展开竞争", "E": "GMP可大大减少建设单位在工程造价控制方面的风险"}, "answer": "ABE", "explanation": "CM模式特点：边设计边施工、CM不赚取差价、GMP减少建设单位造价风险。CM适用于周期长的大型复杂工程，分包仍需招标。选ABE。"}, {"id": 30, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "single", "stem": "建设工程采用CM模式时，代理型合同和非代理型合同的共同点是（）。", "options": {"A": "CM单位均不赚取总包与分包之间的差价", "B": "CM单位均须负责工程分包的发包工作", "C": "均采用保证最大工程费用（GMP）加酬金合同形式", "D": "建设单位控制工程造价的风险均较小"}, "answer": "A", "explanation": "代理型和非代理型CM的共同点是CM单位均不赚取总包与分包之间的差价。选A。"}, {"id": 31, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "关于partnering模式的说法，正确的是（）。", "options": {"A": "partnering协议是建设单位与承包单位之间的协议", "B": "partnering模式信息是封闭性的", "C": "partnering模式特别强调工程参建方基层人员的参与", "D": "partnering协议不是法律意义上的合同"}, "answer": "D", "explanation": "Partnering协议不是法律意义上的合同，是各方自愿签署的合作协议，强调高层参与和信息公开。选D。"}, {"id": 32, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "依据《建设工程监理范围和规模标准规定》，下列项目中，必须实行监理的是（）。", "options": {"A": "建筑面积1000m2的影剧院项目", "B": "建筑面积40000m2的住宅项目", "C": "总投资额800万元的新能源项目", "D": "总投资额2700万元的社会福利项目"}, "answer": "A", "explanation": "必须监理的项目含：大中型公用事业、成片开发住宅（5万㎡以上）、影剧院等。1000㎡影剧院需监理。40000㎡<50000㎡不需强制。选A。"}, {"id": 33, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "下列监理机构人员的职责中，总监理工程师可以书面授权委托给总监理工程师代表的是（ ）。", "options": {"A": "签发工程开工令", "B": "组织编写监理月报", "C": "审批监理实施细则", "D": "组织编写工程质量评估报告"}, "answer": "B", "explanation": "总监可授权总监代表：组织编写监理月报。签发开工令、审批监理细则、编写质量评估报告不得委托。选B。"}, {"id": 34, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "multi", "stem": "下列总监理工程师的职责中，不得委托给总监理工程师代表的有（）。", "options": {"A": "组织审核竣工结算", "B": "组织工程竣工预验收", "C": "组织编写工程质量评估报告", "D": "组织审查施工组织设计", "E": "组织审核分包单位资格"}, "answer": "ABCD", "explanation": "不得委托总监代表的职责：组织审核竣工结算、组织竣工预验收、编写质量评估报告、审查施工组织设计。均属重要决策。选ABCD。"}, {"id": 35, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "下列监理人员基本职责中，属于监理员职责的是（）。", "options": {"A": "进行见证取样", "B": "处理工程索赔", "C": "组织检查现场安全生产管理体系", "D": "进行工程计量"}, "answer": "A", "explanation": "监理员职责包含见证取样。工程索赔、现场安全生产检查、工程计量属专监或总监职责。选A。"}, {"id": 36, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "single", "stem": "在建设工程施工准备阶段，项目监理机构 需要进行的工作是（）。", "options": {"A": "主持召开图纸会审和设计交底会议", "B": "主持召开第一次工地会议", "C": "核查施工机械和设施的安全许可验收手续", "D": "组织建立工程项目质量安全管理体系"}, "answer": "C", "explanation": "施工准备阶段监理工作：核查施工机械和设施安全许可验收手续。图纸会审和第一次工地会议由建设单位主持。选C。"}, {"id": 37, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "multi", "stem": "施工总承包单位按合同约定选定分包单位后，项目监理机构根据施工总承包单位报送的分 包单位资格报审表及相关资料审查的内容有（）。", "options": {"A": "企业资质等级证书", "B": "类似工程业绩", "C": "专职管理人员资格", "D": "专项施工方案", "E": "安全生产许可文件"}, "answer": "ABCE", "explanation": "监理审查分包单位资格：资质等级证书、类似业绩、专职管理人员资格、安全生产许可。专项施工方案是施工技术层面的审查。选ABCE。"}, {"id": 38, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "single", "stem": "根据国家标准《建设工程监理规范》，施工单位做好施工准备后，应向项目监理机构报送的 文件是()。", "options": {"A": "工程开工时间确认书", "B": "工程开工通知", "C": "工程开工报审表", "D": "工程开工报告"}, "answer": "C", "explanation": "施工单位准备完成后应向监理报送工程开工报审表。选C。"}, {"id": 39, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2020年真题II", "type": "multi", "stem": "根据《建设工程安全生产管理条例》，施工单位应编制专项施工方案并组织专家论证、审 查的分部分项工程有（）。", "options": {"A": "拆除工程", "B": "深基坑工程", "C": "地下暗挖工程", "D": "起重吊装工程", "E": "高大模板工程"}, "answer": "BCE", "explanation": "需专家论证的分部分项：深基坑、地下暗挖、高大模板工程。拆除和起重吊装需编方案但不强制论证。选BCE。"}, {"id": 40, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "single", "stem": "施工单位采用新设备、新技术、新材料、新工艺时，应将相应质量认证材料和相关验收标准 报送()单位审查。", "options": {"A": "建设单位", "B": "质量监督机构", "C": "设计单位", "D": "项目监理机构"}, "answer": "D", "explanation": "四新技术质量认证材料和验收标准应报送项目监理机构审查。选D。"}, {"id": 41, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "multi", "stem": "根据国家标准《建设工程监理规范》，施工单位需报送项目监理机构检查复核的施工控制测 量成果有()。", "options": {"A": "施工平面控制网测量成果", "B": "进场道路测量成果", "C": "用地红线控制桩测量成果", "D": "临时水准点测量成果", "E": "高程控制网测量成果"}, "answer": "ADE", "explanation": "监理需复核的施工控制测量成果：施工平面控制网、临时水准点、高程控制网。进场道路和用地红线不属控制测量成果。选ADE。"}, {"id": 42, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "multi", "stem": "下列施工单位行为中，总监理工程师将会根据《建设工程监理规范》签发工程暂停令的有()", "options": {"A": "未按批准的专项施工方案施工", "B": "未对进场的工程材料进行报验", "C": "未按批准的开工时间组织施工", "D": "未按批准的施工组织设计施工", "E": "未按审查通过的工程设计文件施工"}, "answer": "ADE", "explanation": "总监签发暂停令的情形：未按专项施工方案/施工组织设计/设计文件施工等。材料未报验和开工时间问题严重程度不够。选ADE。"}, {"id": 43, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "下列关于竣工报验及结算申请的说法中，正确的是（）。", "options": {"A": "施工单位应向建设单位提交单位工程竣工验收报审表 及竣工资料", "B": "建设单位组织工程竣工预验收", "C": "竣工预验收合格后，施工单位编写工程质量评估报告", "D": "施工单位应向项目监理机构提交竣工结算款支付申请"}, "answer": "D", "explanation": "竣工结算款支付申请应向项目监理机构提交，由监理审核后报建设单位。选D。"}, {"id": 44, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2020年真题", "type": "single", "stem": "建设工程质量监督对地基基础混凝土强度进行监督检测，属于政府质量监督中的（）。", "options": {"A": "生产过程监督", "B": "工程实体质量监督", "C": "工程质量行为监督", "D": "施工管理状况监督"}, "answer": "B", "explanation": "对地基基础混凝土强度进行监督检测属于工程实体质量监督（检测实体质量指标）。选B。"}, {"id": 45, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "single", "stem": "工程质量监督机构核验工程质量保证资料的目的是（）。", "options": {"A": "跟踪质量形成过程", "B": "验证责任主体行为", "C": "推查质量事故隐患", "D": "验证工程实体质量"}, "answer": "D", "explanation": "此题ID45未出现在列表中，跳过。"}, {"id": 46, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "multi", "stem": "建设单位申请办理工程质量监督手续时，需提供的资料有（）。", "options": {"A": "工程监理合同", "B": "施工投标文件", "C": "施工组织设计", "D": "工程质量评估报告", "E": "中标通知书"}, "answer": "ACE", "explanation": "办理质量监督手续需提供：工程监理合同、施工组织设计、中标通知书等。选ACE。"}, {"id": 47, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2021年真题", "type": "single", "stem": "工程质量监督机构收到建设工程质量监督的申报手续，并对有关文件进行审查，审查合格后 签发（）。", "options": {"A": "质量监督文件", "B": "施工许可证", "C": "质量监督报告", "D": "监督计划方案"}, "answer": "A", "explanation": "质量监督机构审查合格后签发质量监督文件。选A。"}, {"id": 48, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "工程质量监督申报手续应由（）向工程质量监督机构办理。", "options": {"A": "建设单位", "B": "施工单位", "C": "监理单位", "D": "设计单位"}, "answer": "A", "explanation": "质量监督申报手续由建设单位向质量监督机构办理。选A。"}, {"id": 49, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "工程开工前，质量监督机构召开的首次监督会议需要检查施工单位提供的文件是（）。", "options": {"A": "施工组织设计", "B": "施工项目经理任命书", "C": "施工方案", "D": "工程质量承诺书"}, "answer": "B", "explanation": "首次监督会议需检查施工单位提供的施工项目经理任命书等人员资格文件。选B。"}, {"id": 50, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "工程质量监督机构发现其监督的工程有影响使用功能的质量问题时，应采取的监督措施是 （）。", "options": {"A": "签发工程质量问题整改通知单并进行现场取证", "B": "签发工程质量问题整改通知单并监督整改过程", "C": "签发工程暂停令并组织召开现场整改工作会", "D": "签发工程暂停令并进行现场取证"}, "answer": "A", "explanation": "发现影响使用功能的质量问题，监督机构应签发整改通知单并现场取证。暂停令由监理签发。选A。"}, {"id": 51, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "multi", "stem": "工程质量监督机构参加竣工验收时，对现场验收宜重点监督的内容有（）。", "options": {"A": "验收组织形式", "B": "验收方法", "C": "验收程序", "D": "标准规定的执行情况", "E": "观感质量检查"}, "answer": "ACD", "explanation": "竣工验收时质量监督机构重点监督：验收组织形式、验收程序、标准规定执行情况。验收方法和观感质量非监督重点。选ACD。"}, {"id": 52, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "multi", "stem": "质量监督机构组织安排工程质量监督准备工作中， 检查各方主体行为，包括（）。", "options": {"A": "审查参建各方的质量保证体系", "B": "工程质量控制程序是否正确", "C": "审查施工组织设计、监理规划的审批手续", "D": "工程质量责任人到位情况是否符合规定", "E": "核查工程参建各方主要管理人员资格"}, "answer": "ACE", "explanation": "监督准备工作含：审查质量保证体系、审查施工组织设计和监理规划审批、核查主要管理人员资格。选ACE。"}, {"id": 53, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "工程质量监督机构的监督检查以（）为主。", "options": {"A": "专项检查与综合检查", "B": "工程实体质量检查", "C": "抽查", "D": "参建各方主体质量行为检查"}, "answer": "C", "explanation": "质量监督机构监督检查以抽查为主。选C。"}, {"id": 54, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2019年真题", "type": "single", "stem": "业主方项目管理的目标中，进度目标是指（ ）的时间目标。", "options": {"A": "项目动用", "B": "竣工验收", "C": "联动试车", "D": "保修期结束"}, "answer": "A", "explanation": "业主方进度目标是项目交付使用（动用）的时间目标。选A。"}, {"id": 55, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2016年真题改", "type": "single", "stem": "关于业主方项目管理目标和任务的说法，不正确的是（ ）。", "options": {"A": "业主方的进度目标指项目交付使用的时间目标", "B": "业主方的投资目标指项目的施工成本目标", "C": "施工方的目标既与工程建设总目标相联系，又有很强的自主特性", "D": "工程咨询单位为施工单位提供咨询服务也属于施工方项目管理范畴"}, "answer": "B", "explanation": "业主方投资目标指项目总投资目标，不是施工成本目标（施工成本是施工方的目标）。选B。"}, {"id": 56, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "multi", "stem": "根据《建设项目工程总承包管理规范》，设计执行计划宜包括的内容有（ ）。", "options": {"A": "质量保证程序和要求", "B": "费用控制原则和要求", "C": "进度计划和主要控制点", "D": "采购工作范围和内容", "E": "技术经济要求"}, "answer": "ACE", "explanation": "设计执行计划包含：质量保证程序和要求、进度计划和主要控制点、技术经济要求。费用控制和采购不属于设计执行计划。选ACE。"}, {"id": 57, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "弱矩阵式项目管理组织结构中，项目负责人担任的角色是（ ）", "options": {"A": "项目决策者或领导者", "B": "项目领导者或协调者", "C": "项目协调者或监督者", "D": "项目监督者或决策者"}, "answer": "C", "explanation": "弱矩阵中项目经理权力弱，仅担任协调者或监督者角色。选C。"}, {"id": 58, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "single", "stem": "工程项目管理采用强矩阵式组织结构的优点是（ ）。", "options": {"A": "有利于从各职能部门择优选定项目经理", "B": "有利于各职能部门考核项目组成员绩效", "C": "有利于加强各职能部门之间的协调配合", "D": "有利于打通各职能部门之间的技术壁垒"}, "answer": "C", "explanation": "强矩阵的优点是加强各职能部门之间的协调配合。选C。"}, {"id": 59, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "single", "stem": "按照项目经理的权限不同，矩阵式项目组织结构可分为不同形式。其中，平衡矩阵式组织结 构适用于（ ）的工程项目。", "options": {"A": "技术较复杂、建设周期较长", "B": "技术较简单、建设周期较短", "C": "技术复杂程度中等、建设周期较长", "D": "技术复杂程度中等、建设周期较短"}, "answer": "C", "explanation": "平衡矩阵适用于技术复杂程度中等、建设周期较长的项目。选C。"}, {"id": 60, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "multi", "stem": "施工项目管理机构组织采用矩阵式组织结构的优点有（ ）", "options": {"A": "实现集权与分权的最优结合", "B": "组织结构稳定性好", "C": "业务人员工作岗位稳定", "D": "不易产生矛盾和扯皮", "E": "能调动各类工作人员的积极性"}, "answer": "AE", "explanation": "矩阵组织结构优点：集权与分权最优结合、调动各类人员积极性。缺点：稳定性差、易产生矛盾。选AE。"}, {"id": 61, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "施工项目管理采用直线式组织结构的优点是（ ）。", "options": {"A": "可减轻领导者负担", "B": "集权与分权相结合", "C": "易于统一指挥", "D": "强调管理业务专门化"}, "answer": "C", "explanation": "直线式组织结构优点是结构简单、易于统一指挥、权责分明。选C。"}, {"id": 62, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "multi", "stem": "在施工项目部编制的责任矩阵图中，任务执行者在项目管理中的角色有（ ）。", "options": {"A": "负责人", "B": "授权人", "C": "监理人", "D": "参与者", "E": "审核者"}, "answer": "ADE", "explanation": "责任矩阵中执行者角色：负责人(P)、参与者(S)、审核者(R)。授权人和监理人不在此列。选ADE。"}, {"id": 63, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "施工项目部编制责任矩阵图时，首先应开展的工作是（ ）。", "options": {"A": "列出需要完成的项目管理任务", "B": "建立“人”与“事”的关联", "C": "画出责任矩阵图", "D": "列出有关项目执行的个人或职能部门名称"}, "answer": "A", "explanation": "编制责任矩阵第一步是列出需要完成的项目管理任务。选A。"}, {"id": 64, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "关于项目管理责任矩阵的说法，正确的是（ ）", "options": {"A": "责任检查时，横向检查可以确保每个人员至少负责一项工作", "B": "责任检查时，纵向检查可以确保每项工作有人员负责", "C": "基于管理活动的工作量估算，可以横向统计每个活动的总工作量", "D": "基于管理活动的工作量估算，可以纵向统计每个活动的总工作量"}, "answer": "C", "explanation": "责任矩阵中横向检查保证每项工作有人负责，纵向保证每人至少一项工作。工作量估算纵向统计每人总工作量。选C。"}, {"id": 65, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题I", "type": "single", "stem": "工程项目管理中应用责任矩阵的目的是（ ）。", "options": {"A": "避免职责不清而出现推诿扯皮现象", "B": "避免各管理部门之间信息沟通不畅", "C": "促进工程项目管理专业人员培养", "D": "便于评价工程项目管理绩效"}, "answer": "A", "explanation": "责任矩阵的核心目的是避免职责不清导致推诿扯皮。选A。"}, {"id": 66, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "multi", "stem": "下列属于工程总承包项目经理的权限有（ ）。", "options": {"A": "代表企业组织实施工程总承包项目管理，对实现合同约定 的项目目标负责", "B": "在授权范围内负责与项目利益相关者协调，解决项目实施 中出现的问题", "C": "在授权范围内，行使相应管理权，履行相应职责", "D": "协调和处理与项目有关的内外部事项", "E": "在合同范围内按规定程序使用工程总承包企业的相关资源"}, "answer": "CDE", "explanation": "总承包项目经理的权限包含：行使管理权、协调内外部事项、在合同范围内决策。A和B是职责而非权限。选CDE。"}, {"id": 67, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "single", "stem": "《建设项目工程总承包管理规范》规定，工程总承包项目经理应履行的职责是（ ）。", "options": {"A": "代表企业签订工程总承包合同", "B": "组织评估工程总承包项目投资估算的合理性", "C": "对项目实施全过程进行策划、组织、协调和控制", "D": "组织选择分包单位并签订工程分包合同"}, "answer": "C", "explanation": "总承包项目经理核心职责：对项目实施全过程策划、组织、协调和控制。签订合同和选分包单位非其职责。选C。"}, {"id": 68, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "single", "stem": "根据《建设工程施工项目经理岗位职业标准》， 施工项目经理具有的权限是（ ）。", "options": {"A": "组建项目经理部并选用项目团队成员", "B": "负责项目投标并参与签订施工合同", "C": "负责确定分包单位并签订分包合同", "D": "组织项目团队成员绩效考核评价"}, "answer": "D", "explanation": "施工项目经理权限包含：组织项目团队成员绩效考核评价。组建项目部、投标等不属权限。选D。"}, {"id": 69, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "根据《建设工程施工项目经理岗位职业标准》， 施工项目经理的权限是（ ）。", "options": {"A": "参与工程竣工验收", "B": "主持组建项目经理部", "C": "组织制定和执行施工现场项目管理制度", "D": "主持项目经理部工作"}, "answer": "D", "explanation": "施工项目经理权限：主持项目经理部工作。参与验收、组建项目部属其他阶段职责。选D。"}, {"id": 70, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "根据《建筑工程施工项目经理岗位职业标准》，施工项目经理应履行的职责是（ ）。", "options": {"A": "组织审查施工组织设计", "B": "主持第一次工地会议", "C": "组织审查专项施工方案", "D": "主持工地例会"}, "answer": "D", "explanation": "施工项目经理职责：主持工地例会。审查施工组织设计和专项方案属监理职责。选D。"}, {"id": 71, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "根据《建设工程施工项目经理岗位职业标准》，施工项目经理应履行的职责是（ ）", "options": {"A": "编制施工日志和施工月报", "B": "定期组织召开施工例会", "C": "建立采购管理制度", "D": "考核评价项目团队管理绩效"}, "answer": "B", "explanation": "施工项目经理职责：定期组织召开施工例会。选B。"}, {"id": 72, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2023年真题", "type": "single", "stem": "根据《建设工程项目管理规范》，项目管理规划应包括的内容有（ ）。", "options": {"A": "项目管理规划大纲和项目管理策划", "B": "项目管理策划和项目管理实施规划", "C": "项目管理配套策划和项目管理实施规划", "D": "项目管理规划大纲和项目管理实施规划"}, "answer": "D", "explanation": "项目管理规划包含项目管理规划大纲和项目管理实施规划两类。选D。"}, {"id": 73, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "single", "stem": "根据《建设工程项目管理规范》，编制项目管理规划大纲需进行的工作有：①确定项目管理 目标；②规定项目管理措施；③编制项目资源计划；④进行项目工作结构分解等。仅就上述工作而言，正确 的工作顺序是（ ）。", "options": {"A": "③-②-①-④", "B": "②-①-③-④", "C": "①-④-②-③", "D": "④-②-③-①"}, "answer": "C", "explanation": "规划大纲编制顺序：确定目标→工作分解→确定措施→编制资源计划。即①-④-②-③。选C。"}, {"id": 74, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2021年真题", "type": "single", "stem": "根据《建设工程项目管理规范》，项目管理实施规划的编制过程包括：①熟悉相关法规和文 件：②分析项目具体特点和环境条件；③履行报批手续；④实施编制活动； ⑤了解相关方的要求。正确的程序是（ ）。", "options": {"A": "①-⑤-②-③-④", "B": "①-②-⑤-④-③", "C": "⑤-②-①-④-③", "D": "②-⑤-①-③-④"}, "answer": "C", "explanation": "管理实施规划编制程序：了解相关方要求→分析项目特点→熟悉法规文件→实施编制→报批。即⑤-②-①-④-③。选C。"}, {"id": 75, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2010年真题", "type": "single", "stem": "根据《建设工程项目管理规范》，项目管理 实施规划应包括（ ）。", "options": {"A": "项目范围管理", "B": "绿色建造与环境管理", "C": "项目收尾管理", "D": "绿色建造与环境管理计划"}, "answer": "D", "explanation": "管理实施规划应包含绿色建造与环境管理计划（区别于大纲中的原则性内容）。选D。"}, {"id": 76, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "multi", "stem": "建设工程施工组织设计的编制依据有（ ）。", "options": {"A": "工程设计文件", "B": "施工合同文件", "C": "监理实施细则", "D": "工程地质条件", "E": "施工平面布置图"}, "answer": "ABD", "explanation": "施工组织设计编制依据含工程设计文件、施工合同、工程地质条件。监理细则和平面图不属编制依据。选ABD。"}, {"id": 77, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "multi", "stem": "施工单位编制施工组织总设计的依据有（ ）", "options": {"A": "工程招标投标文件", "B": "工程水文地质条件", "C": "分包单位技术水平", "D": "工程技术经济指标", "E": "工程有关资源供应情况"}, "answer": "ABDE", "explanation": "施工组织总设计依据：招标投标文件、水文地质条件、技术经济指标、资源供应情况。分包单位水平非编制依据。选ABDE。"}, {"id": 78, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2021年真题", "type": "multi", "stem": "根据《建筑施工组织设计规范》，施工方案的主要内容包括（ ）。", "options": {"A": "工程概况", "B": "施工方法及工艺要求", "C": "施工部署", "D": "施工现场平面布置", "E": "施工准备与资源配置计划"}, "answer": "ABE", "explanation": "施工方案主要内容含：工程概况、施工方法及工艺要求、施工准备与资源配置计划。施工部署和平面布置属单位工程施工组织设计。选ABE。"}, {"id": 79, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2013年真题", "type": "multi", "stem": "单位工程施工组织设计和施工方案均应包括的内容有（ ）。", "options": {"A": "施工安全管理计划", "B": "主要技术经济指标", "C": "工程概况", "D": "施工进度计划", "E": "施工准备与资源配置计划"}, "answer": "CDE", "explanation": "单位工程施工组织设计和施工方案的共同内容：工程概况、施工进度计划、施工准备与资源配置计划。选CDE。"}, {"id": 80, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "multi", "stem": "建设工程施工组织设计的编制依据有（ ）。", "options": {"A": "工程设计文件", "B": "施工合同文件", "C": "监理实施细则", "D": "工程地质条件", "E": "施工平面布置图"}, "answer": "ABD", "explanation": "施工组织设计编制依据：工程设计文件、施工合同、工程地质条件。选ABD。"}, {"id": 81, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "施工组织总设计对整个工程项目施工过程所起的作用是（ ）", "options": {"A": "施工部署、进度协调", "B": "统筹规划、重点控制", "C": "资源配置、绩效考核", "D": "实施策划、动态控制"}, "answer": "B", "explanation": "施工组织总设计的作用是统筹规划、重点控制整个项目施工。选B。"}, {"id": 82, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "multi", "stem": "施工总进度计划编制程序中，第一步工作是（ ）", "options": {"A": "计算工程量", "B": "确定各单位工程施工期限", "C": "确定各单位工程开竣工时间", "D": "确定各单位工程相互搭接关系 答：", "E": "资金使用计划"}, "answer": "AD", "explanation": "施工总进度计划编制程序：首先计算工程量（A），并合理确定各单位工程间的相互搭接关系（D）等。计算工程量是编制总进度计划的基础工作。故选AD。"}, {"id": 83, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "multi", "stem": "下列总体施工准备工作计划中，属于现场准备计划的有（ ）", "options": {"A": "临时用水用电计划", "B": "施工方案编制计划", "C": "试验检验工作计划", "D": "临时供热供气计划", "E": "资金使用计划"}, "answer": "AD", "explanation": "现场准备计划含：临时用水用电计划、临时供热供气计划。方案和试验计划不属现场准备。选AD。"}, {"id": 84, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "multi", "stem": "下列施工组织设计内容中，属于单位工程施工组织设计中“施工部署”的有（ ）。", "options": {"A": "主要施工方案", "B": "工程施工目标", "C": "施工重点和难点分析", "D": "主要分项工程施工工艺要求", "E": "项目经理部工作岗位设置与职责划分"}, "answer": "BCE", "explanation": "施工部署包含：工程施工目标、施工重点难点分析、项目经理部岗位设置与职责划分。选BCE。"}, {"id": 85, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "multi", "stem": "施工单位编制单位工程施工组织设计时，在施工部署中除确定工程管理组织结构形式外， 针对项目经理部还需要确定的内容有（ ）", "options": {"A": "工作岗位", "B": "职责划分", "C": "物资配置", "D": "奖罚制度", "E": "办公地点"}, "answer": "AB", "explanation": "施工部署中针对项目经理部需确定：工作岗位和职责划分。选AB。"}, {"id": 86, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "编制单位工程施工进度计划时，需要确定各项工作的施工顺序，制约施工顺序的因素是（ ）", "options": {"A": "施工定额和工程计量规则", "B": "施工定额和施工部署", "C": "工程计量规则和施工工艺", "D": "施工工艺和施工组织"}, "answer": "D", "explanation": "制约施工顺序的因素是施工工艺（技术逻辑）和施工组织（管理安排）。选D。"}, {"id": 87, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "single", "stem": "某单位工程施工进度计划中，工作A由", "options": {"B": "C两个分项工程合并而成。已知分项工程B的时间定 额和工程量分别是0.35工日/m和5000m，分项工程C的时间定额和工程量分别是0.52工日/m和3000m，则工作", "A": "的综合时间定额是（ ）工日/m。", "C": "0.46", "D": "0.67"}, "answer": "A", "explanation": "综合时间定额=总工日/总工程量=(0.35×5000+0.52×3000)/(5000+3000)=(1750+1560)/8000=3310/8000=0.41工日/m。选A(0.41)。"}, {"id": 88, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "某工作的时间定额是0.6工日/㎡，工程量是300㎡，每天工作1班，每班安排20名工人。编制施工 进度计划时，该工作的持续时间是（ ）。", "options": {"A": "9天", "B": "15天", "C": "9工日", "D": "15工日"}, "answer": "A", "explanation": "总工日=0.6×300=180工日。20人每天完成20工日，持续时间=180/20=9天。选A。"}, {"id": 89, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "初始施工进度计划编制完成后，需要检查是否满足要求，下列检查内容中首要检查的是（ ）。", "options": {"A": "主要施工机具的利用是否均衡", "B": "主要建筑材料的利用是否均衡", "C": "总工期是否满足合同约定", "D": "主要工种的工人是否满足连续施工要求"}, "answer": "C", "explanation": "进度计划首要检查总工期是否满足合同约定，其次检查资源均衡性。选C。"}, {"id": 90, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "single", "stem": "编制单位工程施工进度计划时需要进行的工作有：①确定施工顺序；②划分工作；③确定工 作持续时间。仅就上述工作而言，正确的工作程序是（ ）。", "options": {"A": "①-③-②", "B": "②-①-③", "C": "①-②-③", "D": "②-③-①"}, "answer": "B", "explanation": "编制进度计划正确顺序：划分工作→确定施工顺序→确定工作持续时间。即②-①-③。选B。"}, {"id": 91, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2021年真题", "type": "single", "stem": "根据《建筑施工组织设计规范》，主持编制施工组织设计的应是（ ）。", "options": {"A": "施工单位技术负责人", "B": "项目负责人", "C": "项目总监理工程师", "D": "项目技术负责人"}, "answer": "B", "explanation": "施工组织设计由项目负责人主持编制。选B。"}, {"id": 92, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "危险性较大的分部分项工程专项施工应由施工单位技术部组织相关专家评审会，报由（ ）批准", "options": {"A": "项目负责人", "B": "施工单位技术负责人", "C": "项目技术负责人", "D": "总监工程师"}, "answer": "B", "explanation": "危大工程专项方案经专家论证后，由施工单位技术负责人批准。选B。"}, {"id": 93, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2022年真题", "type": "single", "stem": "根据《建筑施工组织设计规范》，单位工程施工组织设计由（ ）审批。", "options": {"A": "施工单位项目负责人", "B": "总承包单位负责人", "C": "施工单位技术负责人", "D": "施工单位项目技术负责人"}, "answer": "C", "explanation": "单位工程施工组织设计由施工单位技术负责人审批。选C。"}, {"id": 94, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2020年真题", "type": "single", "stem": "根据《建筑施工组织设计规范》，关于施工组织设计审批的说法，正确的是（ ）。", "options": {"A": "专项施工方案应由项目技术负责人审批", "B": "施工方案应由项目总监理工程师审批", "C": "施工组织总设计应由建设单位技术负责人审批", "D": "单位工程施工组织设计应由承包单位技术负责人审批"}, "answer": "D", "explanation": "施工组织总设计由总承包单位技术负责人审批；单位工程施工组织设计由施工单位技术负责人审批。选D。"}, {"id": 95, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "工程施工过程中，需要及时对施工组织设计进行修改的情形是（ ）", "options": {"A": "网架结构由原位拼装改为整体吊装", "B": "采购进场的地面瓷砖尺寸偏差较大", "C": "施工分包单位更换项目技术负责人", "D": "雨季施工地下平均水位有所上升"}, "answer": "A", "explanation": "网架结构安装方法改变属重大施工方案变更，需修改施工组织设计。材料偏差不影响施组。选A。"}, {"id": 96, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "练习题", "type": "single", "stem": "分析论证项目总目标时，应遵循的基本原则是（ ）。", "options": {"A": "质量目标具有最高优先等级", "B": "确保成本目标符合企业发展规划", "C": "施工安全目标应采用定量分析方法", "D": "进度目标优先等级应根据项目实际确定"}, "answer": "D", "explanation": "分析论证项目总目标时，进度目标优先等级应根据项目实际确定，不存在统一的绝对优先。选D。"}, {"id": 97, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题II", "type": "single", "stem": "项目多目标体系中，下一级目标对上一级目标所起的作用是（ ）", "options": {"A": "控制", "B": "制约", "C": "集成", "D": "保证"}, "answer": "D", "explanation": "在多目标体系中，下级目标对上级目标起保证作用（下级目标的实现保证上级目标的达成）。选D。"}, {"id": 98, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题II", "type": "single", "stem": "下列施工项目目标控制措施中，属于组织措施的是（ ）。", "options": {"A": "做好施工合同交底工作", "B": "建立施工项目目标控制工作考评机制", "C": "合理处置工程变更和施工索赔", "D": "改进施工方法和施工工艺"}, "answer": "B", "explanation": "建立目标控制工作考评机制属于组织措施（涉及管理和考核制度）。合同交底属管理措施，变更属经济措施，改进工艺属技术措施。选B。"}, {"id": 99, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2025年真题", "type": "multi", "stem": "实施工程项目目标动态控制可采取的技术措施有（ ）。", "options": {"A": "完善控制工作流程", "B": "及时办理工程款支付手续", "C": "审查论证施工方案", "D": "建立目标控制工作考评机制", "E": "采用价值工程方法"}, "answer": "CE", "explanation": "动态控制技术措施：审查论证施工方案、采用价值工程方法。完善流程属组织措施，付款属经济措施。选CE。"}, {"id": 100, "chapter": "第1章 建设工程项目组织、规划与控制", "marker": "2024年真题", "type": "multi", "stem": "关于施工项目目标及动态控制的说法， 正确的有（ ）。", "options": {"A": "施工项目管理的关键在于项目目标的事后纠偏控制", "B": "施工项目总目标是一个多目标体系", "C": "施工项目目标应符合工程建设强制性标准", "D": "不同施工项目的各个目标可具有不同的优先等级", "E": "构建施工项目目标体系是有效控制施工项目目标的基本前提"}, "answer": "BCDE", "explanation": "施工项目总目标是多目标体系；目标应符合强制性标准；不同项目目标优先等级可不同；构建目标体系是控制前提。关键是事前和过程控制而非事后纠偏。选BCDE。"}, {"id": 101, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "根据《质量管理体系要求》，下列质量管理活动中，属于顾客导向过程的是（ ）。", "options": {"A": "质量目标策划", "B": "质量风险应对", "C": "外部供应产品质量控制", "D": "产品交付后的防护"}, "answer": "D", "explanation": "顾客导向过程（COP）是直接与顾客相关、为顾客创造价值的过程。产品设计开发属于客户导向过程。选D。"}, {"id": 102, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "single", "stem": "根据国家标准《质量管理体系要求》，成文信息分为要求保持和要求保留两类。下列成文信 息中，属于要求保持的是（ ）。", "options": {"A": "设计评审", "B": "人员能力证据", "C": "质量方针", "D": "外部供方评价"}, "answer": "C", "explanation": "成文信息分两类：要求保持的（文件类，如手册、程序文件）和要求保留的（记录类，如检验记录）。质量手册属于要求保持的成文信息。选C。"}, {"id": 103, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2018年真题", "type": "multi", "stem": "根据《质量管理体系标准基础和术语》，质量管理原则包括（ ）。", "options": {"A": "以顾客为关注焦点", "B": "循证决策", "C": "全员积极参与", "D": "关系管理", "E": "全要素控制"}, "answer": "ABCD", "explanation": "质量管理七项原则：以顾客为关注焦点、领导作用、全员参与、过程方法、改进、循证决策、关系管理。选ABCD。"}, {"id": 104, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2010年真题II", "type": "multi", "stem": "关于质量管理体系七项原则的说法，正确的有（ ）。", "options": {"A": "将活动作为相互关联、功能连贯的过程组成的体系来理解和管理", "B": "各级领导建立统一的宗旨和方向，并创造全员积极参与实现组织的质量目标的条件", "C": "全员参与", "D": "基于数据和信息的分析和评价的决策", "E": "以产品为首要关注焦点"}, "answer": "ABCD", "explanation": "质量管理七项原则贯穿质量管理全过程，含以顾客为关注焦点、领导作用、全员积极参与等。选ABCD。"}, {"id": 105, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "single", "stem": "质量管理原则中（ ）是资源保障。", "options": {"A": "以顾客为关注焦点", "B": "领导作用", "C": "关系管理", "D": "全员积极参与"}, "answer": "C", "explanation": "质量管理七项原则中，领导作用是资源保障（营造环境、提供资源、明确方向）。选C。"}, {"id": 106, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "下列管理理念中，属于环境管理体系基本理念的是（ ）。", "options": {"A": "以顾客为关注焦点", "B": "应用过程方法", "C": "有效管理资源", "D": "注重关系管理"}, "answer": "C", "explanation": "环境管理体系基本理念含：污染预防、持续改进、遵守法律法规等。PDCA循环是运行模式。选C。"}, {"id": 107, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题II", "type": "multi", "stem": "根据《环境管理体系要求及使用指南》，", "options": {"A": "领导作用和承诺", "B": "组织所处环境", "C": "环境方针", "D": "组织的角色、职责和权限", "E": "相关方价值"}, "answer": "ACD", "explanation": "环境管理体系核心含：环境方针、策划、实施与运行、检查和管理评审。选ACD。"}, {"id": 108, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "single", "stem": "根据国家标准《环境管理体系要求及使用指南》，下列环境管理体系核心内容中，需要明确 组织环境方针的是（ ）。", "options": {"A": "领导作用", "B": "绩效评价", "C": "体系策划", "D": "组织所处环境"}, "answer": "A", "explanation": "环境方针由最高管理者制定，体现组织对环境管理的承诺和总体方向。选A。"}, {"id": 109, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题II", "type": "single", "stem": "根据《环境管理体系要求及使用指南》，环境管理体系运行应包括的内容是（ ）。", "options": {"A": "危险源辨识和防范", "B": "应急准备和响应", "C": "风险评价和决策", "D": "员工教育和培训"}, "answer": "B", "explanation": "环境管理体系运行含：资源、能力、意识、信息交流、文件化信息、运行策划和控制、应急准备和响应。选B。"}, {"id": 110, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "single", "stem": "职业健康安全管理体系标准应用灵活性的表现是（ ）。", "options": {"A": "与其他管理体系兼容", "B": "强调预防为主和持续改进", "C": "只对方针、目标和体系要素做出要求", "D": "基于PDCA循环保证管理规范化"}, "answer": "C", "explanation": "职业健康安全管理体系标准可灵活应用于各类组织，不论规模大小、类型和活动。选C。"}, {"id": 111, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "single", "stem": "下列不属于职业健康安全管理体系标准的特点（ ）。", "options": {"A": "与其他管理体系兼容", "B": "系统化管理机制", "C": "强制性原则", "D": "法制化和规范化管理手段"}, "answer": "C", "explanation": "职业健康安全管理体系特点含：采用PDCA模式、预防为主、全员参与、持续改进。强制第三方认证不是其特点。选C。"}, {"id": 112, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题II", "type": "single", "stem": "根据《环境管理体系要求及使用指南》，“应急准备和响应”属于环境管理体系部分中的 内容是（ ）。", "options": {"A": "领导作用", "B": "运行", "C": "策划", "D": "支持"}, "answer": "B", "explanation": "\"应急准备和响应\"属于环境管理体系\"运行\"部分。选B。"}, {"id": 113, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "根据《职业健康安全管理体系系要求及使用指南》，建筑企业应界定职业健康安全管理体系 的边界和适用性，以满足职业健康安全管理体系标准对（ ）的基本要求。", "options": {"A": "支持和运行", "B": "绩效评价", "C": "领导作用", "D": "组织所处环境"}, "answer": "D", "explanation": "界定管理体系边界和适用性是为了确定\"范围\"的要求。选D。"}, {"id": 114, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2022年真题", "type": "single", "stem": "企业最高管理者对职业健康安全管理体系进行评价属于（ ）。", "options": {"A": "管理评审", "B": "内部审核", "C": "外部审核", "D": "合规性评价"}, "answer": "A", "explanation": "最高管理者对管理体系进行评价属于\"管理评审\"。选A。"}, {"id": 115, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "根据《卓越绩效评价准则》，建筑企业实施卓越绩效管理，在组织驱动力层面应遵循的基本 理念是（ ）。", "options": {"A": "以战略统领组织的管理活动", "B": "学习、改进与创新", "C": "重视过程与关注结果", "D": "确保组织中员工的发展和权益"}, "answer": "A", "explanation": "卓越绩效管理中组织驱动力层面应遵循\"远见卓识的领导\"和\"战略导向\"等基本理念。选A。"}, {"id": 116, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "multi", "stem": "根据国家标准《卓越绩效评价准则》，组织实施卓越绩效管理的基本理念可分为三个层面， 其中阐明组织经营行为层面的基本理念有（ ）。", "options": {"A": "合作共赢", "B": "战略导向", "C": "社会责任", "D": "系统管理", "E": "以人为本"}, "answer": "ACE", "explanation": "卓越绩效组织经营行为层面理念：顾客驱动卓越、重视过程与关注结果、学习改进与创新。选ACE。"}, {"id": 117, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "single", "stem": "《卓越绩效评价准则》的实质是一种（ ）评价。", "options": {"A": "标准化导向", "B": "符合性", "C": "合格性", "D": "成熟度"}, "answer": "D", "explanation": "卓越绩效评价准则实质是一种\"成熟度\"评价（评估组织管理成熟程度）。选D。"}, {"id": 118, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "multi", "stem": "卓越绩效评价准则框架中，构成“领导作用”三角的是（ ）。", "options": {"A": "资源", "B": "过程管理", "C": "战略", "D": "顾客与市场", "E": "分析和改进"}, "answer": "CD", "explanation": "卓越绩效框架中领导作用三角含：领导、战略、顾客与市场。选CD。"}, {"id": 119, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "multi", "stem": "我国建筑企业已由粗放型发展转为精细化经营，未来发展的关键是全面发展，不断提高核心竞争 力，实施卓越绩效管理的措施有（ ）。", "options": {"A": "发挥领导带头作用，强化卓越意识", "B": "坚持标准化导向，统领管理活动", "C": "坚持顾客导向，提高顾客满意度", "D": "履行企业责任，成为卓越企业公民", "E": "重视结果管理，从多个维度关注结果"}, "answer": "AC", "explanation": "实施卓越绩效管理的措施含：培育卓越文化、强化战略管理、持续改进创新等。选AC。"}, {"id": 120, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "multi", "stem": "建筑企业建立和实施质量、环境、职业健康安全一体化管理体系时，支持与运行过程需进行 的工作有（ ）。", "options": {"A": "实施并保持沟通", "B": "确定并提供资源", "C": "创建、更新和控制成文信息", "D": "持续改进", "E": "管理评审"}, "answer": "ABC", "explanation": "一体化管理体系支持与运行过程含：资源管理、运行策划与控制、应急准备和响应等。选ABC。"}, {"id": 121, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "single", "stem": "企业新建立全面一体化管理体系时，管理体系文件一般按（ ）顺序进行。 ①程序文件②管理手册③记录④工作指导书。", "options": {"A": "①②③④", "B": "②①③④", "C": "②①④③", "D": "①②④③"}, "answer": "C", "explanation": "管理体系文件编制顺序：管理手册→程序文件→工作指导书→记录。即②-①-④-③。选C。"}, {"id": 122, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "single", "stem": "《风险管理指南》采用“三轮”形式中，风险 管理原则轮的核心是（ ）。", "options": {"A": "领导作用与承诺", "B": "创造和保护价值", "C": "风险识别", "D": "风险评价"}, "answer": "B", "explanation": "风险管理原则轮的核心是\"价值创造和保护\"。选B。"}, {"id": 123, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "根据《社会责任指南》，为履行“公平运行实践”的核心主题，建筑企业应确定的社会责任 议题是（ ）。", "options": {"A": "民主管理", "B": "职业健康安全", "C": "尊重产权", "D": "收入创造"}, "answer": "C", "explanation": "公平运行实践核心主题的社会责任议题含：反腐败、公平竞争、尊重产权等。选C。"}, {"id": 124, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "multi", "stem": "根据《社会责任指南》，为履行“劳工实践”的核心主题，建筑企业应确定的社会责任议题是（ ）。", "options": {"A": "民主管理", "B": "职业健康安全", "C": "尊重产权", "D": "工作中的基本原则和权利", "E": "公民和政治权利"}, "answer": "AB", "explanation": "劳工实践核心主题含：就业和雇佣关系、工作条件和社会保护、社会对话。选AB。"}, {"id": 125, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "建筑企业应践行ESG发展理念。这里的“ESG”分别指的是（ ）。", "options": {"A": "生态、社会、治理", "B": "环境、社会、治理", "C": "环境、监督、绿色", "D": "生态、监督、绿色"}, "answer": "B", "explanation": "ESG分别代表Environment(环境)、Social(社会)、Governance(治理)。选B。"}, {"id": 126, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题II改", "type": "multi", "stem": "项目管理协会(PM1)发布的《项目管管理知识体系指南(第8版)》中，项目管理绩效所包 含的内容有（ ）", "options": {"A": "进度", "B": "资源", "C": "财务", "D": "构建赋能文化", "E": "聚焦于价值"}, "answer": "ABC", "explanation": "PMBOK第8版项目管理绩效含：干系人绩效、过程绩效、交付物绩效等。选ABC。"}, {"id": 127, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题II", "type": "multi", "stem": "国际项目管理协会（IPMA）制定的个人能力基准中，考核“个人能力”所包含的维度有（ ）。", "options": {"A": "环境能力", "B": "决策能力", "C": "行为能力", "D": "技术能力", "E": "协调能力"}, "answer": "ACD", "explanation": "IPMA个人能力基准中\"个人能力\"含：自我反思与管理、诚信与可靠、领导力等维度。选ACD。"}, {"id": 128, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题II", "type": "single", "stem": "项目管理责任制度的核心内容是（ ）。", "options": {"A": "项目经理责任制", "B": "项目承包责任制", "C": "项目绩效考核制度", "D": "项目奖惩制度"}, "answer": "A", "explanation": "项目管理责任制度核心内容是明确项目经理的责权利。选A。"}, {"id": 129, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "single", "stem": "根据《建设工程项目管理规范》规定的项目沟通管理程序，项目沟通管理首先应进行的工作 是（ ）。", "options": {"A": "分解项目实施目标", "B": "制定项目沟通计划", "C": "明确项目沟通内容", "D": "分析项目相关方需求"}, "answer": "A", "explanation": "沟通管理程序第一步是\"沟通计划\"（明确沟通需求）。选A。"}, {"id": 130, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "multi", "stem": "根据《建设工程施工项目经理岗位职业标准》，施工项目经理在施工过程管理中应进行的工 作有（ ）。", "options": {"A": "进行项目实施策划", "B": "建立工程项目管理体系", "C": "指派专人记录施工日志", "D": "定期组织召开施工例会", "E": "提交施工进展分析报告"}, "answer": "CDE", "explanation": "施工项目经理过程管理含：施工组织设计实施、进度控制、质量控制等。选CDE。"}, {"id": 131, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题II", "type": "single", "stem": "面对复杂多变的项目环境，项目管理的发展趋势是实施（ ）驱动型项目管理。", "options": {"A": "价值", "B": "资源", "C": "技术", "D": "组织"}, "answer": "A", "explanation": "面对复杂多变项目环境，项目管理趋势是实施\"价值\"驱动型管理。选A。"}, {"id": 132, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "single", "stem": "根据《项目管理知识体系指南（第7版）》，衡量项目成功的标志是（ ）。", "options": {"A": "按期交付项目成果", "B": "可交付成果得到相关方验收", "C": "实现收益并获取价值", "D": "达到预期目标并实现品质提升"}, "answer": "C", "explanation": "PMBOK第7版衡量项目成功标志是\"价值交付\"（交付预期价值成果）。选C。"}, {"id": 133, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "multi", "stem": "根据《项目管理知识体系指南》价值交付系统需要考虑的内容主要包括（ ）。", "options": {"A": "创造价值", "B": "组织治理体系", "C": "与项目有关的职能", "D": "满足项目强调的“铁三角”", "E": "产品管理考虑因素"}, "answer": "ABCE", "explanation": "价值交付系统需考虑：价值定义、价值实现、价值衡量、干系人参与等。选ABCE。"}, {"id": 134, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "练习题", "type": "single", "stem": "根据国际标准《项目、项目群和项目组合管理项目群管理指南》，下列说法不正确的是（ ）。", "options": {"A": "项目组合中的项目一定相互依存和相互关联", "B": "项目群具有复杂性和不确定性", "C": "项目组合是一种层级结构", "D": "项目群由具有相互依存和相互关联的项目群组件构成"}, "answer": "A", "explanation": "项目群管理与项目管理的区别：项目群关注战略层面的协调管理。选A（说法不正确的选项）。"}, {"id": 135, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2024年真题", "type": "multi", "stem": "关于项目群及其管理的说法，正确的有（ ）。", "options": {"A": "项目群经理负责项目群的整体绩效", "B": "一个项目群应至少包含三个项目群组件", "C": "项目群为利益相关方提供收益", "D": "项目群可以是战略性或经营性的", "E": "项目群收尾后方可实现无形收益"}, "answer": "ACD", "explanation": "项目群特点：目标战略性、多个项目协同、长期性、不确定性。选ACD。"}, {"id": 136, "chapter": "第2章 建设工程项目管理相关体系标准", "marker": "2025年真题", "type": "single", "stem": "下列项目群关键角色和责任者中，负责整个项目群战略和支持的是（ ）。", "options": {"A": "项目群经理", "B": "项目群协调人", "C": "项目群管理团队负责人", "D": "项目群发起人"}, "answer": "D", "explanation": "负责项目群战略和支持的角色是\"项目群发起人\"。选D。"}, {"id": 137, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题", "type": "single", "stem": "下列建设工程招标投标行为中，属于要约行为的是（ ）。", "options": {"A": "招标人发布招标公告", "B": "招标人发售招标文件", "C": "投标人提交投标文件", "D": "招标人发出中标通知书"}, "answer": "C", "explanation": "招标人可委托招标代理机构办理招标事宜，招标代理机构应在招标人委托范围内办理。选C。"}, {"id": 138, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题II", "type": "multi", "stem": "建设单位采用邀请招标方式选择施工单位的优点有（ ）。", "options": {"A": "投标人数量较少，可以减少评标工作量，降低费用", "B": "投标人范围较广，有利于获得在技术上有竞争力的报价", "C": "不需要设置资格预审环节，可以缩短招标时间", "D": "可以在一定程度上减少合同履行中的承包商违约风险", "E": "可以在较大程度上避免招标过程中的串标行为"}, "answer": "ACD", "explanation": "邀请招标是指招标人以投标邀请书方式邀请特定法人投标，适用于技术复杂或有特殊要求的项目。选ACD。"}, {"id": 139, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题", "type": "single", "stem": "与公开招标方式相比，采用邀请招标方式具有的特点是（ ）。", "options": {"A": "招标人不需要发出投标邀请函", "B": "投标人不需要提交表明其资质的证明材料", "C": "评标时不需要对投标文件进行合格性审查", "D": "招标中不需要设置资格预审程序"}, "answer": "D", "explanation": "公开招标是指招标人以招标公告方式邀请不特定的法人或其他组织投标。选D。"}, {"id": 140, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "当建设单位采用邀请招标的方式选择承包商时，一般邀请的对象最少不应少于（ ）家。", "options": {"A": "3", "B": "5", "C": "7", "D": "10"}, "answer": "A", "explanation": "邀请招标是指招标人以投标邀请书方式邀请特定法人投标，适用于技术复杂或有特殊要求的项目。选A。"}, {"id": 141, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题II", "type": "multi", "stem": "根据国家九部委《标准施工招标资格预审文件》，资格预审文件的内容包括（ ）。", "options": {"A": "项目建设概况", "B": "工程采用的技术标准和要求", "C": "拟采用的合同条款", "D": "资格审查办法", "E": "招标人对资格预审文件的澄清、修改"}, "answer": "ADE", "explanation": "九部委《标准施工招标资格预审文件》中，资格预审文件内容包括：项目建设概况（A）、资格审查办法（D）、招标人对资格预审文件的澄清与修改（E）等。B技术标准与C拟采用合同条款属于招标文件内容，不属资格预审文件。故选ADE。"}, {"id": 142, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题II", "type": "single", "stem": "对于工程规模大、专业复杂的工程，建设单位管理能力有限时，宜采用的发承包模式 是（ ）。", "options": {"A": "专业分包", "B": "合作体承包", "C": "施工总承包", "D": "平行承包"}, "answer": "C", "explanation": "工程规模大、专业复杂、建设单位管理能力有限时，宜委托施工总承包，由总承包单位统一协调管理，降低建设单位管理难度。平行承包（D）会增加建设单位协调工作量；专业分包（A）是承包方式下的细分。故选C。"}, {"id": 143, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题II", "type": "single", "stem": "施工投标资格预审中，与合格制相比，采用有限数量制时，需要对资格预审申请文件 进行的不同工作是（ ）。", "options": {"A": "初步审查", "B": "面谈答辩", "C": "详细审查", "D": "量化打分"}, "answer": "D", "explanation": "投标保证金不得超过估算价的2%且最高80万。投标人撤回投标，招标人应在5日内退还保证金及利息。选D。"}, {"id": 144, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "下列关于资格预审文件的说法中，正确的是（ ）。", "options": {"A": "资格预审文件的发售期不少于3 天", "B": "潜在投标人对资格预审文件有异议的，应在提交资格预审申请文件截止时间3 日前提出", "C": "潜在投标人对资格预审文件提出异议，招标人应自收到异议之日起2 日内作出答复", "D": "资格审查委员会应由招标人代表和有关技术、经济方面的专家组成，5 人以上单数"}, "answer": "D", "explanation": "资格审查委员会由招标人代表和有关技术、经济等方面专家组成，成员5人以上单数，专家不少于2/3（D正确）。A错误：资格预审文件发售期不得少于5日。B错误：对资格预审文件有异议应至少在提交申请文件截止时间2日前提出。C错误：招标人应自收到异议之日起3日内答复。故选D。"}, {"id": 145, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2014 年真题改", "type": "single", "stem": "发售招标文件和组织现场踏勘的说法，正确的是（ ）。", "options": {"A": "招标人应免费发放招标或资格预审文件", "B": "招标文件发出后不能进行澄清或修改", "C": "投标人踏勘现场发生的费用自理", "D": "自招标文件出售之日起至停止出售之日止，最短不得少于15 日"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 146, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题II", "type": "single", "stem": "采用综合评估法进行施工评标时，有两个投标人综合评分最高且得分相同，投标报价 也相同，则确定中标人的方法是（ ）。", "options": {"A": "由评标委员会投票确定", "B": "由投标人抽签确定", "C": "由招标人自行确定", "D": "由评标委员会主席确定"}, "answer": "C", "explanation": "评标委员会由招标人代表+技术经济专家组成，专家不少于2/3。选C。"}, {"id": 147, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "关于建设工程施工招标评标的说法，正确的是（ ）。", "options": {"A": "投标报价中出现单价与数量的乘积之和与总价不一致时，将作无效标处理", "B": "投标书中大写金额与小写金额不一致时，将作无效标处理", "C": "详细评审的综合评估法，按得分由高到低顺序推荐中标候选人", "D": "初步评审是对标书进行实质性审查"}, "answer": "C", "explanation": "评标由招标人依法组建的评标委员会负责。评标委员会由招标人代表和有关技术、经济专家组成，专家不少于成员总数的2/3。选C。"}, {"id": 148, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题", "type": "multi", "stem": "工程招标过程中，在开标环节应进行的工作有（ ）。", "options": {"A": "公布评标委员会成员名单", "B": "对投标文件进行形式审查", "C": "检查投标文件密封情况", "D": "公布投标人名称及其投标报价", "E": "设有标底的工程公布标底"}, "answer": "CDE", "explanation": "开标应在招标文件确定的提交投标文件截止时间的同一时间公开进行。选CDE。"}, {"id": 149, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "招标人和中标人应当自中标通知书发出之日起（ ）日内，按照招标文件和中标人的投标文件 订立书面合同。", "options": {"A": "5", "B": "15", "C": "30", "D": "60"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 150, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《招标投标法实施条例》，潜在投标人或者其他利害关系人对资格预审文件有异议，应当 在提交资格预审申请文件截止时间（ ）日前提出。", "options": {"A": "2", "B": "3", "C": "15", "D": "5"}, "answer": "A", "explanation": "《招标投标法实施条例》：潜在投标人或利害关系人对资格预审文件有异议的，应在提交资格预审申请文件截止时间2日前提出。故选A。"}, {"id": 151, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题", "type": "multi", "stem": "中标人在签订施工合同前应进行的谈判准备工作有（ ）。", "options": {"A": "收集发包人资信情况", "B": "分析发包人经济实力", "C": "研判合同双方地位和优劣势", "D": "草拟施工合同条款", "E": "拟订合同谈判方案"}, "answer": "ABCE", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选ABCE。"}, {"id": 152, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题II", "type": "multi", "stem": "可调总价施工合同履行过程中，常用的调价方法有（ ）。", "options": {"A": "价差调整法", "B": "文件证明法", "C": "票据价格调整法", "D": "公式调价法", "E": "量差调整法"}, "answer": "BCD", "explanation": "合同履行过程中，承包人和发包人均应按合同约定全面履行义务。选BCD。"}, {"id": 153, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "某工程合同价为1000 万元，合同约定：物价变化时合同价款调整采用调值公式法，其中固定 要素比例为0.3，调价要素为人工费、钢材、水泥三类，分别占合同价的比例为0.2、0.15、0.35，结算 时价格指数分别增长了20%、15%、25%，则该工程实际价款的变化值为（ ）万元。", "options": {"A": "150", "B": "100", "C": "120", "D": "200"}, "answer": "A", "explanation": "调值公式调整额=合同价×Σ(可调比例×指数增长率)=1000×(0.2×20%+0.15×15%+0.35×25%)=1000×(4%+2.25%+8.75%)=1000×15%=150万元。固定部分0.3不参与调整。故选A。"}, {"id": 154, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "某工程合同价为1000 万元，合同约定：物价变化时合同价款调整采用调值公式法，其中固定 要素比例为0.3，调价要素为人工费、钢材、水泥三类，分别占合同价的比例为0.2、0.15、0.35，结算 时价格指数分别增长了20%、15%、25%，则该工程实际价款的变化值为（ ）万元。", "options": {"A": "150", "B": "100", "C": "120", "D": "200"}, "answer": "A", "explanation": "调值公式调整额=合同价×Σ(可调比例×指数增长率)=1000×(0.2×20%+0.15×15%+0.35×25%)=1000×15%=150万元。固定部分0.3不参与调整。故选A。"}, {"id": 155, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题II", "type": "single", "stem": "对于工期不超过1 年、工程规模较小、技术简单成熟、招标时已有施工图设计文件的 中小型工程，一般宜采用的合同计价方式是（ ）。", "options": {"A": "可调总价合同", "B": "固定单价合同", "C": "固定总价合同", "D": "可调单价合同"}, "answer": "C", "explanation": "单价合同是根据实际完成工程量和合同单价结算。选C。"}, {"id": 156, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2021 年真题", "type": "single", "stem": "关于固定单价合同的说法，正确的是（ ）。", "options": {"A": "当通货膨胀达到一定水平时，可对单价进行调整", "B": "当国家政策发生变化时，可对单价进行调整", "C": "当实际工程量发生较大变化时，可对单价进行调整", "D": "无论发生哪些影响价格的因素都不对单价进行调整"}, "answer": "D", "explanation": "单价合同是根据实际完成工程量和合同单价结算。选D。"}, {"id": 157, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2009 年真题", "type": "multi", "stem": "当建设工程施工承包合同的计价方式采用变动单价时，合同中可以约定合同单价调整的情 况有（ ）。", "options": {"A": "工程量发生比较大的变化", "B": "承包商自身成本发生比较大的变化", "C": "业主资金不到位", "D": "市场价格变化达到一定程度", "E": "国家相关政策发生变化"}, "answer": "ADE", "explanation": "采用变动单价合同时，可约定当工程量发生较大变化（A）、市场价格变化达到约定程度（D）、国家有关政策变化（E）时调整单价。B承包商自身成本变化由承包商承担不调价；C业主资金不到位是履约问题，非单价调整事由。故选ADE。"}, {"id": 158, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2019 年真题", "type": "single", "stem": "某土石方工程采用混合计价。其中土方工程采用总价包干14万元，石方工程采用综合单价合同，单价为100元/m³。该工程有关工程量和价格资料见下表，则该工程结算价款为（ ）万元。<br><table class=\"data-table\"><thead><tr><th>项目</th><th>估计工程量（m³）</th><th>实际工程量（m³）</th><th>合同单价（元/m³）</th></tr></thead><tbody><tr><td>土方工程</td><td>3300</td><td>3600</td><td>/</td></tr><tr><td>石方工程</td><td>2000</td><td>2500</td><td>100</td></tr></tbody></table>", "options": {"A": "34", "B": "39", "C": "37", "D": "42"}, "answer": "B", "explanation": "施工投标程序：研究招标文件→调查投标环境→制定施工方案→报价→编制投标文件。选B。"}, {"id": 159, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "工程施工合同采用目标成本加奖罚计价方式时，合同价款正确的计算方式是（ ）。", "options": {"A": "实际发生的直接费+目标成本×基本酬金计算百分比+奖罚酬金", "B": "目标成本×（1+基本酬金计算百分比）+奖罚酬金", "C": "目标成本+实际发生的直接费×基本酬金计算百分比+奖罚酬金", "D": "实际发生的直接费×（1+基本酬金计算百分比）+奖罚酬金"}, "answer": "A", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选A。"}, {"id": 160, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "multi", "stem": "下列成本加酬金合同中，降低成本的有（ ）。", "options": {"A": "成本加固定酬金合同", "B": "成本加固定百分比酬金合同", "C": "成本加浮动酬金合同", "D": "目标成本加固定酬金合同", "E": "目标成本加奖罚合同"}, "answer": "CE", "explanation": "成本加酬金合同适用于工程特别复杂、无法准确确定工程造价的情况。选CE。"}, {"id": 161, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "multi", "stem": "建设单位选择合同计价方式时，通常会考虑的因素有（ ）。", "options": {"A": "分包合同数量", "B": "工程复杂程度", "C": "工程设计深度", "D": "工期紧迫程度", "E": "专业工程种类"}, "answer": "BCD", "explanation": "单价合同是根据实际完成工程量和合同单价结算。选BCD。"}, {"id": 162, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "single", "stem": "下列施工合同计价方式中，施工单位基本没有费用风险的是（ ）。", "options": {"A": "总价合同", "B": "成本加固定酬金合同", "C": "目标成本加奖罚合同", "D": "单价合同"}, "answer": "B", "explanation": "单价合同是根据实际完成工程量和合同单价结算。选B。"}, {"id": 163, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "对于施工中有较大部分采用新技术、新工艺的工程，建设单位和施工单位缺乏经验，又无国家标 准的，应选用（ ）。", "options": {"A": "成本加酬金合同", "B": "固定单价合同", "C": "可调单价合同", "D": "可调总价合同"}, "answer": "A", "explanation": "施工中有较大部分采用新技术、新工艺，发包人和承包人缺乏经验又无国家标准时，工程成本与工期难以准确估算，宜选用成本加酬金合同，由发包人承担大部分风险。故选A。"}, {"id": 164, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "下列施工单位准备投标的工程中，报价可以偏高一些的有（ ）。", "options": {"A": "施工条件差、工期又紧的工程", "B": "有特殊要求的港口码头工程", "C": "支付条件不理想的地下开挖工程", "D": "投标对手多、竞争激烈的工程", "E": "专业要求高的技术密集型工程且施工单位在这方面有专长，声望也比较高"}, "answer": "ABCE", "explanation": "报价可偏高的情形：施工条件差、工期紧（A）；有特殊要求的港口码头等（B）；支付条件不理想的地下开挖（C）；专业要求高且本单位有专长、声望高（E）。D竞争对手多、竞争激烈时应适当降低报价。故选ABCE。"}, {"id": 165, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024 年真题II", "type": "multi", "stem": "某施工设计项目采用不平衡报价法报价时，可采用较低报价的分部工程有（ ）。", "options": {"A": "后期施工的装饰装修工程", "B": "业主可能取消的分部工程", "C": "前期施工的分部工程", "D": "施工难度大的分部工程", "E": "预计工程量会增加的分部工程"}, "answer": "AB", "explanation": "不平衡报价中，对后期施工、可能减少工程量或被业主取消的分部工程（如后期装饰装修A、业主可能取消B）可报低价，以便早期收回资金、降低风险。前期施工（C）、施工难度大（D）、预计工程量增加（E）的分部宜报高价。故选AB。"}, {"id": 166, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "招标人在施工招标文件中规定了暂定金额的分项内容和暂定总价款时，并规定所有投标单位都必 须在总报价中加入这笔固定金额，投标人可采用的报价策略是（ ）。", "options": {"A": "适当提高暂定金额分项内容的单价", "B": "适当减少暂定金额中的分项工程量", "C": "适当降低暂定金额分项内容的单价", "D": "适当增加暂定金额中的分项工程量"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 167, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题", "type": "single", "stem": "施工投标文件编制完成后，按招标文件要求全面校对投标文件的正确做法是（ ）。", "options": {"A": "合理化建议内容无须进行多人次校对", "B": "编制人员校对后无需交由相关负责人审核", "C": "工程总报价至少应由两人分别校对一遍", "D": "校对时只是重点检查投标文件页码是否有误"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 168, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025 年真题", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》，工程总承包招标文件应包含的内容有（ ）。", "options": {"A": "合同条款及格式", "B": "发包人提供的资料", "C": "评标办法", "D": "图纸和工程量清单", "E": "投标资格审查办法"}, "answer": "ABC", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ABC。"}, {"id": 169, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "招标人按照投标人须知前附表要求，对于符合招标文件规定的未中标人的设计成果给予补偿后， 关于该设计成果使用的说法，正确的是（ ）。", "options": {"A": "招标人应保护未中标人知识产权且不得使用其设计成果", "B": "招标人有权免费使用未中标人的设计成果", "C": "应由中标人与未中标人协商使用其设计成果的许可和费用", "D": "中标人应邀请未中标人加入其设计团队并使用末中标人的设计成果"}, "answer": "B", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选B。"}, {"id": 170, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "组成施工合同文件包括：①投标函及投标函附件；②中标通知书；③合同协议书；④通用 合同条款；⑤专用合同条款等。这些合同文件的优先解释顺序为（ ）。", "options": {"A": "③-①-②-④-⑤", "B": "③-②-①-④-⑤", "C": "③-②-①-⑤-④", "D": "①-②-③-⑤-④"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 171, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《建设工程施工合同（示范文本）》（GF-2017-0201）的规定，下列合同文件中的解 释顺序优先的是（ ）", "options": {"A": "中标通知书", "B": "通用合同条款", "C": "合同协议书", "D": "专用合同条款"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 172, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "根据《标准施工招标文件》，下列工作中，属于发包人责任和义务的有（ ）。", "options": {"A": "提供施工场地的地下管线和地下设施等资料", "B": "负责施工现场的环境保护工作", "C": "编制施工环保措施计划", "D": "应负责修建、维修、养护和管理施工所需的临时道路", "E": "组织设计单位进行设计交底"}, "answer": "AE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选AE。"}, {"id": 173, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "multi", "stem": "根据国家九部委《标准施工招标文件》，下列工作中，属于承包人主要义务的有（ ）。", "options": {"A": "组织合同工程的竣工验收", "B": "组织设计交底", "C": "负责施工现场内外的交通道路", "D": "编制工程实施的各项措施计划", "E": "查勘施工现场"}, "answer": "DE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选DE。"}, {"id": 174, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "工程施工合同履行过程中，承包人应履行的义务是（ ）。", "options": {"A": "组织审查施工图设计文件", "B": "查勘施工现场", "C": "取得出入施工场地的专用道路通行权", "D": "组织工程竣工预验收"}, "answer": "B", "explanation": "合同履行过程中，承包人和发包人均应按合同约定全面履行义务。选B。"}, {"id": 175, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《标准施工招标文件》，征得发包人同意后，监理人应在开工日期（ ）天前向承包 人发出开工通知。", "options": {"A": "14", "B": "21", "C": "7", "D": "28"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 176, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "multi", "stem": "根据《标准施工招标文件》，承包人应编制的工程实施措施计划有（ ）。", "options": {"A": "施工安全措施计划", "B": "施工组织设计", "C": "施工环保措施计划", "D": "施工进度计划", "E": "竣工验收组织方案"}, "answer": "ABCD", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ABCD。"}, {"id": 177, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "single", "stem": "根据《标准施工招标文件》，承包人应在（ ）前负责维护和照管工程。", "options": {"A": "竣工清场完成", "B": "工程接收证书颁发", "C": "缺陷责任期届满", "D": "竣工付款证书颁发"}, "answer": "B", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选B。"}, {"id": 178, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "《标准施工招标文件》通用合同条约中的“基准日期”指的是（ ）。", "options": {"A": "投标截止日期之前的第14天", "B": "合同签订日期之前的第14天", "C": "投标截止日期之前的第28天", "D": "合同签订日期之前的第28天"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 179, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "第三者责任保险应以（ ）名义投保", "options": {"A": "第三者", "B": "承包方", "C": "发包方", "D": "发包人和承包人"}, "answer": "D", "explanation": "第三者责任险应以发包人和承包人双方的名义共同投保，保障因工程意外对第三方造成损害的赔偿责任。故选D。"}, {"id": 180, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《标准施工招标文件》，发包人应采纳承包人提出的提前竣工建议而获得效益的（ ） 给予承包人奖励。", "options": {"A": "20%", "B": "10%", "C": "30%", "D": "50%"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 181, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2018年真题", "type": "multi", "stem": "某建设工程因发包人提出设计图纸变更，监理人向承包人发出暂停施工指令，60天后，仍未 向承包人发出复工通知，则承包人正确的做法有（ ）。", "options": {"A": "向监理人提交书面通知，要求监理人在接到书面通知后28天内准许已暂停的工程继续施工", "B": "不受设计变更影响的部分工程，不论监理人是否同意，承包人都可进行施工", "C": "如监理人逾期不予批准承包人的书面通知，则承包人可以通知监理人，将工程受影响部分视为变更的可取 消工作", "D": "如暂停施工影响到整个工程，可视为发包人违约", "E": "要求发包人延长工期，支付合理利润"}, "answer": "ACDE", "explanation": "监理人暂停施工指令发出后逾期（合同约定/56天）未复工，承包人可：书面通知要求限期准许复工（A）；逾期可将受影响部分视为变更的可取消工作（C）；影响整个工程可视为发包人违约（D）；有权要求延长工期和合理利润（E）。B错误：不受影响部分也须按监理人指示施工，不能擅自进行。故选ACDE。"}, {"id": 182, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2019年真题II", "type": "single", "stem": "根据《标准施工招标文件》关于暂停施工的说法，正确的是（ ）。", "options": {"A": "因发包人原因发生暂停施工的紧急情况时，承包人可以先暂停施工，并及时向监理人提出暂停施工的书面 请求", "B": "发包人原因造成暂停施工，承包人可不负责暂停施工期间工程的安全保障", "C": "施工中出现意外情况需要暂停施工的，所有责任由发包人承担", "D": "由于发包人原因引起的暂停施工，承包人有权要求延长工期和（或）增加费用，但不得要求补偿利润"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 183, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "根据《标准施工招标文件》，发包人提供的工程设备，应在工程设备到货（ ）天前通知承 包人。", "options": {"A": "7", "B": "3", "C": "5", "D": "14"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 184, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "承包人按合同约定覆盖了由劳务分包人完成的工程隐蔽部位后，监理人对质量有疑问，要 求承包人对已覆盖的部位重新检验，经检验证明工程质量符合合同要求的，由此增加的费用和延误的工期应 由（ ）承担。", "options": {"A": "监理人", "B": "发包人", "C": "承包人", "D": "劳务分包人"}, "answer": "B", "explanation": "承包人覆盖工程隐蔽部位后，监理人对质量有疑问要求重新检验，经检验证明质量符合合同要求的，由此增加的费用和延误的工期由发包人承担，并支付承包人合理利润。故选B。"}, {"id": 185, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2022年真题II", "type": "single", "stem": "根据《标准施工招标文件》，承包人自检确认的工程隐蔽部位具备覆盖条件后，监理人未 按与承包人约定的时间进行检查且没有其他指示，承包人正确的做法是（ ）。", "options": {"A": "自行完成覆盖工作，并拒绝监理人重新检查的要求", "B": "自行完成覆盖工作，并将相应记录报送监理人签字确认", "C": "自行完成覆盖工作，并向监理人进行索赔", "D": "报告政府质量监督机构后自行完成覆盖工作"}, "answer": "B", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选B。"}, {"id": 186, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《标准施工招标文件》,关于工程计量的说法，正确的是（ ）。", "options": {"A": "总价子目按实际完成工程量计量", "B": "单价子目按支付分解报告确定的周期计量", "C": "总价子目的计量可按正常物价波动进行调整", "D": "发包人在收到承包人提交的工程量报表7天内进行复核"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 187, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "某单价合同履行中，承包人提交了已完工程量报告，监理人需要到现场计量，并提前通知了承包 人，但承包人收到通知后没有派人参加。关于监理人现场计量结果的说法，正确的是（ ）。", "options": {"A": "以承包人的计量结果为准", "B": "以监理人修正的工程量为准", "C": "应再次重新测量后确定", "D": "双方的计量核实结果均无效"}, "answer": "B", "explanation": "单价合同是根据实际完成工程量和合同单价结算。选B。"}, {"id": 188, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《计价规范》，关于预付款的说法，正确的是（ ）。", "options": {"A": "承包人对安全生产措施费应专款专用，在财务账目中合并列项备查", "B": "发包人应在工程开工后的28 天内预付不低于安全生产措施费总额的60%。", "C": "工程预付款应在进度付款中扣回", "D": "其余安全文明施工费最终结算时一并支付"}, "answer": "C", "explanation": "工程预付款应在工程进度款中逐步扣回（C正确）。A错误：安全生产措施费应专款专用、单独列项。B错误：发包人应在开工后28天内预付不低于当年施工进度计划的安全文明施工费总额的60%。D错误：安全文明施工费应预付，非最终结算支付。故选C。"}, {"id": 189, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "关于施工合同中工程进度付款条款的说法，正确的有（）。", "options": {"A": "发包人签发进度款支付证书，表明发包人已接受了承包人完成的相应工作", "B": "发包人应在监理人收到进度付款申请单后的28天内，将进度应付款支付给承包人", "C": "监理人无权扣发承包人未能按照合同要求履行任何工作或义务的相应金额", "D": "发包人应在进度款支付证书签发后28天内完成支付"}, "answer": "B", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选B。"}, {"id": 190, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《财政部住房和城乡建设部关于完善建设工程价款结算有关办法的通知》，国有企业 应支付的建设工程进度款占已完成工程价款的最低的比例是（ ）", "options": {"A": "50%", "B": "80%", "C": "60%", "D": "70%"}, "answer": "B", "explanation": "横道图优点：直观易懂、编制简单；缺点：不能反映工作逻辑关系和关键线路。选B。"}, {"id": 191, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "multi", "stem": "根据《标准施工招标文件》，承包人向监理人提交的竣工付款申请单中应包括的内容有（ ）。", "options": {"A": "竣工结算合同总价", "B": "已支付承包人的工程价款", "C": "应支付的最终结清付款金款", "D": "应扣留的质量保证金", "E": "应支付的竣工付款金额"}, "answer": "ABDE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ABDE。"}, {"id": 192, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "下列关于竣工结算款支付和质量保证金的说法，正确的是（ ）。", "options": {"A": "发包人在收到承包人提交竣工结算申请书14天内未完成审批且未提出异议的，视为认可", "B": "发包人应在签发竣工付款证书后的14天内，支付价款", "C": "工程质量保证金的计算应包括预付款的支付、扣回及价格调整的金额", "D": "若承包人没有完成缺陷责任，发包人有权扣留全部剩余的工程质量保证金"}, "answer": "B", "explanation": "质量保证是质量管理的一部分，致力于提供质量要求会得到满足的信任。选B。"}, {"id": 193, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2023年真题II", "type": "single", "stem": "根据《标准施工招标文件》，不属于工程变更的是（ ）。", "options": {"A": "为完成工程所需要追加的额外工作", "B": "取消承包人合同中的某项工作，转由第三人实施", "C": "改变合同工程的标高", "D": "改变合同中某一项工作的质量标准"}, "answer": "B", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选B。"}, {"id": 194, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2015年真题II", "type": "single", "stem": "根据《标准施工招标文件》，施工合同履行过程中发生工程变更时，由（ ）向承包人发 出变更指令。", "options": {"A": "业主", "B": "设计人", "C": "变更提出方", "D": "监理人"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 195, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2019年真题", "type": "single", "stem": "根据《标准施工招标文件》，关于施工合同变更权和变更程序的说法，正确的是（ ）。", "options": {"A": "发包人可以直接向承包人发出变更意向书", "B": "承包人书面报告发包人后，可根据实际情况对工程进行变更", "C": "承包人根据合同约定，可以向监理人提出书面变更建议", "D": "监理人应在收到承包人书面建议后30天内做出变更指示"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 196, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2020年真题II", "type": "multi", "stem": "根据《标准施工招标文件》，监理人发出的变更指示应包括的内容有（ ）。", "options": {"A": "变更目的", "B": "变更范围", "C": "变更程序", "D": "变更内容", "E": "变更的工程量"}, "answer": "ABDE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ABDE。"}, {"id": 197, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2018年真题II", "type": "single", "stem": "根据《标准施工招标文件》通用合同条款，承包人应该在收到变更指示最多不超过（ ） 天内，向监理人提交变更报价书。", "options": {"A": "14", "B": "7", "C": "28", "D": "30"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 198, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《标准施工招标文件》，除专用合同条款另有约定外，因工程变更引起价格调整时， 已标价工程量清单中又无适用或类似子目价格的，应由监理人和合同当事人按照（ ）的原则商定或确定变 更工作单价。", "options": {"A": "成本加规费", "B": "成本加酬金", "C": "成本加利润", "D": "成本加税金"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 199, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2020年真题II改", "type": "single", "stem": "根据《标准施工招标文件》中的变更估价原则，对于已标价工程量清单中无适用或类似 子目的变更工程的单价，应由（ ）商定。", "options": {"A": "发包人与监理人", "B": "提出变更方与合同当事人", "C": "承包人与监理人", "D": "监理人与合同当事人"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 200, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2021年真题", "type": "single", "stem": "某现浇混凝土工程采用工程量清单中的工程数量为3000m³；合同约定：综合单价为800元/m³， 当实际工程量超过清单中工程数量的15%时，综合单价调整为原单价的0.9倍。工程结束时经监理工程师确认 的实际完成工程量为3500m³，则现浇混凝土工程款应为（ ）万元。", "options": {"A": "240.0", "B": "252.0", "C": "279.6", "D": "276.0"}, "answer": "C", "explanation": "清单量3000，约定超15%（即3450）单价调为0.9倍。实际3500：3450按原单价800元，超出50按800×0.9=720元。价款=3450×800+50×720=2,760,000+36,000=2,796,000元=279.6万元。故选C。"}, {"id": 201, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "某混凝土工程，工程量清单的工程量为2000m³，合同约定的综合单价为400元/m³，后因业主原因 实际工程量变为1600m³。合同约定：若实际工程量与清单工程量偏差超过15%，则综合单价调整，调整系数分 别为1.1和0.9。则该混凝土工程的结算价款是（ ）万元。", "options": {"A": "57.6", "B": "64", "C": "70.4", "D": "74.4"}, "answer": "C", "explanation": "前锋线比较法通过实际进度前锋判断偏差。选C。"}, {"id": 202, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "single", "stem": "根据《标准施工招标文件》，关于计日工价款的说法，正确的是（ ）。", "options": {"A": "计日工价款应由承包人汇总后，按合同约定列入进度付款申请单", "B": "采用计日工计价的变更工作，相应价款应从暂估价中支付", "C": "承包人应按月提交变更工作人员名单，并向监理人报送计日工价款支付报表", "D": "计日工单价应按照成本加利润的原则，由监理人与承包人商定"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 203, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2023年真题II", "type": "multi", "stem": "根据《建设工程工程量清单计价规范》，采用计日工计价的任何一项工作，承包人应按合 同约定提交发包人复核的资料有（ ）。", "options": {"A": "投入该工作施工设备型号、台数和耗用台时", "B": "工作名称、内容和数量", "C": "投入该工作的所有人员的姓名、专业、工种、级别和耗用工时", "D": "不同工种计日工单价的调整方法和理由", "E": "投入该工作的材料类别和数量"}, "answer": "ABCE", "explanation": "采用计日工计价的工作，承包人应提交：投入设备型号台数和耗用台时（A）；工作名称、内容和数量（B）；投入人员姓名、工种、级别和耗用工时（C）；投入材料类别和数量（E）供发包人复核。D单价调整方法非计日工必提交资料。故选ABCE。"}, {"id": 204, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "根据《标准施工招标文件》，承包人向监理人报送竣工验收申请报告时，工程应具备的条件有（ ）。", "options": {"A": "已按合同约定的内容和份数备齐复核要求的竣工资料", "B": "已经收到发包人支付的竣工结算款", "C": "监理人要求提交的竣工验收资料清单", "D": "已按监理人要求编制了缺陷责任期内完成的甩项工作清单及施工计划", "E": "已按监理人要求编制了缺陷责任期内的缺陷修补工作清单及施工计划"}, "answer": "ACDE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ACDE。"}, {"id": 205, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "根据国家九部委《标准施工招标文件》，在正常情况下发包人在收到承包人提交验收申请 报告56天后未进行验收的，实际竣工日期应为（ ）。", "options": {"A": "发包人收到竣工验收申请报告的日期", "B": "提交竣工验收申请报告后第56天", "C": "提交竣工验收申请报告的日期", "D": "发包人未来实际进行竣工验收合格的日期"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 206, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "根据《标准施工招标文件》,除专用合同条款另有约定外，经验收合格的工程实际竣工日期是 （ ）。", "options": {"A": "施工合同约定的竣工日期", "B": "工程接收证书的出具日期", "C": "承包人提交竣工付款申请单的日期", "D": "承包人提交竣工验收申请报告的日期"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 207, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "根据《标准施工招标文件》
