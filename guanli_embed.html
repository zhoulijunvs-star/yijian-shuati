gle", "stem": "根据《标准设计施工总承包招标文件》，除专用合同条款另有约定外，解释顺序排在“承包 人建议书”之后的合同文件是（ ）。", "options": {"A": "发包人要求", "B": "通用合同条款", "C": "专用合同条款", "D": "价格清单"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 219, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》,“承包人建议书”应包括的内容有（ ）。", "options": {"A": "工程设备方案说明", "B": "功能要求", "C": "工程量清单", "D": "分包方案", "E": "对发包人要求中错误的说明"}, "answer": "ADE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ADE。"}, {"id": 220, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《标准设计施工总承包招标文件》，“发包人要求”中出现错误或违法情况时，下列说法正 确的是（ ）。", "options": {"A": "承包人复核时未发现对工程的工艺安排的错误，承包人自行承担由此导致增加的费用和（或）工期延误", "B": "承包人复核时未发现对工程的检验标准错误，发包人承担由此导致增加的费用和（或）工期延误", "C": "选择无条件补偿条款时，承包人复核时未发现发包人要求中存在错误的，承包人自行承担由此导致增加的 费用", "D": "选择有条件补偿条款时，承包人复核时未发现发包人要求中存在错误的，发包人承担由此导致增加的费用"}, "answer": "B", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选B。"}, {"id": 221, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》，关于竣工试验的说法，正确的有（ ）。", "options": {"A": "承包人应在竣工试验中进行适当的检查和功能性试验", "B": "承包人应提前14天将申请竣工试验通知送达监理人", "C": "监理人应在接到竣工试验通知后21天内确定竣工试验时间", "D": "除专用合同条款另有约定外，竣工试验应按三阶段进行", "E": "承包人应在竣工试验前提交竣工记录、正式操作和维修手册"}, "answer": "AD", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选AD。"}, {"id": 222, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "根据《标准设计施工总承包招标文件》， 下列说法正确的有（ ）。", "options": {"A": "因发包人原因造成监理人未能在合同签订之日起60天内发出开工通知，承包人有权提出价格调整要求，或 者解除合同", "B": "价格清单列出的任何数量为实际的工程量", "C": "承包人应在收到经监理人批复的合同进度计划后14天内， 将支付分解报告以及形成支付分解报告的支持性资料报监理人审批", "D": "已签发区段工程验收证书的区段工程由发包人负责照管", "E": "监理人获得发包人同意后，应提前7天向承包人发出开始工作通知"}, "answer": "DE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选DE。"}, {"id": 223, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2022年真题", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》，关于专业工程分包人责任和义务的说法， 正确的是（ ）。", "options": {"A": "负责施工现场的管理工作，与同一施工现场的其他分包人做好配合协调工作", "B": "已竣工分包工程未交付，分包人应负责已完分包工程的成品保护工作", "C": "就分包范围内的工作，分包人根据需要可与发包人直接联系", "D": "分包人征得发包人的同意，可以将其承包的工程转包给他人"}, "answer": "B", "explanation": "专业分包人对分包工程的质量安全向承包人负责，分包人应服从承包人管理。选B。"}, {"id": 224, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2020年真题", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》，关于专业工程分包人责任和义务的说法， 正确的是（ ）。", "options": {"A": "分包人应允许发包人授权的人员在工作时间内合理进入分包工程施工场地", "B": "分包人必须服从发包人直接发出的指令", "C": "遵守政府有关主管部门的管理规定但不用办理有关手续", "D": "分包人可以直接与发包人或工程师发生直接工作联系"}, "answer": "A", "explanation": "分包人应负责分包工程的成品保护。选A。"}, {"id": 225, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》，分包人与发包人或监理人发生直接工 作联系的，将被视为（ ）行为。", "options": {"A": "授权", "B": "无效", "C": "代理", "D": "违约"}, "answer": "D", "explanation": "分包人越过承包人与发包人或监理直接联系，视为违约行为。选D。"}, {"id": 226, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "根据《建设工程施工专业分包合同（示范文本）》，下列工作中，属于承包人（总承包单位）责 任和义务的有（ ）。", "options": {"A": "提供总包合同（价格内容除外）供分包人查阅", "B": "向分包人提供具备施工条件的施工场地", "C": "组织分包人参加由发包人组织的图纸会审", "D": "提供约定的设备和设施，分包承担因此发生的费用", "E": "为分包人提供详细施工组织设计"}, "answer": "ABC", "explanation": "承包人对分包人负责：提供图纸、支付工程款、协调现场施工条件、审批施工方案等。选ABC。"}, {"id": 227, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》，分包人不能按时开工，应在不迟于合同协议 书约定的开工日期前（ ）天，以书面形式向承包人提出延期开工的理由。", "options": {"A": "5", "B": "7", "C": "14", "D": "15"}, "answer": "A", "explanation": "分包人不能按时开工应提前5天书面提出延期申请。选A。"}, {"id": 228, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》关于专业分包合同价款及支付的说法，正 确的是（ ）。", "options": {"A": "分包合同计价方式应与总包合同约定的方式一致", "B": "分包合同价款应参照总包合同相应部分价款确定", "C": "承包人无须向分包人支付工程预付款", "D": "承包人确认计量结果后7天内支付分包工程进度款"}, "answer": "A", "explanation": "分包合同价款与总包合同中相应部分价款无必然联系（独立计价）。选A。"}, {"id": 229, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2019年真题", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》，关于专业分包的说法，正确的是（ ）", "options": {"A": "分包工程合同不能采用固定价格合同", "B": "分包工程合同价款与总包合同相应部分价款没有连带关系", "C": "专业分包人应按规定办理有关施工噪音排放的手续，并承担由此发生的费用", "D": "专业分包人只有在收到承包人的指令后，才能允许发包人授权的人员在工作时间内进入分包工程施工场地"}, "answer": "B", "explanation": "劳务分包中分包人应自行完成劳务作业，不得再次分包。选B。"}, {"id": 230, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《建设工程施工专业分包合同（示范文本）》， 关于专业分包完工验收和竣工结算的说法，不正确的是（ ）。", "options": {"A": "承包人应在收到分包人提供的竣工验收报告之日起3日内通知发包人进行验收。", "B": "分包工程竣工验收报告经承包人认可后14天内，分包人向承包人递交分包工程竣工结算报告及结算资料", "C": "承包人收到分包人递交的分包工程竣工结算报告及结算资料后28天内进行核实给予确认", "D": "分包人收到竣工结算价款之日起7天内，将竣工工程交付发包人"}, "answer": "D", "explanation": "竣工结算应在工程竣工验收合格后进行。选D。"}, {"id": 231, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《建设工程施工劳务分包合同（示范文本）》，下列合同规定的相关义务中，属于劳务分包 人义务的是（ ）。", "options": {"A": "组建项目管理班子", "B": "完成施工计划相应的劳动力安排计划", "C": "负责编制施工组织设计", "D": "负责工程测量定位和沉降观测"}, "answer": "B", "explanation": "劳务分包人义务：组织劳务人员施工、做好安全防护、保管工具等。选B。"}, {"id": 232, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "multi", "stem": "根据《建设工程施工劳务分包合同（示范文本）》，属于承包人义务的是（ ）。", "options": {"A": "组织编制物资需用量计划表", "B": "负责工程测量定位和沉降观测", "C": "提供施工人员安全防护用品", "D": "编制劳务分包人月度施工计划", "E": "协调工作关系"}, "answer": "ABCE", "explanation": "承包人应提供生产生活临时设施、施工图纸、协调管理、支付劳务报酬等。选ABCE。"}, {"id": 233, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "关于与劳务分包人有关的保险办理的说法，正确的是（ ）。", "options": {"A": "运至施工现场用于劳务施工的材料由劳务分包人办理并承担保险费用", "B": "工程承包人提供给劳务分包人使用的施工机械的保险费用由劳务分包人承担", "C": "工程承包人应获得发包人为施工场地内的自有人员办理的保险，劳务分包人不需要支付这部分保费", "D": "工程承包人为劳务分包人租赁的施工机械的保险费用由劳务分包人承担"}, "answer": "C", "explanation": "劳务分包人应为其自有人员办理保险。选C。"}, {"id": 234, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "根据《建设工程施工劳务分包合同（示范文本）》，关于工时及工程量确认的说法，正确的有 （ ）。", "options": {"A": "采用固定劳务报酬方式的，施工过程中不计算工时，只计算工程量", "B": "劳务分包人完成的超出设计图纸范围的工程量，工程承包人应按实际计量", "C": "采用按确定的工时计算劳务报酬的，劳务分包人每日将提供劳务人数报承包人确认", "D": "按确认的工程量计算劳务报酬的，劳务分包人提供完成的工程量报承包人确认", "E": "因劳务分包人原因造成返工的工程量，工程承包人不予计量"}, "answer": "CDE", "explanation": "工时和工程量由劳务分包人按月提交，承包人审核确认。选CDE。"}, {"id": 235, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "single", "stem": "根据《建设工程施工劳务分包合同（示范文本）》，处理施工变更的正确做法是（ ）。", "options": {"A": "监理人应提前7天向劳务分包人发出变更通知", "B": "承包人项目经理应提前14天向劳务分包人发出变更通知", "C": "劳务分包人不得对原工程设计进行变更", "D": "承包人承担变更所增加的劳务报酬，但工期不予顺延"}, "answer": "C", "explanation": "施工变更应通过承包人向发包人提出，经确认后实施。选C。"}, {"id": 236, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "根据《建设工程施工劳务分包合同（示范文本）》，关于不可抗力事件造成的费用分担原 则的说法，正确的是（ ）。", "options": {"A": "劳务分包人的人员伤亡应由工程承包人负责并承担相应费用", "B": "劳务分包人的自有机械设备损坏应由劳务分包人自行承担", "C": "运至施工现场用于劳务作业的材料的损失应由劳务分包人承担", "D": "工程承包人提供给劳务分包人使用的机械设备损坏应由劳务分包人承担"}, "answer": "B", "explanation": "不可抗力导致合同不能履行的，根据不可抗力的影响部分或全部免除责任。选B。"}, {"id": 237, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《标准材料采购招标文件》，合同生效后，买方应向卖方支付的预付款占签约合同价 的比例是（）。", "options": {"A": "30%", "B": "10%", "C": "20%", "D": "5%"}, "answer": "B", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选B。"}, {"id": 238, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "multi", "stem": "根据《标准材料采购招标文件》，关于合同价格及价款支付的说法，正确的有（）。", "options": {"A": "供货周期不超过24个月的，应签订固定价合同", "B": "向卖方支付的结清款应为合同价格的5％", "C": "向卖方支付的预付款应为签约合同价的10％", "D": "供货周期超过6个月的，应签订可调价合同", "E": "向卖方支付的进度款应为合同价格的80％"}, "answer": "BC", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选BC。"}, {"id": 239, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "根据材料设备采购合同，质量保修期起算时间为（）。", "options": {"A": "材料设备采购后", "B": "材料设备交付后", "C": "材料设备验收后", "D": "工程竣工验收后"}, "answer": "C", "explanation": "材料设备质量保修期从工程竣工验收合格之日起算。选C。"}, {"id": 240, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《标准材料采购招标文件》中通用合同条款，因卖方未能按时支付合同约定的材料时，每延 迟交货一天，应向买方支付延迟交付材料金额（）的违约金。", "options": {"A": "0.08%", "B": "0.5%", "C": "0.8%", "D": "1.0%"}, "answer": "A", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选A。"}, {"id": 241, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "single", "stem": "根据《标准设备采购招标文件》，买方在收到卖方提交的买卖双方签署的合同设备验收证书或已 生效的验收款支付函正本一份并经审核无误后28日内，向卖方支付合同价格的（）。", "options": {"A": "5%", "B": "10%", "C": "20%", "D": "25%"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 242, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "multi", "stem": "根据《标准设备采购招标文件》，在卖方按合同约定交付全部合同设备后，买方向卖方支 付60%合同价格前，卖方应提交的单据有（）。", "options": {"A": "交货清单", "B": "设备出厂质量合格证", "C": "100%合同价格增值税发票", "D": "已收预付款证明", "E": "结清款支付函"}, "answer": "ABC", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选ABC。"}, {"id": 243, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "multi", "stem": "根据《标准设备采购招标文件》，卖方的合同义务有（）。", "options": {"A": "承担买方派出的设备监造人员交通食宿费用", "B": "承担设备在施工场地卸货的风险和费用", "C": "免费为交货前检验的买方代表提供工作条件及便利", "D": "按约定时间出具合同设备的质量保证期届满证书", "E": "承担公司设备交付之前包括运输在内的所有风险"}, "answer": "CE", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选CE。"}, {"id": 244, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "施工承包风险可从施工项目本身和外部环境两方面考虑。施工项目本身的风险主要有（）。", "options": {"A": "施工质量安全风险", "B": "工程分包风险", "C": "社会风险", "D": "政策风险", "E": "施工组织管理风险"}, "answer": "ABE", "explanation": "施工项目本身风险含：施工技术风险、材料设备风险、人员风险、组织管理风险等。选ABE。"}, {"id": 245, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2023年真题II改", "type": "multi", "stem": "根据《建设工程项目管理规范》，关于项目风险管理计划的说法，正确的有（）。", "options": {"A": "组织的风险管理制度是重要内容", "B": "经批准后在实施过程中不得修改", "C": "应在项目开工前编制完成", "D": "招标文件与工程合同是重要的编制依据", "E": "内容包括必需的资源和费用预算"}, "answer": "CDE", "explanation": "风险管理计划含风险分类、识别方法、评估标准、应对策略、监控安排等。选CDE。"}, {"id": 246, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2022年真题", "type": "single", "stem": "项目风险管理的工作流程：①风险应对；②风险评估；③风险识别；④风险监控。以下程序 正确的是（）。", "options": {"A": "③→②→④→①", "B": "②→③→④→①", "C": "①→③→②→④", "D": "③→②→①→④"}, "answer": "D", "explanation": "风险管理流程：风险识别→风险评估→风险应对→风险监控。即③-②-①-④。选D。"}, {"id": 247, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "multi", "stem": "进行施工风险识别时，可采用的方法有（）。", "options": {"A": "财务报表法", "B": "初始清单法", "C": "决策树法", "D": "盈亏平衡分析法", "E": "流程图法"}, "answer": "ABE", "explanation": "风险识别方法含：专家调查法、头脑风暴法、检查表法、情景分析法等。选ABE。"}, {"id": 248, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "multi", "stem": "工程承包风险管理中，在风险评估环节需进行的工作有（）。", "options": {"A": "风险等级判定", "B": "工程本身条件分析", "C": "风险因素发生概率分析", "D": "风险损失量分析", "E": "风险发生部位判定"}, "answer": "ACD", "explanation": "风险评估含：风险概率分析、影响程度分析、风险等级评定等。选ACD。"}, {"id": 249, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《建设工程项目管理规范》，除各类风险发生的概率，可能造成的损失量和风险等级 外，施工项目风险评估报告还应包括的内容是（）。", "options": {"A": "风险相关的条件因素", "B": "管理人员责任", "C": "风险发展动态", "D": "风险传递路径"}, "answer": "A", "explanation": "风险评估报告除概率/损失量/风险等级外，还应包括风险应对建议。选A。"}, {"id": 250, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2023年真题II", "type": "single", "stem": "某投标人中标后发现其报价有较大失误，因而拒绝与业主签订施工合同。其采取的风险应 对策略属于（）。", "options": {"A": "风险减轻", "B": "风险自留", "C": "风险转移", "D": "风险规避"}, "answer": "D", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选D。"}, {"id": 251, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "multi", "stem": "承包人采取的风险应对措施中，属于风险转移的有()。", "options": {"A": "投保建筑工程一切险", "B": "以联合体方式承包工程", "C": "工程进度计划中留有机动时间", "D": "要求发包人提供工程款支付担保", "E": "与发包人按可调单价方式签订工程合同"}, "answer": "AD", "explanation": "风险转移含：购买工程保险、分包部分高风险工作等。选AD。"}, {"id": 252, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "作为应对施工风险的常用措施，应急储备的主要形式是（）。", "options": {"A": "合同储备和技术储备", "B": "预算储备和时间储备", "C": "预算储备和技术储备", "D": "合同储备和时间储备"}, "answer": "B", "explanation": "应急储备的主要形式是预留费用（预备费）。选B。"}, {"id": 253, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2022年真题", "type": "single", "stem": "根据《工程建设项目施工招标投标办法》，项目估算总价为3500万元的工程项目，其施工投 标保证金的金额一般不得超过（）。", "options": {"A": "35", "B": "80", "C": "105", "D": "70"}, "answer": "D", "explanation": "投标保证金不超过估算价2%且≤80万。3500万×2%=70万，未超80万，故不超过70万。选D。"}, {"id": 254, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2022年真题", "type": "single", "stem": "施工项目投标保证金有效期应当与（）一致。", "options": {"A": "投标截止日期", "B": "投标有效期", "C": "中标通知书发出日期", "D": "评标报告提交日期"}, "answer": "B", "explanation": "投标保证金有效期应与投标有效期一致（且应超过投标有效期30天）。选B。"}, {"id": 255, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "根据《标准施工招标文件》，承包人应确保其履约担保在（）前一直有效。", "options": {"A": "发包人签认工程验收证书", "B": "工程竣工结算", "C": "缺陷责任期届满", "D": "发包人颁发工程接收证书"}, "answer": "D", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选D。"}, {"id": 256, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "根据《住房城乡建设部财政部关于印发建设工程质量保证金管理办法的通知》关于工程质量 保证金的说法，正确的是（）。", "options": {"A": "工程质量保证金总预留比例不得高于工程价款结算总额的5%", "B": "工程质量保证金需要与履约保证金一并预留", "C": "工程质量保证金可由承包人以银行保函替代", "D": "工程质量保证金可用于施工过程中工程质量缺陷的修复"}, "answer": "C", "explanation": "质量保证是质量管理的一部分，致力于提供质量要求会得到满足的信任。选C。"}, {"id": 257, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2023年真题", "type": "single", "stem": "发包人与承包人签订一份金额为800万的承包合同，则承包人应提交的履约保证金为（）。", "options": {"A": "80万", "B": "40万", "C": "24万", "D": "16万"}, "answer": "A", "explanation": "履约保证金不超过合同价10%。800万×10%=80万。选A。"}, {"id": 258, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2021年真题", "type": "single", "stem": "根据《标准施工招标文件》，担保金额在担保有效期内随着工程款支付可以逐期减少的担保 是（）。", "options": {"A": "投标担保", "B": "履约担保", "C": "预付款担保", "D": "支付担保"}, "answer": "C", "explanation": "招标文件的发售期不得少于5日。招标人对已发出的招标文件进行必要澄清或修改的，应在投标截止时间至少15日前书面通知所有获取招标文件的潜在投标人。选C。"}, {"id": 259, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2017年真题改", "type": "single", "stem": "关于履约担保的说法，正确的有（）。", "options": {"A": "履约担保是为保证正确、合理使用发包人支付的预付款而提供的担保", "B": "应由发包人出具的担保是履约担保", "C": "银行履约保函担保金额通常为合同金额的10%左右", "D": "保留金由发包人从工程进度款中扣除，总额一般限制在合同总价款的5%"}, "answer": "C", "explanation": "履约担保有效期应持续到工程竣工，形式可为银行保函、担保书等。选C。"}, {"id": 260, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "练习题", "type": "multi", "stem": "下列建设工程施工过程发生的损失中，属于建筑工程一切险承保范围的（）。", "options": {"A": "非人为火灾事故造成的损失", "B": "工艺不善引发事故造成的损失", "C": "设计错误造成的损失", "D": "货物盘点时发生的盘亏损失", "E": "工地库房被盗造成的损失"}, "answer": "ABE", "explanation": "建筑工程一切险承保自然灾害、意外事故造成的物质损失。设计错误、自然磨损除外。选ABE。"}, {"id": 261, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题", "type": "single", "stem": "下列施工现场发生的损失中，属于建筑工程一切险除外责任的是（）。", "options": {"A": "工艺不善引起的事故损失", "B": "矫正原材料缺陷造成的损失", "C": "火灾引起的在建工程损失", "D": "水灾引起的施工机械损坏"}, "answer": "B", "explanation": "除外责任含：设计错误、自然磨损、原材料缺陷引起的自身损失等。选B。"}, {"id": 262, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题II", "type": "single", "stem": "下列安装工程损失费用中属于安装工程的一切险免责范围的是（）。", "options": {"A": "因安装人员技术不精引起的事故损失", "B": "因突降冰雹造成已安装设备损坏的损失", "C": "因遭遇雷击造成电气设备损坏的损失", "D": "因超负荷造成电器用具本身的损失"}, "answer": "D", "explanation": "安装工程一切险免责范围含：因电气故障造成的本身损失。选D。"}, {"id": 263, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2025年真题II", "type": "single", "stem": "安装工程一切险主要承保机械和设备在安装过程中因（）造成的损失。", "options": {"A": "设备缺陷或操作失误", "B": "自然灾害或操作失误", "C": "自然灾害或意外事故", "D": "设备缺陷或意外事故"}, "answer": "C", "explanation": "安装工程一切险承保因自然灾害和意外事故造成的损失。选C。"}, {"id": 264, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2015年真题I", "type": "single", "stem": "根据我国保险制度，关于建设工程第三者责任险说法，正确的是（）。", "options": {"A": "被保险人是项目法人和承包人以外的第三人", "B": "赔偿范围包括承包商在工地的财产损失", "C": "被保险人是发包人和承包人", "D": "赔偿范围包括承包商在现场从事与工作有关的职工伤亡"}, "answer": "C", "explanation": "第三者责任险赔偿因施工造成第三方人身伤亡或财产损失。选C。"}, {"id": 265, "chapter": "第3章 建设工程招标投标与合同管理", "marker": "2024年真题", "type": "single", "stem": "下列工程保险中，属于职业责任保险的是（）。", "options": {"A": "意外伤害险", "B": "设计责任险", "C": "第三者责任险", "D": "施工人员工伤险"}, "answer": "B", "explanation": "职业责任保险含设计责任保险、监理责任保险等。建筑师设计责任保险属职业责任险。选B。"}, {"id": 266, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "在下列影响施工过程的不利因素中，属于社会环境影响因素的是（ ）。", "options": {"A": "不明水文气象条件", "B": "地下埋葬文物的处理", "C": "建设资金不到位", "D": "临时停水停电断路"}, "answer": "D", "explanation": "社会环境因素含：征地拆迁、社会治安、周边居民阻工等。选D。"}, {"id": 267, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "下列影响施工进度的不利因素中，属于施工单位自身因素的是（ ）。", "options": {"A": "施工设备选型失当", "B": "施工图纸出现差错", "C": "工程地质资料有误", "D": "工程设计变更频繁"}, "answer": "A", "explanation": "施工方自身因素含：施工组织不合理、技术力量不足、材料供应不及时等。选A。"}, {"id": 268, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "建设单位进度计划系统中，用来明确设计文件交付日期、主要设备交货日期、施工单位进场 日期、水电及道路接通日期等的计划表是（ ）。", "options": {"A": "工程项目综合进度计划表", "B": "工程项目总进度计划表", "C": "工程项目年度计划表", "D": "工程项目进度平衡表"}, "answer": "D", "explanation": "建设单位进度计划中，用来明确各参建方进场和交付时间的计划是进度控制计划表。选D。"}, {"id": 269, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题", "type": "single", "stem": "下列工程进度计划中，能够对全工地性工程的施工期限及开竣工日期作出安排的是（ ）。", "options": {"A": "单位工程施工进度计划", "B": "工程项目建设总进度计划", "C": "分部工程施工进度计划", "D": "施工总进度计划"}, "answer": "D", "explanation": "施工总进度计划安排全工地性工程的施工期限及开竣工时间。选D。"}, {"id": 270, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "下列进度计划中，属于建设单位计划系统的是（ ）。", "options": {"A": "工程项目年度计划", "B": "设计总进度计划", "C": "施工准备工作计划", "D": "年度施工计划"}, "answer": "A", "explanation": "建设单位计划系统含：工程项目总进度计划、年度计划等。选A。"}, {"id": 271, "chapter": "第4章 建设工程进度管理", "marker": "2021年真题II", "type": "single", "stem": "某项目基础施工的横道图如下图，第三周的施工人数是（ ）人。", "options": {"A": "22", "B": "12", "C": "18", "D": "24"}, "answer": "A", "explanation": "横道图第3周施工人数=各施工段同时施工人数之和。选A。"}, {"id": 272, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "multi", "stem": "与依次施工和平行施工相比，建设工程组织流水施工的特点有（ ）。", "options": {"A": "施工工期最短", "B": "各工作队可实现专业化施工", "C": "能够尽可能利用工作面进行施工", "D": "施工现场组织管理比较简单", "E": "单位时间内投入的资源较为均衡"}, "answer": "BCE", "explanation": "流水施工特点：专业化生产提高效率、连续均衡施工、缩短工期等。选BCE。"}, {"id": 273, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题", "type": "single", "stem": "在资源投入允许的条件下，施工项目可采取下列不同的施工组织方式：①平行施工；②流水 施工；③依次施工。按施工期由长至短排序，三种施工组织方式的正确排序是（ ）。", "options": {"A": "③-②-①", "B": "①-②-③", "C": "②-③-①", "D": "③-①-②"}, "answer": "A", "explanation": "工期排序：依次施工(最长)>流水施工>平行施工(最短)。选A。"}, {"id": 274, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "multi", "stem": "下列关于流水施工垂直图的说法，正确的有（ ）。", "options": {"A": "纵坐标表示施工过程所处的空间位置或里程", "B": "横坐标表示流水施工时间安排", "C": "铁路、公路、地铁、输电线路、天然气管道等线性工程施工进度计划更适合采用", "D": "斜向进度线的斜率可直观反映各施工过程的进展速度", "E": "施工过程及其先后顺序表达清楚、时间和空间状况形象直观"}, "answer": "CDE", "explanation": "垂直图以横坐标表示时间，纵坐标表示施工段，斜线表示施工进度。选CDE。"}, {"id": 275, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "下列流水施工参数中，属于工艺参数的是（ ）。", "options": {"A": "工作面", "B": "流水节拍", "C": "流水强度", "D": "流水步距"}, "answer": "C", "explanation": "工艺参数含：施工过程数、流水强度。选C。"}, {"id": 276, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "下列流水施工参数中属于工艺参数的是（ ）。", "options": {"A": "流水段和流水步距", "B": "流水步距和流水强度", "C": "流水强度和施工过程", "D": "施工过程和流水段"}, "answer": "C", "explanation": "工艺参数：施工过程、流水强度。选C。"}, {"id": 277, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "下列流水施工参数中，用以表达流水施工在空间布置上开展状态的参数（空间参数）是（ ）。", "options": {"A": "施工段", "B": "流水强度", "C": "施工过程", "D": "流水节拍"}, "answer": "A", "explanation": "空间参数含：施工段、工作面。选A。"}, {"id": 278, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "multi", "stem": "在编制流水施工进度计划时，划分施工段应遵循的原则有（ ）。", "options": {"A": "各施工段的劳动量应大致相等", "B": "施工段的界限应尽可能与结构界限相吻合", "C": "各施工段要有足够的工作面", "D": "多层建筑物应既分施工段，又分施工层", "E": "施工段数目要少于施工过程数"}, "answer": "ABCD", "explanation": "划分施工段原则：数量合理、界限分明、劳动量相当、满足最小工作面。选ABCD。"}, {"id": 279, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题", "type": "single", "stem": "建设工程组织流水施工时，用来区别流水施工组织方式的特征参数是（ ）。", "options": {"A": "流水强度", "B": "流水节拍", "C": "流水段数", "D": "流水步距"}, "answer": "B", "explanation": "流水节拍是区别流水施工组织方式的特征参数。选B。"}, {"id": 280, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "某工程有3个施工过程，分4个施工段，如图所示施工过程Ⅱ到Ⅲ的步距是（ ）。<br><table class=\"data-table\"><thead><tr><th></th><th>施工段①</th><th>施工段②</th><th>施工段③</th><th>施工段④</th></tr></thead><tbody><tr><td>Ⅰ</td><td>3</td><td>5</td><td>4</td><td>3</td></tr><tr><td>Ⅱ</td><td>4</td><td>3</td><td>4</td><td>2</td></tr><tr><td>Ⅲ</td><td>3</td><td>2</td><td>3</td><td>3</td></tr></tbody></table>", "options": {"A": "6", "B": "3", "C": "4", "D": "5"}, "answer": "A", "explanation": "流水步距=相邻施工过程开始时间的最小间隔。按累加数列错位相减取大差法计算。选A。"}, {"id": 281, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某工程有3个施工过程，分3个施工段组织分别流水施工，流水参数如下表，该工程流水工期是（ ） 天。 施工过程 流水节拍（天） I II III", "options": {"A": "4 5 4", "B": "5 3 6", "C": "2 2 4", "D": "21"}, "answer": "C", "explanation": "流水工期=Σ步距+最后施工过程持续时间+间歇-搭接。按非节奏流水计算。选C。"}, {"id": 282, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题", "type": "single", "stem": "某分部工程有3个施工过程，划分为4个施工段组织非节奏流水施工，流水节拍见下表，则流水施工工期是（ ）天。<br><table class=\"data-table\"><thead><tr><th></th><th>施工段①</th><th>施工段②</th><th>施工段③</th><th>施工段④</th></tr></thead><tbody><tr><td>Ⅰ</td><td>3</td><td>5</td><td>3</td><td>4</td></tr><tr><td>Ⅱ</td><td>4</td><td>3</td><td>4</td><td>3</td></tr><tr><td>Ⅲ</td><td>5</td><td>4</td><td>5</td><td>4</td></tr></tbody></table>", "options": {"A": "21", "B": "26", "C": "22", "D": "25"}, "answer": "B", "explanation": "非节奏流水工期=Σ步距+tn。计算：选B。"}, {"id": 283, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某工程有3个施工过程，分3个施工段组织分别流水施工，流水参数如下表，该工程流水工期是（ ） 天。 施工段 施工过程 I II III", "options": {"A": "4 3 3", "B": "3 4 6", "C": "5 4 3", "D": "18"}, "answer": "A", "explanation": "分别流水工期计算：Σ步距+最后施工过程的节拍之和。选A。"}, {"id": 284, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "某工程分为三个施工段，每个施工段有三个施工过程，每个施工过程由一个专业工作队完 成，各专业工作队在各施工段上的流水节拍均是3天。该工程的流水工期是（ ）天。", "options": {"A": "9", "B": "15", "C": "18", "D": "27"}, "answer": "B", "explanation": "全等节拍：流水工期=(m+n-1)×t=(3+3-1)×3=15天。选B。"}, {"id": 285, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某工程有I、II、III、IV四个施工过程，3个施工段，各施工过程的流水节拍均为4天，其中施工I 和II之间有1天的搭接时间，III和IV之间有3天的间歇时间，按全等节拍组织流水施工，该工程的流水施工工 期是（ ）天。", "options": {"A": "18", "B": "24", "C": "26", "D": "30"}, "answer": "C", "explanation": "全等节拍：流水工期=(m+n-1)×t-ΣC+ΣZ=(3+4-1)×4-1+3=24-1+3=26天。选C。"}, {"id": 286, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "multi", "stem": "建设工程组织固定节拍流水施工的特点有（ ）。", "options": {"A": "相邻施工过程的流水步距相等", "B": "专业工作队数等于施工过程数", "C": "各施工段的流水节拍不全相等", "D": "施工段之间可能有空闲时间", "E": "各专业工作队能够连续作业"}, "answer": "ABE", "explanation": "固定节拍特点：各施工过程流水节拍相等、流水步距相等即节拍。选ABE。"}, {"id": 287, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "某分部工程有3个施工过程，划分为4个施工段组织加快的成倍节拍流水施工，流水节拍分 别为4天，6天和2天，则该分部工程需派出的专业工作队数是（ ）。", "options": {"A": "3", "B": "4", "C": "5", "D": "6"}, "answer": "D", "explanation": "成倍节拍专业队数=b1+b2+b3=4/2+6/2+2/2=2+3+1=6。K=最大公约数(4,6,2)=2。选D。"}, {"id": 288, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "某分部工程有4个施工过程，划分为3个施工段组织加快的成倍节拍流水施工，流水节拍分别 为4天、6天、4天和2天，该分部工程需安排的专业工作队数是（ ）个。", "options": {"A": "8", "B": "3", "C": "4", "D": "6"}, "answer": "A", "explanation": "最大公约数K=2。队数=4/2+6/2+4/2+2/2=2+3+2+1=8。选A。"}, {"id": 289, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某分部工程有3个施工过程，各分为4个流水节拍相等的施工段，各施工过程的流水节拍分别为6、 4、4天。如果组织加快的成倍节拍流水施工，则专业工作队数和流水施工工期分别为（ ）。", "options": {"A": "3个和20天", "B": "4个和25天", "C": "5个和24天", "D": "7个和20天"}, "answer": "D", "explanation": "K=最大公约数(6,4,4)=2。队数=6/2+4/2+4/2=3+2+2=7。工期=(4+7-1)×2=20天。选D。"}, {"id": 290, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "multi", "stem": "建设工程组织加快的成倍节拍流水施工时，具有的特点有（ ）。", "options": {"A": "各施工段之间可能有空闲时间", "B": "相邻施工过程的流水步距相等", "C": "不同施工过程的流水节拍相等", "D": "专业工作队数大于施工过程数", "E": "流水步距与流水节拍成倍数关系"}, "answer": "BDE", "explanation": "成倍节拍特点：同一施工过程节拍相等、不同施工过程节拍为倍数关系。选BDE。"}, {"id": 291, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "multi", "stem": "建设工程组织异节奏流水施工时，可采用的具体方式有（ ）。", "options": {"A": "等步距异节奏流水施工", "B": "等节拍异节奏流水施工", "C": "固定节拍异节奏流水施工", "D": "异步距异节奏流水施工", "E": "异步距异节奏流水施工"}, "answer": "AD", "explanation": "异节奏流水可采用成倍节拍流水或一般异节奏流水。选AD。"}, {"id": 292, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题B", "type": "multi", "stem": "建设工程组织异节奏流水施工时，可采用的具体方式有（ ）。", "options": {"A": "等步距异节奏流水施工", "B": "等节拍异节奏流水施工", "C": "固定节拍异节奏流水施工", "D": "异步距异节奏流水施工", "E": "异节拍异节奏流水施工"}, "answer": "AD", "explanation": "异节奏流水方式：成倍节拍流水和一般异节奏流水。选AD。"}, {"id": 293, "chapter": "第4章 建设工程进度管理", "marker": "2018年真题", "type": "multi", "stem": "某双代号网络计划如下图，绘图的错误有（）。", "options": {"A": "多个终点节点", "B": "存在循环回路", "C": "多个起点节点", "D": "节点编号有误", "E": "有多余虚工作"}, "answer": "CDE", "explanation": "双代号网络图用箭线表示工作，用节点表示工作的开始或结束。选CDE。"}, {"id": 294, "chapter": "第4章 建设工程进度管理", "marker": "2017年真题", "type": "single", "stem": "根据《工程网络计划技术规程》JQJ/T121—2015，网络图存在的绘图错误有（）", "options": {"A": "编号相同的工作", "B": "多个起点节点", "C": "相同的节点编号", "D": "无箭尾节点的箭线"}, "answer": "A", "explanation": "网络图绘图错误含：多个起点节点、循环回路、交叉箭线等。选A。"}, {"id": 295, "chapter": "第4章 建设工程进度管理", "marker": "2022年真题", "type": "multi", "stem": "某项目的工作逻辑关系如下表，工作A的紧后工作有（）。 工作", "options": {"A": "", "B": "", "C": "", "D": "", "E": "G 紧前工作 —"}, "answer": "ABE", "explanation": "紧后工作=以本工作为紧前工作的工作。据逻辑关系表确定。选ABE。"}, {"id": 296, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某双代号网络图如下图，关于各项工作逻辑关系的说法，正确的是（）。", "options": {"A": "工作D的紧后工作有工作E和工作G", "B": "工作B的紧后工作有工作C和工作", "D": "", "C": "工作G的紧前工作有工作C和工作"}, "answer": "C", "explanation": "双代号网络图用箭线表示工作，用节点表示工作的开始或结束。选C。"}, {"id": 297, "chapter": "第4章 建设工程进度管理", "marker": "2021年真题II", "type": "single", "stem": "某工作有两个紧前工作，最早完成时间分别是第2天和第4天，该工作持续时间是5天，则其 最早完成时间是第（）天。", "options": {"A": "9", "B": "6", "C": "7", "D": "11"}, "answer": "A", "explanation": "最早开始=紧前工作最早完成最大值=max(2,4)=4。最早完成=4+5=9天。选A。"}, {"id": 298, "chapter": "第4章 建设工程进度管理", "marker": "2020年真题II", "type": "single", "stem": "网络计划中，某项工作的持续时间是4天，最早第2天开始，两项紧后工作分别最早在第8天 和第12天开始。该项工作自由时差是（）天", "options": {"A": "4", "B": "2", "C": "6", "D": "8"}, "answer": "B", "explanation": "自由时差=紧后最早开始最小值-本工作最早完成。最早完成=2+4=6。min(8,12)-6=8-6=2天。选B。"}, {"id": 299, "chapter": "第4章 建设工程进度管理", "marker": "2016年真题", "type": "single", "stem": "某双代号网络计划中。工作M的最早开始时间和最迟开始时间分别为第12天和第16天，其持续 时间为5天。工作M有3项紧后工作，它们的最早开始时间分别为第21天、第24天和第28天，则工作M的自由时 差为（）天。", "options": {"A": "1", "B": "3", "C": "4", "D": "5"}, "answer": "C", "explanation": "双代号网络图用箭线表示工作，用节点表示工作的开始或结束。选C。"}, {"id": 300, "chapter": "第4章 建设工程进度管理", "marker": "2018年真题", "type": "single", "stem": "某工作有三项紧后工作，持续时间分别为4天、5天、6天，对应的最迟完成时间分别为第18天、 第16天、第14天，则该工作的最迟完成时间是第（）天。", "options": {"A": "14", "B": "12", "C": "8", "D": "6"}, "answer": "C", "explanation": "最迟完成=紧后工作最迟开始的最小值。紧后最迟开始=最迟完成-持续时间。第1项:18-4=14；第2项:16-5=11；第3项:14-6=8。min(14,11,8)=8天。选C。"}, {"id": 301, "chapter": "第4章 建设工程进度管理", "marker": "2021年真题", "type": "single", "stem": "工作最早开始时间为第4天，总时差为2天，持续时间为6天，该工作的最迟完成时间是第（） 天。", "options": {"A": "9", "B": "11", "C": "10", "D": "12"}, "answer": "D", "explanation": "最迟完成=最早开始+总时差+持续时间=4+2+6=12天。选D。"}, {"id": 302, "chapter": "第4章 建设工程进度管理", "marker": "2022年真题", "type": "single", "stem": "某工程网络计划中，工作M的持续时间是1天，最早第4天开始，工作M的两个紧后工作的最迟 开始时间分别为第7天和第9天，工作M的总时差是（）天。", "options": {"A": "2", "B": "1", "C": "3", "D": "5"}, "answer": "A", "explanation": "总时差是指在不影响总工期的前提下，工作可以利用的机动时间。选A。"}, {"id": 303, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "在工程网络计划中，已知某工作总时差和自由时差分别为7天和5天，如果该工作的实际完成 时间延长了3天，则该工作对网络计划的影响是（）。", "options": {"A": "使总工期延长3天，但不影响其后续工作的正常进行", "B": "不影响总工期，但使其后续工作的开始时间推迟3天", "C": "使后续工作的开始时间推迟3天，且总工期延长2天", "D": "既不影响总工期，也不影响其后续工作的正常进行"}, "answer": "D", "explanation": "总时差是指在不影响总工期的前提下，工作可以利用的机动时间。选D。"}, {"id": 304, "chapter": "第4章 建设工程进度管理", "marker": "2017年真题II", "type": "multi", "stem": "某项目分部工程双代号时标网络计划如下图，关于该网络计划的说法，正确的是（）。", "options": {"A": "工作", "C": "", "E": "I、L组成关键线路", "B": "工作H的总时差为2天", "D": "工作D的总时差为1天"}, "answer": "ABD", "explanation": "双代号网络图用箭线表示工作，用节点表示工作的开始或结束。选ABD。"}, {"id": 305, "chapter": "第4章 建设工程进度管理", "marker": "2022年真题", "type": "single", "stem": "某双代号时标网络计划如下图（时间单位：天），工作A3的最迟开始时间是第（）天。", "options": {"A": "8", "B": "5", "C": "6", "D": "7"}, "answer": "D", "explanation": "双代号网络图用箭线表示工作，用节点表示工作的开始或结束。选D。"}, {"id": 306, "chapter": "第4章 建设工程进度管理", "marker": "2024 nation": "单代号网络图用节点表示工作，用箭线表示工作间的逻辑关系。选C。"}, {"id": 314, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "multi", "stem": "某工程单代号网络计划如下图所示，图中节点下方数字为相应工作的持续时间。下列工作 中属于关键工作的有（）。", "options": {"A": "工作", "B": "工作", "C": "工作", "D": "工作", "E": ""}, "answer": "ABE", "explanation": "单代号网络图用节点表示工作，用箭线表示工作间的逻辑关系。选ABE。"}, {"id": 315, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "multi", "stem": "某工程单代号网络图如下图，关于网络计划的说法，不正确的是（）。", "options": {"A": "工作C的自由时差为2", "B": "工作C的最迟完成时间为4", "C": "工作B的自由时差为0", "D": "工作B的最早完成时间为6", "E": "工作A与工作D之间的时间间隔为0"}, "answer": "BE", "explanation": "单代号网络图用节点表示工作，用箭线表示工作间的逻辑关系。选BE。"}, {"id": 316, "chapter": "第4章 建设工程进度管理", "marker": "2021年真题", "type": "multi", "stem": "某单代号搭接网络计划如下图（时间单位：天），其时间参数正确的有（）。", "options": {"A": "TFC=1", "B": "FFB=2", "C": "LSD=8", "D": "LSE=5", "E": "LFC=5"}, "answer": "ACDE", "explanation": "单代号网络图用节点表示工作，用箭线表示工作间的逻辑关系。选ACDE。"}, {"id": 317, "chapter": "第4章 建设工程进度管理", "marker": "2022年真题", "type": "multi", "stem": "工程网络计划中，关键工作是指（）的工作。", "options": {"A": "最早开始时间与最迟开始时间相差最小", "B": "总时差最小", "C": "时标网络计划中无波形线", "D": "与紧后工作之间间隔时间为零", "E": "双代号网络计划中两端节点均为关键节点"}, "answer": "AB", "explanation": "关键工作是总时差最小的工作，位于关键线路上。选AB。"}, {"id": 318, "chapter": "第4章 建设工程进度管理", "marker": "2020年真题", "type": "multi", "stem": "某双代号网络计划如下图，关键线路有（）。", "options": {"A": "②→③→⑤", "B": "①→⑤", "C": "①→③→④", "D": "②→③→④", "E": "①→③→⑤"}, "answer": "BE", "explanation": "双代号网络图用箭线表示工作，用节点表示工作的开始或结束。选BE。"}, {"id": 319, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "已知某工程网络计划的计划工期等于计算工期，其中工作M的开始节点和结束节点均为关键 节点，则该工作（）。", "options": {"A": "为关键工作", "B": "自由时差为0", "C": "总时差等于自由时差", "D": "总时差为0"}, "answer": "C", "explanation": "当网络计划计划工期等于计算工期，且工作M的开始节点和结束节点均为关键节点时，该工作的总时差等于自由时差。A错误：起止均为关键节点不代表本工作是关键工作；B、D错误：仅当本工作为关键工作时自由时差、总时差才为0。故选C。"}, {"id": 320, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "单代号搭接网络计划中，关键线路是指（）的线路。", "options": {"A": "自始至终关键工作组成", "B": "相邻两项工作之间的时间间隔均为零", "C": "相邻两项工作之间的时距均为零", "D": "自始至终由关键节点组成"}, "answer": "B", "explanation": "单代号网络图用节点表示工作，用箭线表示工作间的逻辑关系。选B。"}, {"id": 321, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "根据工程网络施工进度计划的编制程序、下列网络计划的编制工作中、属于网络图绘制阶 段的是（）。", "options": {"A": "确定计划目标", "B": "确定关键线路", "C": "优化网络计划", "D": "工程项目分解"}, "answer": "D", "explanation": "分部分项工程成本分析是成本分析的基础。选D。"}, {"id": 322, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "按照工程网络计划编制程序，在网络图绘制阶段需要进行的工作是（）。", "options": {"A": "进行工程项目分解", "B": "确定网络计划目标", "C": "调查工程实际条件", "D": "分析工作持续时间"}, "answer": "A", "explanation": "月(季)度成本分析是定期进行的中间成本分析。选A。"}, {"id": 323, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "multi", "stem": "根据所追求的目标不同，网络计划优化包括（）。", "options": {"A": "工期优化", "B": "质量优化", "C": "费用优化", "D": "安全优化", "E": "资源优化"}, "answer": "ACE", "explanation": "网络计划优化按追求目标分为：工期优化（A）、费用优化（C）、资源优化（E）。质量、安全不属网络计划优化目标。故选ACE。"}, {"id": 324, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "下列工程进度计划方法中，属于肯定型网络计划方法的是（）。", "options": {"A": "计划评审技术", "B": "图示评审技术", "C": "关键线路法", "D": "线性进度法"}, "answer": "C", "explanation": "成本考核是实现成本目标责任制的保证。选C。"}, {"id": 325, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "采用横道图编制施工进度计划的优点是（）。", "options": {"A": "可以明确表示各项工作之间的逻辑关系", "B": "可以直接判断各项工作的机动时间", "C": "可以直接显示整个计划的关键工作", "D": "可以直观表明各项工作的持续时间"}, "answer": "D", "explanation": "横道图进度计划优点是直观易懂，缺点是不能反映工作间的逻辑关系和关键工作。选D。"}, {"id": 326, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "关于横道图进度计划的说法，错误的是（）。", "options": {"A": "不能反映影响工期的关键工作和关键线路", "B": "不能反映工作所具有的机动时间（时差）", "C": "不能反映工程费用与工期之间的关系", "D": "不能反映各项工作之间的相互联系、相互制约关系"}, "answer": "D", "explanation": "横道图进度计划优点是直观易懂，缺点是不能反映工作间的逻辑关系和关键工作。选D。"}, {"id": 327, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "下列建设工程施工进度控制工作中，属于施工进度监测系统过程的是（）。", "options": {"A": "分析进度偏差对后续工作的影响", "B": "分析比较实际进度与计划进度", "C": "分析进度偏差对总工期的影响", "D": "分析进度偏差产生的原因"}, "answer": "B", "explanation": "进度控制动态循环过程包括计划、实施、检查、纠偏。PDCA循环。选B。"}, {"id": 328, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "下列建设工程施工进度控制工作中，属于施工进度调整系统过程的是（）。", "options": {"A": "分析进度偏差产生原因", "B": "收集整理实际进度", "C": "对比实际进度与计划进度", "D": "判别是否存在进度偏差"}, "answer": "A", "explanation": "进度控制动态循环过程包括计划、实施、检查、纠偏。PDCA循环。选A。"}, {"id": 329, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某工程截至第7周的进度如图所示（空心横道表示计划进度，实心横道表示实际进展），则截至第 7周末（）", "options": {"A": "工作A提前完成", "B": "工作C按时完成", "C": "工作D进度正常", "D": "工作E比计划提前2周完成"}, "answer": "C", "explanation": "第7周实际进度落后于计划进度，需计算偏差。选C。"}, {"id": 330, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "single", "stem": "某工程施工进度检查运用S曲线比较法，某检查日期实际进展点落在了计划S曲线的右侧，则该点 与S曲线纵坐标的距离表示（）。", "options": {"A": "实际进度拖后的时间", "B": "实际进度超前的时间", "C": "实际进度拖后的工作量", "D": "实际进度超前的工作量"}, "answer": "C", "explanation": "实际进展点落在计划S曲线右侧=进度滞后，纵坐标距离=进度偏差(工作量差)。选C。"}, {"id": 331, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "某工程时标网络计划及第6天末检查的实际进度如图所示，正确的是（）", "options": {"A": "工作E的实际进度拖延1天，不影响总工期", "B": "工作G进度超前，不影响总工期 【2024年真题II】某工程时标网络计划及第6天末检查的实际进度如图所示，正确的是（）", "C": "工作H的实际进度拖延1天，将使其后续工作J的最早开始时间推迟1天", "D": "工作I的最早开始时间推迟1天，总工期延长1天 【2020年真题】某项目时标网络计划第2、4周末实际进度前锋线如下图，关于该项目进度情况的说法，不正 确的有（）。"}, "answer": "D", "explanation": "时标网络第6天检查实际进度，前锋线落后于检查线的表示延误。选D。"}, {"id": 332, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "某工程时标网络计划及第6天末检查的实际进度如图所示，正确的是（）", "options": {"C": "工作H的实际进度拖延1天，将使其后续工作J的最早开始时间推迟1天", "D": "工作I的最早开始时间推迟1天，总工期延长1天 【2020年真题】某项目时标网络计划第2、4周末实际进度前锋线如下图，关于该项目进度情况的说法，不正 确的有（）。", "A": "第2周末，工作C提前1周，工期提前1周", "B": "第2周末，工作A拖后2周，但不影响工期"}, "answer": "D", "explanation": "时标网络第6天末前锋线分析。选D。"}, {"id": 333, "chapter": "第4章 建设工程进度管理", "marker": "2020年真题", "type": "single", "stem": "某项目时标网络计划第2、4周末实际进度前锋线如下图，关于该项目进度情况的说法，不正 确的有（）。", "options": {"A": "第2周末，工作C提前1周，工期提前1周", "B": "第2周末，工作A拖后2周，但不影响工期", "C": "第2周末，工作B拖后1周，但不影响工期", "D": "第4周末，工作D拖后1周，但不影响工期 【2025年真题II】下列实际进度与计划进度比较分析方法中，既适用于工作实际进度与计划进度的局部比较， 又可用来分析预测工程项目整体进度状况的是（）。"}, "answer": "D", "explanation": "前锋线在第2、4周末，分析各工作进度情况。选D（不正确说法）。"}, {"id": 334, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "下列实际进度与计划进度比较分析方法中，既适用于工作实际进度与计划进度的局部比较， 又可用来分析预测工程项目整体进度状况的是（）。", "options": {"A": "横道图比较法", "B": "S曲线比较法", "C": "垂直图比较法", "D": "前锋线比较法"}, "answer": "D", "explanation": "S曲线比较法既可局部比较又可整体预测。选D。"}, {"id": 335, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题II", "type": "single", "stem": "通过缩短关键工作的持续时间来调整建设工程施工进度计划时，可采用的技术措施是（）。", "options": {"A": "组织更多施工队伍", "B": "采用更先进的施工方式", "C": "改善外部配合条件", "D": "增加每天施工时间"}, "answer": "B", "explanation": "关键工作是总时差最小的工作，位于关键线路上。选B。"}, {"id": 336, "chapter": "第4章 建设工程进度管理", "marker": "2024年真题", "type": "single", "stem": "工程施工过程中，通过缩短关键工作的持续时间来调整施工进度计划时，可采取的技术措施 是（）。", "options": {"A": "采用更先进的施工机械", "B": "改善施工作业环境", "C": "增加施工机械数量", "D": "组织更多施工队伍"}, "answer": "A", "explanation": "关键工作是总时差最小的工作，位于关键线路上。选A。"}, {"id": 337, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题II", "type": "single", "stem": "通过缩短工程网络计划中关键工作的持续时间来调整施工进度计划时，可采取的组织措施 是（）。", "options": {"A": "采用多班制施工方式", "B": "实施强有力的调度指挥", "C": "减少施工现场湿作业量", "D": "改善外部配合条件"}, "answer": "A", "explanation": "关键工作是总时差最小的工作，位于关键线路上。选A。"}, {"id": 338, "chapter": "第4章 建设工程进度管理", "marker": "练习题", "type": "multi", "stem": "施工进度计划调整（）是通过改变某些工作间的逻辑关系。", "options": {"A": "缩短工作的时长", "B": "组织平行作业", "C": "组织搭接作业", "D": "运用先进的施工机械", "E": "分段组织流水作业"}, "answer": "BCE", "explanation": "通过改变工作间逻辑关系调整进度计划，如将顺序改为平行或搭接。选BCE。"}, {"id": 339, "chapter": "第4章 建设工程进度管理", "marker": "2025年真题", "type": "single", "stem": "工程网络计划工期优化的基本方法是通过（）来达到优化目标。", "options": {"A": "改变关键工作之间的逻辑关系", "B": "压缩关键工作的持续时间", "C": "增加非关键工作的资源投入", "D": "降低非关键工作的资源强度"}, "answer": "B", "explanation": "工期优化应优先缩短关键工作的持续时间。选B。"}, {"id": 340, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "建设工程质量固有特性主要体现在建筑产品的（）。", "options": {"A": "实用性", "B": "舒适性", "C": "安全性", "D": "可靠性", "E": "全面性"}, "answer": "ACD", "explanation": "建设工程质量固有特性体现在：适用性、安全性、耐久性、可靠性、经济性及与环境的协调性。选ACD。"}, {"id": 341, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "single", "stem": "建设工程投资决策和建设实施的不同阶段对工程质量有着不同程度的影响。其中对工程质量 有着决定性影响的是（）。", "options": {"A": "工程投资决策", "B": "工程勘察设计", "C": "工程施工", "D": "工程竣工验收"}, "answer": "B", "explanation": "投资决策阶段（可行性研究）对工程质量有决定性影响，确定质量目标和标准。选B。"}, {"id": 342, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "建设工程投资决策阶段的质量控制工作是（）。", "options": {"A": "确定项目应采用的质量标准和管理方法", "B": "编制项目质量控制工作计划", "C": "确定项目应达到的质量目标和水平", "D": "编制项目质量管理体系文件"}, "answer": "C", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选C。"}, {"id": 343, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "下列影响工程质量的环境因素中，属于技术环境因素的是（）。", "options": {"A": "周边建筑工程", "B": "质量检验制度", "C": "水文地质条件", "D": "质量评价标准"}, "answer": "D", "explanation": "技术环境因素含：工程技术条件、施工技术方法、检测技术手段等。选D。"}, {"id": 344, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "下列影响施工质量的环境因素中，属于管理环境因素的有（）。", "options": {"A": "施工所依据的质量评价标准", "B": "施工单位的质量管理制度", "C": "设计图纸", "D": "地下障碍物", "E": "施工单位的质量检验制度"}, "answer": "BE", "explanation": "管理环境因素含：质量管理体系、质量管理制度、参建各方管理协调等。选BE。"}, {"id": 345, "chapter": "第5章 建设工程质量管理", "marker": "2018年真题", "type": "single", "stem": "我国实行建造师执业资格注册制度、管理人员持证上岗制度，都是对建筑工程项目质量影响 因素中（）的控制。", "options": {"A": "人的因素", "B": "管理因素", "C": "环境因素", "D": "技术因素"}, "answer": "A", "explanation": "建造师执业资格制度和管理人员持证上岗是对\"人的因素\"的控制。选A。"}, {"id": 346, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "single", "stem": "下列影响工程质量的因素中，可变性最大的是（）。", "options": {"A": "施工工艺影响因素", "B": "人因影响因素", "C": "工程材料影响因素", "D": "机械设备影响因素"}, "answer": "B", "explanation": "影响工程质量的因素中人的因素可变性最大（人的技术水平和责任心波动大）。选B。"}, {"id": 347, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "multi", "stem": "全面质量管理具有的基本特点有（）。", "options": {"A": "管理手段的先进性", "B": "管理内容的全面性", "C": "管理方法的多样性", "D": "管理范围的全面性", "E": "管理目标的多样性"}, "answer": "BCD", "explanation": "全面质量管理(TQM)的核心是全员参与、全过程控制、全方位管理。选BCD。"}, {"
