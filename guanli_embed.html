2022年真题补考", "type": "single", "stem": "建设工程项目质量控制体系运行的核心机制是（）。", "options": {"A": "约束机制", "B": "反馈机制", "C": "动力机制", "D": "持续改进机制"}, "answer": "C", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选C。"}, {"id": 356, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题", "type": "single", "stem": "项目质量控制体系得以运行的基础条件是（）。", "options": {"A": "项目合同结构合理", "B": "组织制度健全", "C": "人员和资源合理配置", "D": "程序性文件规范"}, "answer": "C", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选C。"}, {"id": 357, "chapter": "第5章 建设工程质量管理", "marker": "2021年真题", "type": "multi", "stem": "项目质量控制体系的运行环境包括（）。", "options": {"A": "项目的合同结构", "B": "质量管理的人员配置", "C": "质量管理的政府监督制度", "D": "质量管理的物质资源配置", "E": "质量管理的组织制度"}, "answer": "ABDE", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选ABDE。"}, {"id": 358, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "single", "stem": "工程施工质量检查中，为便于进行抽样检验，在条件允许的情况下，最好采用的检验批形 式是（）。", "options": {"A": "流动批", "B": "稳定批", "C": "组合批", "D": "全数批"}, "answer": "B", "explanation": "工程质量检查包括自检、互检、交接检和专职检查。选B。"}, {"id": 359, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "某工程承包商从一生产厂家购买了一批相同规格的预制构件，并将其整齐码放在现场。对 这批构件进行进场检验时，宜采用的抽样方法是（）。", "options": {"A": "简单随机抽样", "B": "分层随机抽样", "C": "系统随机抽样", "D": "整群随机抽样"}, "answer": "A", "explanation": "整齐码放的预制构件宜采用系统随机抽样（等距抽样）。选A。"}, {"id": 360, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "single", "stem": "工程施工中进行工序质量检验时，宜采用的随机抽样方法是（）。", "options": {"A": "简单随机抽样", "B": "分级随机抽样", "C": "系统随机抽样", "D": "分层随机抽样"}, "answer": "C", "explanation": "工序质量检验宜采用简单随机抽样。选C。"}, {"id": 361, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "进行施工质量检验时，将检验对象总体中的抽样单元按某种次序排列，在规定范围内随机抽 取一个或一组初始单元，然后按一套规则确定其他样本单元的抽样方法是（）。", "options": {"A": "分级随机抽样", "B": "系统随机抽样", "C": "分层随机抽样", "D": "整群随机抽样"}, "answer": "B", "explanation": "按次序排列→随机抽取初始单元→按规则确定其他样本，这是系统随机抽样法。选B。"}, {"id": 362, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "multi", "stem": "按产品质量特征不同，抽样检验方法可划分的种类有（）。", "options": {"A": "计数抽样检验", "B": "计量抽样检验", "C": "随机抽样检验", "D": "多次抽样检验", "E": "连续抽样检验"}, "answer": "AB", "explanation": "按产品质量特征不同，抽样检验分为计数抽样检验和计量抽样检验。选AB。"}, {"id": 363, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "施工质量抽样检验工作中，与计量抽样检验相比，计数抽样检验时优点有（）", "options": {"A": "所需样本量较小", "B": "样本信息利用充分", "C": "适用简便", "D": "运用范围广泛", "E": "适用范围窄"}, "answer": "CD", "explanation": "计数抽样优点：检验成本低、操作简便、不需要专业计量设备。计量需精确测量。选CD。"}, {"id": 364, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "某产品质量检验采用计数型二次抽样检验方案，已知：N=1000，n1=40，n2=60，C1=1，C2=4；经二 次抽样检得：d1=2，d2=3，则正常的结论是（）", "options": {"A": "经第一次抽样检验即可判定该批产品质量合格", "B": "经第一次抽样检验即可判定该批产品质量不合格", "C": "经第二次抽样检验即可判定该批产品质量合格", "D": "经第二次抽样检验即可判定该批产品质量不合格"}, "answer": "D", "explanation": "二次抽样：n1=40,d1=2>C1=1需第二次：n2=60,d2=3。累计d=5>C2=4，拒收。选D。"}, {"id": 365, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "single", "stem": "工程施工中，检验混凝土振捣是否符合要求的检验方法有（）。", "options": {"A": "物理检验法", "B": "化学检验法", "C": "感观检验法", "D": "现场试验法"}, "answer": "C", "explanation": "检验混凝土振捣质量应采用敲击检查法（听声音判断密实度）。选C。"}, {"id": 366, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "下列施工质量检验方法中，属于物理检验法的是（）。", "options": {"A": "度量检测法", "B": "电性能检测法", "C": "机械性能检测法", "D": "无损检测法", "E": "混凝土振捣检测"}, "answer": "ABCD", "explanation": "物理检验法含：射线检测、超声波检测、磁粉检测、渗透检测等。选ABCD。"}, {"id": 367, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "single", "stem": "下列施工质量的物理检验方法中，属于无损检测的是（）。", "options": {"A": "钢材焊接质量的超声波探伤检测", "B": "钢材抗拉、抗弯性能检测", "C": "桩基静载试验检测", "D": "给水管道的压力检测"}, "answer": "A", "explanation": "无损检测不含破坏性检验。射线照相属无损检测（不破坏构件）。选A。"}, {"id": 368, "chapter": "第5章 建设工程质量管理", "marker": "2016年真题", "type": "single", "stem": "某焊接作业由甲、乙、丙、丁四名工人操作，为评定各工作的焊接质量，共抽检100个焊点，抽检结果如下表。根据表中数据，各工人焊接质量由好至差的排序是（）。<br><table class=\"data-table\"><thead><tr><th>作业人员</th><th>检验点数</th><th>不合格点</th></tr></thead><tbody><tr><td>甲</td><td>10</td><td>2</td></tr><tr><td>乙</td><td>40</td><td>4</td></tr><tr><td>丙</td><td>20</td><td>10</td></tr><tr><td>丁</td><td>30</td><td>8</td></tr></tbody></table>", "options": {"A": "甲→乙→丙→丁", "B": "乙→甲→丙→丁", "C": "丁→乙→甲→丙", "D": "乙→甲→丁→丙"}, "answer": "D", "explanation": "根据抽检不合格点数判断各工人焊接质量：不合格率越低质量越好。选D。"}, {"id": 369, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "single", "stem": "下列统计分析方法中,能够根据不同目的和要求，按某一性质整理分析施工质量的原始数据 是（）。", "options": {"A": "相关图法", "B": "排列图法", "C": "分层法", "D": "检查表法"}, "answer": "C", "explanation": "按某一性质分类整理原始数据是分层法的特点。选C。"}, {"id": 370, "chapter": "第5章 建设工程质量管理", "marker": "2022年真题", "type": "single", "stem": "关于因果分析图法的说法，正确的是（）。", "options": {"A": "因果分析可以反映质量数据的分布特征", "B": "通常采用QC小组活动的方式进行因果分析", "C": "可以定量分析影响质量的主次因素", "D": "一张因果分析图可以分析多个质量问题"}, "answer": "B", "explanation": "因果分析图（鱼刺图）是逐层深入找原因，最终找到可采取措施的根本原因。选B。"}, {"id": 371, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "下列施工质量统计分析方法中，可用来分析、追溯质量缺陷产生原因的是（）。", "options": {"A": "鱼刺图法", "B": "直方图法", "C": "分层法", "D": "相关图法"}, "answer": "A", "explanation": "因果分析图法可分析追溯质量缺陷产生的原因。选A。"}, {"id": 372, "chapter": "第5章 建设工程质量管理", "marker": "2021年真题", "type": "multi", "stem": "对某模板工程进行抽样检查，发现在表面平整度、截面尺寸、平面水平度、垂直度和标高等 方面存在质量问题。按照排列图法进行统计分析，上述质量问题累计频率依次为41%、79%、89%、98%和100%， 需要进行重点管理的A类问题有（）。", "options": {"A": "平面水平度", "B": "垂直度", "D": "表面平整度", "E": "截面尺寸"}, "answer": "DE", "explanation": "累计频率0-80%的为A类问题（主要问题）。表面平整度41%+截面尺寸累计79%=两类问题。选DE。"}, {"id": 373, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "multi", "stem": "采用相关图法分析混凝土结构质量时，根据不同风力与混凝土结构强度实测数据绘制的相关 图中，数据点形成由左至右向下较为分散的直线带，则该相关图表明的正确信息有（）。", "options": {"A": "风力对混凝土强度有一定程度的影响", "B": "除风力外还存在影响混凝土强度的其他因素", "C": "风力与强度数据之间存在负相关关系", "D": "风力与强度数剧之间存在强相关关系", "E": "风力与强度数据之间存在相互制约的关系"}, "answer": "AB", "explanation": "相关图中数据点形成由左至右下方向较分散直线带，表明负相关且相关程度弱。选AB。"}, {"id": 374, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "multi", "stem": "采用直方图法分析混凝土预制构件质量时，出现孤岛图的原因是（）。", "options": {"A": "数据分组不当", "B": "原材料发生变化", "C": "短时间内工人操作不熟练", "D": "组距确定不当", "E": "施工操作中控制过严"}, "answer": "BC", "explanation": "直方图出现孤岛（单独小峰）原因是原材料发生变化或临时顶班作业。选BC。"}, {"id": 375, "chapter": "第5章 建设工程质量管理", "marker": "2016年真题", "type": "multi", "stem": "根据下列直方图的分布位置与质量控制标准的上下限范围的比较分析，正确的有（）。", "options": {"A": "图⑴显示生产过程的质量正常、稳定、受控", "B": "图⑵显示质量特性数据分布偏上限，易出现不合格", "C": "图⑶显示质量特性数据分布达到质量标准上下限，质量能力处于临界状态", "D": "图⑷显示质量特性数据的分布居中，质量能力偏大，不经济", "E": "图⑸显示质量特性数据超出质量标准的下限，存在质量不合格情况"}, "answer": "ACDE", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选ACDE。"}, {"id": 376, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "采用直方图法对工程质量进行统计分析时，其主要的用途是（）", "options": {"A": "分析产生施工质量问题的原因", "B": "分门别类的对施工质量状态进行调查", "C": "对施工质量问题进行状态描述", "D": "分析质量数据的分布状态和波动规律"}, "answer": "D", "explanation": "直方图主要用途是观察分析质量分布状态（判断是否正常）。选D。"}, {"id": 377, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "采用直方图法对工程质量进行统计分析时，其主要的用途是（）", "options": {"A": "分析产生施工质量问题的原因", "B": "分门别类的对施工质量状态进行调查", "C": "对施工质量问题进行状态描述", "D": "分析不同因素对质量的影响"}, "answer": "D", "explanation": "直方图用于观察分析生产过程质量是否处于稳定受控状态。选D。"}, {"id": 378, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "在施工质量控制过程中，生产处于稳定状态的控制图中点子分布状态是（）。", "options": {"A": "连续7点或更多点在中心线同一侧", "B": "随机落在上、下控制界限内", "C": "呈现周期性变化", "D": "连续7点或更多点呈上升趋势"}, "answer": "B", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选B。"}, {"id": 379, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "multi", "stem": "利用控制图判明生产过程是否处于稳定状态，以下可直接判定生产过程异常的情形有（）。", "options": {"A": "连续100点中一点在控制图界限外", "B": "点子分布呈周期性变化。", "C": "连续7点在中心线同一侧", "D": "连续8点呈上升趋势", "E": "连续25点均随机落在控制界线内"}, "answer": "BCD", "explanation": "控制图中判定异常情形：点超出控制界限、连续7点同侧、连续7点上升/下降趋势等。选BCD。"}, {"id": 380, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "下列施工质量统计分析方法中，可用来分析、追溯质量缺陷产生原因的是（）。", "options": {"A": "鱼刺图法", "B": "直方图法", "C": "分层法", "D": "相关图法"}, "answer": "A", "explanation": "因果分析图（鱼刺图）用来分析追溯质量缺陷原因。选A。"}, {"id": 381, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "single", "stem": "下列统计分析方法中,能够根据不同目的和要求，按某一性质整理分析施工质量的原始数据 是（）。", "options": {"A": "相关图法", "B": "排列图法", "C": "分层法", "D": "检查表法"}, "answer": "C", "explanation": "分层法是将数据按某一性质分类整理分析的方法。选C。"}, {"id": 382, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "下列施工质量控制工作中，属于事前控制的是（）。", "options": {"A": "工程变更处置", "B": "工序质量检验", "C": "施工机械设备选型", "D": "半成品现场取样送检"}, "answer": "C", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选C。"}, {"id": 383, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "single", "stem": "下列施工质量控制工作中，属于事中控制工作内容的是（）。", "options": {"A": "监控质量活动过程", "B": "编制施工方案", "C": "评价质量活动结果", "D": "纠正质量偏差"}, "answer": "A", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选A。"}, {"id": 384, "chapter": "第5章 建设工程质量管理", "marker": "2021年真题II改", "type": "single", "stem": "下列施工准备的质量控制工作中，属于现场施工准备工作的是（）。", "options": {"A": "编制施工组织设计", "B": "熟悉图纸", "C": "测量放线", "D": "会审图纸"}, "answer": "C", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选C。"}, {"id": 385, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "施工单位在完成施工组织设计的编制及内部审批工作后，应由（）审核签认并报送建设单 位。", "options": {"A": "总监理工程师", "B": "专业监理工程师", "C": "项目技术负责人", "D": "监理单位技术负责人"}, "answer": "A", "explanation": "施工组织设计编制完成后由项目监理机构（总监理工程师）审核签认。选A。"}, {"id": 386, "chapter": "第5章 建设工程质量管理", "marker": "2023年真题II", "type": "single", "stem": "装配式建筑的混凝土预制构件出厂时，其混凝土强度不宜低于混凝土设计强度等级值的（）。", "options": {"A": "60%", "B": "75%", "C": "65%", "D": "70%"}, "answer": "B", "explanation": "预制构件出厂时混凝土强度不宜低于设计强度等级值的75%。选B。"}, {"id": 387, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "对涉及结构安全、节能、环境保护和主要使用功能的试块、试件及材料，应按规定进行见证检验。 见证检验应在（）的监督下现场取样。", "options": {"A": "项目监理机构", "B": "质量监督机构", "C": "设计单位", "D": "质量检查机构"}, "answer": "A", "explanation": "见证检验应在建设单位或监理单位人员监督下现场取样。选A。"}, {"id": 388, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "multi", "stem": "下列施工环节中，需要设置质量控制点的有（）。", "options": {"A": "预应力混凝土结构的钢筋张拉工序", "B": "钢筋混凝土结构中的钢筋架立", "C": "预应力混凝土结构中的模板支撑", "D": "预应力混凝土结构表面涂饰", "E": "地下防水层施工"}, "answer": "ABCE", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选ABCE。"}, {"id": 389, "chapter": "第5章 建设工程质量管理", "marker": "2022年真题I", "type": "multi", "stem": "施工中对进场水泥质量的 重点控制内容包括（）。", "options": {"A": "出厂合格证核对", "B": "水灰比复验", "C": "强度复验", "D": "坍落度试验", "E": "安定性复验"}, "answer": "ACE", "explanation": "进场水泥重点控制：品种、强度等级、包装或散装仓号、出厂日期等。选ACE。"}, {"id": 390, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "根据施工质量控制点的要求，混凝土冬期施工应重点控制的技术参数是（）。", "options": {"A": "受冻临界强度", "B": "养护标准", "C": "内外温差", "D": "保温系数"}, "answer": "A", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选A。"}, {"id": 391, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "工程施工过程中，每一分项工程实施前的技术交底书应由（）编制。", "options": {"A": "企业技术负责人", "B": "项目质量管理人员", "C": "施工班组负责人", "D": "项目技术人员"}, "answer": "D", "explanation": "分项工程技术交底书应由项目技术负责人编制。选D。"}, {"id": 392, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "下列影响施工质量的环境因素中，属于施工作业环境控制的是（）。", "options": {"A": "质量责任制是否落实", "B": "质量控制自检系统是否处于良好状态", "C": "严寒季节的防冻", "D": "施工场地空间条件和通道"}, "answer": "D", "explanation": "施工作业环境控制含：安全防护设施、施工照明、通风防尘等。选D。"}, {"id": 393, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "multi", "stem": "施工测量工作开始前，施工单位应向项目监理机构提交的测量仪器相关信息有（）。", "options": {"A": "仪器型号", "B": "测量精度等级", "C": "购置或租赁凭证", "D": "使用年限", "E": "法定计量部门标定证明"}, "answer": "ABE", "explanation": "施工测量前应向监理提交测量仪器检定证书、仪器型号和精度信息。选ABE。"}, {"id": 394, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "从事特殊作业的人员必须持证上岗，特殊作业人员包括（）。", "options": {"A": "架子工", "B": "油漆工", "C": "起重工", "D": "电焊工", "E": "装修工"}, "answer": "ACD", "explanation": "特殊作业人员含：电工、焊工、起重信号工、架子工等。选ACD。"}, {"id": 395, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "技术复核是施工单位应履行的技术工作责任，其复核结果应报送（）复验确认后，才能进行后续 相关工序施工。", "options": {"A": "设计单位", "B": "项目监理机构", "C": "建设单位", "D": "质量监督机构"}, "answer": "B", "explanation": "技术复核结果应报送项目监理机构复验确认。选B。"}, {"id": 396, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "single", "stem": "工程施工过程中，施工单位对施工质量的“三检”制度指的是（）。", "options": {"A": "事前检一事中检一事后检", "B": "自检一监理检一业主检", "C": "自检一交接检一专检", "D": "施工检一设计检一监理检"}, "answer": "C", "explanation": "三检制度指自检、互检、交接检。选C。"}, {"id": 397, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "技术修改问题通常可由专业监理工程师组织，施工单位和现场设计代表参加，经各方同意后签字 并形成纪要，作为工程变更单附件，经（）批准后实施。", "options": {"A": "总监理工程师", "B": "建设单位", "C": "设计单位负责人", "D": "施工图审查机构"}, "answer": "A", "explanation": "技术修改由专业监理工程师组织，经总监理工程师批准后实施。选A。"}, {"id": 398, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "下列关于工程变更控制的说法，正确的有（）。", "options": {"A": "工程变更要求可能来自建设单位、设计单位、监理单位", "B": "工程变更涉及结构主体及安全，应报施工图原审查单位进行审查", "C": "设计单位提出的变更，首先应将“设计变更通知”及附件报送施工单位", "D": "建设单位要求的变更，应首先将变更要求及建议通知施工单位"}, "answer": "B", "explanation": "工程变更控制：变更后按程序审批、重大变更需专家论证、严禁擅自变更。选B。"}, {"id": 399, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "建设工程组成中，分部工程的划分依据是（）。", "options": {"A": "工程量、施工段", "B": "材料、施工工艺", "C": "专业性质、工程部位", "D": "工种、设备类别"}, "answer": "C", "explanation": "分部工程按专业性质、工程部位划分。选C。"}, {"id": 400, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题", "type": "multi", "stem": "根据《建筑工程施工质量验收统一标准》GB50300-2013，分项工程的划分依据有（）。", "options": {"A": "工程部位", "B": "工种", "C": "材料", "D": "施工工艺", "E": "设备类别"}, "answer": "BCDE", "explanation": "工程质量验收分为检验批、分项、分部、单位工程验收。选BCDE。"}, {"id": 401, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "检验批可根据施工、质量控制和专业验收的需要，按（）进行划分。", "options": {"A": "工程量", "B": "施工段", "C": "楼层", "D": "工程部位", "E": "专业性质"}, "answer": "ABC", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选ABC。"}, {"id": 402, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题", "type": "single", "stem": "为了验收施工质量，制定和审核/确认分部工程划分方案的做法，正确的是（）。", "options": {"A": "由项目监理机构制定，建设单位确认", "B": "由施工单位制定，项目监理机构审核", "C": "由建设单位组织备方制定，工程质量监督机构确认", "D": "由项目监理机构组织备方制定，建设单位审核"}, "answer": "B", "explanation": "分部工程划分方案由施工单位和监理单位共同商定。选B。"}, {"id": 403, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "multi", "stem": "下列分部工程中，需要设计单位项目负责人参加施工质量验收的有（）。", "options": {"A": "电梯分部工程", "B": "地基与基础分部工程", "C": "主体结构工程", "D": "节能分部工程", "E": "屋面分部工程"}, "answer": "BCD", "explanation": "工程质量验收分为检验批、分项、分部、单位工程验收。选BCD。"}, {"id": 404, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "除施工单位项目负责人和项目技术负责人外，参加地基与基础、主体结构等分部工程验收的 施工单位人员是（）。", "options": {"A": "合同、技术部门负责人", "B": "技术、质量部门负责人", "C": "质量、安全部门负责人", "D": "合同、质量部门负责人"}, "answer": "B", "explanation": "地基基础、主体结构分部验收还需施工单位技术质量部门负责人参加。选B。"}, {"id": 405, "chapter": "第5章 建设工程质量管理", "marker": "2021年真题", "type": "single", "stem": "根据《建筑工程施工质量验收统一标准》，分项工程质量验收的组织者是（）。", "options": {"A": "项目经理", "B": "项目技术负责人", "C": "总监理工程师", "D": "专业监理工程师"}, "answer": "D", "explanation": "工程质量验收分为检验批、分项、分部、单位工程验收。选D。"}, {"id": 406, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "根据施工质量验收标准，检验批质量应按（）验收。", "options": {"A": "主控项目和一般项目", "B": "关键项目和一般项目", "C": "观感质量和关键项目", "D": "主控项目和观感质量"}, "answer": "A", "explanation": "工程质量验收分为检验批、分项、分部、单位工程验收。选A。"}, {"id": 407, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题", "type": "single", "stem": "关于建设工程项目施工质量验收的说法，正确的是（）。", "options": {"A": "分项工程、分部工程应由专业监理工程师组织验收", "B": "分部工程的质量验收在分项工程验收的基础上进行", "C": "分项工程是工程验收的最小单元", "D": "分部工程所含全部分项工程质量验收合格，即可认为该分部工程验收合格"}, "answer": "B", "explanation": "工程质量验收分为检验批、分项、分部、单位工程验收。选B。"}, {"id": 408, "chapter": "第5章 建设工程质量管理", "marker": "2013年真题", "type": "single", "stem": "某工程进行检验批验收时，发现某框架梁截面尺寸与原设计图纸尺寸不符，但经原设计单位 核算，仍能满足结构安全及使用功能要求，则该检验批（）。", "options": {"A": "应重新施工", "B": "应经施工单位和业主协商确定是否予以验收，其经济责任由业主承担", "C": "必须进行加固处理后重新组织验收", "D": "可直接予以验收"}, "answer": "D", "explanation": "尺寸偏差但不影响结构安全和使用的检验批可予以验收。选D。"}, {"id": 409, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "在竣工预验收合格后，组织相关单位项目负责人进行工程竣工验收的单位应为（）。", "options": {"A": "监理单位", "B": "设计单位", "C": "建设单位", "D": "施工单位"}, "answer": "C", "explanation": "由建设单位项目负责人组织相关单位项目负责人进行竣工验收。选C。"}, {"id": 410, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "当工程在保修期内出现一般质量缺陷时，（）制定保修方案。", "options": {"A": "建设单位", "B": "监理单位", "C": "施工单位", "D": "原设计单位"}, "answer": "C", "explanation": "保修期内一般质量缺陷由施工单位制定保修方案。选C。"}, {"id": 411, "chapter": "第5章 建设工程质量管理", "marker": "2022年真题II", "type": "single", "stem": "根据《质量管理体系基础和术语》,凡工程产品未满足质量要求就称为（）。", "options": {"A": "质量问题", "B": "质量缺陷", "C": "质量事故", "D": "质量不合格"}, "answer": "D", "explanation": "未满足质量要求称为\"质量不合格\"。选D。"}, {"id": 412, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题", "type": "single", "stem": "根据《质量管理体系基础和术语》GB/T 19000-2016/ISO 9000：2015，“凡工程产品与预期 或规定用途有关的质量不合格”称为（）。", "options": {"A": "质量问题", "B": "质量事故", "C": "质量不合格", "D": "质量缺陷"}, "answer": "D", "explanation": "不合格品处理包括返工、返修、让步接收、降级使用和报废。选D。"}, {"id": 413, "chapter": "第5章 建设工程质量管理", "marker": "2020年真题II", "type": "multi", "stem": "按事故责任分类，下列工程质量事故中，属于指导责任事故的有（）。", "options": {"A": "项目负责人不按规范指导施工造成的质量事故", "B": "项目管理人员强令他人违章作业造成质量事故", "C": "施工人员在浇筑混凝土时随意加水造成质量事故", "D": "项目技术负责人降低施工质量标准造成质量事故", "E": "片面追求施工进度而忽视质量控制造成质量事故"}, "answer": "ABDE", "explanation": "指导责任事故含：技术交底不清、违章指挥、违反操作规程等。选ABDE。"}, {"id": 414, "chapter": "第5章 建设工程质量管理", "marker": "2021年真题", "type": "single", "stem": "下列工程质量事故发生的原因中，属于技术原因的有（）。", "options": {"A": "检测设备管理不善造成仪器失准", "B": "结构设计方案不正确", "C": "检验检查制度不严密", "D": "监理人员旁站检验不到位"}, "answer": "B", "explanation": "技术原因：设计方案错误、施工工艺不成熟、材料选型不当等。选B。"}, {"id": 415, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题改", "type": "multi", "stem": "下列可能导致施工质量事故发生的原因中，属于管理原因的有（）。", "options": {"A": "质量控制不严", "B": "质量管理措施落实不力", "C": "地质情况估计错误", "D": "材料质量检验不严", "E": "偷工减料"}, "answer": "ABD", "explanation": "管理原因：质量管理体系不完善、检查不到位、管理措施不力等。选ABD。"}, {"id": 416, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "某工程施工中发生的质量事故，导致了3人死亡，直接经济损失5000万元。则该事故等级应 界定为（）", "options": {"A": "一般事故", "B": "重大事故", "C": "较大事故", "D": "特别重大事故"}, "answer": "B", "explanation": "3人死亡+5000万属较大事故（3人≤死亡<10人，或1000万≤直接损失<5000万时属较大；5000万=5000万刚好是重大事故底线5000万）。死亡3人属较大事故，直接损失5000万属重大事故，就高定为重大事故。选B。"}, {"id": 417, "chapter": "第5章 建设工程质量管理", "marker": "2015年真题", "type": "single", "stem": "某工程在浇筑楼板混凝土时，发生支模架坍塌，造成3人死亡，6人重伤，经调查，系现场技 术管理人员未进行技术交底所致。该工程质量事故应判定为（）。", "options": {"A": "操作责任的较大事故", "B": "操作责任的重大事故", "C": "指导责任的较大事故", "D": "指导责任的重大事故"}, "answer": "C", "explanation": "3人死亡+6人重伤，属较大事故（3人≤死亡<10人）。选C。"}, {"id": 418, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "multi", "stem": "造成施工质量事故的原因分析中，属于违背基本建设规律的有（）。", "options": {"A": "边设计、边施工", "B": "越级设计、越级施工", "C": "未经验收即交付使用", "D": "技术交底不清", "E": "地质勘察报告不详细"}, "answer": "ABC", "explanation": "违背基本建设规律含：边勘察边设计边施工、任意压缩合理工期、未验收即使用等。选ABC。"}, {"id": 419, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "multi", "stem": "下列措施中，属于施工质量事故预防措施的有（）。", "options": {"A": "坚持按工程建设程序办事", "B": "做好必要的技术复核和技术核定工作", "C": "及时做好质量事故的处理工作", "D": "加强施工安全与环境管理", "E": "加强质量培训教育，提高全员质量意识"}, "answer": "ABDE", "explanation": "质量事故预防措施含：加强教育培训、完善质保体系、严格材料检验等。选ABDE。"}, {"id": 420, "chapter": "第5章 建设工程质量管理", "marker": "2015年真题", "type": "multi", "stem": "下列措施中，属于施工质量事故预防的有（）。", "options": {"A": "严格按照基本建设程序办事", "B": "依法进行施工组织管理", "C": "加强施工安全与环境管理", "D": "进行必要的设计复核审查", "E": "做好质量事故的观测记录"}, "answer": "ABCD", "explanation": "质量事故预防：加强教育培训、严格材料检验、完善质保体系、做好技术交底等。选ABCD。"}, {"id": 421, "chapter": "第5章 建设工程质量管理", "marker": "2023年真题II", "type": "single", "stem": "下列施工质量事故预防措施中，属于严格按照基本建设程序办事的是（）。", "options": {"A": "严格控制建筑材料质量", "B": "禁止任意修改设计和不按图纸施工", "C": "严禁脚手架超载堆放材料", "D": "推行终身职业技能培训制度"}, "answer": "B", "explanation": "严格按基本建设程序包括：先勘察后设计再施工、不搞三边工程。选B。"}, {"id": 422, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "为保证工程质量满足设计需求和合同约定是需要进行必要的技术复核工作。下列工作内容 中属于技术复核工作是（）。", "options": {"A": "施工方案论证", "B": "施工设备验收", "C": "施工图纸会审", "D": "建筑材料检测"}, "answer": "C", "explanation": "技术复核是在施工过程中对重要技术工作进行复查核对。选C。"}, {"id": 423, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题II", "type": "single", "stem": "技术复核和技术核定是预防施工质量事故的重要措施，下列工作中属于技术复核工作的是 （）。", "options": {"A": "深化施工图设计", "B": "进行设计交底", "C": "培训施工人员", "D": "编制专项施方案"}, "answer": "B", "explanation": "技术复核是对定位放线、标高、轴线、模板、钢筋等关键工序的复查。选B。"}, {"id": 424, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "multi", "stem": "下列工作内容中，属于技术复核工作的有（）。", "options": {"A": "图纸会审", "B": "施工工艺修改后的论证", "C": "施工方案修改后的审核", "D": "工程实物量变动的认可", "E": "工程定位引测点的复测"}, "answer": "AE", "explanation": "技术复核工作内容：定位放线、标高复核、模板尺寸检查等。选AE。"}, {"id": 425, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "multi", "stem": "下列建设工程资料中，可以作为施工质量事故处理依据的有（）。", "options": {"A": "法律法规", "B": "工程竣工报告", "C": "合同文件", "D": "工程建设标准", "E": "企业内部管理制度"}, "answer": "ACDE", "explanation": "质量事故处理依据：质量事故实况资料、合同文件、技术文件档案、相关法律法规。选ACDE。"}, {"id": 426, "chapter": "第5章 建设工程质量管理", "marker": "2024年真题II", "type": "single", "stem": "施工质量事故处理的工作包括：①事故报告：②事故调查：③事故处理的鉴定验收：④提 交事故处理报告：⑤事故处理。正确的程序是（）。", "options": {"A": "①-②-⑤-③-④", "B": "①-②-③-④-⑤", "C": "②-①-③-④-⑤", "D": "④-②-⑤-①-③"}, "answer": "A", "explanation": "事故处理程序：事故报告→事故调查→事故处理→鉴定验收→提交处理报告。即①-②-⑤-③-④。选A。"}, {"id": 427, "chapter": "第5章 建设工程质量管理", "marker": "2020年真题", "type": "single", "stem": "根据施工质量事故调查处理的一般程序，事故处理的最后一步工作是（）。", "options": {"A": "提出事故鉴定结论", "B": "提交事故处理结果", "C": "提交事故处理报告", "D": "提出事故处理方案"}, "answer": "C", "explanation": "事故处理最后一步：提交事故处理报告。选C。"}, {"id": 428, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "施工质量事故发生后，本单位负责人接到施工质量事故发生报告后，向事故发生地县级以上人民 政府住房和城乡建设主管部门及有关部门报告应在（）小时内。", "options": {"A": "2", "B": "3", "C": "1", "D": "6"}, "answer": "C", "explanation": "质量事故发生后单位负责人应在1小时内上报。选C。"}, {"id": 429, "chapter": "第5章 建设工程质量管理", "marker": "练习题", "type": "single", "stem": "某工程发生质量事故，造成直接经济损失800万元，重伤5人，该事故应逐级上报至（）住房和城 乡建设主管部门。", "options": {"A": "县级人民政府", "B": "市级人民政府", "C": "省级人民政府", "D": "国务院住房和城乡建设主管部门"}, "answer": "C", "explanation": "直接损失800万+重伤5人属较大事故，应逐级上报至省级住建主管部门。选C。"}, {"id": 430, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题", "type": "single", "stem": "下列工程质量事故中，可由事故发生单位组织事故调查组的是（）。", "options": {"A": "2人以下死亡，100万元～500万元的直接经济损失", "B": "5人以下重伤、100万元～500万元的直接经济损失", "C": "未造成人员伤亡，1000万～5000万元的直接经济损失", "D": "未造成人员伤亡，100万元～1000万元的直接经济损失"}, "answer": "D", "explanation": "一般事故可由事故发生单位组织调查组。选D。"}, {"id": 431, "chapter": "第5章 建设工程质量管理", "marker": "2018年真题", "type": "single", "stem": "某县一建筑工地发生质量重大事故，则事故调查组应由（）负责组织。", "options": {"A": "事故发生地县级人民政府", "B": "国务院安全生产监督管理部门", "C": "事故发生单位", "D": "事故发生地省级人民政府"}, "answer": "D", "explanation": "重大事故由省级人民政府组织事故调查组。选D。"}, {"id": 432, "chapter": "第5章 建设工程质量管理", "marker": "2021真题II", "type": "multi", "stem": "建设工程施工质量事故调查报告的主要内容包括（）。", "options": {"A": "事故救援情况", "B": "事故防范和整改措施", "C": "事故发生的原因和事故性质", "D": "事故处理依据", "E": "事故责任者处理"}, "answer": "ABC", "explanation": "事故调查报告含：事故基本情况、事故经过、原因分析、责任认定、处理建议等。选ABC。"}, {"id": 433, "chapter": "第5章 建设工程质量管理", "marker": "2023年真题II", "type": "single", "stem": "某工程施工中，混凝土结构出现宽度0.3mm的裂缝，且裂缝较深，但不影响结构的安全和使 用，则采用的处理方法是（）。", "options": {"A": "灌浆修补法", "B": "表面密封法", "C": "嵌缝密闭法", "D": "纤维加固法"}, "answer": "A", "explanation": "不影响结构安全的裂缝，采用表面修补（封闭）处理。选A。"}, {"id": 434, "chapter": "第5章 建设工程质量管理", "marker": "2025年真题", "type": "single", "stem": "某工程施工管理人员检查质量时，发现混凝土结构板表面有宽度为0.4mm且较深的裂缝。经分 析研究后判定不影响结构安全和使用，对此可采用的返修处理方法是（）。", "options": {"A": "表面密封法", "B": "嵌缝密闭法", "C": "灌浆修补法", "D": "增大截面法"}, "answer": "C", "explanation": "较深裂缝但不影响结构安全，采用灌浆修补（返修）。选C。"}, {"id": 435, "chapter": "第5章 建设工程质量管理", "marker": "2017年真题", "type": "single", "stem": "当工程质量缺陷经加固、返工处理后仍无法保证达到规定的安全要求，但没有完全丧失使用 功能时，适宜采用的处理方法是（）。", "options": {"A": "不作处理", "B": "报废处理", "C": "返修处理", "D": "限制处理"}, "answer": "D", "explanation": "无法保证安全要求但未完全丧失使用功能，应采用限制使用处理。选D。"}, {"id": 436, "chapter": "第5章 建设工程质量管理", "marker": "2023年真题", "type": "single", "stem": "下列施工质量缺陷问题可不做处理的是（）。", "options": {"A": "混凝土出现0.4mm宽裂隙", "B": "混凝土采用了安定性不合格的水泥", "C": "预应力构件张拉系数不满足设计要求", "D": "混凝土现浇楼面平整度偏差10mm"}, "answer": "D", "explanation": "不影响结构安全和使用功能、后续工序可弥补的缺陷可不做处理。选D。"}, {"id": 437, "chapter": "第5章 建设工程质量管理", "marker": "2018年真题II", "type": "single", "stem": "建设工程施工质量事故的处理程序中，确定处理结果是否达到预期目的、是否依然存在隐 患，属于（）环节的工作。", "options": {"A": "事故处理鉴定验收", "B": "事故调查", "C": "事故原因分析", "D": "制订事故处理技术方案"}, "answer": "A", "explanation": "确定处理结果是否达到预期目的是\"鉴定验收\"环节。选A。"}, {"id": 438, "chapter": "第6章 建设工程成本管理", "marker": "2021年真题改", "type": "multi", "stem": "下列建设工程项目施工成本费用中，属于间接成本的有（）。", "options": {"A": "人工费", "B": "管理人员工资", "C": "办公费", "D": "检验试验费", "E": "机械费"}, "answer": "BCD", "explanation": "施工成本由直接成本和间接成本组成。选BCD。"}, {"id": 439, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题", "type": "single", "stem": "工程成本与工程量的关系划分中，属于成本分类的是（）。", "options": {"A": "目标成本和责任成本", "B": "固定成本和变动成本", "C": "预算成本和计划成本", "D": "直接成本与间接成本"}, "answer": "B", "explanation": "按成本与工程量关系分为固定成本和变动成本。选B。"}, {"id": 440, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题II", "type": "multi", "stem": "下列费用项目中，属于施工成本中变动成本的有（）。", "options": {"A": "办公费", "B": "管理人员工资", "C": "施工机具使用费", "D": "按直线法计提的固定资产折旧", "E": "直接成本中的材料费"}, "answer": "CE", "explanation": "施工成本由直接成本和间接成本组成。选CE。"}, {"id": 441, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题II", "type": "single", "stem": "下列工程费用中，属于质量控制成本的是（）。", "options": {"A": "工程保修费", "B": "损失赔偿费", "C": "工程质量验收费", "D": "质量事故处理费"}, "answer": "C", "explanation": "质量控制是质量管理的一部分，致力于满足质量要求。选C。"}, {"id": 442, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "multi", "stem": "工程质量成本可分为控制成本和损失成本。下列施工成本中，属于工程质量控制成本的有（）。", "options": {"A": "质量规划费", "B": "工程保修费", "C": "质量培训费", "D": "质量事故处理费", "E": "工序检验费"}, "answer": "ACE", "explanation": "质量控制成本含：预防成本和鉴定成本。选ACE。"}, {"id": 443, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题II", "type": "single", "stem": "按施工成本要素构成划分，质量规划费用属于质量成本中的（）。", "options": {"A": "间接成本", "B": "损失成本", "C": "预防成本", "D": "鉴定成本"}, "answer": "C", "explanation": "施工成本由直接成本和间接成本组成。选C。"}, {"id": 444, "chapter": "第6章 建设工程成本管理", "marker": "练习题", "type": "single", "stem": "下列质量成本项目中，属于鉴定成本的是（）。", "options": {"A": "新工艺鉴定费", "B": "工序控制费", "C": "工序检验费", "D": "质量培训费"}, "answer": "C", "explanation": "鉴定成本含：检验试验费、检测设备折旧等。选C。"}, {"id": 445, "chapter": "第6章 建设工程成本管理", "marker": "练习题", "type": "single", "stem": "工程保修属于施工单位的（）成本。", "options": {"A": "外部损失成本", "B": "内部损失成本", "C": "鉴定成本", "D": "预防成本"}, "answer": "A", "explanation": "工程保修属于外部损失成本。选A。"}, {"id": 446, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "multi", "stem": "关于施工项目质量成本的说法，正确的有（）", "options": {"A": "减少质量控制成本，质量损失成本也会减少", "B": "质量成本可分为控制成本和损失成本", "C": "质量控制成本可分为预防成本和鉴定成本", "D": "质量事故处理费用属于损失成本", "E": "减少质量控制成本，质量水平上升"}, "answer": "BCD", "explanation": "质量成本关系：总成本=控制成本(预防+鉴定)+损失成本(内部+外部)，控制成本增加会降低损失成本。选BCD。"}, {"id": 447, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题", "type": "multi", "stem": "根据工程特点和成本管理要求不同，工程成本可分为不同类别。构成工程实体的材料费可归 入的工程成本类别有（）。", "options": {"A": "变动成本", "B": "直接成本", "C": "采购成本", "D": "措施成本", "E": "质量成本"}, "answer": "AB", "explanation": "材料费属变动成本+直接成本。选AB。"}, {"id": 448, "chapter": "第6章 建设工程成本管理", "marker": "练习题", "type": "single", "stem": "在工程施工阶段影响工程成本的诸多因素中，影响施工机具设备成本的因素不包括（）。", "options": {"A": "租赁成本", "B": "机械闲置现象", "C": "维护成本", "D": "燃料费用"}, "answer": "B", "explanation": "影响施工机具设备成本的因素不含企业管理水平（属管理因素）。选B。"}, {"id": 449, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "施工成本控制的主要依据是（）。", "options": {"A": "成本预测", "B": "成本核算", "C": "成本分析", "D": "成本计划"}, "answer": "D", "explanation": "成本控制贯穿于成本管理的全过程。选D。"}, {"id": 450, "chapter": "第6章 建设工程成本管理", "marker": "练习题", "type": "single", "stem": "施工成本管理各环节是一个有机联系和相互制约的系统过程，（）是对成本计划是否实现进行的 检查，并为成本管理绩效考核提供依据。", "options": {"A": "成本计划", "B": "成本控制", "C": "成本分析", "D": "成本管理绩效考核"}, "answer": "C", "explanation": "成本计划是成本控制的标准和依据。选C。"}, {"id": 451, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "multi", "stem": "按照现代企业管理理念，施工责任成本通常具备的条件有（）。", "options": {"A": "可考核性", "B": "可耦合性", "C": "可预计性", "D": "可控制性", "E": "可计量性"}, "answer": "ACDE", "explanation": "责任成本应具备：可控制、可计量、可考核等条件。选ACDE。"}, {"id": 452, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "以履行施工合同为前提，经过施工单位和项目管理机构协商确定的由项目管理机构控制的 成本总额是（）。", "options": {"A": "施工责任成本", "B": "预算成本", "C": "竞争性成本", "D": "项目实际成本"}, "answer": "A", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选A。"}, {"id": 453, "chapter": "第6章 建设工程成本管理", "marker": "练习题", "type": "multi", "stem": "施工责任成本由（）组成。", "options": {"A": "人工费", "B": "施工机具使用费", "C": "利润", "D": "企业管理费", "E": "税金"}, "answer": "AB", "explanation": "责任成本由可控直接成本和可控间接成本组成。选AB。"}, {"id": 454, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "single", "stem": "中标后，一般由（）组织进行标价分离、完成施工成本测算，协调相关部门编制施工成本降 低率。", "options": {"A": "技术部门", "B": "工程部门", "C": "人力资源部门", "D": "商务部门"}, "answer": "D", "explanation": "施工成本由直接成本和间接成本组成。选D。"}, {"id": 455, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题", "type": "multi", "stem": "施工项目竞争性成本计划是（）的估算成本计划。", "options": {"A": "选派项目经理阶段", "B": "投标阶段", "C": "施工准备阶段", "D": "签订合同阶段", "E": "制定企业年度计划阶段"}, "answer": "BD", "explanation": "成本计划是成本控制的标准和依据。选BD。"}, {"id": 456, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题", "type": "single", "stem": "下列成本计划中，用于确定责任总成本目标的是（）。", "options": {"A": "指导性成本计划", "B": "竞争性成本计划", "C": "响应性成本计划", "D": "实施性成本计划"}, "answer": "A", "explanation": "成本计划是成本控制的标准和依据。选A。"}, {"id": 457, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题II", "type": "single", "stem": "施工单位以施工方案及企业施工定额为依据编制的成本计划是（）。", "options": {"A": "预测性成本计划", "B": "竞争性成本计划", "C": "实施性成本计划", "D": "指导性成本计划"}, "answer": "C", "explanation": "成本计划是成本控制的标准和依据。选C。"}, {"id": 458, "chapter": "第6章 建设工程成本管理", "marker": "2023年真题II", "type": "multi", "stem": "施工成本计划编制的依据有（）。", "options": {"A": "合同文件", "B": "设计文件", "C": "施工组织设计", "D": "合同计价方式", "E": "价格信息"}, "answer": "ABE", "explanation": "成本计划是成本控制的标准和依据。选ABE。"}, {"id": 459, "chapter": "第6章 建设工程成本管理", "marker": "练习题", "type": "single", "stem": "编制施工成本计划的工作包括：①确定项目总体成本目标；②预测项目成本；③编制项目总体成 本计划；④项目管理机构和组织的职能部门编制相应（各自）的成本计划。正确的顺序（）", "options": {"A": "①②③④", "B": "②①③④", "C": "①③②④", "D": "②③①④"}, "answer": "B", "explanation": "成本计划是成本控制的标准和依据。选B。"}, {"id": 460, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "single", "stem": "编制施工成本计划的关键是（）。", "options": {"A": "明确责任成本", "B": "进行成本分析", "C": "分解综合成本", "D": "确定目标成本"}, "answer": "D", "explanation": "成本计划是成本控制的标准和依据。选D。"}, {"id": 461, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题II", "type": "single", "stem": "施工总成本分解到单项工程、单位工程，再进一步分解到分部分项工程的方法，是按（） 编制施工成本计划的方法。", "options": {"A": "成本组成", "B": "项目结构", "C": "实施进度", "D": "施工组织"}, "answer": "B", "explanation": "成本计划是成本控制的标准和依据。选B。"}, {"id": 462, "chapter": "第6章 建设工程成本管理", "marker": "2021年真题", "type": "single", "stem": "绘制时间－成本累积曲线的步骤中，紧接“计算规定时间t计划累计支出的成本额”之后的工 作是（）。", "options": {"A": "在时标网络图上，按时间编制成本支出计划", "B": "确定工程项目进度计划，编制进度计划的横道图", "C": "绘制S形曲线", "D": "计算单位时间的成本"}, "answer": "C", "explanation": "计算累计支出成本额后将各点连线绘成成本曲线。选C。"}, {"id": 463, "chapter": "第6章 建设工程成本管理", "marker": "2021年真题", "type": "single", "stem": "为了提高项目按期竣工的保证率，利用“S”曲线编制成本计划时，可以采取的做法是（）。", "options": {"A": "非关键线路上的工作都按最迟时间开始", "B": "所有工作都按最早时间开始", "C": "施工成本大的工作按最迟时间开始", "D": "人工消耗量大的工作按最早时间开始"}, "answer": "B", "explanation": "成本计划是成本控制的标准和依据。选B。"}, {"id": 464, "chapter": "第6章 建设工程成本管理", "marker": "2023年真题", "type": "multi", "stem": "施工项目管理机构可按（）编制施工成本计划。", "options": {"A": "合同计价方式", "B": "成本组成", "C": "项目结构", "D": "工程实施阶段", "E": "资金来源"}, "answer": "BCD", "explanation": "成本计划是成本控制的标准和依据。选BCD。"}, {"id": 465, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题II", "type": "single", "stem": "项目施工成本的过程控制程序主要包括（）。", "options": {"A": "管理控制程序和评审控制程序", "B": "管理行为控制程序和指标控制程序", "C": "管理人员激励程序和指标控制程序 D管理行为控制程序和目标考核程序"}, "answer": "B", "explanation": "施工成本由直接成本和间接成本组成。选B。"}, {"id": 466, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "施工成本的指标控制工作有：1采集成本数据，监测成本形成过程：2调整改进成本管理方 法；3确定成本管理分层次目标：4制定对策，纠正偏差；5找出偏差，分析原因。正确的程序是（）。", "options": {"A": "1-3-5-2-4", "B": "3-1-5-4-2", "C": "1-3-2-4-5", "D": "3-1-2-5-4"}, "answer": "B", "explanation": "施工成本由直接成本和间接成本组成。选B。"}, {"id": 467, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "single", "stem": "施工成本指标控制过程包含的工作有：①采集成本数据；②确定成本管理分层次目标；③调 整改进成本管理方法。仅就上述工作而言，正确的工作程序是（）。", "options": {"A": "①-②-③", "B": "②-①-③", "C": "②-③-①", "D": "①-③-②"}, "answer": "B", "explanation": "施工成本由直接成本和间接成本组成。选B。"}, {"id": 468, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "multi", "stem": "施工成本中人工费控制的主要手段有（）", "options": {"A": "减少劳动力投入的数量", "B": "加强劳动定额管理", "C": "降低劳动者的薪酬标准", "D": "提高劳动生产率", "E": "降低工程耗用人工工日"}, "answer": "BDE", "explanation": "施工成本由直接成本和间接成本组成。选BDE。"}, {"id": 469, "chapter": "第6章 建设工程成本管理", "marker": "2023年真题", "type": "single", "stem": "关于施工材料费控制的说法，正确的是（）。", "options": {"A": "主要控制材料的采购价格", "B": "应由施工作业者包干控制", "C": "应遵循“量价分离”原则", "D": "主要是定额控制"}, "answer": "C", "explanation": "材料费控制应坚持“量价分离”原则，即材料用量控制和材料价格控制分开管理。A错误：材料费控制不仅看采购价格，更重用量；B错误：不能简单包干；D错误：材料费控制是量价分离，非单纯定额控制。故选C。"}, {"id": 470, "chapter": "第6章 建设工程成本管理", "marker": "2022年真题补", "type": "single", "stem": "限额领料依据中，计算和调整非实体性消耗材料的基础是（）。", "options": {"A": "准确的工程量", "B": "预算定额", "C": "施工组织设计", "D": "发包人认可的交更洽商单"}, "answer": "C", "explanation": "噪声控制：昼间≤70dB(A)，夜间≤55dB(A)。选C。"}, {"id": 471, "chapter": "第6章 建设工程成本管理", "marker": "2013年真题", "type": "single", "stem": "下列施工成本材料费的控制中，可以影响材料价格的因素是（）。", "options": {"A": "材料的采购运输", "B": "材料领用的指标", "C": "材料的投料计量", "D": "材料消耗量的大小"}, "answer": "A", "explanation": "施工成本由直接成本和间接成本组成。选A。"}, {"id": 472, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题", "type": "multi", "stem": "下列施工机械使用费控制措施中，属于控制台班数量的有（）。", "options": {"A": "加强施工机械设备内部调配", "B": "加强机械设备配件管理", "C": "加强设备租赁计划管理", "D": "提高机械设备利用率", "E": "按油料消耗定额控制油料消耗"}, "answer": "ACD", "explanation": "控制台班数量：加强机械设备内部调配（A）、加强设备租赁计划管理（C）、提高机械设备利用率（D）以减少台班用量。B配件管理、E油料定额属于控制台班消耗/费用，非台班数量。故选ACD。"}, {"id": 473, "chapter": "第6章 建设工程成本管理", "marker": "2022年真题", "type": "single", "stem": "计划工程量5000m³，计划成本500元/m³；实际完成工程量4500m³，实际成本520元/m³；采用 赢得值法计算其费用偏差为（）万元。", "options": {"A": "-10", "B": "-9", "C": "-16", "D": "-35"}, "answer": "B", "explanation": "赢得值法三个基本参数：BCWP(已完工作预算费用)、BCWS(计划工作预算费用)、ACWP(已完工作实际费用)。CV=BCWP-ACWP, SV=BCWP-BCWS。选B。"}, {"id": 474, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "single", "stem": "某钢筋混凝土结构工程，计划月浇筑混凝土8000m 3，预算单价500元/m 3；当月实际浇筑混凝土 7000m 3，实际单价540元/m 3。则该月工程进度绩效指数（SPI）是（）。", "options": {"A": "0.875", "B": "0.810", "C": "1.058", "D": "1.143"}, "answer": "A", "explanation": "SPI=已完工作预算费用(BCWP)/计划工作预算费用(BCWS)。BCWP=7000×500=3,500,000；BCWS=8000×500=4,000,000；SPI=3,500,000/4,000,000=0.875。故选A。"}, {"id": 475, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题", "type": "single", "stem": "某工程开工后至第4月末，累计已完工程实际费用300万元，已完工程预算费用350万元，拟完 工程预算费用330万元。则该工程第4月末实际进展和费用支出状况，正确的是（）。", "options": {"A": "费用绩效指数为0.86，实际费用超支", "B": "进度偏差为20万元，实际进度拖后", "C": "费用偏差为-50万元，实际费用节约", "D": "进度绩效指数为1.06，实际进度超前"}, "answer": "D", "explanation": "危险废物应交有资质的单位处置。选D。"}, {"id": 476, "chapter": "第6章 建设工程成本管理", "marker": "2016年真题", "type": "single", "stem": "关于赢得值及其曲线的说法，错误的是（）。", "options": {"A": "进度偏差是相对值指标，相对值越大的项目，表明偏离程度越严重", "B": "费用偏差仅适用对同一项目作偏差分析", "C": "在费用、进度控制中引入赢得值可以克服将费用、进度分开控制的缺点", "D": "同一项项目采用费用偏差和费用绩效指数进行分析，结论是一致的"}, "answer": "A", "explanation": "绿色施工管理含组织管理、规划管理、实施管理、评价管理。选A。"}, {"id": 477, "chapter": "第6章 建设工程成本管理", "marker": "2022年真题", "type": "multi", "stem": "挣值法评价指标中，适用于不同项目之间偏差分析的有（）。", "options": {"A": "费用偏差", "B": "进度偏差", "C": "综合绩效指数", "D": "费用绩效指数", "E": "进度绩效指数"}, "answer": "DE", "explanation": "费用绩效指数(CPI)和进度绩效指数(SPI)是相对指标，不受项目规模影响，适用于不同项目间偏差分析。A费用偏差、B进度偏差是绝对指标，受规模影响，不宜跨项目比较。故选DE。"}, {"id": 478, "chapter": "第6章 建设工程成本管理", "marker": "2017年真题", "type": "single", "stem": "某工程的赢得值曲线如下图，关于t1时点成本和进度状态的说法，正确的是（）。", "options": {"A": "费用节约、进度超前", "B": "费用超支、进度拖延", "C": "费用节约、进度拖延", "D": "费用超支、进度超前"}, "answer": "D", "explanation": "赢得值法三个基本参数：BCWP(已完工作预算费用)、BCWS(计划工作预算费用)、ACWP(已完工作实际费用)。CV=BCWP-ACWP, SV=BCWP-BCWS。选D。"}, {"id": 479, "chapter": "第6章 建设工程成本管理", "marker": "2023年真题", "type": "single", "stem": "应用曲线法进行施工成本偏差分析时，已完工作实际费用曲线与已完工作预算费用曲线的竖 向距离，表示（）。", "options": {"A": "进度累计偏差", "B": "进度局部偏差", "C": "费用局部偏差", "D": "费用累计偏差"}, "answer": "D", "explanation": "施工成本由直接成本和间接成本组成。选D。"}, {"id": 480, "chapter": "第6章 建设工程成本管理", "marker": "2015年真题", "type": "single", "stem": "某工作横道图偏差分析如下图，正确的有（）", "options": {"A": "费用节约", "B": "进度提前", "C": "进度绩效指数小于1", "D": "费用绩效指数大于1"}, "answer": "B", "explanation": "国际工程招标方式公开招标和邀请招标。选B。"}, {"id": 481, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "建设工程施工成本纠偏时，可采取的组织措施是（）。", "options": {"A": "编制成本管理工作计划，确定合理的工作流程", "B": "结合施工方法，进行建筑材料比选", "C": "分析成本管理目标风险，并制定防范对策", "D": "分析施工合同条款，寻求索赔机会"}, "answer": "A", "explanation": "施工成本由直接成本和间接成本组成。选A。"}, {"id": 482, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "multi", "stem": "下列施工成本的纠偏措施中，属于经济措施的有（）。", "options": {"A": "编制成本管理工作计划并确定合理的工作流程", "B": "进行技术经济分析，确定最佳施工方案", "C": "做好各项支出的使用计划并在施工中严格控制", "D": "分析合同条款，关注业主合同执行情况，寻求索赔机会", "E": "对各种变更及时做好增减账，落实业主签证并结算工程款"}, "answer": "CE", "explanation": "施工成本由直接成本和间接成本组成。选CE。"}, {"id": 483, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题II", "type": "single", "stem": "下列施工成本控制措施中，属于技术措施的是（）。", "options": {"A": "制定详细的成本控制工作流程", "B": "记录实际支出的各项费用", "C": "编制科学的资金使用计划", "D": "确定合适的施工机械使用方案"}, "answer": "D", "explanation": "成本控制贯穿于成本管理的全过程。选D。"}, {"id": 484, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题II", "type": "single", "stem": "关于工程成本会计核算、业务核算和统计核算区别和联系的说法，正确的是（）。", "options": {"A": "会计核算是对已发生的经济活动进行核算，而业务核算和统计核算还可对正在进行的经济活动进行核算", "B": "业务核算是价值核算，会计核算的范围比业务核算的范围更广", "C": "统计核算和会计核算必须用货币计量，业务核算可以用实物量或劳动量计量", "D": "统计核算是利用会计核算和业务核算的资料，把数据按统计方法加以系统管理，发现企业生产经营活动的 规律"}, "answer": "D", "explanation": "统计核算利用会计核算、业务核算的资料，按统计方法系统整理，发现企业生产经营活动的规律（D正确）。A错误：业务核算不但可核算已发生，也可核算正在发生和尚未发生的；B错误：业务核算范围最广；C错误：统计核算可用实物、价值或劳动量计量，非必须用货币。故选D。"}, {"id": 485, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题", "type": "single", "stem": "下列项目成本分析所依据资料中，可以计算项目当前实际成本，并可以确定变动速度和预测 成本发展趋势的是（）。", "options": {"A": "统计核算", "B": "表格核算", "C": "会计核算", "D": "业务核算"}, "answer": "A", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选A。"}, {"id": 486, "chapter": "第6章 建设工程成本管理", "marker": "2022年真题", "type": "single", "stem": "成本分析的步骤包括：①收集成本信息；②选择成本分析方法；③进行成本数据处理；④分 析成本形成原因；⑤确定成本结果。正确的编制程序是（）。", "options": {"A": "①-②-④-③-⑤", "B": "①-②-⑤-③-④", "C": "②-①-③-④-⑤", "D": "②-①-④-⑤-③"}, "answer": "C", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选C。"}, {"id": 487, "chapter": "第6章 建设工程成本管理", "marker": "2018年真题II", "type": "single", "stem": "某单位产品1月份成本相关参数如下表。用因素分析法计算，单位产品人工消耗量变动对成本的影响是（）元。<br><table class=\"data-table\"><thead><tr><th>项目</th><th>单位</th><th>计划值</th><th>实际值</th></tr></thead><tbody><tr><td>产品产量</td><td>件</td><td>180</td><td>200</td></tr><tr><td>单位产品人工消耗量</td><td>工日/件</td><td>12</td><td>11</td></tr><tr><td>人工单价</td><td>元/工日</td><td>100</td><td>110</td></tr></tbody></table>", "options": {"A": "－20000", "B": "－18000", "C": "－19800", "D": "－22000"}, "answer": "A", "explanation": "因素分析法按替代顺序分析。人工消耗量变动对成本的影响=(实际消耗量－计划消耗量)×计划单价×相关产量，根据该表数据计算结果为－20000元。故选A。"}, {"id": 488, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题", "type": "single", "stem": "砖基础工程施工成本的主要影响因素由工程量、砖消耗量和价格构成。上述三个影响因素的 计划值分别为500m³、529块/m³和0.26元/块，实际值分别为510m³、530块/m³和0.25元/块。采用因素分析法 进行成本分析时，按上述影响因素顺序第二次替代与第一次替代的差额是（）元。", "options": {"A": "-2703", "B": "132.6", "C": "-1195", "D": "1375.4"}, "answer": "B", "explanation": "施工成本由直接成本和间接成本组成。选B。"}, {"id": 489, "chapter": "第6章 建设工程成本管理", "marker": "2015年真题", "type": "single", "stem": "某项目施工成本数据如下表，根据差额计算法，成本降低率提高对成本降低额的影响程度为（）万元。<br><table class=\"data-table\"><thead><tr><th>项目</th><th>单位</th><th>计划</th><th>实际</th><th>差额</th></tr></thead><tbody><tr><td>成本</td><td>万元</td><td>220</td><td>240</td><td>20</td></tr><tr><td>成本降低率</td><td>%</td><td>3</td><td>3.5</td><td>0.5</td></tr><tr><td>成本降低额</td><td>万元</td><td>6.6</td><td>8.4</td><td>1.8</td></tr></tbody></table>", "options": {"A": "0.6", "B": "0.7", "C": "1.1", "D": "1.2"}, "answer": "D", "explanation": "施工成本由直接成本和间接成本组成。选D。"}, {"id": 490, "chapter": "第6章 建设工程成本管理", "marker": "2021年真题II", "type": "single", "stem": "某施工项目的成本指标如下，利用动态比率法进行成本分析时，第四季度的基期指数是（）。 指标 第一季度 第二季度 第三季度 第四季度 降低成本（万元） 45.60 47.80 52.50 64.30 基期指数（%） （第一季度=100）", "options": {"A": "109.83", "B": "115.13", "C": "122.48", "D": "141.01"}, "answer": "D", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选D。"}, {"id": 491, "chapter": "第6章 建设工程成本管理", "marker": "2018年真题", "type": "single", "stem": "某工程各门窗安装班组的相关经济指标如下表，按照成本分析的比率法，人均效益最好的班组是（）。<br><table class=\"data-table\"><thead><tr><th></th><th>班组甲</th><th>班组乙</th><th>班组丙</th><th>班组丁</th></tr></thead><tbody><tr><td>工程量（m²）</td><td>5400</td><td>5000</td><td>4800</td><td>5200</td></tr><tr><td>班组人数（人）</td><td>50</td><td>45</td><td>42</td><td>43</td></tr><tr><td>班组人工费（元）</td><td>150000</td><td>126000</td><td>147000</td><td>129000</td></tr></tbody></table>", "options": {"A": "甲", "B": "乙", "C": "丙", "D": "丁"}, "answer": "A", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选A。"}, {"id": 492, "chapter": "第6章 建设工程成本管理", "marker": "2016年真题", "type": "single", "stem": "下列施工成本分析方法中，可以用来分析各种因素对成本影响程度的是（）。", "options": {"A": "连环置换法", "B": "相关比率法", "C": "比重分析法", "D": "动态比率法"}, "answer": "A", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选A。"}, {"id": 493, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "single", "stem": "施工成本分析过程中，将同类指标不同时期的数值进行对比后求出比率的方法是（）。", "options": {"A": "构成比率法", "B": "相关比率法", "C": "综合比率法", "D": "动态比率法"}, "answer": "D", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选D。"}, {"id": 494, "chapter": "第6章 建设工程成本管理", "marker": "2016年真题", "type": "multi", "stem": "关于分部分项工程成本分析，下列说法正确的有（）。", "options": {"A": "分部分项成本分析是施工项目成本分析的基础", "B": "必须对施工项目所有的分部分项进行成本分析", "C": "分部分项成本分析的方法是进行实际成本与目标成本比较", "D": "分部分项成本分析的对象为已完分部分项工程", "E": "对主要的分部分项工程要做到从开工到竣工进行系统的成本分析"}, "answer": "ADE", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选ADE。"}, {"id": 495, "chapter": "第6章 建设工程成本管理", "marker": "2022年真题", "type": "single", "stem": "进行月（季）度成本分析时，如果出现人工费、机械费的“政策性”亏损，则应该（）。", "options": {"A": "增加收入，弥补亏损", "B": "采取增收节支措施，防止今后再超支", "C": "从控制支出着手，把超支额压缩到最低限度", "D": "停止生产，等待政策调整"}, "answer": "C", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选C。"}, {"id": 496, "chapter": "第6章 建设工程成本管理", "marker": "2021年真题", "type": "single", "stem": "施工项目年度成本分析的内容，除了月（季）度成本分析的六个方面以外，重点是（）。", "options": {"A": "针对下一年度施工进展情况，制定切实可行的成本管理措施", "B": "通过对技术组织措施执行效果的分析，寻求更加有效的节约途径", "C": "通过实际成本与计划成本的对比，分析成本降低水平", "D": "通过实际成本与目标成本的对比，分析目标成本控制措施落实情况"}, "answer": "A", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选A。"}, {"id": 497, "chapter": "第6章 建设工程成本管理", "marker": "2014年真题", "type": "multi", "stem": "单位工程竣工成本分析的内容包括（）。", "options": {"A": "专项成本分析", "B": "竣工成本分析", "C": "成本总量构成比例分析", "D": "主要资源节超对比分析", "E": "主要技术节约措施及经济效果分析"}, "answer": "BDE", "explanation": "成本分析的方法有比较法、因素分析法、差额计算法等。选BDE。"}, {"id": 498, "chapter": "第6章 建设工程成本管理", "marker": "2021年真题", "type": "single", "stem": "下列施工项目综合成本的分析方法中，可以全面了解单位工程的成本构成和降低成本来源的 是（）。", "options": {"A": "分部分项工程成本分析", "B": "月（季）度成本分析", "C": "竣工成本的综合分析", "D": "年度成本分析"}, "answer": "C", "explanation": "竣工成本的综合分析以单位工程竣工成本资料为依据，可全面了解单位工程的成本构成和降低成本来源。A分部分项分析是基础；B月（季）度分析用于阶段性控制；D年度分析侧重年度经营。故选C。"}, {"id": 499, "chapter": "第6章 建设工程成本管理", "marker": "2020年真题", "type": "single", "stem": "关于施工项目材料费分析的说法，正确的是（）。", "options": {"A": "运距长短对于材料费没有直接影响", "B": "材料费分析中不应考虑材料的保管费", "C": "材料单价、材料储备天数和日平均用量均影响储备资金占用量", "D": "租赁周转材料的时间越长，租赁费支出越少"}, "answer": "C", "explanation": "材料储备资金占用量=日平均用量×材料单价×材料储备天数，三者均直接影响储备资金占用量（C正确）。A错误：运距影响运费进而影响材料费；B错误：材料保管费应纳入材料费分析；D错误：租赁周转材料时间越长，租赁费支出越多。故选C。"}, {"id": 500, "chapter": "第6章 建设工程成本管理", "marker": "2017年真题", "type": "single", "stem": "下列成本项目的分析中，属于材料费分析的是（）。", "options": {"A": "分析材料节约奖对劳务分包合同的影响", "B": "分析材料储备天数对材料储备金的影响", "C": "分析施工机械燃料消耗量对施工成本的影响", "D": "分析材料检验试验费占企业管理费的比重"}, "answer": "B", "explanation": "数字孪生在工程建设中可实现虚拟建造和仿真分析。选B。"}, {"id": 501, "chapter": "第6章 建设工程成本管理", "marker": "2025年真题", "type": "multi", "stem": "建筑企业对项目管理机构可控责任成本考核的内容有（）。", "options": {"A": "项目成本计划编制和落实情况", "B": "项目成本管理工作制度建立情况", "C": "项目成本管理责任制落实情况", "D": "项目成本目标和阶段成本目标完成情况", "E": "各施工队和班组责任成本检查和考核情况"}, "answer": "ACDE", "explanation": "可控责任成本考核含：成本降低额和降低率、预算与实际的偏差分析等。选ACDE。"}, {"id": 502, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "某项目施工合同成本为2000万元，项目实际施工成本为1800万元，项目竣工结算总成本为 1650万元，则项目施工成本降低率为（）。", "options": {"A": "8.33%", "B": "9.09%", "C": "10.00%", "D": "11.11%"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 503, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题", "type": "single", "stem": "进行施工成本管理绩效考核时，从企业层面考核项目施工成本降低额的正确计算公式是（）。", "options": {"A": "项目计划总成本-项目实际施工成本", "B": "项目施工合同成本-项目实际施工成本", "C": "施工计划总成本-工程竣工结算成本", "D": "施工责任目标成本-工程竣工结算成本"}, "answer": "B", "explanation": "施工成本由直接成本和间接成本组成。选B。"}, {"id": 504, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "下列施工成本管理绩效考核内容中，属于项目部对各班组考核内容的是（）。", "options": {"A": "岗位成本管理责任的执行情况", "B": "班组任务单的管理情况", "C": "班组完成施工任务后的考核情况", "D": "班组责任成本的完成情况"}, "answer": "D", "explanation": "施工成本由直接成本和间接成本组成。选D。"}, {"id": 505, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "multi", "stem": "采用平衡积分卡法考核施工成本管理绩效的优点有（）。", "options": {"A": "能够提高考核准确性", "B": "能够实现短期灵活考核", "C": "能够提高管理效率", "D": "能够促进长期发展", "E": "能够激发个体积极性"}, "answer": "ACDE", "explanation": "施工成本由直接成本和间接成本组成。选ACDE。"}, {"id": 506, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题II", "type": "single", "stem": "若施工企业具有明确的成本管理目标，健全的成本管理流程，完备的成本控制体系，以及 较强的数据收集和分析能力，可以实现对成本定量化考核且考核周期较短。则该企业适宜采用的成本管理绩 效考核方法是（）。", "options": {"A": "全视角反馈法", "B": "PDCA管理循环法", "C": "关键绩效指标法", "D": "目标管理法"}, "answer": "C", "explanation": "成本控制贯穿于成本管理的全过程。选C。"}, {"id": 507, "chapter": "第6章 建设工程成本管理", "marker": "2024年真题", "type": "multi", "stem": "采用PDCA循环法进行施工成本管理绩效考核的不足有（）。", "options": {"A": "不适合需要周期性考核的企业", "B": "投入成本高", "C": "会抑制各部门之间的协同合作", "D": "难以持续提高管理成效", "E": "过于强调计划性"}, "answer": "BE", "explanation": "施工成本由直接成本和间接成本组成。选BE。"}, {"id": 508, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "multi", "stem": "下列危险源中，属于第一类危险源的有（）。", "options": {"A": "直接供给能量的装置和设备", "B": "作业过程中拥有能量的物体", "C": "可能发生能量蓄积或者突然释放的装置", "D": "物的缺陷和物件堆放不当", "E": "人的不安全行为"}, "answer": "ABC", "explanation": "第一类危险源是可能意外释放的能量或危险物质（如带电体、高压容器、有毒气体）。选ABC。"}, {"id": 509, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "single", "stem": "下列施工过程中的行为或状态，属于第一类危险源的是（）。", "options": {"A": "建筑工人违章进入危险区域", "B": "施工现场管理人员违章指挥", "C": "施工现场存在有毒有害物质", "D": "高空作业平台未设防护栏杆"}, "answer": "C", "explanation": "第一类危险源是能量/物质本身。高处作业面属于势能危险源（第一类）。选C。"}, {"id": 510, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "single", "stem": "施工生产危险源可分为第一类危险源和第二类危险源。下列危险源中，属于第二类危险源的 是（）。", "options": {"A": "施工用炸药储存室", "B": "行驶中的车辆", "C": "违规操作设备", "D": "可燃烧危险物质"}, "answer": "C", "explanation": "第二类危险源是导致能量/物质约束失效的不安全因素。安全防护设施缺陷属第二类。选C。"}, {"id": 511, "chapter": "第7章 建设工程施工安全管理", "marker": "2021年真题", "type": "single", "stem": "下列风险控制方法中，属于第一类危险源控制方法的是（）。", "options": {"A": "建立健全危险源管理规章制度", "B": "限制能量和隔离危险物质", "C": "加强危险源的日常管理、定期检查", "D": "加强员工的安全意识教育"}, "answer": "B", "explanation": "第一类危险源控制方法：消除危险源、限制能量、隔离等。消除危险源是最根本的方法。选B。"}, {"id": 512, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "single", "stem": "列危险源控制方法中，可用于控制第二类危险源的是（）。 A采取应急救援方法", "options": {"B": "隔离危险物质", "C": "加强员工的安全意识教育", "D": "限制能量释放"}, "answer": "C", "explanation": "第二类危险源控制方法：提高设备可靠性、安全培训、加强管理等。故障-安全设计属控制第二类。选C。"}, {"id": 513, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "single", "stem": "施工作业面立面防护高度不够时，容易造成的事故伤害（）。", "options": {"A": "坍塌倾覆", "B": "物体打击", "C": "高处坠落", "D": "机械伤害"}, "answer": "C", "explanation": "立面防护高度不够易导致高处坠落事故。选C。"}, {"id": 514, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "single", "stem": "施工现场容易导致倾覆事故的危险源是（）。", "options": {"A": "高处作业", "B": "悬空作业", "C": "吊装作业", "D": "爆破作业"}, "answer": "C", "explanation": "导致倾覆事故的危险源是脚手架不稳定、基础不牢固等。选C。"}, {"id": 515, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "下列施工生产的危险源中，属于物体打击事故危险源的是（）", "options": {"A": "高处悬空作业未系好安全带", "B": "垂直运输过程及吊装工艺过程捆绑不牢固", "C": "危险性较大的分部分项工程无专项施工方案", "D": "起重作业信号不当，指挥不到位"}, "answer": "B", "explanation": "物体打击事故危险源包括：高处堆物不稳定、工具零件飞出等。选B。"}, {"id": 516, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "辨识危险源时，从一个可能的事故开始，自下而上，层层地寻找顶事件的直接原因事件和 间接原因事件，直至基本原因事件，并用逻辑图表达事件之间的逻辑关系。这种分析方法是（）。", "options": {"A": "LEC评价法", "B": "预先危险性分析法", "C": "事故树分析法", "D": "安全检查表法"}, "answer": "C", "explanation": "自下而上层层寻找原因事件，用逻辑图表达，这是\"事故树分析(FTA)\"方法。选C。"}, {"id": 517, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "single", "stem": "下列危险源辨识与评价方法中，仅用于风险评价的是（）。", "options": {"A": "LEC评价法", "B": "安全检查表法", "C": "事故树分析法", "D": "危险与可操作性分析法"}, "answer": "A", "explanation": "仅用于风险评价的方法是\"作业条件危险性评价法(LEC法)\"。选A。"}, {"id": 518, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "作业条件危险性评价法是通过对作业时事故发生的可能性（L）、暴露于危险环境的频率（E）及 危险严重程度（C）三个要素计算得出评定结果，用评定结果评估作业风险大小的一种评价方法，某矿山作业 条件危险性要素相关参数见下表。依据此表，对该矿山作业条件危险性评定的结果，正确的是（） L", "options": {"E": "", "C": "水泵房 6 6 6 炸药库 3 5 40", "A": "水泵房危险性值为6", "B": "水泵房危险性值为18", "D": "炸药库危险性值为600"}, "answer": "D", "explanation": "LEC法：D=L×E×C。根据表数据计算D值判断风险等级。选D。"}, {"id": 519, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "single", "stem": "海因里希提出的事故因果连锁过程包括五个因素：①伤害；②事故；③遗传及社会环境；④ 人的缺点；⑤人的不安全行为或物的不安全状态。上述因素之间正确的连锁关系是（）。", "options": {"A": "①→②→③→④→⑤", "B": "③→④→⑤→②→①", "C": "③→④→①→②→⑤", "D": "⑤→③→①→④→②"}, "answer": "B", "explanation": "海因里希因果连锁：遗传及社会环境→人的缺点→人的不安全行为/物的不安全状态→事故→伤害。即③-④-⑤-②-①。选B。"}, {"id": 520, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "multi", "stem": "根据轨迹交叉理论造成安全事故的直接原因有（）。", "options": {"A": "社会环境条件差", "B": "物的不安全状态", "C": "组织不健全", "D": "管理制度不完善", "E": "人的不安全行为"}, "answer": "BE", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选BE。"}, {"id": 521, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "multi", "stem": "根据系统理论，关于系统安全管理的说法，正确的有（）。", "options": {"A": "应将人、机械、环境作为一个整体进行研究，追求系统安全", "B": "应在规定的功能、时间、成本条件下，使人员和设备的伤害和损失最小", "C": "安全管理工作的目标是控制危险源，努力将事故发生概率降到最低", "D": "安全管理主要是消除几种选定的危险源，而不是减少总的危险性", "E": "通常所说的安全或危险只是一种主观判断，没有一种事物是绝对安全的"}, "answer": "ABCE", "explanation": "系统安全理论：安全是相对的（非绝对）、危险源不可能完全消除、系统需对意外事件具有容错能力。选ABCE。"}, {"id": 522, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "某汽车制造企业拟引进可靠度高的自动化生产线，代替原有人员手工操作，同时加强人员行为失 误校正和培训，减少事故发生。这种做法符合事故致因理论中的（）。", "options": {"A": "事故因果连锁理论", "B": "轨迹交叉理论", "C": "能量意外释放理论", "D": "系统安全理论"}, "answer": "B", "explanation": "提高系统可靠性+人员培训，符合系统安全理论思想。选B。"}, {"id": 523, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "某机械厂认为优秀的人员选择是预防事故的重要措施，该厂通过严格的生理、心理检验，从众多 的求职人员中选择身体、智力、性格特征及动作特征等方面优秀的人才就业。该厂做法符合事故致因理论中 的（）。", "options": {"A": "能量意外释放理论", "B": "事故频发倾向理论", "C": "系统安全理论", "D": "轨迹交叉理论"}, "answer": "B", "explanation": "通过生理心理检验选拔优秀人才预防事故，符合\"事故倾向性理论\"。选B。"}, {"id": 524, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "multi", "stem": "事故隐患的整改“三定”包括（ ）", "options": {"A": "定人", "B": "定机械", "C": "定岗位职责", "E": "定措施"}, "answer": "ACE", "explanation": "隐患整改三定：定整改责任人、定整改措施、定整改时限。选ACE。"}, {"id": 525, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "根据《施工企业安全生产管理规范》GB50656-2011，施工单位建设工程项目的安全生产第一责任 人是（ ）。", "options": {"A": "主要负责人", "B": "法定代表人", "C": "项目经理", "D": "专职安全生产员"}, "answer": "C", "explanation": "施工单位项目负责人(项目经理)是项目安全生产第一责任人。选C。"}, {"id": 526, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "施工安全管理体系中，施工安全生产方针应由（ ）发布。", "options": {"A": "项目经理", "B": "企业技术负责人", "C": "企业最高管理者", "D": "企业法定代表人"}, "answer": "C", "explanation": "施工安全生产方针应由企业最高管理者发布。选C。"}, {"id": 527, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "single", "stem": "关于本质安全化系统的说法，正确的是（ ）。", "options": {"A": "狭义的本质安全是指人、物和系统的安全可靠性", "B": "可依靠控制系统、报警系统、联锁系统减小事故发生概率", "C": "本质安全是绝对安全的理想状态，实际运行中很难达到", "D": "广义的本质安全系统不具有“失误一安全功能”和“故障一安全功能”"}, "answer": "C", "explanation": "本质安全系统：即使发生人为失误也能避免事故发生。重点是通过设计消除或减少危险。选C。"}, {"id": 528, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "multi", "stem": "安全生产管理3", "options": {"E": "原则是（ ）。", "A": "强制管理", "B": "工程技术", "C": "教育培训", "D": "安全交底"}, "answer": "ABC", "explanation": "安全生产管理原则含：安全第一预防为主、管生产必须管安全、全员参与等。选ABC。"}, {"id": 529, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "multi", "stem": "下列本质安全化控制措施中，属于物的本质安全控制措施的有（ ）。", "options": {"A": "开展预先危险性分析", "B": "落实安全风险分级管控和隐患排查治理双重预防机制", "C": "运用人机匹配法分析最佳人机组合", "D": "运用“四新”淘汰落后工艺、设备和材料", "E": "通过合理的现场平面布局避免人与物的运动轨迹交叉"}, "answer": "ABD", "explanation": "物的本质安全控制措施：消除危险源、安全防护装置、安全联锁装置等。选ABD。"}, {"id": 530, "chapter": "第7章 建设工程施工安全管理", "marker": "2020年真题", "type": "single", "stem": "施工企业安全生产责任制度应当覆盖的范围是（）。", "options": {"A": "纵向从最高管理者到专职安全生产管理人员，横向涵盖各职能部门", "B": "纵向从最高管理者到专职安全生产管理人员，横向涵盖各项目负责人", "C": "纵向从最高管理者到班组长和岗位人员，横向涵盖各职能部门", "D": "纵向从最高管理者到班组长和岗位人员，横向涵盖各项目负责人"}, "answer": "C", "explanation": "安全生产责任制是最基本的安全管理制度，明确各岗位安全责任。选C。"}, {"id": 531, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "single", "stem": "某施工企业安全生产费用状况如下，年初结余100万元，当年提取800万元，当年实际支出 1020万元，该企业针对当年安全生产费用赤字的解决办法（）。", "options": {"A": "当年末从税后利润中弥补亏损120万元", "B": "来年每月多提取安全生产费用10万元", "C": "当年末补提安全生产费用120万元", "D": "当年多提取安全生产费用220万元"}, "answer": "C", "explanation": "安全生产费用赤字可通过调整年度预算或从下年度提取中弥补。选C。"}, {"id": 532, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "根据安全生产费用管理相关规定，建设单位应当在合同中单独约定并于工程开工日一个月 内向承包单位支付企业安全生产费用的比例最低为（）。", "options": {"A": "20%", "B": "50%", "C": "30%", "D": "40%"}, "answer": "B", "explanation": "建设单位应在开工后一个月内向承包单位支付不低于50%的企业安全生产费用。选B。"}, {"id": 533, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "multi", "stem": "建设工程施工企业安全生产费用可用于（）", "options": {"A": "维护安全防护设施设备支出", "B": "安全生产责任保险支出", "C": "企业职工薪酬和福利", "D": "企业人员报告事故隐患的奖励支出", "E": "“三同时”要求初期投入的安全设施费"}, "answer": "ABD", "explanation": "安全生产费用可用于：安全防护设施、应急器材、安全培训教育、安全检查评价等。选ABD。"}, {"id": 534, "chapter": "第7章 建设工程施工安全管理", "marker": "2021年真题", "type": "single", "stem": "根据安全生产教育培训制度，新上岗的施工企业从业人员，岗前培训时间的最少学时是（） 学时。", "options": {"A": "12", "B": "36", "C": "48", "D": "24"}, "answer": "D", "explanation": "新上岗从业人员岗前安全培训时间不少于24学时。选D。"}, {"id": 535, "chapter": "第7章 建设工程施工安全管理", "marker": "2016年真题", "type": "single", "stem": "根据《安全生产许可条例》，施工企业安全生产许可证（）。", "options": {"A": "有效期为2年", "B": "有效期届满时经同意可以不再审查", "C": "要求企业获得职业健康安全管理体系认证", "D": "应在届满后3个月内办理延期手续"}, "answer": "B", "explanation": "安全生产许可证有效期为3年。选B。"}, {"id": 536, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "multi", "stem": "关于从事特种作业人员条件的说法，正确的是（）。", "options": {"A": "应当具备初中及以上文化程度", "B": "特种作业操作证每6年复审一次", "C": "技能熟练后操作证可以不复审", "D": "年满18周岁，且不超过国家法定退休年龄", "E": "经社区或者县级以上医疗机构体检健康合格"}, "answer": "ADE", "explanation": "特种作业人员条件：年满18周岁、体检合格、初中以上文化程度、经专门培训合格。选ADE。"}, {"id": 537, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "single", "stem": "特种作业操作证的复审时间可以延长的基本条件是持有该证的特种作业人员在证书有效期内， 连续从事本工种工作（）年以上。", "options": {"A": "3", "B": "5", "C": "10", "D": "6"}, "answer": "C", "explanation": "连续从事本工种10年以上，复审时间可延长至6年一次。选C。"}, {"id": 538, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "single", "stem": "根据《特种作业人员安全技术培训考核管理办法》，特种作业人员连续从事本工种不满10年 的，对其特种作业操作证的复审要求是（）。", "options": {"A": "每年复审1次", "B": "每2年复审1次", "C": "每6年复审1次", "D": "每3年复审1次"}, "answer": "D", "explanation": "特种作业操作证每3年复审一次（从事不满10年）。选D。"}, {"id": 539, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "multi", "stem": "按照施工现场危险源公示告知制度，应向从业人员告知的内容有（）。", "options": {"A": "危险源名称", "B": "危险出现的时段", "C": "作业场所存在的危险因素", "D": "危险源涉及的危险因素", "E": "工作岗位防范措施"}, "answer": "CE", "explanation": "危险源公示告知内容：危险因素、防范措施、应急措施。选CE。"}, {"id": 540, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "施工企业针对安全生产和特殊季节安全防范的需要，可以适时召开（）。", "options": {"A": "安全生产专题会", "B": "安全生产事故分析会", "C": "安全生产技术交底会", "D": "安全生产现场会"}, "answer": "A", "explanation": "针对安全生产和特殊季节召开的会议是\"安全生产专题会议\"。选A。"}, {"id": 541, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "multi", "stem": "施工现场劳动保护用品使用和管理的要求有（）。", "options": {"A": "劳动保护用品作为保障安全的预防性措施而不能替代工程防护设施", "B": "用人单位使用的劳务派遣人员由派遣单位管理并配备劳动保护用品", "C": "处于作业地点的外来人员应佩戴使用与作业者相同标准的劳动保护用品", "D": "基层作业人员的劳动保护用品由本人自备且应符合相关标准要求", "E": "用人单位应为接纳的实习人员配备符合标准的劳动保护用品"}, "answer": "ACE", "explanation": "劳动防护用品要求：免费提供、监督使用、定期检查更换、建立发放台账。选ACE。"}, {"id": 542, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "single", "stem": "根据《建设工程安全生产管理条例》，对达到一定规模的危险性较大的分部分项工程，施工 单位应编制专项施工方案的是（）。", "options": {"A": "场地平整工程", "B": "土方开挖工程", "C": "砌体工程", "D": "抹灰工程"}, "answer": "B", "explanation": "需编制专项施工方案的危大工程含：基坑支护、模板工程、脚手架、起重吊装等。选B。"}, {"id": 543, "chapter": "第7章 建设工程施工安全管理", "marker": "2022年真题", "type": "multi", "stem": "根据《建设工程安全生产管理条例》，下列危险性较大的分部分项工程，施工单位应当组织 专家进行专项施工方案论证的有（）", "options": {"A": "脚手架工程", "B": "起重吊装工程", "C": "深基坑工程", "D": "地下暗挖工程", "E": "高大模板工程"}, "answer": "CDE", "explanation": "需专家论证的危大工程含：深基坑、高大模板、大跨度结构、地下暗挖等。选CDE。"}, {"id": 544, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "超过一定规模的危险性较大的分部分项工程专项施工方案经专家论证后结论为“修改后通 过”的，施工单位正确的做法是（）。", "options": {"A": "参考专家意见自行修改完善", "B": "修改后应按照规定的要求重新组织专家论证", "C": "应按照专家意见进行修改，修改情况应及时告知专家", "D": "重新编制专项施工方案并组织专家论证"}, "answer": "C", "explanation": "专家论证结论为\"修改后通过\"的，施工单位应按专家意见修改后履行审批手续方可实施。选C。"}, {"id": 545, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "multi", "stem": "对于专业分包单位实施的危险性较大的分部分项工程，由该专业分包单位编制的专项施工 方案应由（）共同审核签字并加盖单位公章后，方可报送项目监理机构。", "options": {"A": "建设单位项目负责人", "B": "总承包单位技术负责人", "C": "专业分包项目技术负责人", "D": "专业分包单位技术负责人", "E": "总承包单位项目负责人"}, "answer": "BD", "explanation": "专业分包编制的专项方案应由分包单位技术负责人和总承包单位技术负责人共同审核签字。选BD。"}, {"id": 546, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "multi", "stem": "在建设工程专项施工方案审批环节，需要签字盖章的有()。", "options": {"A": "施工单位技术负责人签字", "B": "施工单位公章", "C": "总监理工程师签字", "D": "总监理工程师执业印章", "E": "施工单位法定代表人签字"}, "answer": "ABCD", "explanation": "专项方案审批需总承包单位技术负责人、分包单位技术负责人、项目总监理工程师签字盖章。选ABCD。"}, {"id": 547, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题", "type": "single", "stem": "工程施工临边作业时，作业面距坠落基准面高度达到2m及以上的，应在临空一侧采取的防护 措施是（）。", "options": {"A": "设置高度不小于1.2m的防护栏杆，并设置挡脚板", "B": "设置防护栏杆，并采用密目式安全立网封闭", "C": "设置警示标志，并安排专人值守", "D": "采用工具式栏板封闭，并设置挡脚板"}, "answer": "B", "explanation": "临边2m及以上应在临空一侧设置防护栏杆。选B。"}, {"id": 548, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "关于防高处坠落安全技术措施的说法，正确的是（）。", "options": {"A": "悬空作业（安装拆除模板、吊装等），施工人员必须站在操作平台上作业并系好安全带", "B": "在坠落高度基准面2m进行临边作业时，应在临空一侧设置防护栏杆，但不必用密目式安全立网或工具式栏 板封闭", "C": "当垂直洞口短边边长大于或等于800mm时，应在临空一侧设置高度不小于900m的防护栏杆，并采用密目式安 全立网或工具式栏板封闭", "D": "非竖向洞口短边边长大于等于1000mm时，应在洞口作业侧设置高度不小于900mm的防护栏杆，并采用安全平 网封闭"}, "answer": "A", "explanation": "高处作业安全技术措施含：安全带高挂低用、安全网铺设等。选A。"}, {"id": 549, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "下列关于攀登作业的安全防护措施说法错误的是（）。", "options": {"A": "同一梯子上不得两人同时作业", "B": "使用固定式直梯攀登作业时,当攀登高度超过8m时，应设置梯间平台", "C": "深基坑施工应设置扶梯、入坑踏步及专用载人设备或斜道等设施", "D": "深基坑施工采用斜道时，应加设间距不大于1m的防滑条等防滑措施"}, "answer": "D", "explanation": "攀登作业应使用安全自锁器，禁止手持工具攀爬。选D（错误选项）。"}, {"id": 550, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "multi", "stem": "为防止施工现场物体坠落或飞溅造成物体打击伤害，可采取的安全技术措施有（）。", "options": {"A": "在施工工程邻近必须通行的道路上方搭设防护棚", "B": "对短边边长小于500mm的竖向洞口进行封闭", "C": "进入施工现场的人员佩戴符合标准的安全帽", "D": "为登高作业设置专用梯子或其他攀爬设施", "E": "在起重机械作业区域周边设置防护栏杆"}, "answer": "ACE", "explanation": "防物体打击措施：设置安全通道防护棚、安全网、工具袋等。选ACE。"}, {"id": 551, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "multi", "stem": "施工现场及生活区防触电的安全技术措施有（）。", "options": {"A": "电力系统工作接地", "B": "宿舍使用48V安全电压", "C": "装设漏电保护器", "D": "电工持证上岗", "E": "电气设备保护接地"}, "answer": "ACE", "explanation": "防触电措施：TN-S系统、三级配电两级保护、重复接地等。选ACE。"}, {"id": 552, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "上层作业高度为20m时，坠落半径为（）", "options": {"A": "3m", "B": "4m", "C": "5m", "D": "6m"}, "answer": "C", "explanation": "坠落半径：h=20m时坠落半径R=5m。选C。"}, {"id": 553, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "根据《建设工程安全生产管理条例》，建设工程施工前，施工单位的（）向班组长、分包单位技 术负责人进行安全技术交底。", "options": {"A": "项目经理", "B": "项目技术负责人", "C": "单位技术负责人", "D": "专职安全管理人员"}, "answer": "B", "explanation": "施工前应由施工单位技术负责人向班组长、分包技术负责人进行安全技术交底。选B。"}, {"id": 554, "chapter": "第7章 建设工程施工安全管理", "marker": "2020年真题改", "type": "single", "stem": "关于施工项目安全技术交底的说法，不正确的有（）。", "options": {"A": "施工项目必须实行逐级安全技术交底", "B": "交底内容应针对潜在危险因素和存在问题", "C": "必须采用新的安全技术措施", "D": "定期向多工种交叉施工的作业队做书面技术交底"}, "answer": "C", "explanation": "安全技术交底应在施工前进行，以书面形式并由双方签字。选C（不正确）。"}, {"id": 555, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "multi", "stem": "施工安全技术交底的主要内容包括（）", "options": {"A": "项目成员分工情况", "B": "工程项目和分部分项工程的概况", "C": "施工项目的施工作业特点和危险点", "D": "针对危险点的具体预防措施", "E": "作业人员发现事故隐患应采取的措施"}, "answer": "BCDE", "explanation": "安全技术交底内容含：施工工艺、危险因素、安全措施、应急措施等。选BCDE。"}, {"id": 556, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "安全风险等级划分为一般风险，用（）表示。", "options": {"A": "红色", "B": "蓝色", "C": "黄色", "D": "橙色"}, "answer": "C", "explanation": "一般风险用黄色标示。选C。"}, {"id": 557, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题", "type": "single", "stem": "施工安全风险等级从高到低可划分为重大风险、较大风险、一般风险和低风险，分别用()四 种颜色标示。", "options": {"A": "橙、紫、黄、蓝", "B": "红、橙、黄、蓝", "C": "紫、橙、蓝、黄", "D": "红、橙、蓝、黄"}, "answer": "B", "explanation": "风险等级颜色标示：重大风险(红)、较大风险(橙)、一般风险(黄)、低风险(蓝)。选B。"}, {"id": 558, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "single", "stem": "施工企业应建立安全风险等级管控和隐患排查治理双重预防机制，针对项目重大安全风险 填写的清单汇总选册后，应报告的主管部门是（）。", "options": {"A": "项目属地负有安全生产监督管理职责的部门", "B": "项目属地县级以上建设行政主管部门", "C": "企业注册地负有安全生产监督管理职责的部门", "D": "建设单位所在地县级以上建设行政主管部门"}, "answer": "A", "explanation": "重大安全风险清单汇总册应报告工程所在地住建主管部门。选A。"}, {"id": 559, "chapter": "第7章 建设工程施工安全管理", "marker": "2020年真题", "type": "single", "stem": "在应急预案体系的构成中，针对具体设施所制定的应急处置措施属于（）。", "options": {"A": "综合应急预案", "B": "专项应急预案", "C": "现场处置方案", "D": "应急行动指南"}, "answer": "C", "explanation": "针对具体设施的应急处置措施属\"现场处置方案\"。选C。"}, {"id": 560, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "关于生产安全事故应急预案的说法，正确的是（）。", "options": {"A": "施工单位应急预案应由施工单位主要负责人签署公布", "B": "建筑施工单位应至少每年组织一次生产安全事故应急预案演练", "C": "事故风险单一、危险性小的企业，可只编制专项应急预案", "D": "施工单位应急预案的评审人员应具备正高级职称"}, "answer": "A", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选A。"}, {"id": 561, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "某工程项目施工过程中发生安全事故，导致1人死亡，11人重伤，直接经济损失约为500万 元。该生产安全事故等级属于（）。", "options": {"A": "特别重大事故", "B": "较大事故", "C": "重大事故", "D": "一般事故"}, "answer": "B", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选B。"}, {"id": 562, "chapter": "第7章 建设工程施工安全管理", "marker": "2024年真题II", "type": "single", "stem": "若施工重大事故发生地与事故发生单位所在地不在同一个县级以上行政区域的，则事故调 查应采取的做法是（）。", "options": {"A": "由事故发生地人民政府负责调查，事故发生单位所在地人民政府派人参加", "B": "由事故发生单位所在地人民政府负责调查，事故发生地人民政府派人参加", "C": "由上级主管部门负责调查，事故发生地和事故发生单位所在地人民政府派人参加", "D": "委托第三方专业机构负责调查，事故发生地和事故发生单位所在地人民政府派人参加"}, "answer": "A", "explanation": "事故发生地与单位所在地不同，由事故发生地人民政府组织调查。选A。"}, {"id": 563, "chapter": "第7章 建设工程施工安全管理", "marker": "2018年真题", "type": "single", "stem": "某县一建筑工地发生生产安全重大事故，则事故调查组应由（）负责组织。", "options": {"A": "事故发生地县级人民政府", "B": "国务院安全生产监督管理部门", "C": "事故发生单位", "D": "事故发生地省级人民政府"}, "answer": "D", "explanation": "重大事故由省级人民政府组织调查。选D。"}, {"id": 564, "chapter": "第7章 建设工程施工安全管理", "marker": "2021年真题", "type": "single", "stem": "下列建设工程安全事故中，县级人民政府可以委托事故发生单位组织事故调查组进行调查的 是（）。", "options": {"A": "2人轻伤，总损失1000万元", "B": "1人重伤，直接经济损失200万元", "C": "无伤亡，直接经济损失1000万元以下", "D": "1人轻伤，无其他损失"}, "answer": "C", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选C。"}, {"id": 565, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "multi", "stem": "某工程施工中发生一起混凝土坍塌事故，造成5人重伤。该事故报告及调查处理的正确做法 有（）。", "options": {"A": "事故现场有关人员应立即向本单位负责人报告", "B": "事故调查组应邀请县级人民检察院派人参加", "C": "事故发生单位应委托原设计单位提出技术处理方案", "D": "事故单位负责人应在收到报告后2h内向上级主管部门报告", "E": "事故发生地省级人民政府应负责调查事故"}, "answer": "AB", "explanation": "重伤5人属一般事故，由县级政府组织调查，需保护现场并在1小时内上报。选AB。"}, {"id": 566, "chapter": "第7章 建设工程施工安全管理", "marker": "2021年真题", "type": "single", "stem": "一般情况下，负责特别重大事故调查的人民政府应当自收到事故调查报告之日起（）日内作 出批复。", "options": {"A": "15", "B": "30", "C": "60", "D": "90"}, "answer": "B", "explanation": "特别重大事故调查报告批复时限：收到报告之日起30日内。选B。"}, {"id": 567, "chapter": "第7章 建设工程施工安全管理", "marker": "2019年真题", "type": "single", "stem": "建设工程安全事故调查组应当提交事故调查报告的时间为（）。", "options": {"A": "自事故发生之日起30日内", "B": "自调查组成立之日起30日内", "C": "自调查组成立之日起60日内", "D": "自事故发生之日起60日内"}, "answer": "D", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选D。"}, {"id": 568, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "单位主要负责人未依法履行安全生产管理职责，导致较大安全事故发生的，对其罚款，符合要求 的是（）", "options": {"A": "处上一年年收入20%至30%的罚款", "B": "处上一年年收入40%的罚款", "C": "处上一年年收入60%的罚款", "D": "处上一年年收入80%的罚款"}, "answer": "C", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选C。"}, {"id": 569, "chapter": "第7章 建设工程施工安全管理", "marker": "练习题", "type": "single", "stem": "事故发生单位主要负责人瞒报事故，应处（）的罚款。", "options": {"A": "处上一年年收人20%至30%", "B": "处上一年年收人40%至60%", "C": "处上一年年收入60%至80%", "D": "处上一年年收入80%至100%"}, "answer": "C", "explanation": "主要负责人瞒报事故处上一年年收入60%-100%罚款。选C。"}, {"id": 570, "chapter": "第7章 建设工程施工安全管理", "marker": "2025年真题II", "type": "multi", "stem": "根据《生产安全事故罚款处罚规定》，发生一般生产安全事故后，事故发生单位将被处以 100万元以上150万元以下罚款的行为有（）。", "options": {"A": "瞒报事故而贻误事故抢救", "B": "谎报或者瞒报事故", "C": "伪造事故现场影响事故调查", "D": "伪造或者故意破坏事故现场", "E": "在事故调查中作伪证"}, "answer": "BDE", "explanation": "安全事故等级分为特别重大、重大、较大和一般事故。选BDE。"}, {"id": 571, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题", "type": "multi", "stem": "绿色建造需要将绿色发展理念融入工程策划、设计、施工、交付全过程，除体现绿色化外， 还应体现的特征有（ ）。", "options": {"A": "信息化", "B": "工业化", "C": "系统化", "D": "产业化", "E": "集约化"}, "answer": "ABDE", "explanation": "绿色建造除绿色化外还应体现信息化、工业化、集约化、产业化等特征。选ABDE。"}, {"id": 572, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题", "type": "single", "stem": "作为绿色策划的主要内容，绿色交付策划应明确的内容是（ ）。", "options": {"A": "绿色建造效果评估内容及方式", "B": "绿色建造目标及实施路径", "C": "绿色建造全过程数字化技术应用方式", "D": "绿色建造各参与方协同工作机制"}, "answer": "A", "explanation": "绿色交付策划应明确绿色建造效果评估和交付标准。选A。"}, {"id": 573, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题", "type": "multi", "stem": "除实现源头减量目标外，编制施工现场建筑垃圾减量化专项方案还应实现的目标有（ ）。", "options": {"A": "过程控制", "B": "循环利用", "C": "集中处理", "D": "影响评估", "E": "快速处置"}, "answer": "AB", "explanation": "建筑垃圾减量化目标除源头减量外还有分类收集和资源化利用。选AB。"}, {"id": 574, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "multi", "stem": "清洁生产的主要内容可归纳为（ ）。", "options": {"A": "清洁的原料与能源", "B": "清洁的产品", "C": "清洁的生产过程", "D": "清洁的施工现场环境", "E": "贯穿于清洁生产的全过程控制"}, "answer": "ABCE", "explanation": "清洁生产主要内容：清洁能源、清洁生产过程、清洁产品。选ABCE。"}, {"id": 575, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题", "type": "single", "stem": "清洁生产可概括为“三清一控”。其中的“一控”是指贯穿于清洁生产的（ ）控制。", "options": {"A": "减量化", "B": "全过程", "C": "全要素", "D": "碳排放"}, "answer": "B", "explanation": "一控指全过程控制。选B。"}, {"id": 576, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "练习题", "type": "single", "stem": "绿色施工可持续发展理念主要的考量是（ ）", "options": {"A": "经济的可持续性", "B": "社会的可持续性", "C": "环境的可持续性", "D": "资源的永续利用和环境容量的承载能力"}, "answer": "D", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选D。"}, {"id": 577, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题", "type": "multi", "stem": "除实现源头减量目标外，编制施工现场建筑垃圾减量化专项方案还应实现的目标有（ ）。", "options": {"A": "过程控制", "B": "循环利用", "C": "集中处理", "D": "影响评估", "E": "快速处置"}, "answer": "AB", "explanation": "建筑垃圾减量化目标含源头减量和资源化利用。选AB。"}, {"id": 578, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "single", "stem": "循环经济的3R原则中“再循环”是指（ ）。", "options": {"A": "通过输入端控制方式，用较少资源投入来达到既定的生产目的", "B": "通过过程端控制方式，将废物直接作为产品或经修复、翻新、再制造后继续作为产品使用", "C": "通过过程端控制方式，将废物的全部或部分作为其他产品的部件予以使用", "D": "通过输出端控制方式，将生产出来的物品在完成其使用功能后通过回收利用重新变成可用资源"}, "answer": "D", "explanation": "再循环(Recycle)指废物再次变为资源。选D。"}, {"id": 579, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题", "type": "single", "stem": "采用生命周期评估（LCA）方法评价绿色施工时，需进行的工作有：①清单分析；②解释说明； ③影响评估。仅就上述工作而言，正确的工作程序是（ ）。", "options": {"A": "①-②-③", "B": "②-③-①", "C": "①-③-②", "D": "②-①-③"}, "answer": "C", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选C。"}, {"id": 580, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题", "type": "single", "stem": "为实现绿色施工，施工单位应建立以（ ）为第一责任人的绿色施工管理体系。", "options": {"A": "企业法定代表人", "B": "企业技术负责人", "C": "项目经理", "D": "项目技术负责人"}, "answer": "C", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选C。"}, {"id": 581, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "multi", "stem": "根据《建筑工程绿色施工规范》，建设单位的绿色施工职责有（ ）。", "options": {"A": "审查绿色施工组织设计", "B": "组织绿色施工的实施", "C": "提供绿色施工所需资金保障", "D": "编制绿色施工专项方案", "E": "建立绿色施工协调机制"}, "answer": "CE", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选CE。"}, {"id": 582, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "single", "stem": "根据现行绿色施工评价标准，施工现场500km以内生产的建筑材料用量占建筑材料总重量的 比例应不低于（ ）。", "options": {"A": "50%", "B": "60%", "C": "70%", "D": "80%"}, "answer": "C", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选C。"}, {"id": 583, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "练习题", "type": "multi", "stem": "下列施工方法中，属于绿色施工的有（ ）。", "options": {"A": "使用商品混凝土", "B": "采用人造板材模板", "C": "降低机械的满载率", "D": "面砖施工前进行总体排版策划", "E": "采用专业加工配送的钢筋"}, "answer": "ABDE", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选ABDE。"}, {"id": 584, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "single", "stem": "在土方作业阶段，应按照施工现场扬尘控制要求，采取洒水、覆盖等措施，达到作业区目 测扬尘高度小于（ ）m，不扩散到场区外。", "options": {"A": "0.5", "B": "1", "C": "2", "D": "1.5"}, "answer": "D", "explanation": "土方作业区目测扬尘高度小于1.5m。选D。"}, {"id": 585, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题II", "type": "multi", "stem": "控制施工现场扬尘技术措施有（ ）。", "options": {"A": "现场搭设封闭式垃圾站", "B": "对运输易散落物料车辆进行封闭", "C": "采用覆膜方式养护混凝土", "D": "现场出入口设置洗车槽", "E": "充分利用建筑物拆除产生的废弃物"}, "answer": "ABD", "explanation": "控制扬尘措施：洒水降尘、覆盖、绿化、围挡等。选ABD。"}, {"id": 586, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题", "type": "single", "stem": "根据国家标准《建筑施工场界环境噪声排放标准》，夜间场界环境噪声不得超过（ ）。", "options": {"A": "60dB（A)", "B": "65dB（A)", "C": "55dB（A)", "D": "70dB（A)"}, "answer": "C", "explanation": "建筑施工场界环境噪声排放限值：昼间70dB(A)，夜间55dB(A)。选C。"}, {"id": 587, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "练习题", "type": "single", "stem": "关于加强建筑垃圾的回收再利用，下列说法错误的是（ ）。", "options": {"A": "力争建筑垃圾的再利用和回收率达到30%", "B": "建筑物拆除产生的废弃物的再利用和回收率大于40%", "C": "对于碎石类、土石方类建筑垃圾，力争再利用率大于60%", "D": "对于碎石类、土石方类建筑垃圾，可采用地基填埋、铺路等方式提高再利用率"}, "answer": "C", "explanation": "建筑垃圾回收再利用应分类收集。错误的是\"所有垃圾混合处理\"。选C。"}, {"id": 588, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2018年真题", "type": "single", "stem": "下列施工现场环境保护措施中，属于大气污染防治措施的是（ ）。", "options": {"A": "禁止将有毒有害废弃物作土方回填", "B": "工地临时厕所化粪池应采取防渗漏措施", "C": "选用低噪声设备和加工工艺", "D": "禁止在施工现场焚烧各种包装物"}, "answer": "D", "explanation": "大气污染防治含：洒水降尘、覆盖、封闭运输等。选D。"}, {"id": 589, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "练习题", "type": "single", "stem": "在绿色施工管理过程中，“施工总平面布置优化”是属于（ ）方面的工作内容。", "options": {"A": "节材与材料资源利用", "B": "节能与能源利用", "C": "节地与施工用地保护", "D": "环境保护"}, "answer": "C", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选C。"}, {"id": 590, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题", "type": "single", "stem": "文明施工应贯彻的“8S”管理理念，是在“整理、整顿，清扫、清洁、素养，安全6S管理要 素基础上，又增加（ ）两大要素。", "options": {"A": "监督和学习", "B": "节约和学习", "C": "监督和供应", "D": "节约和供应"}, "answer": "B", "explanation": "8S在6S(整理整顿清扫清洁素养安全)基础上增加节约和学习。选B。"}, {"id": 591, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "single", "stem": "按照文明施工管理工作要求，下列做法中，正确的是（ ）。", "options": {"A": "根据施工总平面布局，应合理规划作业区等，降低交叉施工干扰", "B": "施工临时设施与永久性设施应严格进行区分利用", "C": "建筑垃圾可作为废料进行土方填埋施工", "D": "施工现场设开放式垃圾站，施工垃圾、生活垃圾集中存放"}, "answer": "A", "explanation": "文明施工做法：施工现场设置连续封闭围挡。选A。"}, {"id": 592, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2023年真题", "type": "multi", "stem": "下列选项中，施工现场文明施工中“五牌一图”指的有（ ）。", "options": {"A": "工程概况牌", "B": "消防保卫牌", "C": "文明施工牌", "D": "安全生产牌", "E": "现场布置牌"}, "answer": "ABCD", "explanation": "五牌一图：工程概况牌、管理人员名单牌、消防保卫牌、安全生产牌、文明施工牌+施工现场总平面图。选ABCD。"}, {"id": 593, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "multi", "stem": "根据现行绿色施工评价标准，施工现场污水排放应符合的规定包括（ ）。", "options": {"A": "现场道路周边应设置排水沟", "B": "现场厕所应设置化粪池并定期清理", "C": "钻孔桩作业应采用泥浆循环利用系统", "D": "试验室养护用水可直接排入市政污水管道", "E": "工地厨房污水可直接排入市政污水管道"}, "answer": "ABC", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选ABC。"}, {"id": 594, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2024年真题II", "type": "single", "stem": "根据现行绿色施工评价标准，下列施工现场环境保护评价指标中，属于控制项的是（ ）。", "options": {"A": "对集中堆放在施工现场的土方应采取抑尘措施", "B": "施工现场厨房烟气应净化后排放", "C": "施工现场应在醒目位置设环境保护标识", "D": "施工现场垃圾应分类、封闭、集中堆放"}, "answer": "C", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选C。"}, {"id": 595, "chapter": "第8章 绿色建造及施工现场环境管理", "marker": "2025年真题II", "type": "multi", "stem": "根据《建筑与市政工程绿色施工评价标准》，下列施工现场环境保护措施中，属于绿色施 工评价“优选项”的有（ ）。", "options": {"A": "绿色施工策划文件中包含环境保护内容.", "B": "现场设置可移动环保厕所并定期清运、消毒", "C": "现场建立洒水清扫制度并配备洒水设备", "D": "现场采用自动喷雾（淋）降尘系统", "E": "现场设置动态连续噪声监测设施并保存昼夜噪声曲线"}, "answer": "BDE", "explanation": "绿色施工的总体框架由施工管理、环境保护、节材、节水、节能、节地组成。选BDE。"}, {"id": 596, "chapter": "第9章 国际工程承包管理", "marker": "2025年真题", "type": "single", "stem": "商务部等19部门《关于促进对外承包工程高质量发展的指导意见》提出，为推动对外承包工 程转型升级和高质量发展，除坚持企业主体、互利共赢和规范有序原则外，还应坚持的原则是（ ）。", "options": {"A": "属地经营", "B": "性价合理", "C": "多边合作", "D": "质量优先"}, "answer": "D", "explanation": "除企业主体、互利共赢、规范有序外还应坚持防范风险原则。选D。"}, {"id": 597, "chapter": "第9章 国际工程承包管理", "marker": "2024年真题", "type": "multi", "stem": "为加快形成对外承包工程发展新优势，国家鼓励建筑企业由建设施工优势为主向同时具有（ ） 的综合优势转变。", "options": {"A": "集成设计", "B": "投融资", "C": "全过程工程咨询", "D": "工程建设", "E": "运营服务"}, "answer": "BDE", "explanation": "向投资建设运营一体化综合优势转变（含设计、投融资、运营等能力）。选BDE。"}, {"id": 598, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "根据《企业境外投资管理办法》，实行备案制的项目中，投资主体是地方企业且中方投资额3亿美 元及以上的，备案机关是（ ）。", "options": {"A": "国家发展和改革委员会", "B": "财政部", "C": "国家经济委员会", "D": "企业注册地省级政府发展改革部门"}, "answer": "A", "explanation": "地方企业投资3亿美元及以上的备案机关是国家发改委。选A。"}, {"id": 599, "chapter": "第9章 国际工程承包管理", "marker": "2025年真题", "type": "single", "stem": "根据《企业境外投资管理办法》，对于投资主体直接或通过其控制的境外企业开展的敏感类 项目，应实行的投资管理方式是（ ）。", "options": {"A": "审批制", "B": "备案制", "C": "核准制", "D": "登记制"}, "answer": "C", "explanation": "敏感类项目实行核准管理。选C。"}, {"id": 600, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "对外承包工程项目备案和立项管理说法正确的是（ ）", "options": {"A": "与我国无外交关系的国家承包的工程项目应办理备案", "B": "应当在项目签约后完成工程项目备案", "C": "企业承包特定项目应当在商务主管部门办理备案", "D": "企业应当在对外签订工程项目合同之日起30个工作日以内，填写《对外承包工程项目报到登记表》，报送 给中国驻工程项目所在国使（领）馆或者代管馆"}, "answer": "D", "explanation": "对外承包工程项目：一般项目备案、特定项目核准。选D。"}, {"id": 601, "chapter": "第9章 国际工程承包管理", "marker": "2024年真题", "type": "multi", "stem": "为了保护本地劳动力就业，世界上不少国家和地区对外籍劳务输入有严格限制，进入此国家 和地区承包工程的企业需要办理的事项有（ ）。", "options": {"A": "申请获得政府担保", "B": "申请纳税证明", "C": "申请劳务输入配额", "D": "申请居留签证", "E": "申请工作许可"}, "answer": "CDE", "explanation": "进入限制外劳输入国家需办理：工作许可、居留许可等。选CDE。"}, {"id": 602, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "对纳税人境内境外的各种应税收入均征收属于（ ）税收政策。", "options": {"A": "属地主义原则", "B": "属人主义原则", "C": "属地兼属人原则", "D": "领土原则"}, "answer": "B", "explanation": "对境内外收入均征税属属人主义税收管辖权。选B。"}, {"id": 603, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "企业因没有遵循法律法规和准则而可能遭受法律制裁属于（ ）", "options": {"A": "法律风险", "B": "市场风险", "C": "经济风险", "D": "合规风险"}, "answer": "D", "explanation": "未遵循法律法规可能遭受法律制裁属法律合规风险。选D。"}, {"id": 604, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "国际供应链原材料和航运、物流成本大幅上涨，项目建设成本增大属于（ ）", "options": {"A": "资金风险", "B": "经济风险", "C": "社会风险", "D": "市场风险"}, "answer": "D", "explanation": "原材料航运成本上涨导致建设成本增大属市场风险。选D。"}, {"id": 605, "chapter": "第9章 国际工程承包管理", "marker": "2024年真题", "type": "single", "stem": "建筑企业应践行ESG 发展理念。这里的“ESG” 分别指的是（ ）。", "options": {"A": "生态、社会、治理", "B": "环境、社会、治理", "C": "环境、监督、绿色", "D": "生态、监督、绿色"}, "answer": "B", "explanation": "ESG分别代表Environment(环境)、Social(社会)、Governance(治理)。选B。"}, {"id": 606, "chapter": "第9章 国际工程承包管理", "marker": "2025年真题", "type": "multi", "stem": "企业开展国际工程承包业务时，为应对汇率风险可采用的金融工具有（ ）。", "options": {"A": "税务优惠", "B": "远期合约", "C": "期权合约", "D": "货币期货", "E": "货币互换"}, "answer": "BCDE", "explanation": "应对汇率风险金融工具：远期外汇合约、外汇期权、货币互换等。选BCDE。"}, {"id": 607, "chapter": "第9章 国际工程承包管理", "marker": "2024年真题", "type": "single", "stem": "国际工程承包商在甄选项目初步确定投标策略时，宜采用的方法是（ ）。", "options": {"A": "PERT分析法", "B": "LCC评估法", "C": "LCA评估法", "D": "SWOT 分析法"}, "answer": "D", "explanation": "初步确定投标策略宜采用SWOT分析法。选D。"}, {"id": 608, "chapter": "第9章 国际工程承包管理", "marker": "2025年真题", "type": "single", "stem": "根据FIDIC《施工合同条件》，合同组成文件包括：①图纸；②资料表；③规范要求。仅就 上述合同文件而言，正确的优先解释顺序是（ ）。", "options": {"A": "①-②-③", "B": "②-③-①", "C": "③-①-②", "D": "②-①-③"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 609, "chapter": "第9章 国际工程承包管理", "marker": "2024年真题", "type": "single", "stem": "根据FIDIC《施工合同条件》,合同条款未规定“费用加利润”中的利润计取比例时，应按（ ） 计取。", "options": {"A": "20%", "B": "5%", "C": "3%", "D": "10%"}, "answer": "B", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选B。"}, {"id": 610, "chapter": "第9章 国际工程承包管理", "marker": "2021年真题改", "type": "single", "stem": "关于FIDIC《施工合同条件》的说法，正确的是（ ）。", "options": {"A": "工程师办理工程保险", "B": "由业主或业主代表管理合同", "C": "工程师无权解除任何一方依照合同具有的职责、义务或责任", "D": "适用于由承包商做绝大部分设计的工程项目"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 611, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "FIDIC《施工合同条件》规定,在货物运输方面，承包商还应在不少于（ ）天将所提供的永久设 备或其他主要货物运抵现场的日期通知工程师。", "options": {"A": "7", "B": "3", "C": "5", "D": "21"}, "answer": "D", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选D。"}, {"id": 612, "chapter": "第9章 国际工程承包管理", "marker": "2024年真题", "type": "single", "stem": "FIDIC《施工合同条件》规定，业主应收到工程师签发的最终付款证书（ ）天内向承包商 付款。", "options": {"A": "14", "B": "21", "C": "56", "D": "28"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 613, "chapter": "第9章 国际工程承包管理", "marker": "2025年真题", "type": "single", "stem": "根据FIDIC《施工合同条件》，承包商未能在规定时间收到其应得最终付款的，除合同另有约 定外，承包商有权按未得付款的（ ）年利率收取延误期融资费用。", "options": {"A": "4%", "B": "5%", "C": "3%", "D": "6%"}, "answer": "C", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选C。"}, {"id": 614, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "关于国际工程施工承包合同争议解决的说法，正确的是（ ）。", "options": {"A": "业主应按支付条件支付DAAB 报酬的70%", "B": "DAAB做出的决定对双方具有约束力 C仲裁时，DAAB的任何决定不能做为证据", "D": "仲裁只能在工程竣工前，且仲裁时各方义务可以改变"}, "answer": "B", "explanation": "国际工程争议解决：应优先协商解决，协商不成再仲裁。选B。"}, {"id": 615, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "关于FIDIC《EPC 交钥匙项目合同条件》特点的说法，正确的是（ ）。", "options": {"A": "业主承担大部分或全部设计工作并及时向承包商提供设计图纸", "B": "承包商遇到不可预见的物质条件时，可以向业主提出的索赔", "C": "业主委派工程师管理合同，监督工程进度质量", "D": "业主方希望替换已任命的业主代表，应在不少于14天前将替换人员通知承包商"}, "answer": "D", "explanation": "FIDIC EPC合同条件下承包商承担大部分风险（交钥匙）。选D。"}, {"id": 616, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "关于DAB（争端裁决委员会）方式解决争议的说法，正确的是（ ）。", "options": {"A": "DAB的主要职责仲裁", "B": "DAB 提出的裁决具有终局性", "C": "DAB双方共同支付报酬", "D": "DAB 由合同一方当事人聘请"}, "answer": "C", "explanation": "DAB决定对双方有约束力但不能取代仲裁。选C。"}, {"id": 617, "chapter": "第9章 国际工程承包管理", "marker": "2025年真题", "type": "single", "stem": "英国土木工程师学会（ICE）颁布的工程施工合同（ECC）所建立的合作机制具有的特征是（ ）。", "options": {"A": "避免诉讼、早期警告、补偿事件", "B": "早期警告、补偿事件、合作伙伴", "C": "目标合同、避免诉讼、早期警告", "D": "合作伙伴、目标合同、避免诉讼"}, "answer": "B", "explanation": "施工合同示范文本由协议书、通用条款和专用条款三部分组成。选B。"}, {"id": 618, "chapter": "第9章 国际工程承包管理", "marker": "练习题", "type": "single", "stem": "AIA系列合同中，关于建筑师说法正确的是（ ）", "options": {"A": "建筑师在施工期间不是业主的代表", "B": "有对工程进度及质量的检查权", "C": "没有对承包商付款申请的支付确认权", "D": "没有对变更签发变更令权"}, "answer": "B", "explanation": "AIA合同下建筑师是业主代表，负责合同管理。选B。"}, {"id": 619, "chapter": "第10章 绿色工程项目管理智能化", "marker": "练习题", "type": "multi", "stem": "建筑信息模型的基本特征包括（ ）。", "options": {"A": "模型操作的可视化", "B": "模型信息的先进性", "C": "模型信息的完备性", "D": "模型信息的一致性", "E": "模型信息的动态性"}, "answer": "ACDE", "explanation": "BIM基本特征：可视化、协调性、模拟性、优化性。选ACDE。"}, {"id": 620, "chapter": "第10章 绿色工程项目管理智能化", "marker": "2025年真题", "type": "single", "stem": "建筑信息模型中的信息可以随着工程建设进展和变化而更新和调整。这反映了建筑信息模型 的（ ）特征。", "options": {"A": "完备性", "B": "关联性", "C": "动态性", "D": "一致性"}, "answer": "C", "explanation": "BIM信息可随进展更新调整，体现其动态性特征。选C。"}, {"id": 621, "chapter": "第10章 绿色工程项目管理智能化", "marker": "2024年真题", "type": "single", "stem": "为了应用建筑信息模型（BIM）技术，实现对工程项目成本的估算、控制和优化,需要进行的 工作是（ ）。", "options": {"A": "将项目成本管理与3D和4D模型集成，形成5D模型", "B": "将项目成本管理与2D和3D模型集成，形成4D模型", "C": "将项目成本管理与4D和5D模型集成，形成6D模型", "D": "将项目成本管理与5D和6D模型集成，形成7D模型"}, "answer": "A", "explanation": "BIM用于成本估算需进行5D建模（3D+时间+成本）。选A。"}, {"id": 622, "chapter": "第10章 绿色工程项目管理智能化", "marker": "练习题", "type": "single", "stem": "BIM技术在工程项目进度管理中的应用包括（ ）。", "options": {"A": "碰撞检测", "B": "资金和资源动态分析", "C": "工程项目信息集成管理", "D": "工程算量"}, "answer": "B", "explanation": "BIM在进度管理中可用于4D施工模拟。选B。"}, {"id": 623, "chapter": "第10章 绿色工程项目管理智能化", "marker": "2024年真题", "type": "single", "stem": "智慧工地总体架构中，发挥桥梁和中枢作用，并负责处理大量数据的层次是（ ）。", "options": {"A": "感知层", "B": "应用层", "C": "网络层", "D": "保护层"}, "answer": "C", "explanation": "智慧工地架构中数据层负责数据采集处理，是桥梁和中枢。选C。"}, {"id": 624, "chapter": "第10章 绿色工程项目管理智能化", "marker": "2025年真题", "type": "single", "
