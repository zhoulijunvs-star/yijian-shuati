      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
      navItem.classList.add('active');
      document.getElementById('ch-'+ch.id).scrollIntoView({behavior:'smooth',block:'start'});
      // Close sidebar on mobile
      if (window.innerWidth <= 768) toggleSidebar();
    };
    navList.appendChild(navItem);

    // Quick jump
    const btn = document.createElement('button');
    btn.textContent = ch.nav;
    btn.onclick = () => document.getElementById('ch-'+ch.id).scrollIntoView({behavior:'smooth'});
    quickJump.appendChild(btn);

    // Main content
    const totalStars = ch.sections.reduce((sum, s) => {
      return sum + (s.stars === undefined ? 2 : s.stars);
    }, 0);
    
    html += `<div class="chapter-block" id="ch-${ch.id}">`;
    html += `<div class="ch-header" onclick="toggleChapter(this)">`;
    html += `<div class="ch-num">${ch.id}</div>`;
    html += `<div class="ch-title">${ch.name}</div>`;
    html += `<div class="ch-meta">${ch.sections.length}节 · ${ch.score}</div>`;
    html += `<div class="ch-arrow">▶</div>`;
    html += `</div>`;
    html += `<div class="ch-body">`;

    ch.sections.forEach(sec => {
      const starEmoji = sec.stars <= 1 ? '※' : sec.stars <= 2 ? '※※' : '※※※';
      const starClass = sec.stars <= 1 ? 'tag-1' : sec.stars <= 2 ? 'tag-2' : 'tag-3';
      
      html += `<div class="section">`;
      html += `<div class="section-header" onclick="toggleSection(this)">`;
      html += `<span>${sec.name}</span>`;
      html += `<span class="star" style="color:${sec.stars>=3?'#e8a040':sec.stars>=2?'#c08030':'#999'}">${starEmoji}</span>`;
      html += `<span style="font-size:11px;color:#999">${sec.score}</span>`;
      html += `<span style="font-size:10px;margin-left:auto">▼</span>`;
      html += `</div>`;
      html += `<div class="section-body">`;

      sec.points.forEach(pt => {
        const sclass = pt.star >= 3 ? 'f3' : pt.star >= 2 ? 'f2' : 'f1';
        const tclass = pt.star >= 3 ? 'tag-3' : pt.star >= 2 ? 'tag-2' : 'tag-1';
        html += `<div class="point ${sclass}">`;
        html += `<span class="point-tag ${tclass}">${pt.star>=3?'※※※':pt.star>=2?'※※':'※'}</span>`;
        html += `<b>${pt.name}</b>`;
        html += `</div>`;

        if (pt.subs) {
          pt.subs.forEach(sub => {
            html += `<div class="sub-point">${sub}</div>`;
          });
        }

        if (pt.includes) {
          pt.includes.forEach(inc => {
            html += `<div class="include-note"><b>📥 被包含：</b>${inc.from} → ${inc.why}</div>`;
          });
        }
      });

      // Section-level cross references & includes
      // (handled at point level for most cases)

      html += `</div></div>`;
    });

    html += `</div></div>`;
  });

  container.innerHTML = html;
}

function toggleChapter(header) {
  const body = header.nextElementSibling;
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open');
  header.classList.toggle('open');
  if (!isOpen) {
    // Auto-open first section
    const firstSec = body.querySelector('.section-body');
    if (firstSec) firstSec.classList.add('open');
  }
}

function toggleSection(header) {
  const body = header.nextElementSibling;
  body.classList.toggle('open');
}

// ===== SEARCH =====
function clearHighlights() {
  document.querySelectorAll('.search-hl').forEach(function(e){
    var p=e.parentNode;
    p.replaceChild(document.createTextNode(e.textContent),e);
    p.normalize();
  });
}

function doSearch(query) {
  clearHighlights();
  const resultEl = document.getElementById('search-result');
  const navItems = document.querySelectorAll('#nav-list .nav-item');
  
  if (!query || query.trim().length < 1) {
    resultEl.style.display = 'none';
    navItems.forEach(n => { n.classList.remove('ch-dim','ch-match'); });
    document.querySelectorAll('#content .chapter-block').forEach(b => { b.style.display = ''; });
    return;
  }

  const q = query.toLowerCase();
  let totalFound = 0;
  const matchedChapters = new Set();

  document.querySelectorAll('#content .chapter-block').forEach(function(block) {
    var chMatch = block.textContent.toLowerCase().includes(q);
    var pointsWithMatch = 0;

    // Search points, sub-points, section headers IN ORDER (D3 renders these specific classes)
    block.querySelectorAll('.point,.sub-point,.section-header').forEach(function(el) {
      if (el.textContent.toLowerCase().includes(q)) {
        pointsWithMatch++;
        // Expand parent section
        var sec = el.closest('.section');
        if (sec) {
          var sb = sec.querySelector('.section-body');
          if (sb) sb.classList.add('open');
        }
        // Highlight match in this element
        highlightInElement(el, query);
      }
    });

    if (chMatch || pointsWithMatch > 0) {
      block.style.display = '';
      matchedChapters.add(block.id.replace('ch-',''));
      // Auto-expand chapter
      var header = block.querySelector('.ch-header');
      if (header && !header.classList.contains('open')) toggleChapter(header);
      totalFound += Math.max(1, pointsWithMatch);
    } else {
      block.style.display = 'none';
    }
  });

  // Update nav
  navItems.forEach(function(n) {
    var chNum = n.textContent.match(/Ch(\d+)/);
    if (chNum && matchedChapters.has(chNum[1])) {
      n.classList.add('ch-match'); n.classList.remove('ch-dim');
    } else {
      n.classList.add('ch-dim'); n.classList.remove('ch-match');
    }
  });

  resultEl.style.display = 'block';
  if (totalFound > 0) {
    resultEl.textContent = '找到 ' + totalFound + ' 处匹配';
    resultEl.style.color = '#5a9a4a';
  } else {
    resultEl.textContent = '未找到匹配';
    resultEl.style.color = '#c04848';
  }
}

function highlightInElement(el, q) {
  function walk(node) {
    if (node.nodeType === 3) {
      var txt = node.textContent;
      var idx = txt.toLowerCase().indexOf(q.toLowerCase());
      if (idx >= 0) {
        var span = document.createElement('span');
        span.className = 'search-hl';
        span.textContent = txt.substring(idx, idx + q.length);
        var after = document.createTextNode(txt.substring(idx + q.length));
        node.textContent = txt.substring(0, idx);
        node.parentNode.insertBefore(span, node.nextSibling);
        node.parentNode.insertBefore(after, span.nextSibling);
      }
    } else if (node.nodeType === 1 && !/^(SCRIPT|STYLE)$/i.test(node.tagName)) {
      Array.from(node.childNodes).forEach(walk);
    }
  }
  walk(el);
}
