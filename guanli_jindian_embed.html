<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>一建管理 · 金点题(金月)</title>
<style>
:root {
  --bg: #f5f6fa;
  --card: #fff;
  --text: #1a1a2e;
  --text2: #555;
  --border: #e0e3eb;
  --primary: #4361ee;
  --primary-light: #eef0ff;
  --correct: #10b981;
  --correct-bg: #ecfdf5;
  --wrong: #ef4444;
  --wrong-bg: #fef2f2;
  --tag-bg: #f0f1f7;
  --progress-bg: #e5e7eb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  line-height: 1.6;
}
/* ── Top bar ── */
.topbar {
  background: var(--card);
  border-bottom: 1px solid var(--border);
  padding: 12px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky; top: 0; z-index: 10;
}
.topbar h1 { font-size: 18px; font-weight: 700; }
.topbar-right { display: flex; gap: 12px; align-items: center; }
.topbar-right .badge {
  font-size: 13px; color: var(--text2);
  background: var(--tag-bg); padding: 4px 10px; border-radius: 6px;
}
.btn {
  padding: 6px 16px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); font-size: 13px; cursor: pointer; color: var(--text);
  transition: all .15s;
}
.btn:hover { background: var(--primary-light); border-color: var(--primary); color: var(--primary); }
.btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
/* ── Layout ── */
.app { max-width: 800px; margin: 0 auto; padding: 20px; }
/* ── Chapter selector ── */
.chapter-bar {
  display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 20px;
}
.chapter-bar .ch-btn {
  font-size: 12px; padding: 5px 10px; border: 1px solid var(--border);
  border-radius: 16px; cursor: pointer; background: var(--card); color: var(--text2);
  transition: all .15s; white-space: nowrap;
}
.chapter-bar .ch-btn:hover { border-color: var(--primary); color: var(--primary); }
.chapter-bar .ch-btn.sel { background: var(--primary); color: #fff; border-color: var(--primary); }
/* ── Stats row ── */
.stats-row {
  display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap;
}
.stat-card {
  flex: 1; min-width: 100px; background: var(--card); border: 1px solid var(--border);
  border-radius: 10px; padding: 14px 16px; text-align: center;
}
.stat-card .val { font-size: 28px; font-weight: 700; }
.stat-card .lbl { font-size: 12px; color: var(--text2); margin-top: 2px; }
.stat-card.wrong .val { color: var(--wrong); }
.stat-card.acc .val { color: var(--correct); }
/* ── Progress ── */
.progress-wrap { margin-bottom: 20px; }
.progress-info { display: flex; justify-content: space-between; font-size: 13px; color: var(--text2); margin-bottom: 6px; }
.progress-bar { height: 6px; background: var(--progress-bg); border-radius: 3px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--primary); border-radius: 3px; transition: width .3s; }
/* ── Question card ── */
.q-card {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px;
}
.q-meta {
  font-size: 12px; color: var(--text2); margin-bottom: 12px;
  display: flex; gap: 10px; flex-wrap: wrap;
}
.q-meta span {
  background: var(--tag-bg); padding: 2px 8px; border-radius: 4px;
}
.q-stem {
  font-size: 16px; font-weight: 600; margin-bottom: 20px; line-height: 1.7;
}
.q-options { display: flex; flex-direction: column; gap: 10px; }
.opt-btn {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 14px 16px; border: 2px solid var(--border);
  border-radius: 10px; cursor: pointer; transition: all .2s;
  background: var(--card); text-align: left; font-size: 14px;
  line-height: 1.5;
}
.opt-btn:hover { border-color: var(--primary); background: var(--primary-light); }
.opt-btn .multi-cb { width: 16px; height: 16px; accent-color: var(--primary); flex-shrink: 0; }
.opt-btn .opt-letter {
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--tag-bg); display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0;
}
.opt-btn.correct { border-color: var(--correct); background: var(--correct-bg); }
.opt-btn.correct .opt-letter { background: var(--correct); color: #fff; }
.opt-btn.wrong { border-color: var(--wrong); background: var(--wrong-bg); }
.opt-btn.wrong .opt-letter { background: var(--wrong); color: #fff; }
.opt-btn.dim { opacity: .5; }
.opt-btn.done { pointer-events: none; }
/* ── Feedback ── */
.feedback {
  margin-top: 16px; padding: 14px 16px; border-radius: 8px; font-size: 14px;
  display: none;
}
.feedback.show { display: block; }
.feedback.correct { background: var(--correct-bg); color: var(--correct); border: 1px solid var(--correct); }
.feedback.wrong { background: var(--wrong-bg); color: var(--wrong); border: 1px solid var(--wrong); }
/* ── Note ── */
.note-box { margin-top: 12px; display: none; }
.note-box.show { display: block; }
.note-box textarea {
  width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
  font-size: 13px; font-family: inherit; resize: vertical; min-height: 48px;
  background: #fafbfc;
}
.note-box textarea:focus { outline: none; border-color: var(--primary); }
.note-box .note-hint { font-size: 11px; color: #999; margin-top: 2px; }
.existing-note {
  margin-top: 12px; padding: 10px 14px; background: #fffbeb; border-radius: 8px;
  font-size: 13px; border: 1px solid #fde68a; display: flex; gap: 8px; align-items: flex-start;
}
.existing-note .note-icon { font-size: 16px; flex-shrink: 0; }
.existing-note .note-text { flex: 1; color: #92400e; }
/* ── Action row ── */
.actions { display: flex; gap: 10px; margin-top: 16px; justify-content: center; }
.btn-next {
  padding: 10px 32px; border-radius: 8px; font-size: 15px; font-weight: 600;
  border: none; cursor: pointer; background: var(--primary); color: #fff;
  transition: all .15s;
}
.btn-next:hover { opacity: .9; }
.btn-next:disabled { background: var(--progress-bg); cursor: not-allowed; color: #999; }
/* ── Empty ── */
.empty {
  text-align: center; padding: 60px 20px; color: var(--text2);
}
.empty .icon { font-size: 48px; margin-bottom: 12px; }
/* ── Wrong book ── */
.wrong-book {
  background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  padding: 24px; margin-top: 32px;
}
.wrong-book h3 { font-size: 16px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.wrong-book .count { font-size: 12px; color: var(--wrong); font-weight: normal; }
.wrong-item {
  padding: 12px; border-bottom: 1px solid var(--border); font-size: 14px;
  cursor: pointer; transition: background .15s;
}
.wrong-item:last-child { border-bottom: none; }
.wrong-item:hover { background: var(--primary-light); }
/* ── Analysis Modal ── */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 100;
  display: none; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--card); border-radius: 16px; padding: 28px; max-width: 640px;
  width: 90%; max-height: 80vh; overflow-y: auto;
}
.modal h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
.modal .close-btn {
  margin-left: auto; background: none; border: none; font-size: 20px; cursor: pointer; color: #999;
}
.analysis-section { margin-bottom: 24px; }
.analysis-section h3 { font-size: 14px; color: var(--text2); margin-bottom: 10px; }
.chapter-bar-chart { display: flex; flex-direction: column; gap: 8px; }
.cb-row { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.cb-label { min-width: 100px; text-align: right; color: var(--text2); }
.cb-track { flex: 1; height: 20px; background: var(--progress-bg); border-radius: 4px; overflow: hidden; position: relative; }
.cb-fill { height: 100%; border-radius: 4px; transition: width .5s; }
.cb-fill.weak { background: #ef4444; }
.cb-fill.medium { background: #f59e0b; }
.cb-fill.strong { background: #10b981; }
.cb-val { min-width: 50px; font-weight: 600; font-size: 12px; }
.rec-card {
  padding: 12px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 13px;
  border-left: 4px solid;
}
.rec-card.high { background: #fef2f2; border-color: #ef4444; }
.rec-card.medium { background: #fffbeb; border-color: #f59e0b; }
.rec-card.low { background: #ecfdf5; border-color: #10b981; }
.rec-card .rec-title { font-weight: 600; margin-bottom: 2px; }
.wrong-item .q-text { margin-bottom: 4px; }
.wrong-item .q-meta-small { font-size: 12px; color: var(--text2); }
.wrong-item .q-meta-small .your { color: var(--wrong); }
.wrong-item .q-meta-small .ans { color: var(--correct); }
/* ── Responsive ── */
/* ── Info panel ── */
.info-panel { transition: max-height 0.3s ease, opacity 0.3s ease; overflow: hidden; }
.btn-toggle { font-size: 18px; padding: 4px 10px; min-width: 36px; text-align: center; }
@media (max-width: 600px) {
  .info-panel { max-height: 0; opacity: 0; }
  .info-panel.open { max-height: 800px; opacity: 1; }
  .btn-toggle { display: inline-block; }
}
@media (min-width: 601px) {
  .btn-toggle { display: none; }
  .info-panel { max-height: none; opacity: 1; }
}
@media (max-width: 600px) {
  .topbar { padding: 10px 16px; }
  .topbar h1 { font-size: 16px; }
  .app { padding: 12px; }
  .stats-row { gap: 8px; }
  .stat-card { padding: 10px 12px; }
  .stat-card .val { font-size: 22px; }
  .q-card { padding: 16px; }
  .q-stem { font-size: 15px; }
  .opt-btn { padding: 12px; font-size: 13px; }
  .data-table { font-size: 13px; }
}
/* ── Data table ── */
.data-table {
  width: 100%;
  border-collapse: collapse;
  margin: 12px 0;
  font-size: 14px;
}
.data-table th, .data-table td {
  border: 1px solid var(--border);
  padding: 6px 10px;
  text-align: center;
  font-size: 13px;
}
.data-table th {
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
  white-space: nowrap;
}
.data-table tbody td {
  background: var(--card);
}
.data-table tr:nth-child(even) td {
  background: #f9fafb;
}

/* ── Sidebar layout ── */
.layout { display: flex; min-height: 100vh; }
.sidebar {
  width: 260px; min-width: 260px; background: var(--card);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; overflow: hidden;
}
.sidebar-title {
  padding: 14px 14px 10px; font-size: 13px; font-weight: 600;
  color: var(--text2); border-bottom: 1px solid var(--border);
  flex-shrink: 0; display: flex; justify-content: space-between; align-items: center;
}
.sidebar-title .total { font-weight: normal; font-size: 12px; }
.q-nums {
  flex: 1; overflow-y: auto; padding: 8px 6px;
  display: flex; flex-wrap: wrap; align-content: flex-start; gap: 3px;
}
.q-num {
  width: 30px; height: 30px; border-radius: 5px;
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; font-weight: 500; cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card); color: var(--text2);
  transition: all .15s; flex-shrink: 0; user-select: none;
}
.q-num:hover { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
.q-num.current { border-color: var(--primary); background: var(--primary); color: #fff; font-weight: 700; transform: scale(1.1); z-index: 1; }
.q-num.correct { background: var(--correct-bg); border-color: #a7f3d0; color: var(--correct); }
.q-num.wrong { background: var(--wrong-bg); border-color: #fecaca; color: var(--wrong); }
.q-num.correct.current { background: var(--correct); color: #fff; border-color: var(--correct); }
.q-num.wrong.current { background: var(--wrong); color: #fff; border-color: var(--wrong); }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.main .app { max-width: 100%; }
/* Mobile */
@media (max-width: 768px) {
  .layout { flex-direction: column; }
  .sidebar { width: 100%; min-width: 100%; height: auto; max-height: 140px; position: relative; border-right: none; border-bottom: 1px solid var(--border); }
  .q-num { width: 26px; height: 26px; font-size: 10px; }
  .q-nums { gap: 2px; padding: 6px; }
}

</style>
</head>

<div class="layout">

  </div>
  <div class="main">
<div class="topbar">

  </div>

  </div>
</div>
</div>

<!-- Analysis Modal -->
<div class="modal-overlay" id="analysisModal" onclick="if(event.target===this)hideAnalysis()">

    <div id="analysisContent"></div>
  </div>
</div>
</div>

// ── localStorage ──
const LS_KEY = 'guanli_quiz_state_v2';
function saveState() {
  localStorage.setItem(LS_KEY, JSON.stringify({
    answeredQ, mode, selChapter, autoNext
  }));
}
function loadState() {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) {
    try {
      const s = JSON.parse(raw);
      answeredQ = s.answeredQ || {};
      mode = s.mode || 'seq';
      selChapter = s.selChapter || 'all';
      autoNext = s.autoNext || false;
      updateModeBtn();
      updateAutoNextBtn();
    } catch(e) {}
  }
}
function resetProgress() {
  if (confirm('确定要重置所有刷题进度？')) {
    answeredQ = {};
    notesQ = {};
    selChapter = 'all';
    saveState();
    renderChapters();
    applyFilter();
    renderQuestionList();
  }
}

// ── Notes ──
let notesQ = {};
const NOTES_KEY = 'guanli_quiz_notes_v2';

function loadNotes() {
  const raw = localStorage.getItem(NOTES_KEY);
  if (raw) try { notesQ = JSON.parse(raw); } catch(e) {}
}
loadNotes();

function saveNotes() {
  localStorage.setItem(NOTES_KEY, JSON.stringify(notesQ));
}

function getNote(qid) {
  return notesQ[qid] || '';
}

function saveNote(qid) {
  const el = document.getElementById('noteInput');
  if (!el) return;
  const text = el.value.trim();
  if (text) {
    notesQ[qid] = text;
  } else {
    delete notesQ[qid];
  }
  saveNotes();
}

function escapeHtml(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Chapters ──
function getChapters() {
  const set = new Set();
  allQuestions.forEach(q => set.add(q.chapter));
  return ['all', ...Array.from(set).sort((a,b) => {
    const na = parseInt(a.match(/\d+/)?.[0] || '0');
    const nb = parseInt(b.match(/\d+/)?.[0] || '0');
    return na - nb;
  })];
}

function renderChapters() {
  const chapters = getChapters();
  const bar = document.getElementById('chapterBar');
  bar.innerHTML = chapters.map(ch => {
    const cls = ch === selChapter ? 'ch-btn sel' : 'ch-btn';
    const label = ch === 'all' ? '全部' : ch.replace(/^第\d+章\s*/, '');
    return `<button class="${cls}" onclick="selectChapter('${ch}')">${label}</button>`;
  }).join('');
}

function selectChapter(ch) {
  selChapter = ch;
  saveState();
  renderChapters();
  applyFilter();
}

// ── Filter ──
function applyFilter() {
  if (selChapter === 'all') {
    filteredQuestions = [...allQuestions];
  } else {
    filteredQuestions = allQuestions.filter(q => q.chapter === selChapter);
  }
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Mode ──
function toggleMode() {
  mode = mode === 'seq' ? 'rand' : 'seq';
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateModeBtn();
  saveState();
  renderQuestion();
  renderQuestionList();
}

function updateModeBtn() {
  document.getElementById('btnMode').textContent = mode === 'seq' ? '顺序' : '随机';
  document.getElementById('btnMode').classList.toggle('active', mode === 'rand');
}

function toggleAutoNext() {
  autoNext = !autoNext;
  updateAutoNextBtn();
  saveState();
}
function toggleInfoPanel() {
  document.getElementById('infoPanel').classList.toggle('open');
}
function updateAutoNextBtn() {
  const btn = document.getElementById('btnAutoNext');
  if (autoNext) {
    btn.textContent = '🔁 自动下一题 ✓';
    btn.style.background = '#ecfdf5';
    btn.style.borderColor = '#10b981';
    btn.style.color = '#10b981';
  } else {
    btn.textContent = '🔁 自动下一题';
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  }
}

function shuffleFiltered() {
  for (let i = filteredQuestions.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filteredQuestions[i], filteredQuestions[j]] = [filteredQuestions[j], filteredQuestions[i]];
  }
}

// ── Stats ──
function updateStats() {
  const total = filteredQuestions.length;
  const doneCount = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
  const wrongCount = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
  const remain = total - doneCount;

  document.getElementById('statDone').textContent = doneCount;
  document.getElementById('statWrong').textContent = wrongCount;
  document.getElementById('statAcc').textContent = doneCount > 0
    ? Math.round((doneCount - wrongCount) / doneCount * 100) + '%' : '-';
  document.getElementById('statRemain').textContent = remain;
  document.getElementById('progressPct').textContent = Math.round(doneCount / total * 100) + '%';
  document.getElementById('progressFill').style.width = (doneCount / total * 100) + '%';

  // Wrong book
  renderWrongBook();
}

let multiSelected = new Set();  // For multi-select questions

function renderQuestion() {
  const area = document.getElementById('questionArea');
  if (filteredQuestions.length === 0) {
    area.innerHTML = '<div class="empty"><div class="icon">✨</div><p>该章节暂无题目</p></div>';
    return;
  }
  if (currentIdx >= filteredQuestions.length) {
    const total = filteredQuestions.length;
    const done = filteredQuestions.filter(q => answeredQ[q.id] !== undefined).length;
    const wrong = filteredQuestions.filter(q => answeredQ[q.id] && answeredQ[q.id] !== 'correct').length;
    area.innerHTML = `
      <div class="empty">
        <div class="icon">🎉</div>
        <p>全部刷完！</p>

        </p>
        <button class="btn-next" style="margin-top:16px;" onclick="retryWrong()">复习错题</button>
      </div>`;
    return;
  }
  
  const q = filteredQuestions[currentIdx];

  }

  area.innerHTML = `

      <div class="q-options">${optHtml}</div>
      <div class="feedback ${answered ? 'show ' : ''}${prevAns === 'correct' ? 'correct' : prevAns ? 'wrong' : ''}" id="feedback">
        ${answered ? (prevAns === 'correct' ? '✓ 回答正确！' : `✗ 回答错误，正确答案是 ${formatAnswer(q.answer)}`) : ''}
        ${answered && q.explanation ? `<div style="margin-top:8px;padding:8px 10px;background:#fff;border-radius:6px;font-size:13px;color:#555;line-height:1.7;"><strong>📖 解析：</strong>${q.explanation}</div>` : ''}
      </div>
      ${answered ? `

        <div class="note-hint">输入后自动保存</div>
      </div>
      ` : ''}
      <div class="actions">
        <button class="btn" onclick="prevQuestion()" ${currentIdx === 0 ? 'disabled' : ''}>上一题</button>
        ${isMulti && !answered ? '<button class="btn-next" onclick="submitMulti()" id="btnSubmitMulti">提交答案</button>' : ''}
        <button class="btn-next" onclick="nextQuestion()">${answered ? '下一题' : '跳过'}</button>
      </div>
    </div>`;
}

function formatAnswer(ans) {
  return ans.length === 1 ? ans : ans.split('').join('、');
}

function toggleMulti(cb) {
  const key = cb.dataset.key;
  if (cb.checked) multiSelected.add(key);
  else multiSelected.delete(key);
}

function toggleMultiClick(key) {
  const cb = document.querySelector(`.multi-cb[data-key="${key}"]`);
  if (cb) { cb.checked = !cb.checked; toggleMulti(cb); }
}

function answer(letter) {
  const q = filteredQuestions[currentIdx];
  const correct = q.type === 'multi'
    ? letter.split('').sort().join('') === q.answer.split('').sort().join('')
    : letter === q.answer;
  answeredQ[q.id] = correct ? 'correct' : letter;
  saveState();
  updateStats();
  renderQuestion();
  renderQuestionList();
  if (autoNext && correct && currentIdx < filteredQuestions.length - 1) {
    setTimeout(() => { currentIdx++; renderQuestion(); renderQuestionList(); document.getElementById('questionArea').scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 700);
  }
}

function submitMulti() {
  if (multiSelected.size === 0) return;
  const selected = Array.from(multiSelected).sort().join('');
  answer(selected);
}

function prevQuestion() {
  if (currentIdx > 0) { currentIdx--; renderQuestion(); renderQuestionList(); }
}

function nextQuestion() {
  if (currentIdx < filteredQuestions.length - 1) {
    currentIdx++;
    renderQuestion(); renderQuestionList();
  } else {
    currentIdx = filteredQuestions.length;
    renderQuestion(); renderQuestionList();
  }
}

function retryWrong() {
  const wrongIds = new Set();
  for (const [id, ans] of Object.entries(answeredQ)) {
    if (ans !== 'correct') wrongIds.add(parseInt(id));
  }
  if (wrongIds.size === 0) {
    alert('没有错题，全部正确！');
    return;
  }
  filteredQuestions = allQuestions.filter(q => wrongIds.has(q.id));
  if (mode === 'rand') shuffleFiltered();
  currentIdx = 0;
  updateStats();
  renderQuestion();
  renderQuestionList();
}

// ── Wrong book ──
function renderWrongBook() {
  const wrongQs = [];
  for (const q of allQuestions) {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  }
  
  const book = document.getElementById('wrongBook');
  const list = document.getElementById('wrongList');
  
  if (wrongQs.length === 0) {
    book.style.display = 'none';
    return;
  }
  
  book.style.display = 'block';
  document.getElementById('wrongCount').textContent = `(${wrongQs.length} 题)`;
  
  list.innerHTML = wrongQs.map(wq => `
    <div class="wrong-item" onclick="jumpToQuestion(${wq.id})">
      <div class="q-text">${wq.stem.substring(0, 80)}...</div>
      <div class="q-meta-small">
        <span>${wq.chapter}</span> |
        你的答案: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
        正确答案: <span class="ans">${formatAnswer(wq.answer)}</span>
      </div>
    </div>
  `).join('');
}

function jumpToQuestion(qid) {
  selChapter = 'all';
  filteredQuestions = [...allQuestions];
  if (mode === 'rand') shuffleFiltered();
  const idx = filteredQuestions.findIndex(q => q.id === qid);
  if (idx >= 0) {
    currentIdx = idx;
    renderChapters();
    updateStats();
    renderQuestion();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

// ── Analysis ──
function showAnalysis() {
  // Build chapter stats
  const chStats = {};
  allQuestions.forEach(q => {
    if (!chStats[q.chapter]) chStats[q.chapter] = { total: 0, done: 0, wrong: 0 };
    chStats[q.chapter].total++;
    const ans = answeredQ[q.id];
    if (ans !== undefined) {
      chStats[q.chapter].done++;
      if (ans !== 'correct') chStats[q.chapter].wrong++;
    }
  });

  // Sort by accuracy (worst first)
  const chapters = Object.entries(chStats)
    .filter(([_, s]) => s.done > 0)
    .map(([name, s]) => ({
      name: name.replace(/^第\d+章\s*/, ''),
      fullName: name,
      ...s,
      acc: s.done > 0 ? Math.round((s.done - s.wrong) / s.done * 100) : 0
    }))
    .sort((a, b) => a.acc - b.acc);

  const overallDone = Object.values(chStats).reduce((s, c) => s + c.done, 0);
  const overallWrong = Object.values(chStats).reduce((s, c) => s + c.wrong, 0);
  const overallAcc = overallDone > 0 ? Math.round((overallDone - overallWrong) / overallDone * 100) : 0;

  if (overallDone === 0) {
    document.getElementById('analysisContent').innerHTML = '<p style="color:#888;padding:20px 0;">还没有刷题记录，先刷几题再来分析吧 ✨</p>';
    document.getElementById('analysisModal').classList.add('show');
    return;
  }

  // Build most-wrong questions
  const wrongQs = [];
  allQuestions.forEach(q => {
    const ans = answeredQ[q.id];
    if (ans && ans !== 'correct') {
      wrongQs.push({ ...q, yourAnswer: ans });
    }
  });
  wrongQs.sort((a, b) => {
    const ca = (answeredQ[a.id] && answeredQ[a.id] !== 'correct' ? 1 : 0);
    const cb = (answeredQ[b.id] && answeredQ[b.id] !== 'correct' ? 1 : 0);
    return cb - ca;
  });

  // Recommendations
  const recs = [];
  chapters.forEach(ch => {
    if (ch.done < 3) return;
    if (ch.acc < 50) recs.push({ level: 'high', text: `「${ch.name}」正确率仅 ${ch.acc}%，需重点攻克，建议回看讲义原文`, ch });
    else if (ch.acc < 70) recs.push({ level: 'medium', text: `「${ch.name}」正确率 ${ch.acc}%，加强专项练习`, ch });
  });
  const untouched = Object.entries(chStats).filter(([_, s]) => s.done === 0);
  untouched.forEach(([name, s]) => {
    recs.push({ level: 'medium', text: `「${name.replace(/^第\d+章\s*/, '')}」尚未刷过，安排时间过一遍`, ch: null });
  });

  let html = `
    <div class="analysis-section">
      <h3>📈 总体正确率: <b style="color:${overallAcc>=70?'var(--correct)':overallAcc>=50?'#f59e0b':'var(--wrong)'}">${overallAcc}%</b> (${overallDone - overallWrong}/${overallDone})</h3>
    </div>
    <div class="analysis-section">
      <h3>📊 章节正确率排序（低到高）</h3>
      <div class="chapter-bar-chart">
  `;

  chapters.forEach(ch => {
    const level = ch.acc < 50 ? 'weak' : ch.acc < 70 ? 'medium' : 'strong';
    html += `
      <div class="cb-row">
        <div class="cb-label">${ch.name}</div>
        <div class="cb-track"><div class="cb-fill ${level}" style="width:${ch.acc}%"></div></div>
        <div class="cb-val">${ch.acc}% <span style="font-weight:normal;color:#999;">(${ch.done - ch.wrong}/${ch.done})</span></div>
      </div>`;
  });

  html += `</div></div>`;

  // Recommendations
  if (recs.length > 0) {
    html += `<div class="analysis-section"><h3>💡 备考建议</h3>`;
    recs.forEach(r => {
      html += `<div class="rec-card ${r.level}"><div class="rec-title">${r.level === 'high' ? '🔴 优先' : r.level === 'medium' ? '🟡 关注' : '🟢 保持'}</div>${r.text}</div>`;
    });
    html += `</div>`;
  }

  // Top wrong questions
  if (wrongQs.length > 0) {
    html += `<div class="analysis-section"><h3>⚠️ 高频错题 (Top 5)</h3>`;
    wrongQs.slice(0, 5).forEach(wq => {
      html += `<div class="wrong-item" onclick="jumpToQuestion(${wq.id});hideAnalysis()">
        <div class="q-text">${wq.stem.substring(0, 60)}...</div>
        <div class="q-meta-small">
          你的: <span class="your">${formatAnswer(wq.yourAnswer)}</span> |
          正确: <span class="ans">${formatAnswer(wq.answer)}</span>
        </div>
      </div>`;
    });
    html += `</div>`;
  }

  document.getElementById('analysisContent').innerHTML = html;
  document.getElementById('analysisModal').classList.add('show');
}

function hideAnalysis() {
  document.getElementById('analysisModal').classList.remove('show');
}

// ── Keyboard ──
document.addEventListener('keydown', e => {
  const q = filteredQuestions.length > 0 && currentIdx < filteredQuestions.length
    ? filteredQuestions[currentIdx] : null;
  if (!q) return;
  const prevAns = answeredQ[q.id];
  const answered = prevAns !== undefined;
  
  if (!answered && q.type === 'single' && ['a','b','c','d'].includes(e.key.toLowerCase())) {
    const letter = e.key.toUpperCase();
    if (q.options[letter]) answer(letter);
  }
  if (e.key === 'ArrowLeft') prevQuestion();
  if (e.key === 'ArrowRight' || e.key === ' ') nextQuestion();
});

// ── Start ──
load();

// ── Question list sidebar ──
function renderQuestionList() {
  const container = document.getElementById('qNums');
  if (!container) return;
  let html = '';
  for (let i = 0; i < filteredQuestions.length; i++) {
    const q = filteredQuestions[i];
    const status = answeredQ[q.id];
    let cls = 'q-num';
    if (i === currentIdx) cls += ' current';
    if (status === 'correct') cls += ' correct';
    else if (status) cls += ' wrong';
    html += `<div class="${cls}" onclick="jumpToQuestion(${i})" title="第${i+1}题">${i+1}</div>`;
  }
  container.innerHTML = html;
  // Update total count
  const totalEl = document.querySelector('.sidebar-title .total');
  if (totalEl) totalEl.textContent = `${filteredQuestions.length}题`;
  // Scroll current into view
  const currentEl = container.querySelector('.current');
  if (currentEl) {
    currentEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }
}

function jumpToQuestion(idx) {
  if (idx >= 0 && idx < filteredQuestions.length) {
    currentIdx = idx;
    renderQuestion();
    renderQuestionList();
  }
}

</script>
</body>
</html>
